async function saveSite(id){
  if(!CAN.manageClients()) return toast("Assistant Manager and above can change sites");
  const label=$("#sfLabel").value.trim();
  const latValue=$("#sfLat").value.trim(), lngValue=$("#sfLng").value.trim();
  const lat=+$("#sfLat").value, lng=+$("#sfLng").value, rad=+$("#sfRad").value;
  if(!label) return toast("Give the site a name");
  if(!latValue || !lngValue) return toast("Enter the site's latitude and longitude");
  if(!isFinite(lat)||lat<-90||lat>90) return toast("Latitude must be between −90 and 90");
  if(!isFinite(lng)||lng<-180||lng>180) return toast("Longitude must be between −180 and 180");
  if(!(rad>=25&&rad<=5000)) return toast("Radius must be between 25 m and 5000 m");
  const clientId=$("#sfClient").value||null;
  if(id){
    const { error } = await supabase.from("locations").update({
      label, client_id:clientId, latitude:lat, longitude:lng, radius_meters:rad
    }).eq("id", id);
    if(error) return toast("Could not save — "+error.message);
    const site=LOCATIONS.find(l=>l.id===id);
    Object.assign(site, { label, client:clientId, lat, lng, radius:rad });
    syncPunchSite(site);
    closeModal(); toast("Saved"); return render();
  }
  const { data, error } = await supabase.from("locations").insert({
    organization_id:ORG_ID, client_id:clientId, label, latitude:lat, longitude:lng,
    radius_meters:rad, is_active:true
  }).select().single();
  if(error) return toast("Could not add the site — "+error.message);
  FIRM.setupComplete = true;   // first site completes setup (DB trigger, 031)
  const site={ id:data.id, label, client:clientId, lat, lng, radius:rad, active:true };
  LOCATIONS.push(site);
  syncPunchSite(site);
  closeModal(); toast("Site added — punches here will now match"); render();
}
async function toggleSite(id){
  if(!CAN.manageClients()) return toast("Assistant Manager and above can change sites");
  const l=LOCATIONS.find(x=>x.id===id);
  if(l.active && LOCATIONS.filter(x=>x.active).length<=1)
    return toast("Keep at least one active site, or every punch is flagged");
  const { error } = await supabase.from("locations").update({ is_active:!l.active }).eq("id", id);
  if(error) return toast("Could not update — "+error.message);
  l.active=!l.active; syncPunchSite(l); render();
}

/* The signed-in user's own profile. Always loaded by the Supabase session's
   user id (profiles.auth_user_id) — never by an id from the page — so the
   page can only ever show or edit the caller's own row. Editing follows the
   existing rule (profiles_update RLS, CAN.manageTeam()): only a partner may
   update a profile, and only name and phone are offered here. Role, company,
   status, rates and reporting line stay with the Team screen. */
let PROFILE = { forUid:undefined, loading:false, row:null, company:null, email:"", error:"" };

function initialsOf(name){
  const parts=String(name||"").trim().split(/\s+/).filter(Boolean);
  if(!parts.length) return "?";
  return ((parts[0][0]||"")+(parts.length>1?parts[parts.length-1][0]:"")).toUpperCase();
}

async function loadMyProfile(){
  const forUid=AUTH_UID;   // one load per signed-in user; retry only via "Try again"
  PROFILE={ forUid, loading:true, row:null, company:null, email:"", error:"" };
  const fail=msg=>{ PROFILE={ forUid, loading:false, row:null, company:null, email:"", error:msg }; };
  try{
    const { data:{ user }, error:userErr } = await supabase.auth.getUser();
    if(userErr || !user) fail("You're not signed in. Please sign in again.");
    else{
      const { data:row, error } = await supabase.from("profiles")
        .select("id,employee_code,full_name,contact_email,phone,role,reports_to,company,company_id,joining_date,exit_date,is_active,created_at")
        .eq("auth_user_id", user.id).maybeSingle();
      if(error) fail("Could not load your profile — "+(error.message||"please try again."));
      else if(!row) fail("No employee profile is linked to this account. Contact your administrator.");
      else{
        let company=null;
        if(row.company_id){
          const { data:c } = await supabase.from("companies").select("id,code,name").eq("id", row.company_id).maybeSingle();
          company=c||null;
        }
        PROFILE={ forUid, loading:false, row, company, email:user.email||"", error:"" };
      }
    }
  }catch(err){
    fail("Network error — could not load your profile. Check your connection and try again.");
  }
  if(view==="profile") render();
}

  ev.preventDefault();
  if(!CAN.manageTeam() || !PROFILE.row) return false;
  const name=$("#pmName").value.trim(), phone=$("#pmPhone").value.trim();
  if(!name) { profileMsg("pmMsg","Enter your full name."); return false; }
  if(phone && !/^\+?[0-9][0-9 ()-]{5,19}$/.test(phone)) { profileMsg("pmMsg","Enter a valid phone number (digits, spaces, +, - or brackets)."); return false; }
  const btn=$("#pmSave"); btn.disabled=true; btn.textContent="Saving…";
  try{
    const { data:{ user } } = await supabase.auth.getUser();
    if(!user){ profileMsg("pmMsg","You're not signed in. Please sign in again."); return false; }
    // Scoped to the caller's own linked row; RLS (profiles_update) still decides.
    const { data, error } = await supabase.from("profiles")
      .update({ full_name:name, phone:phone||null })
      .eq("id", PROFILE.row.id).eq("auth_user_id", user.id).select("id,full_name,phone");
    if(error){ profileMsg("pmMsg","Could not save your changes — "+(error.message||"please try again.")); return false; }
    if(!data || !data.length){ profileMsg("pmMsg","Your profile could not be updated — you may not have permission to change it."); return false; }
    PROFILE.row.full_name=data[0].full_name; PROFILE.row.phone=data[0].phone;
    const p=PEOPLE.find(x=>x.id===PROFILE.row.id); if(p) p.name=data[0].full_name;
    saveIdentityCache();
    render(); toast("Profile updated");
  }catch(err){
    profileMsg("pmMsg","Network error — your changes were not saved. Try again.");
  }finally{
    const b=$("#pmSave"); if(b){ b.disabled=false; b.textContent="Save changes"; }
  }
  return false;
}

/* Change password for the signed-in user, via Supabase Auth only.
   1. Confirm the current password on a separate in-memory client
      (createPasswordCheckClient) so the app's own session is untouched.
   2. Update the password on the real session with updateUser() — the user
      stays signed in. Passwords are never logged, stored, or cached. */
async function changeMyPassword(ev){
  ev.preventDefault();
  const cur=$("#cpCurrent").value, p1=$("#cpNew").value, p2=$("#cpConfirm").value;
  $("#cpMsg").hidden=true;
  if(!cur) { profileMsg("cpMsg","Enter your current password."); return false; }
  if(!p1) { profileMsg("cpMsg","Enter a new password."); return false; }
  if(p1.length<8) { profileMsg("cpMsg","New password must be at least 8 characters."); return false; }
  if(p1!==p2) { profileMsg("cpMsg","New password and confirmation do not match."); return false; }
  if(p1===cur) { profileMsg("cpMsg","New password must be different from your current password."); return false; }

  const btn=$("#cpSubmit"); btn.disabled=true; btn.textContent="Changing…";
  const done=()=>{ const b=$("#cpSubmit"); if(b){ b.disabled=false; b.textContent="Change password"; } };
  try{
    const { data:{ user }, error:userErr } = await supabase.auth.getUser();
    if(userErr || !user || !user.email){ profileMsg("cpMsg","Your session has expired. Sign in again, then change your password."); return false; }

    const checker = window.createPasswordCheckClient ? window.createPasswordCheckClient() : null;
    if(!checker){ profileMsg("cpMsg","Password change is not available — the app is not configured."); return false; }
    const { data:chk, error:chkErr } = await checker.auth.signInWithPassword({ email:user.email, password:cur });
    if(chkErr){
      const code=chkErr.code||"", msg=chkErr.message||"";
      if(code==="invalid_credentials" || /invalid login credentials/i.test(msg)) profileMsg("cpMsg","Current password is incorrect.");
      else if(/rate limit|too many/i.test(msg) || code==="over_request_rate_limit") profileMsg("cpMsg","Too many attempts. Wait a few minutes and try again.");
      else if(/network|fetch/i.test(msg)) profileMsg("cpMsg","Network error — check your connection and try again.");
      else profileMsg("cpMsg","Could not verify your current password. Please try again.");
      return false;
    }
    // End the throwaway verification session (server-side too); ignore failures.
    if(chk && chk.session) await checker.auth.signOut({ scope:"local" }).catch(()=>{});
    if(!chk || !chk.user || chk.user.id!==user.id){ profileMsg("cpMsg","Could not verify your current password. Please try again."); return false; }

    const { error } = await supabase.auth.updateUser({ password:p1, current_password:cur });
    if(error){
      const code=error.code||"", msg=error.message||"";
      if(code==="same_password") profileMsg("cpMsg","New password must be different from your current password.");
      else if(code==="weak_password") profileMsg("cpMsg","That password is too weak"+(msg?" — "+msg:"")+".");
      else if(code==="reauthentication_needed" || code==="reauthentication_not_valid")
        profileMsg("cpMsg","For security, sign out and sign in again, then change your password.");
      else if(/network|fetch/i.test(msg)) profileMsg("cpMsg","Network error — your password was not changed. Try again.");
      else profileMsg("cpMsg","Could not change your password"+(msg?" — "+msg:"")+".");
      return false;
    }
    ["cpCurrent","cpNew","cpConfirm"].forEach(id=>{ const el=$("#"+id); if(el) el.value=""; });
    profileMsg("cpMsg","Password changed. Use your new password the next time you sign in.", true);
    toast("Password changed");
  }catch(err){
    profileMsg("cpMsg","Network error — your password was not changed. Try again.");
  }finally{ done(); }
  return false;
}

   corrected. The database enforces the same (trg_guard_holiday_change). */
function mapHoliday(h){ return { id:h.id, date:h.holiday_date, name:h.name, description:h.description||"" }; }
const holidayLocked = h => !!h && h.date <= TODAY;
function holidaysCardHTML(year){

          '<td class="wrap">'+esc(h.name)+(h.description?'<div class="tiny muted">'+esc(h.description)+'</div>':'')+'</td>'+

            ? '<button class="btn ghost sm" onclick="holidayForm(\''+h.id+'\')">Edit</button>'+
              (holidayLocked(h) ? '' : ' <button class="btn ghost sm" onclick="confirmDeleteHoliday(\''+h.id+'\')">Delete</button>')
            : '')+'</td></tr>').join("")+'</tbody></table>'
      : '<div class="empty">No holidays added for '+year+'.</div>')+
    '<p class="tiny muted" style="margin-top:10px">Sunday is the weekly off and is not listed. Saturdays and holidays are optional working days: '+
      'nobody is marked absent for them, and working one (punch in and out) earns 1 Earned Leave. '+
      (can ? 'Holidays can be added for future dates only; past holidays keep their date.' : 'Only Partners, Managers and Assistant Managers can add or change holidays.')+'</p></div>';
}
function holidayForm(id){
  if(!CAN.manageHolidays()) return toast("Only Partners, Managers and Assistant Managers can add or change holidays");
  const h = id ? HOLIDAYS.find(x=>x.id===id) : null;
  if(id && !h) return toast("That holiday no longer exists — refresh the page");
  const locked = holidayLocked(h);
  modal('<h3>'+(h?'Edit holiday':'Add holiday')+'</h3>'+
    '<label class="field"><span>Date *</span><input type="date" id="hfDate" min="'+addDays(TODAY,1)+'" value="'+(h?h.date:'')+'"'+(locked?' disabled':'')+'></label>'+
    (locked ? '<p class="tiny muted" style="margin:-6px 0 10px">This date has passed, so it cannot be moved. You can still correct the name or description.</p>' : '')+
    '<label class="field"><span>Holiday name *</span><input type="text" id="hfName" maxlength="100" value="'+esc(h?h.name:'')+'" placeholder="e.g. Diwali"></label>'+
    '<label class="field"><span>Description</span><textarea id="hfDesc" maxlength="500" rows="3" placeholder="Optional">'+esc(h?h.description:'')+'</textarea></label>'+
    '<p class="tiny muted">Shown in every employee\'s calendar, in every company of '+esc(FIRM.name)+'.</p>'+
    '<div class="row"><button class="btn ghost" onclick="closeModal()">Cancel</button>'+
    '<button class="btn" id="hfSave" onclick="saveHoliday('+(h?'\''+h.id+'\'':'')+')">'+(h?'Save changes':'Add holiday')+'</button></div>');
}
async function saveHoliday(id){
  if(!CAN.manageHolidays()) return toast("Only Partners, Managers and Assistant Managers can add or change holidays");
  const h = id ? HOLIDAYS.find(x=>x.id===id) : null;
  const date = $("#hfDate").value, name = $("#hfName").value.trim(), description = $("#hfDesc").value.trim();
  if(!date || !validISODate(date)) return toast("Choose the holiday date");
  if(!name) return toast("Enter the holiday name");
  if(name.length>100) return toast("The name can be at most 100 characters");
  if(description.length>500) return toast("The description can be at most 500 characters");
  const dateChanged = !h || date!==h.date;
  if(dateChanged && date<=TODAY) return toast(h ? "A holiday can only be moved to a future date" : "Holidays can only be added for future dates");
  if(h && dateChanged && holidayLocked(h)) return toast("This holiday's date has passed, so it cannot be moved");
  const clash = HOLIDAYS.find(x=>x.date===date && x.id!==id);
  if(clash) return toast("There is already a holiday on "+fmtDate(date)+": "+clash.name);
  const btn=$("#hfSave"); if(btn.disabled) return; btn.disabled=true;
  const fields = { name, description:description||null };
  if(dateChanged) fields.holiday_date = date;
  const { data, error } = h
    ? await supabase.from("holidays").update(fields).eq("id", h.id).select("*").maybeSingle()
    : await supabase.from("holidays").insert({ organization_id:ORG_ID, ...fields }).select("*").single();
  btn.disabled=false;
  if(error) return toast(error.code==="23505" ? "There is already a holiday on that date" : "Could not save the holiday — "+error.message);
  if(!data) return toast("Could not save the holiday — only Partners, Managers and Assistant Managers can change holidays");
  const row = mapHoliday(data);
  HOLIDAYS = HOLIDAYS.filter(x=>x.id!==row.id).concat(row);
  closeModal(); toast(h ? "Holiday updated" : name+" added to everyone's calendar"); render();
}
function confirmDeleteHoliday(id){
  const h = HOLIDAYS.find(x=>x.id===id); if(!h) return;
  if(!CAN.manageHolidays()) return toast("Only Partners, Managers and Assistant Managers can delete holidays");
  if(holidayLocked(h)) return toast("A holiday dated today or earlier cannot be deleted");
  modal('<h3>Delete holiday?</h3><p style="margin:0 0 10px"><strong>'+esc(h.name)+'</strong> on '+fmtDate(h.date)+
    ' will be removed from every employee\'s calendar.</p>'+
    '<div class="row"><button class="btn ghost" onclick="closeModal()">Cancel</button>'+
    '<button class="btn" id="hdDel" onclick="deleteHoliday(\''+h.id+'\')">Delete holiday</button></div>');
}
async function deleteHoliday(id){
  const btn=$("#hdDel"); if(btn && btn.disabled) return; if(btn) btn.disabled=true;
  const { data, error } = await supabase.from("holidays").delete().eq("id", id).select("id");
  if(btn) btn.disabled=false;
  if(error) return toast("Could not delete the holiday — "+error.message);
  if(!data || !data.length) return toast("Could not delete the holiday — only Partners, Managers and Assistant Managers can delete holidays");
  HOLIDAYS = HOLIDAYS.filter(x=>x.id!==id);
  closeModal(); toast("Holiday deleted"); render();
}

/* Live updates (046): every open app re-reads the holiday list as soon as
   anyone adds, edits or deletes a holiday (Supabase Realtime on `holidays`),
   and again when the tab becomes visible, in case the socket dropped. No
   filter on the subscription — Realtime can't filter DELETE events — so any
   event just triggers a re-read of this organization's list (RLS-scoped).
   Before 046 is applied the channel receives nothing and the app behaves
   as before (holidays refresh on reload). */
let HOLIDAY_CHANNEL = null, HOLIDAY_CHANNEL_ORG = null, HOLIDAY_REFETCH_T = null, HOLIDAY_LAST_FETCH = 0;
const holidaysKey = list => list.map(h=>h.id+"|"+h.date+"|"+h.name+"|"+h.description).sort().join("\n");
function startHolidaySync(){
  if(!supabase || !ORG_ID || HOLIDAY_CHANNEL_ORG===ORG_ID) return;
  stopHolidaySync();
  HOLIDAY_CHANNEL_ORG = ORG_ID;
  HOLIDAY_LAST_FETCH = Date.now();
  HOLIDAY_CHANNEL = supabase.channel("holidays-"+ORG_ID)
    .on("postgres_changes", { event:"*", schema:"public", table:"holidays" }, scheduleHolidayRefetch)
    .subscribe();
}
function stopHolidaySync(){
  clearTimeout(HOLIDAY_REFETCH_T); HOLIDAY_REFETCH_T = null;
  if(HOLIDAY_CHANNEL && supabase) supabase.removeChannel(HOLIDAY_CHANNEL).catch(()=>{});
  HOLIDAY_CHANNEL = null; HOLIDAY_CHANNEL_ORG = null;
}
function scheduleHolidayRefetch(){
  clearTimeout(HOLIDAY_REFETCH_T);
  HOLIDAY_REFETCH_T = setTimeout(refetchHolidays, 400);   // one read per burst of changes
}
async function refetchHolidays(){
  const org = ORG_ID;
  if(!supabase || !org || !DATA_READY) return;
  HOLIDAY_LAST_FETCH = Date.now();
  const { data, error } = await supabase.from("holidays").select("*").eq("organization_id", org);
  if(error || !data || org!==ORG_ID){ if(error) console.warn("[HOLIDAYS] refresh failed", error); return; }
  const next = data.map(mapHoliday);
  if(holidaysKey(next)===holidaysKey(HOLIDAYS)) return;
  HOLIDAYS = next;
  // Never wipe an open form or a field being typed in; the next render shows it.
  const a = document.activeElement;
  const typing = !!a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);
  if($("#veil").hidden && !typing) render();
}
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState==="visible" && HOLIDAY_CHANNEL && Date.now()-HOLIDAY_LAST_FETCH > 60000) scheduleHolidayRefetch();
});

/* =====================  DESIGNATIONS (044)  ===================== */
/* A designation is the employee's title (designations.name) and maps to one of
   the 7 access levels in profiles.role, which every permission check still
   uses. The 7 built-in designations keep today's names and are read-only. The
   list is managed by Partners, Managers and Assistant Managers — a non-partner
   only for levels below their own; the access level never changes once set.
   Assigning a designation to an employee stays with Partners (Team page).
   Loaded on its own: before 044 is applied this fails quietly and the app
   keeps the fixed list. */
let DESIG_LIST = [], DESIG_ERROR = "";
const mapDesignation = d => ({ id:d.id, name:d.name, accessRole:d.access_role, builtin:!!d.is_builtin,
  active:!!d.is_active, sort:d.sort_order||0 });
const sortDesignations = () => DESIG_LIST.sort((a,b)=>(RANK[b.accessRole]||0)-(RANK[a.accessRole]||0) ||
  (b.builtin?1:0)-(a.builtin?1:0) || (a.sort-b.sort) || a.name.localeCompare(b.name));
async function loadDesignations(){
  const org = ORG_ID;
  DESIG_LIST = []; DESIG_ERROR = "";
  if(!org) return;
  const [dR, pR] = await Promise.all([
    supabase.from("designations").select("id,name,access_role,is_builtin,is_active,sort_order").eq("organization_id", org),
    supabase.from("profiles").select("id,designation_id").eq("organization_id", org)
  ]);
  if(org !== ORG_ID) return;
  const err = dR.error || pR.error;
  if(err){ console.error("[DESIG] Designations load failed — run supabase/migrations/044_managed_designations.sql.", err); DESIG_ERROR = err.message || "unknown error"; return; }
  DESIG_LIST = dR.data.map(mapDesignation); sortDesignations();
  const byProfile = new Map(pR.data.map(r=>[r.id, r.designation_id]));
  PEOPLE.forEach(applyDesignation);
  function applyDesignation(p){
    p.designationId = byProfile.get(p.id) || null;
    const d = DESIG_LIST.find(x=>x.id===p.designationId);
    p.designation = d ? d.name : "";
  }
}
const designationsReady = () => !DESIG_ERROR && DESIG_LIST.length>0;
/* What to show as someone's designation: their title, else the access level's name. */
function desigName(p){ return (p && p.designation) || (p && p.label) || ""; }
/* Profile page: its own profiles row, named through the loaded people list. */
function profileDesignation(r){ const p = PEOPLE.find(x=>x.id===r.id); return (p && p.designation) || ROLE_LABEL[r.role] || r.role || ""; }
const builtinDesignation = role => DESIG_LIST.find(d=>d.builtin && d.accessRole===role) || null;
/* Designation <select> options for the employee form, values "d:<id>"; the
   employee's current one stays listed even when inactive. Legacy roles with no
   designation keep a "r:<role>" option. Without 044: the fixed role list. */
function designationOptionsHTML(p){
  if(!designationsReady()){
    return (ASSIGNABLE_ROLES.includes(p.role) ? '' : '<option value="r:'+esc(p.role)+'" selected>'+esc(ROLE_LABEL[p.role]||p.role)+' (legacy)</option>')+
      ASSIGNABLE_ROLES.map(r=>'<option value="r:'+r+'"'+(r===p.role?" selected":"")+'>'+ROLE_LABEL[r]+'</option>').join("");
  }
  const cur = p.designationId || (p.id ? null : (builtinDesignation(p.role)||{}).id);
  const list = DESIG_LIST.filter(d=>d.active || d.id===cur);
  return (!cur && p.role && !builtinDesignation(p.role) ? '<option value="r:'+esc(p.role)+'" selected>'+esc(ROLE_LABEL[p.role]||p.role)+' (legacy)</option>' : '')+
    ASSIGNABLE_ROLES.map(r=>{
      const ds = list.filter(d=>d.accessRole===r);
      return ds.length ? '<optgroup label="'+esc(ROLE_LABEL[r])+' access">'+ds.map(d=>'<option value="d:'+d.id+'"'+(d.id===cur?" selected":"")+'>'+
        esc(d.name)+(d.active?'':' (inactive)')+'</option>').join("")+'</optgroup>' : '';
    }).join("");
}
/* "d:<id>" / "r:<role>" → { role, designationId } */
function parseDesignationChoice(v){
  v = String(v||"");
  if(v.startsWith("d:")){ const d = DESIG_LIST.find(x=>x.id===v.slice(2)); return d ? { role:d.accessRole, designationId:d.id, name:d.name } : null; }
  if(v.startsWith("r:")) return { role:v.slice(2), designationId:null, name:ROLE_LABEL[v.slice(2)]||v.slice(2) };
  return null;
}

/* Access levels the signed-in user may give a new designation. */
const designationLevelChoices = () => ASSIGNABLE_ROLES.filter(r=>rank()>=RANK.partner || (RANK[r]||0) < rank());
function designationForm(id){

      (d ? '<option>'+esc(ROLE_LABEL[d.accessRole]||d.accessRole)+'</option>'
         : '<option value="">Choose what this designation can do…</option>'+
           designationLevelChoices().map(r=>'<option value="'+r+'">'+esc(ROLE_LABEL[r])+'</option>').join(""))+

    '<p class="tiny muted" style="margin-top:-6px">'+(d ? 'The access level is fixed once a designation is created.'
      : 'Employees with this designation get the same permissions as a '+'standard designation of this level. It cannot be changed later.')+'</p>'+

    '<button class="btn" id="dfSave" onclick="saveDesignation('+(d?'\''+d.id+'\'':'')+')">'+(d?'Save changes':'Add designation')+'</button></div>');
}
async function saveDesignation(id){
  const d = id ? DESIG_LIST.find(x=>x.id===id) : null;
  const name = $("#dfName").value.trim().replace(/\s+/g," ");
  const role = d ? d.accessRole : $("#dfRole").value;
  if(name.length<2 || name.length>60) return toast("The name must be 2–60 characters");
  if(!role) return toast("Choose the access level");
  if(d ? !CAN.editDesignation(d) : !designationLevelChoices().includes(role))
    return toast("You can only manage designations below your own level");
  if(DESIG_LIST.some(x=>x.id!==id && x.name.toLowerCase()===name.toLowerCase())) return toast('"'+name+'" already exists');
  const btn=$("#dfSave"); if(btn.disabled) return; btn.disabled=true;
  const cols = "id,name,access_role,is_builtin,is_active,sort_order";
  const { data, error } = d
    ? await supabase.from("designations").update({ name }).eq("id", d.id).select(cols).maybeSingle()
    : await supabase.from("designations").insert({ organization_id:ORG_ID, name, access_role:role, sort_order:RANK[role]||0 }).select(cols).single();
  btn.disabled=false;
  if(error) return toast(error.code==="23505" ? '"'+name+'" already exists' : "Could not save the designation — "+error.message);
  if(!data) return toast("Could not save the designation — you do not have permission to change it");
  const row = mapDesignation(data);
  DESIG_LIST = DESIG_LIST.filter(x=>x.id!==row.id).concat(row); sortDesignations();
  ALL_PEOPLE.forEach(p=>{ if(p.designationId===row.id) p.designation=row.name; });
  closeModal(); toast(d ? "Designation updated" : row.name+" added"); render();
}
async function toggleDesignation(id){
  const d = DESIG_LIST.find(x=>x.id===id);
  if(!d || !CAN.editDesignation(d)) return toast("You cannot change this designation");
  const { data, error } = await supabase.from("designations").update({ is_active:!d.active }).eq("id", id).select("id,is_active").maybeSingle();
  if(error) return toast("Could not update — "+error.message);
  if(!data) return toast("Could not update — you do not have permission to change it");
  d.active = !!data.is_active;
  toast(d.name+(d.active?" activated":" deactivated — employees who have it keep it")); render();
}
async function deleteDesignation(id){
  const d = DESIG_LIST.find(x=>x.id===id);
  if(!d || !CAN.editDesignation(d)) return toast("You cannot delete this designation");
  if(ALL_PEOPLE.some(p=>p.designationId===id)) return toast(d.name+" is in use — deactivate it instead");
  const { data, error } = await supabase.from("designations").delete().eq("id", id).select("id");
  if(error) return toast("Could not delete — "+error.message);
  if(!data || !data.length) return toast("Could not delete — you do not have permission to change it");
  DESIG_LIST = DESIG_LIST.filter(x=>x.id!==id);
  toast(d.name+" deleted"); render();
}
/* After create-employee (which only knows the role and gives the built-in
   designation of that role), set the chosen custom designation. */
async function setProfileDesignation(profileId, designationId){
  const { data, error } = await supabase.from("profiles").update({ designation_id:designationId })
    .eq("id", profileId).select("id,role,designation_id").maybeSingle();
  if(error || !data) return { ok:false, message:error ? error.message : "no permission" };
  return { ok:true, row:data };
}

/* ==================  LOCAL IDENTITY CACHE (display-only)  ==================
   Fixes the "Checking your database…" screen reappearing on every launch and
   every tab focus. This cache is NEVER used for authorization — every real
   check (auth.getUser(), the my_profile() RPC, is_active, and every
   RLS-governed query inside loadAppData()) still runs in full, every single
   time startApp() is called, exactly as before. All this does is let the
   app paint its OWN chrome — organization name, your name/role, a
   correctly-gated nav — immediately from the last values this exact signed-
   in user legitimately saw, while that same data is re-fetched for real in
   the background. If the re-fetch disagrees (deactivated, reassigned,
   session actually invalid), the real check wins outright — see startApp().
   Nothing here is fabricated: every cached field is a value Supabase
   returned to this user in an earlier, fully-authorized session. */
const IDENTITY_CACHE_KEY = "pm_identity_v1";
function saveIdentityCache(){
  try{
    const p = person(me);
    const comp = p.company || "";
    localStorage.setItem(IDENTITY_CACHE_KEY, JSON.stringify({
      uid:AUTH_UID, profileId:me, orgId:ORG_ID, orgName:FIRM.name,
      company:comp, companyId:p.companyId, companyName:companyFullName(p.companyId||comp),
      name:p.name, role:p.role, label:p.label, reportsTo:p.reportsTo
    }));
  }catch(e){ /* localStorage unavailable (private browsing etc.) — cache is optional, not required */ }
}
function loadIdentityCache(uid){
  try{
    const raw = localStorage.getItem(IDENTITY_CACHE_KEY);
    if(!raw) return null;
    const c = JSON.parse(raw);
    return (c && c.uid && c.uid===uid && c.profileId && c.orgId) ? c : null;
  }catch(e){ return null; }
}
function clearIdentityCache(){
  try{ localStorage.removeItem(IDENTITY_CACHE_KEY); }catch(e){}
}
/* Paints the app chrome from a cached identity and seeds a one-row PEOPLE
   so person(me)/rank()/CAN.* resolve correctly for that paint. DATA_READY
   stays false, so render() (see above) shows a plain loading note in the
   content pane only, never fabricated numbers, until the real
   loadAppData() lands and replaces PEOPLE wholesale. */
function paintFromCache(cache){
  FIRM.name = cache.orgName || "";
  ORG_ID = cache.orgId;
  const comp = cache.company || "";
  PEOPLE = [{ id:cache.profileId, name:cache.name, label:cache.label, role:cache.role,
    reportsTo:cache.reportsTo, company:comp, companyId:cache.companyId||null,
    active:true, email:"", joined:null, left:null, cost:0, bill:0, ctc:0, authUserId:cache.uid }];
  ALL_PEOPLE = PEOPLE;
  HOME_COMPANY_ID = cache.companyId || null;
  COMPANIES = HOME_COMPANY_ID
    ? [{ id:HOME_COMPANY_ID, code:comp, name:cache.companyName||comp, active:true }] : [];
  me = cache.profileId;
  DATA_READY = false;
  $("#authScreen").hidden = true;
  $("#sidebar").hidden = false;
  $("main").hidden = false;
  render();
}

async function doSignup(ev){
  ev.preventDefault();
  const name=$("#suName").value.trim(), email=$("#suEmail").value.trim().toLowerCase(), companyName=$("#suCompany").value.trim(), password=$("#suPassword").value, confirm=$("#suConfirm").value;
  const errEl=$("#authError"), btn=$("#suSubmit"); errEl.hidden=true;
  if(!name){errEl.textContent="Enter your full name.";errEl.hidden=false;return false;}
  if(!email){errEl.textContent="Enter your email address.";errEl.hidden=false;return false;}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){errEl.textContent="Enter a valid email address.";errEl.hidden=false;return false;}
  if(!password){errEl.textContent="Enter a password.";errEl.hidden=false;return false;}
  if(!confirm){errEl.textContent="Confirm your password.";errEl.hidden=false;return false;}
  if(password.length<8){errEl.textContent="Password must be at least 8 characters.";errEl.hidden=false;return false;}
  if(password!==confirm){errEl.textContent="Passwords do not match.";errEl.hidden=false;return false;}
  if(!companyName){errEl.textContent="Enter your company name.";errEl.hidden=false;return false;}
  if(!supabase){errEl.textContent="Supabase is not configured.";errEl.hidden=false;return false;}
  btn.disabled=true;btn.textContent="Creating account...";
  try{
    const {data,error}=await supabase.auth.signUp({email,password,options:{data:{full_name:name,company_name:companyName}}});
    if(error) throw error;
    if(data.session) return false;
    errEl.className="auth-alert ok";
    errEl.textContent="Account created. Confirm your email, then sign in to enter your workspace.";
    errEl.hidden=false;
  }catch(e){console.error("[AUTH] Signup request failed",e);errEl.textContent=e.message||"Registration failed. Please try again.";errEl.hidden=false;}
  finally{btn.disabled=false;btn.textContent="Sign Up";}
  return false;
}

function authErrorMessage(err, fallback){
  const msg = (err && err.message) || "";
  if(/invalid login credentials/i.test(msg)) return "Invalid email or password.";
  if(/email not confirmed/i.test(msg)) return "This account isn't confirmed yet — contact your administrator.";
  if(/network|fetch/i.test(msg)) return "Network error — check your connection and try again.";
  return fallback+(msg?" — "+msg:"");
}

async function doLogin(ev){
  ev.preventDefault();
  const email = $("#liEmail").value.trim();
  const password = $("#liPassword").value;
  const errEl = $("#authError"), btn = $("#liSubmit");
  errEl.hidden = true;
  if(!email || !password){ errEl.textContent = "Enter your email and password."; errEl.hidden = false; return false; }
  if(!supabase){ errEl.textContent = "Supabase is not configured."; errEl.hidden = false; return false; }
  btn.disabled = true; btn.textContent = "Signing in…";
  let error=null;
  try{
    const result=await supabase.auth.signInWithPassword({ email, password });
    error=result.error;
  }catch(err){
    console.error("[AUTH] Sign-in request failed",err);
    errEl.textContent=authErrorMessage(err,"Could not sign in");
    errEl.hidden=false;
    btn.disabled=false; btn.textContent="Sign in";
    return false;
  }
  btn.disabled = false; btn.textContent = "Sign in";
  if(error){
    console.error("[AUTH] Sign-in rejected by Supabase",error);
    errEl.textContent = authErrorMessage(error, "Could not sign in");
    errEl.hidden = false;
    return false;
  }
  // supabase.auth.onAuthStateChange picks up SIGNED_IN and loads the app.
  return false;
}

async function doSetNewPassword(ev){

/* =========================  BOOT  ============================= */
/* Two questions, asked in this order, and never conflated:
     1. "Am I authenticated?" — Supabase Auth already answered that by the
        time startApp() runs.
     2. "Which organization/profile/role do I have?" — answered here, via
        my_profile() first. Querying `organizations` before knowing that
        is what used to produce the misleading "No organization is set up"
        message for a merely-unlinked account (see migrations/
        004_profile_lookup_and_bootstrap.sql for the full explanation). */
async function provisionDirectSignup(user){
  // A direct signup creates its own tenant. The security-definer RPC links the
  // authenticated user to a Partner profile and company atomically; invited
  // employees already have a linked profile and never enter this branch.
  const meta=(user&&user.user_metadata)||{};
  const orgName=String(meta.company_name||"").trim();
  const name=String(meta.full_name||"").trim();
  if(!orgName||!name){
    return false;
  }
  const {error}=await supabase.rpc("provision_signup_company");
  if(error){
    // A repeated auth callback can overlap a successful provisioning request.
    // Recheck only this caller's profile before treating the error as final.
    let linkedRows=null, linkedErr=null;
    try{
      const linkedResult=await supabase.rpc("my_profile");
      linkedRows=linkedResult.data;
      linkedErr=linkedResult.error;
    }catch(err){ linkedErr=err; }
    if(linkedErr){ console.error("[SIGNUP] Post-provision profile recheck failed",linkedErr); throw linkedErr; }
    if(linkedRows?.some(p=>p.auth_user_id===user.id)) return true;
    console.error("[SIGNUP] Tenant provisioning RPC failed",error);
    throw error;
  }
  return true;
}

/* opts.quiet: true whenever the chrome/dashboard is already showing
   something reasonable — either fully loaded earlier this page-life, or
   optimistically painted from the identity cache (see paintFromCache()) —
   so there is no need to blank the screen with the two-step "Confirming
   your account." / "Fetching your firm's data." progress screens while
   this re-verifies. Every actual check below still runs in full every
   time; quiet only ever suppresses those two BENIGN progress screens — any
   real problem (session invalid, deactivated, load error, unmatched
   profile) still shows its normal blocking screen unconditionally, exactly
   as before, so nothing here weakens auth, RLS, or error visibility. */
let LANDED_FOR = null;   // profile id whose landing page has been chosen (see startApp)
async function startApp(opts){
  const quiet = !!(opts && opts.quiet);

  $("#authScreen").hidden = true;
  $("#sidebar").hidden = false;
  $("main").hidden = false;
  if(!quiet) renderBlockingScreen("Loading…", "Confirming your account.");

  let user=null, userErr=null;
  try{
    const authResult=await supabase.auth.getUser();
    user=authResult.data?.user||null;
    userErr=authResult.error||null;
  }catch(err){ userErr=err; }
  if(userErr || !user){
    AUTH_UID = null; clearIdentityCache();
    renderBlockingScreen("Session error", "We couldn't confirm your session. Please sign in again.", true, true);
    return;
  }

  // Case C/D split: is this session linked to a profile at all, independent
  // of organization RLS (see my_profile() — it can only ever return the
  // caller's own row, so it works even before any org relationship exists).
  let myRows=null, myErr=null;
  try{
    const profileResult=await supabase.rpc("my_profile");
    myRows=profileResult.data;
    myErr=profileResult.error;
  }catch(err){ myErr=err; }
  if(myErr){
    console.error("[AUTH] Profile lookup failed",myErr);
    renderBlockingScreen("Couldn't load your data",
      "Please check your connection and try again.", true, true);
    return;
  }
  const myRow = (myRows && myRows[0]) || null;

  if(!myRow){
    // A direct signup carries company/name metadata and receives its own
    // tenant. Invited employees have a linked profile and never enter this
    // branch; never infer their role or permissions from login history.
    try{
      if(await provisionDirectSignup(user)) return startApp(opts);
    }catch(err){
      renderBlockingScreen("Couldn't load your data",
        "We couldn't finish loading your workspace. Please try again or contact support.",true,true);
      return;
    }
    renderBlockingScreen("Account not assigned",
      "This login is not linked to an active employee profile. Ask your Partner to invite or assign your account.",true,true);
    return;
  }

  if(!myRow.is_active){
    AUTH_UID = null; clearIdentityCache();
    renderBlockingScreen("Account deactivated",
      "Your employee account has been deactivated. Contact your administrator.", true, true);
    return;
  }

  // Case A: linked and active — load the rest of the firm's data, scoped to
  // the organization this profile actually belongs to.
  // Data loading includes role-aware queries (such as Partner salary history),
  // so set the verified auth UID before those queries run.
  AUTH_UID = user.id;
  if(!quiet) renderBlockingScreen("Loading…", "Fetching your firm's data.");
  LOAD_ERROR = null;
  try{
    await loadAppData(myRow.organization_id,myRow.id);
  }catch(err){
    console.error("[AUTH] Employee/company data load failed",err);
    LOAD_ERROR = "Unexpected error while loading: "+(err && err.message ? err.message : String(err));
  }
  if(LOAD_ERROR){
    renderBlockingScreen("Couldn't load your data", LOAD_ERROR, true, true);
    return;
  }

  const myProfile = PEOPLE.find(p=>p.id===myRow.id);
  if(!myProfile){
    renderBlockingScreen("Couldn't load your data",
      "Your profile could not be matched to the loaded organization data. Contact your administrator.",
      true, true);
    return;
  }

  me = myProfile.id;
  AUTH_UID = user.id;
  // Landing page, chosen once per signed-in user per app session — quiet
  // session refreshes (tab focus, token revalidation) never move the user.
  // Only a partner of an organization whose initial setup is still pending
  // (organizations.setup_completed_at, 031) starts on Sites & Clients.
  if(LANDED_FOR !== me){
    LANDED_FOR = me;
    view = (CAN.manageTeam() && !FIRM.setupComplete) ? "clients" : "today";
  }
  refreshMyPunches();
  saveIdentityCache();
  render();
}

async function initAuth(){
  if(!supabase){
    renderBlockingScreen("Couldn't load your data",
      "Supabase is not configured — check VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY.", true, false);
    $("#sidebar").hidden = false; $("main").hidden = false; $("#authScreen").hidden = true;
    return;
  }

  supabase.auth.onAuthStateChange((event, session)=>{
    if(event==="PASSWORD_RECOVERY"){ showAuthScreen("recovery"); return; }
    if(event==="SIGNED_IN" && AUTH_VIEW!=="recovery"){
      // supabase-js re-fires SIGNED_IN for reasons that are not a new
      // sign-in — a tab regaining focus, its own internal session
      // revalidation — not just an actual login. If it's the exact same
      // user we already fully loaded this page-life, that is a redundant
      // re-fire: skip the blocking screens and, throttled, just refresh
      // quietly. A DIFFERENT user id (a real new sign-in, or switching
      // accounts) always gets the full, non-quiet flow — this is what
      // preserves logout/account-switching correctness.
      if(session && session.user && AUTH_UID && session.user.id===AUTH_UID){
        const now = Date.now();
        if(now - LAST_QUIET_REFRESH < 30000) return;
        LAST_QUIET_REFRESH = now;
        startApp({quiet:true});
      } else {
        startApp();
      }
      return;
    }
    if(event==="SIGNED_OUT"){ stopHolidaySync(); me=null; LANDED_FOR=null; DATA_READY=false; AUTH_UID=null; PERSONAL_EVENTS=[]; STATUTORY_DATES=[]; STAT_CATEGORIES=[]; clearIdentityCache(); showAuthScreen("login"); return; }
  });

  let session=null, sessionError=null;
  try{
    const sessionResult=await supabase.auth.getSession();
    session=sessionResult.data?.session||null;
    sessionError=sessionResult.error||null;
  }catch(err){ sessionError=err; }
  if(sessionError){
    renderBlockingScreen("Session error","We couldn't restore your session. Please sign in again.",true,true);
    return;
  }
  if(session){
    // A cached identity for THIS exact user paints the chrome instantly;
    // the real check below still always runs — see startApp()'s header
    // comment. No cache, or a different user than last time on this
    // device/browser: the normal first-time blocking flow, unchanged.
    const cache = loadIdentityCache(session.user.id);
    if(cache){ paintFromCache(cache); LAST_QUIET_REFRESH = Date.now(); }
    startApp({ quiet: !!cache });
  } else {
    showAuthScreen("login");
  }
}

/* "Import Clients" (Sites & Clients) and "Import Employees" (Team).
   1. A real .xlsx template, built from the live dropdown values (XLSX rich mode).
   2. The uploaded .xlsx is read by xlsxReadCore() — in a Web Worker, so a big
      file never freezes the page — then checked against the template.
   3. Preview: clients are validated by the import-clients Edge Function in
      dry-run mode (organization-wide duplicate check, RLS as the caller);
      employees by the same rules as savePerson()/create-employee.
   4. Only "Confirm import" writes anything, through the same server paths as
      the Add forms: import-clients (inserts as the caller, under RLS) and
      create-employee, one call per employee, with a server-generated password.
   Retries are safe: an existing client code / employee code / email is
   always reported as a duplicate and skipped, never inserted twice. */

/* Header matching ignores case, "*", "(₹)" and punctuation. */

function biColName(n){ let s=""; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=(n-m-1)/26; } return s; }
function biSerial(iso){ const [y,m,d]=iso.split("-").map(Number); return (Date.UTC(y,m-1,d)-Date.UTC(1899,11,30))/86400000; }
function biSerialToISO(n){ return new Date(Math.round((Math.floor(n)-25569)*86400000)).toISOString().slice(0,10); }

/* A date cell: "" when blank, "YYYY-MM-DD", or null when unreadable.
   Accepts real Excel dates, 2026-04-01, 01-04-2026 / 01/04/2026 (day first)
   and 1-Apr-2026 / 1 April 2026. */
const BI_MONTHS = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
function biDate(v){
  if(v===null || v===undefined || v==="") return "";
  if(typeof v==="number") return (v>=1 && v<2958466) ? biSerialToISO(v) : null;
  const s=biStr(v); let y,m,d,x;
  if((x=/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[T ].*)?$/.exec(s))){ y=+x[1]; m=+x[2]; d=+x[3]; }
  else if((x=/^(\d{1,2})[\/\-. ](\d{1,2})[\/\-. ](\d{4})$/.exec(s))){ d=+x[1]; m=+x[2]; y=+x[3]; }
  else if((x=/^(\d{1,2})[\s\-\/]+([A-Za-z]{3,9})[\s\-\/,]+(\d{4})$/.exec(s))){
    d=+x[1]; y=+x[3]; m=BI_MONTHS.indexOf(x[2].slice(0,3).toLowerCase())+1;
    if(!m) return null;
  } else return null;
  if(y<1900 || y>2100) return null;
  const iso=y+"-"+pad2(m)+"-"+pad2(d);
  return validISODate(iso) ? iso : null;
}
/* An amount: 0 when blank, the number, or null when not a number in 0..max. */
function biAmount(v, max){
  if(v===null || v===undefined || v==="") return 0;
  const n = typeof v==="number" ? v : Number(biStr(v).replace(/^(rs\.?|inr)/i,"").replace(/[,\s₹]/g,""));
  return (Number.isFinite(n) && n>=0 && n<=max) ? Math.round(n*100)/100 : null;
}

/* ---------------- .xlsx reader ---------------- */
/* Self-contained (it is also the Web Worker's source): no outside names.
   Returns { sheets:[{ name, rows:[{ n: excelRowNumber, c:[cell values] }] }] }.
   Cells are strings, numbers or booleans; a date-formatted number comes back
   as "YYYY-MM-DD". */
async function xlsxReadCore(buf){
  const u8=new Uint8Array(buf);
  const dv=new DataView(u8.buffer,u8.byteOffset,u8.byteLength);
  const dec=new TextDecoder("utf-8");
  if(u8.length<22 || dv.getUint32(0,true)!==0x04034b50) throw new Error("NOT_XLSX");
  let eocd=-1;
  for(let i=u8.length-22;i>=Math.max(0,u8.length-65557);i--){ if(dv.getUint32(i,true)===0x06054b50){ eocd=i; break; } }
  if(eocd<0) throw new Error("NOT_XLSX");
  const count=dv.getUint16(eocd+10,true), cdOff=dv.getUint32(eocd+16,true);
  const entries={};
  let p=cdOff;    
  for(let i=0;i<count;i++){
    if(p+46>u8.length || dv.getUint32(p,true)!==0x02014b50) throw new Error("NOT_XLSX");
    const flags=dv.getUint16(p+8,true), method=dv.getUint16(p+10,true), csize=dv.getUint32(p+20,true);
    const nlen=dv.getUint16(p+28,true), xlen=dv.getUint16(p+30,true), clen=dv.getUint16(p+32,true), loff=dv.getUint32(p+42,true);
    const name=dec.decode(u8.subarray(p+46,p+46+nlen)).replace(/\\/g,"/").replace(/^\/+/,"");
    entries[name.toLowerCase()]={ method, csize, loff, encrypted:!!(flags&1) };
    p+=46+nlen+xlen+clen;
  }
  async function read(name){
    const e=entries[String(name).replace(/^\/+/,"").toLowerCase()];
    if(!e) return null;
    if(e.encrypted) throw new Error("NOT_XLSX");
    const start=e.loff+30+dv.getUint16(e.loff+26,true)+dv.getUint16(e.loff+28,true);
    const data=u8.subarray(start,start+e.csize);
    if(e.method===0) return dec.decode(data);
    if(e.method!==8) throw new Error("NOT_XLSX");
    const stream=new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    return dec.decode(new Uint8Array(await new Response(stream).arrayBuffer()));
  }
  const ent=s=>s.replace(/&(#x[0-9a-f]+|#\d+|amp|lt|gt|quot|apos);/gi,(m,g)=>{
      const k=g.toLowerCase();
      if(k[0]==="#") return String.fromCodePoint(k[1]==="x"?parseInt(k.slice(2),16):parseInt(k.slice(1),10));
      return {amp:"&",lt:"<",gt:">",quot:'"',apos:"'"}[k];
    }).replace(/_x([0-9a-fA-F]{4})_/g,(m,h)=>String.fromCharCode(parseInt(h,16)));
  const attr=(s,n)=>{ const m=new RegExp("(?:^|\\s)"+n+'\\s*=\\s*"([^"]*)"').exec(s); return m?ent(m[1]):null; };
  const textOf=x=>{ let out=""; const re=/<(?:\w+:)?t(?:\s[^>]*)?>([\s\S]*?)<\/(?:\w+:)?t>/g; let m;
    x=x.replace(/<(?:\w+:)?rPh\b[\s\S]*?<\/(?:\w+:)?rPh>/g,"");
    while((m=re.exec(x))) out+=ent(m[1]); return out; };
  const dirOf=path=>path.includes("/")?path.slice(0,path.lastIndexOf("/")+1):"";
  const resolve=(base,target)=>{
    if(target.startsWith("/")) return target.slice(1);
    const parts=(dirOf(base)+target).split("/"), out=[];
    parts.forEach(q=>{ if(q==="..") out.pop(); else if(q && q!==".") out.push(q); });
    return out.join("/");
  };
  async function rels(path){
    const x=await read(dirOf(path)+"_rels/"+path.slice(dirOf(path).length)+".rels");
    const out=[]; if(!x) return out;
    const re=/<(?:\w+:)?Relationship\b([^>]*?)\/?>/g; let m;
    while((m=re.exec(x))) out.push({ id:attr(m[1],"Id"), type:attr(m[1],"Type")||"", target:resolve(path,attr(m[1],"Target")||"") });
    return out;
  }

  const rootRels=await rels("");
  const office=rootRels.find(r=>/\/officeDocument$/.test(r.type));
  const wbPath=office?office.target:"xl/workbook.xml";
  const wbXml=await read(wbPath);
  if(!wbXml) throw new Error("NOT_XLSX");
  const wbRels=await rels(wbPath);
  const date1904=/<(?:\w+:)?workbookPr\b[^>]*date1904\s*=\s*"(1|true)"/i.test(wbXml);

  const sst=[];
  const sstRel=wbRels.find(r=>/\/sharedStrings$/.test(r.type));
  const sstXml=await read(sstRel?sstRel.target:"xl/sharedStrings.xml");
  if(sstXml){ const re=/<(?:\w+:)?si\b[^>]*>([\s\S]*?)<\/(?:\w+:)?si>|<(?:\w+:)?si\s*\/>/g; let m; while((m=re.exec(sstXml))) sst.push(m[1]?textOf(m[1]):""); }

  const dateStyle=[];
  const stRel=wbRels.find(r=>/\/styles$/.test(r.type));
  const stXml=await read(stRel?stRel.target:"xl/styles.xml");
  if(stXml){
    const fmts={}; let m;
    const nf=/<(?:\w+:)?numFmt\b([^>]*?)\/?>/g;
    while((m=nf.exec(stXml))) fmts[attr(m[1],"numFmtId")]=attr(m[1],"formatCode")||"";
    const isDate=id=>{
      const n=+id;
      if((n>=14&&n<=22)||(n>=27&&n<=36)||(n>=45&&n<=47)||(n>=50&&n<=58)) return true;
      const code=fmts[id]; if(!code) return false;
      const bare=code.replace(/"[^"]*"/g,"").replace(/\[[^\]]*\]/g,"").replace(/\\./g,"");
      return /[dy]/i.test(bare) || /m{3,}/i.test(bare);
    };
    const xfs=/<(?:\w+:)?cellXfs\b[^>]*>([\s\S]*?)<\/(?:\w+:)?cellXfs>/.exec(stXml);
    if(xfs){ const re=/<(?:\w+:)?xf\b([^>]*?)(?:\/>|>)/g; while((m=re.exec(xfs[1]))) dateStyle.push(isDate(attr(m[1],"numFmtId")||"0")); }
  }
  const toISO=n=>{ const days=Math.floor(n)+(date1904?1462:0)-25569; return new Date(days*86400000).toISOString().slice(0,10); };
  const colIdx=ref=>{ const m=/^([A-Z]+)/i.exec(ref||""); if(!m) return -1; let n=0; for(const ch of m[1].toUpperCase()) n=n*26+ch.charCodeAt(0)-64; return n-1; };

  const sheets=[];
  const sre=/<(?:\w+:)?sheet\b([^>]*?)\/?>/g; let sm;
  while((sm=sre.exec(wbXml))){
    const a=sm[1];
    const rid=attr(a,"r:id") || (/\s[\w]+:id\s*=\s*"([^"]*)"/.exec(a)||[])[1];
    const rel=wbRels.find(r=>r.id===rid);
    const xml=rel?await read(rel.target):null;
    const rows=[];
    if(xml){
      const rowRe=/<(?:\w+:)?row\b([^>]*?)(?:\/>|>([\s\S]*?)<\/(?:\w+:)?row>)/g; let rm, seq=0;
      while((rm=rowRe.exec(xml))){
        const rn=+(attr(rm[1],"r")||0) || seq+1; seq=rn;
        const cells=[]; let ci=-1;
        if(rm[2]){
          const cre=/<(?:\w+:)?c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/(?:\w+:)?c>)/g; let cm;
          while((cm=cre.exec(rm[2]))){
            const ca=cm[1], inner=cm[2]||"";
            const at=colIdx(attr(ca,"r")); ci = at>=0 ? at : ci+1;
            const t=attr(ca,"t")||"n", s=+(attr(ca,"s")||0);
            const vm=/<(?:\w+:)?v>([\s\S]*?)<\/(?:\w+:)?v>/.exec(inner);
            const raw=vm?ent(vm[1]):"";
            let v="";
            if(t==="s") v=sst[+raw]||"";
            else if(t==="inlineStr") v=textOf(inner);
            else if(t==="str") v=raw;
            else if(t==="b") v=raw==="1";
            else if(t==="e") v="";
            else if(raw!==""){ const n=Number(raw); v=Number.isFinite(n) ? (dateStyle[s] ? toISO(n) : n) : raw; }
            while(cells.length<ci) cells.push("");
            cells[ci]=v;
          }
        }
        rows.push({ n:rn, c:cells });
      }
    }
    sheets.push({ name:attr(a,"name")||"", rows });
  }
  return { sheets };
}
/* Parses off the main thread; falls back to the page if a Worker can't start. */
function biParseWorkbook(buf){
  return new Promise((resolve,reject)=>{
    let w=null, url=null;
    const onPage=()=>xlsxReadCore(buf).then(resolve,reject);
    try{
      const src="const xlsxReadCore = "+xlsxReadCore.toString()+";\n"+
        "self.onmessage=async e=>{try{self.postMessage({ok:true,r:await xlsxReadCore(e.data)});}"+
        "catch(err){self.postMessage({ok:false,error:String(err&&err.message||err)});}};";
      url=URL.createObjectURL(new Blob([src],{type:"text/javascript"}));
      w=new Worker(url);
    }catch(_e){ if(url) URL.revokeObjectURL(url); onPage(); return; }
    const done=()=>{ try{ w.terminate(); }catch(_e){} URL.revokeObjectURL(url); };
    w.onmessage=ev=>{ done(); if(ev.data && ev.data.ok) resolve(ev.data.r); else reject(new Error(ev.data && ev.data.error || "NOT_XLSX")); };
    w.onerror=ev=>{ if(ev && ev.preventDefault) ev.preventDefault(); done(); onPage(); };
    w.postMessage(buf);
  });
}

/* Finds the template sheet and its columns; returns { rows, extra } or { error }. */
function biExtract(kind, wb){
  const K=BI_KINDS[kind], cols=K.columns();
  const headOf=sh=>sh.rows.find(r=>r.c.some(v=>biStr(v)!==""));
  const fits=sh=>{ const h=headOf(sh); if(!h) return false; const got=h.c.map(biNorm);
    return cols.filter(c=>c.req).every(c=>got.includes(biNorm(c.header))); };
  const sheet=wb.sheets.find(s=>biNorm(s.name)===biNorm(K.sheet)) || wb.sheets.find(fits);
  if(!sheet) return { error:'This file has no "'+K.sheet+'" sheet. Download the '+K.noun+' import template and fill in its "'+K.sheet+'" sheet.' };
  const head=headOf(sheet);
  if(!head) return { error:'The "'+sheet.name+'" sheet is empty — no column headings or rows were found.' };
  const got=head.c.map(biNorm), index={}, missing=[];
  cols.forEach(c=>{ const i=got.indexOf(biNorm(c.header)); if(i<0) missing.push(c.header); else index[c.key]=i; });
  if(missing.length) return { error:'This is not the '+K.noun+' import template — missing column'+(missing.length>1?"s":"")+": "+
    missing.join(", ")+". Download the template again and copy your rows into it." };
  const known=new Set(cols.map(c=>biNorm(c.header)));
  const extra=head.c.map(biStr).filter(v=>v && !known.has(biNorm(v)));
  const rows=[];
  for(const r of sheet.rows){
    if(r.n<=head.n) continue;
    const v={}; let any=false;
    cols.forEach(c=>{ let x=r.c[index[c.key]];
      if(x===undefined || x===null) x="";
      if(typeof x==="boolean") x=x?"TRUE":"FALSE";
      if(typeof x==="string") x=x.trim();
      if(x!=="") any=true; v[c.key]=x; });
    if(any) rows.push({ row:r.n, v });
  }
  if(!rows.length) return { error:'No '+K.nouns+' found — the "'+sheet.name+'" sheet has headings but no filled rows.' };
  if(rows.length>BI_MAX_ROWS) return { error:"This file has "+rows.length.toLocaleString("en-IN")+" rows. Import at most "+
    BI_MAX_ROWS.toLocaleString("en-IN")+" at a time — split the file and import each part." };
  return { rows, extra };
}

/* ---------------- validation ---------------- */
/* Records: { row, raw, status: ready|invalid|duplicate (preview) then
   imported|failed|duplicate, reason, warnings[], payload }. */
function biClientRecords(rows){
  return rows.map(r=>({ row:r.row, raw:r.v, status:"pending", reason:"", warnings:[],
    payload:{ row:r.row, code:biStr(r.v.code).toUpperCase(), name:biStr(r.v.name), type:biStr(r.v.type),
      pan:biStr(r.v.pan).toUpperCase(), gstin:biStr(r.v.gstin).toUpperCase(), email:biStr(r.v.email),
      phone:biShow(r.v.phone), partner:biPartnerCodeOf(r.v.partner) } }));
}
/* Server results -> records. Also catches what one request can't see: the
   same code / PAN in two different requests of the same file. */
function biApplyClientResults(recs, results, preview){
  const by=new Map(results.map(r=>[r.row,r]));
  recs.forEach(rec=>{
    const r=by.get(rec.row); if(!r) return;
    rec.status = r.status==="failed" ? (preview?"invalid":"failed") : r.status==="ready" ? "ready" : r.status;
    rec.reason = r.reason||"";
    rec.warnings = (r.warnings||[]).slice();
  });
  if(preview){
    const codes=new Map(), pans=new Map();
    recs.forEach(rec=>{
      if(rec.status!=="ready") return;
      const c=rec.payload.code, p=rec.payload.pan;
      if(codes.has(c)){ rec.status="duplicate"; rec.reason="Client code "+c+" appears earlier in this file (row "+codes.get(c)+")"; return; }
      codes.set(c,rec.row);
      if(p){ if(pans.has(p) && !rec.warnings.length) rec.warnings.push("Same PAN as row "+pans.get(p)+" in this file"); else if(!pans.has(p)) pans.set(p,rec.row); }
    });
  }
}

/* Same rules, order and wording as savePerson() and create-employee. */
function biEmployeeRecords(rows){
  const comps=assignableCompanies();
  const retained=ALL_PEOPLE.filter(p=>!p.deleted);   // deleted employees free their code and email (039)
  const byCode=new Map(retained.map(p=>[p.code,p]));
  const byEmail=new Map(retained.filter(p=>p.email).map(p=>[p.email.toLowerCase(),p]));
  const seenCode=new Map(), seenEmail=new Map();
  const recs=rows.map(r=>({ row:r.row, raw:r.v, status:"ready", reason:"", warnings:[], payload:null, dep:null, bossIn:"" }));
  for(const rec of recs){
    const v=rec.raw;
    const bad=m=>{ rec.status="invalid"; rec.reason=m; }, dup=m=>{ rec.status="duplicate"; rec.reason=m; };
    const name=biStr(v.name), code=biShow(v.code), email=biStr(v.email).toLowerCase();
    if(!name){ bad("Enter a name"); continue; }
    if(!code){ bad("An employee code is required"); continue; }
    if(byCode.has(code)){ dup("Employee code "+code+" is already used ("+byCode.get(code).name+")"); continue; }
    if(seenCode.has(code)){ dup("Employee code "+code+" appears earlier in this file (row "+seenCode.get(code)+")"); continue; }
    const compIn=biStr(v.company);
    if(!compIn){ bad("Select a company"); continue; }
    const named=comps.filter(c=>c.name.toLowerCase()===compIn.toLowerCase());
    const comp=named.length===1 ? named[0] : comps.find(c=>c.code && c.code.toLowerCase()===compIn.toLowerCase());
    if(!comp){ bad(named.length>1 ? 'More than one company is called "'+compIn+'" — enter its company code instead'
      : 'Company "'+compIn+'" was not found or is inactive — choose an active company'); continue; }
    if(!email){ bad("Enter an email address"); continue; }
    if(!BI_EMAIL_RE.test(email)){ bad("Enter a valid email address"); continue; }
    if(byEmail.has(email)){ dup("An employee with this email already exists ("+byEmail.get(email).name+")"); continue; }
    if(seenEmail.has(email)){ dup("Email "+email+" appears earlier in this file (row "+seenEmail.get(email)+")"); continue; }
    const roleIn=biStr(v.role).toLowerCase();
    if(!roleIn){ bad("Choose a designation"); continue; }
    // A managed designation (044) by name, else a standard one by name or code.
    const dMatch=designationsReady() ? DESIG_LIST.find(d=>d.active && d.name.toLowerCase()===roleIn.replace(/\s+/g," ")) : null;
    const role=dMatch ? dMatch.accessRole : ASSIGNABLE_ROLES.find(r=>ROLE_LABEL[r].toLowerCase()===roleIn || r===roleIn.replace(/[\s-]+/g,"_"));
    if(!role){ bad("Designation must be one of: "+(designationsReady() ? DESIG_LIST.filter(d=>d.active).map(d=>d.name) : ASSIGNABLE_ROLES.map(r=>ROLE_LABEL[r])).join(", ")); continue; }
    rec.designationId=dMatch && !dMatch.builtin ? dMatch.id : null;
    rec.designationName=dMatch ? dMatch.name : ROLE_LABEL[role];
    const joined=biDate(v.joined);
    if(joined===null){ bad("Joined on must be a valid date, e.g. 01-Apr-2026"); continue; }
    const ctc=biAmount(v.ctc,BI_MAX_CTC), cost=biAmount(v.cost,BI_MAX_RATE), bill=biAmount(v.bill,BI_MAX_RATE);
    if(ctc===null){ bad("Monthly CTC must be a number of 0 or more"); continue; }
    if(cost===null || bill===null){ bad("Rates cannot be negative — enter a number of 0 or more"); continue; }
    seenCode.set(code,rec.row); seenEmail.set(email,rec.row);
    rec.bossIn=biStr(v.reportsTo);
    rec.companyName=comp.name;
    rec.payload={ fullName:name, email, employeeCode:code, role, companyId:comp.id, reportsTo:null,
      joiningDate:joined||TODAY, costPerHour:cost, billRatePerHour:bill, monthlyCtc:ctc };
  }
  // Reports to: an active employee, or another row of this file.
  const inFile=new Map(recs.filter(r=>r.status==="ready").map(r=>[r.payload.employeeCode,r]));
  for(const rec of recs){
    if(rec.status!=="ready" || !rec.bossIn) continue;
    const b=biCodeOf(rec.bossIn);
    if(b===rec.payload.employeeCode){ rec.status="invalid"; rec.reason="Nobody reports to themselves"; continue; }
    const ex=byCode.get(b);
    if(ex){
      if(!ex.active){ rec.status="invalid"; rec.reason="Reports to "+ex.name+", who is inactive"; continue; }
      rec.payload.reportsTo=ex.id; continue;
    }
    const dep=inFile.get(b);
    if(dep){ rec.dep=dep; continue; }
    rec.status="invalid";
    rec.reason='Reports to "'+rec.bossIn+'" was not found — use the employee code of an active employee or of another row in this file';
  }
  for(const rec of recs){            // a reporting loop inside the file
    if(rec.status!=="ready" || !rec.dep) continue;
    let cur=rec.dep, steps=0;
    while(cur && steps++<=recs.length){ if(cur===rec){ rec.status="invalid"; rec.reason="The reporting line in this file loops back to this row"; break; } cur=cur.dep; }
  }
  let changed=true;                  // someone whose manager row can't be imported
  while(changed){
    changed=false;
    for(const rec of recs) if(rec.status==="ready" && rec.dep && rec.dep.status!=="ready"){
      rec.status="invalid"; rec.reason="Reports to row "+rec.dep.row+" ("+rec.dep.payload.employeeCode+"), which cannot be imported"; changed=true;
    }
  }
  return recs;
}

/* ---------------- server calls ---------------- */
async function biCallFn(name, body){
  let session=null;
  try{ ({ data:{ session } } = await supabase.auth.getSession()); }catch(_e){}
  if(!session) return { ok:false, status:401, error:"Your session has expired — sign in again." };
  if(!window.SUPABASE_FN_BASE) return { ok:false, error:"Server is not configured — missing Supabase URL." };
  let res;
  try{
    res=await fetch(window.SUPABASE_FN_BASE+name,{ method:"POST",
      headers:{ "Content-Type":"application/json", "Authorization":"Bearer "+session.access_token, "apikey":window.SUPABASE_ANON_KEY||"" },
      body:JSON.stringify(body) });
  }catch(_e){ return { ok:false, network:true, error:"Network error — could not reach the server." }; }
  let data=null; try{ data=await res.json(); }catch(_e){}
  if(!res.ok){
    const msg = data && data.error ? data.error+(data.detail?" ("+data.detail+")":"")
      : res.status===404 ? "The "+name+" function is not available on the server (HTTP 404)."
      : res.status===401 ? "Your session has expired. Please sign in again."
      : "The server answered HTTP "+res.status+".";
    return { ok:false, status:res.status, error:msg };
  }
  return { ok:true, status:res.status, data };
}

/* ---------------- state + screens ---------------- */
const BI_STATE = { clients:null, employees:null };

  progress:{ done:0, total:0 }, token:0, stop:false, abort:"", credsSaved:false, leaving:false });

function openImport(kind){
  const K=BI_KINDS[kind];
  if(!K.can()) return toast(K.denied);
  if(!BI_STATE[kind]) BI_STATE[kind]=biFresh();
  modal(biScreen(kind), "wide");
}
/* Repaint only if this import's dialog is the one on screen. */
function biRefresh(kind){
  const root=$("#biRoot");
  if($("#veil").hidden || !root || root.dataset.kind!==kind) return;
  $("#modal").innerHTML=biScreen(kind);
}
function biReset(kind){
  const st=BI_STATE[kind];
  if(st && (st.stage==="importing" || st.stage==="validating")) return;
  if(st && st.stage==="done" && kind==="employees" && biCreds(st).length && !st.credsSaved && !st.leaving){
    st.leaving=true; biRefresh(kind); return;
  }
  BI_STATE[kind]=biFresh(); biRefresh(kind);
}
function biClose(kind){
  const st=BI_STATE[kind];
  if(st && st.stage==="done" && kind==="employees" && biCreds(st).length && !st.credsSaved && !st.leaving){
    st.leaving=true; biRefresh(kind); return;
  }
  if(st && st.stage==="done"){ BI_STATE[kind]=null; }
  closeModal();
}
function biCloseAnyway(kind){ BI_STATE[kind]=null; closeModal(); }
function biSetFilter(kind, f){ BI_STATE[kind].filter=f; biRefresh(kind); }
function biStopImport(kind){ const st=BI_STATE[kind]; if(st && st.stage==="importing"){ st.stop=true; biRefresh(kind); } }
