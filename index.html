        ? 'Only the '+ready.toLocaleString("en-IN")+' row'+(ready>1?"s":"")+' marked Ready will be imported. '+
          (invalid+dupes ? 'Invalid and duplicate rows are skipped — download them as an error file, fix them and import that file again.' : '')
        : 'No rows are ready to import. Download the error file to see what to fix.')+
      (kind==="employees" && ready ? ' Each new employee gets the same welcome email as Add employee.' : '')+'</p>'+
      '<div class="row">'+
        '<button class="btn ghost" onclick="biReset(\''+kind+'\')">Choose another file</button>'+
        (invalid+dupes ? '<button class="btn ghost" onclick="biDownloadErrors(\''+kind+'\')">Download error file</button>' : '')+
        '<button class="btn" '+(ready&&!st.error?'':'disabled ')+'onclick="biConfirm(\''+kind+'\')">Confirm import ('+ready.toLocaleString("en-IN")+')</button>'+
      '</div>';
  }
  else if(st.stage==="importing"){
    const pct=st.progress.total ? Math.round(100*st.progress.done/st.progress.total) : 0;
    h+='<p class="tiny muted">'+esc(st.fileName)+'</p>'+
      '<p class="tiny" style="margin-top:10px">Importing '+st.progress.done.toLocaleString("en-IN")+' of '+st.progress.total.toLocaleString("en-IN")+' '+K.nouns+'…</p>'+
      '<div class="bi-bar"><div style="width:'+pct+'%"></div></div>'+
      '<p class="tiny muted">You can close this window — the import carries on, and opening '+K.title+' again shows its progress. '+
        'Keep the app open until it finishes.</p>'+
      '<div class="row"><button class="btn ghost" '+(st.stop?'disabled ':'')+'onclick="biStopImport(\''+kind+'\')">'+
        (st.stop?'Stopping after the current '+(kind==="clients"?"batch":"row")+'…':'Stop import')+'</button>'+
      '<button class="btn ghost" onclick="closeModal()">Hide</button></div>';
  }
  else if(st.stage==="done"){
    const imported=biCount(st,"imported"), failed=biCount(st,"failed")+biCount(st,"invalid"), dupes=biCount(st,"duplicate");
    const creds=biCreds(st);
    h+='<p class="tiny muted">'+esc(st.fileName)+'</p>'+
      '<div class="bi-stats c3">'+biStat("Successfully imported",imported,imported?"ok":"")+biStat("Failed",failed,failed?"bad":"")+
        biStat("Skipped as duplicates",dupes,dupes?"warn":"")+'</div>'+
      (st.abort ? '<div class="auth-alert bad">'+esc(st.abort)+'</div>' : '')+
      (imported ? '<p class="tiny muted">Imported '+K.nouns+' now appear in the '+(kind==="clients"?"client master":"team list")+'.</p>' : '')+
      (creds.length
        ? '<div class="auth-alert '+(st.credsSaved?'ok':'bad')+'" style="margin-top:10px">'+(st.credsSaved
            ? 'Credentials downloaded. Share each password privately and store the file securely.'
            : (st.leaving ? '<b>The passwords have not been downloaded.</b> They are not stored anywhere and cannot be shown again. ' +
                'Download them now, or close anyway and have each employee use “Forgot password” on the sign-in screen.'
              : 'Download the credentials file now — the '+creds.length+' generated password'+(creds.length>1?"s are":" is")+
                ' shown only once and stored nowhere.'))+'</div>'
        : '')+
      (failed+dupes ? biTable(kind) : '')+
      '<div class="row">'+
        (failed+dupes ? '<button class="btn ghost" onclick="biDownloadErrors(\''+kind+'\')">Download error file</button>' : '')+
        (creds.length ? '<button class="btn'+(st.credsSaved?' ghost':'')+'" onclick="biDownloadCreds()">Download credentials ('+creds.length+')</button>' : '')+
        '<button class="btn'+(creds.length && !st.credsSaved ? ' ghost' : '')+'" onclick="'+(st.leaving && !st.credsSaved?'biCloseAnyway':'biClose')+'(\''+kind+'\')">'+
          (st.leaving && !st.credsSaved ? 'Close without downloading' : 'Done')+'</button>'+
      '</div>';
  }
  return h+'</div>';
}
function biStat(label, n, tone){
  return '<div class="bi-stat '+tone+'"><b>'+n.toLocaleString("en-IN")+'</b><span>'+esc(label)+'</span></div>';
}
const BI_STATUS = { ready:["Ready","ok"], invalid:["Invalid","bad"], duplicate:["Duplicate","warn"],
  imported:["Imported","ok"], failed:["Failed","bad"], pending:["Checking","info"] };
function biTable(kind){
  const st=BI_STATE[kind];
  const done=st.stage==="done";
  const tabs = done ? [["problems","Problems"],["all","All"]] : [["all","All"],["ready","Ready"],["invalid","Invalid"],["duplicate","Duplicates"]];
  if(!tabs.some(t=>t[0]===st.filter)) st.filter=tabs[0][0];
  const pick = st.filter==="all" ? st.recs : st.filter==="problems" ? st.recs.filter(r=>r.status!=="imported") : st.recs.filter(r=>r.status===st.filter);
  const LIMIT=300;
  const shown=pick.slice(0,LIMIT);
  const cols = kind==="clients"
    ? [["Code",r=>r.payload.code],["Client",r=>r.payload.name],["Type",r=>r.payload.type||"Private Ltd"],["Partner",r=>biShow(r.raw.partner)]]
    : [["Code",r=>biShow(r.raw.code)],["Name",r=>biShow(r.raw.name)],["Company",r=>biShow(r.raw.company)],["Designation",r=>biShow(r.raw.role)],["Email",r=>biShow(r.raw.email)]];
  return '<div class="tabbar" style="margin:6px 0 8px">'+tabs.map(t=>{
      const n = t[0]==="all" ? st.recs.length : t[0]==="problems" ? st.recs.filter(r=>r.status!=="imported").length : st.recs.filter(r=>r.status===t[0]).length;
      return '<button class="tab" aria-current="'+(st.filter===t[0])+'" onclick="biSetFilter(\''+kind+'\',\''+t[0]+'\')">'+t[1]+' <span class="count">'+n+'</span></button>';
    }).join("")+'</div>'+
    '<div class="bi-table"><table><thead><tr><th class="r">Row</th><th>Status</th>'+cols.map(c=>'<th>'+c[0]+'</th>').join("")+'<th>Reason</th></tr></thead><tbody>'+
    (shown.length ? shown.map(r=>{
      const s=BI_STATUS[r.status]||[r.status,""];
      return '<tr><td class="r num tiny">'+r.row+'</td><td><span class="tag '+s[1]+'">'+s[0]+'</span></td>'+
        cols.map(c=>'<td>'+esc(c[1](r)||"—")+'</td>').join("")+
        '<td class="tiny">'+esc(r.reason||"")+(r.warnings.length?'<div class="tiny" style="color:var(--ochre)">'+esc(r.warnings.join("; "))+'</div>':'')+'</td></tr>';
    }).join("") : '<tr><td colspan="'+(cols.length+3)+'" class="tiny muted">No rows here.</td></tr>')+
    '</tbody></table></div>'+
    (pick.length>LIMIT ? '<p class="tiny muted" style="margin-top:6px">Showing the first '+LIMIT+' of '+pick.length.toLocaleString("en-IN")+' rows — the error file lists them all.</p>' : '');
}

/* ---------------- upload ---------------- */
function biPick(kind, input){ const f=input.files && input.files[0]; if(f) biLoad(kind, f); }
function biDrop(ev, kind){
  ev.preventDefault(); ev.currentTarget.classList.remove("drag");
  const f=ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files[0]; if(f) biLoad(kind, f);
}
async function biLoad(kind, file){
  const K=BI_KINDS[kind];
  if(!K.can()) return toast(K.denied);
  const st=BI_STATE[kind]=biFresh();
  const token=++BI_LOAD_TOKEN; st.token=token;
  st.fileName=file.name;
  const fail=m=>{ if(st.token!==token) return; st.stage="start"; st.error=m; biRefresh(kind); };
  if(!/\.xlsx$/i.test(file.name)) return fail(/\.(xls|csv|ods|xlsm|xlsb)$/i.test(file.name)
    ? "Only .xlsx files are supported. In Excel use File › Save As › Excel Workbook (.xlsx), then upload that file."
    : "That is not an Excel .xlsx file. Upload the "+K.noun+" import template saved as .xlsx.");
  if(file.size>BI_MAX_BYTES) return fail("The file is larger than 10 MB. Split it into smaller files and import each one.");
  st.stage="reading"; biRefresh(kind);
  let wb;
  try{ wb=await biParseWorkbook(await file.arrayBuffer()); }
  catch(_e){ return fail("This file could not be read as an Excel workbook. If it is password-protected, remove the password; otherwise open it in Excel and save it again as .xlsx."); }
  if(st.token!==token) return;
  const out=biExtract(kind, wb);
  if(out.error) return fail(out.error);
  st.extra=out.extra;
  if(kind==="employees"){
    st.recs=biEmployeeRecords(out.rows);
    st.stage="preview"; biRefresh(kind); return;
  }
  // Clients: the server validates every row (dry run) — the same checks the import itself runs.
  st.recs=biClientRecords(out.rows);
  st.stage="validating"; st.progress={ done:0, total:st.recs.length }; biRefresh(kind);
  const results=[];
  for(let i=0;i<st.recs.length;i+=200){
    const part=st.recs.slice(i,i+200);
    const res=await biCallFn("import-clients",{ dryRun:true, onboardedDate:TODAY, rows:part.map(r=>r.payload) });
    if(st.token!==token) return;
    if(!res.ok) return fail("Could not check the file on the server — "+res.error);
    results.push(...(res.data.results||[]));
    st.progress.done=Math.min(st.recs.length,i+200); biRefresh(kind);
  }
  biApplyClientResults(st.recs, results, true);
  st.recs.forEach(r=>{ if(r.status==="pending"){ r.status="invalid"; r.reason="The server did not return a result for this row"; } });
  st.stage="preview"; biRefresh(kind);
}
let BI_LOAD_TOKEN = 0;

/* ---------------- import ---------------- */
function biGuardUnload(on){
  if(window.desktopApp) return;   // the desktop window would refuse to close silently
  window.onbeforeunload = on ? (e=>{ e.preventDefault(); e.returnValue=""; return ""; }) : null;
}
async function biConfirm(kind){
  const K=BI_KINDS[kind], st=BI_STATE[kind];
  if(!K.can()) return toast(K.denied);
  if(!st || st.stage!=="preview") return;           // one run at a time — a second click does nothing
  const ready=st.recs.filter(r=>r.status==="ready");
  if(!ready.length) return;
  st.stage="importing"; st.stop=false; st.abort=""; st.progress={ done:0, total:ready.length }; st.filter="problems";
  biGuardUnload(true); biRefresh(kind);
  try{ await (kind==="clients" ? biImportClients(st, ready) : biImportEmployees(st, ready)); }
  catch(err){ st.abort="The import stopped unexpectedly — "+(err && err.message || err)+". Rows not marked Imported were not saved."; }
  ready.forEach(r=>{ if(r.status==="ready"){ r.status="failed"; r.reason=r.reason||"Not imported — the import stopped before this row"; } });
  biGuardUnload(false);
  const imported=biCount(st,"imported");
  if(imported){
    if(kind==="clients") FIRM.setupComplete=true;
    await reloadAppData();
  }
  st.stage="done"; biRefresh(kind);
  if(imported) toast(imported+" "+(imported>1?K.nouns:K.noun)+" imported");
}

async function biImportClients(st, ready){
  for(let i=0;i<ready.length;i+=BI_CLIENT_CHUNK){
    if(st.stop){ st.abort="Import stopped. Rows not marked Imported were not saved — import the error file to finish."; return; }
    const part=ready.slice(i,i+BI_CLIENT_CHUNK);
    const res=await biCallFn("import-clients",{ onboardedDate:TODAY, rows:part.map(r=>r.payload) });
    if(!res.ok){
      const unsure=res.network || !res.status || res.status>=500;
      part.forEach(r=>{ r.status="failed"; r.reason = unsure
        ? "Network or server error — this row may or may not have been saved. Import the error file again: rows already saved are skipped as duplicates."
        : res.error; });
      if(res.status===401 || res.status===403){ st.abort=res.error; ready.slice(i+BI_CLIENT_CHUNK).forEach(r=>{ r.status="failed"; r.reason="Not imported — "+res.error; }); return; }
    } else {
      biApplyClientResults(part, res.data.results||[], false);
      part.forEach(r=>{ if(r.status==="ready"||r.status==="pending"){ r.status="failed"; r.reason="The server did not return a result for this row"; } });
    }
    st.progress.done=Math.min(ready.length,i+BI_CLIENT_CHUNK); biRefresh("clients");
  }
}

async function biImportEmployees(st, ready){
  // Managers first: a row whose "Reports to" is another row of the file waits for it.
  const order=[], placed=new Set();
  const visit=r=>{ if(placed.has(r)) return; placed.add(r); if(r.dep) visit(r.dep); order.push(r); };
  ready.forEach(visit);
  for(const rec of order){
    if(st.stop){ st.abort="Import stopped. Rows not marked Imported were not saved — import the error file to finish."; return; }
    if(rec.dep){
      if(rec.dep.status!=="imported"){
        rec.status="failed";
        rec.reason="Not imported — the row it reports to (row "+rec.dep.row+", "+rec.dep.payload.employeeCode+") was not imported. Import the error file again once that row is fixed.";
        st.progress.done++; biRefresh("employees"); continue;
      }
      rec.payload.reportsTo=rec.dep.createdId;
    }
    const r=await createEmployeeAccount(Object.assign({}, rec.payload, { generatePassword:true }));
    if(r.ok && r.password && r.profile){
      rec.status="imported"; rec.createdId=r.profile.id; rec.password=r.password; rec.reason="";
      if(rec.designationId){   // create-employee gave that level's standard designation
        const set=await setProfileDesignation(r.profile.id, rec.designationId);
        if(!set.ok) rec.warnings.push("Designation could not be set to "+rec.designationName+" — edit this employee to set it");
      }
      if(!r.hasSalary) rec.warnings.push("Salary record not confirmed by the server — check this employee's CTC on the Salary page");
    } else if(r.ok){
      // An outdated create-employee that ignored generatePassword: nothing usable came back.
      rec.status="failed"; rec.reason="The server did not return a password — the create-employee function needs updating.";
      st.abort="The server's create-employee function is out of date. Deploy the updated function, then import the error file."; return;
    } else if(r.status===409){
      rec.status="duplicate"; rec.reason=r.message;
    } else {
      rec.status="failed";
      rec.reason = r.network
        ? "Network error — this employee may or may not have been created. Import the error file again: if they were created they are skipped as a duplicate, and they can set a password with “Forgot password”."
        : r.message;
      if(r.status===401 || r.status===403){ st.abort=r.message; st.progress.done++; return; }
      if(/^Password must be at least/.test(r.message||"")){
        rec.reason="The server's create-employee function is out of date (it does not generate passwords yet).";
        st.abort="The server's create-employee function is out of date. Deploy the updated function, then import the error file."; return;
      }
    }
    st.progress.done++; biRefresh("employees");
  }
}

/* ---------------- downloads ---------------- */
/* Failed, invalid and duplicate rows in the template's own columns — fix
   them and upload this same file again (the extra columns are ignored). */
function biDownloadErrors(kind){
  const K=BI_KINDS[kind], st=BI_STATE[kind], S=XLSX.STYLE, cols=K.columns();
  const rows=st.recs.filter(r=>r.status==="invalid"||r.status==="failed"||r.status==="duplicate");
  if(!rows.length) return toast("No failed rows");
  const label={ invalid:"Invalid", failed:"Failed", duplicate:"Duplicate — skipped" };
  const sheet={ name:K.sheet, freeze:true, headerHeight:30,
    cols:cols.map(c=>({ width:c.width, style:c.kind==="date"?S.date:c.kind==="money"?S.money:S.text })).concat([{width:11},{width:20},{width:70}]),
    rows:[cols.map(c=>({ v:c.header+(c.req?" *":""), s:c.req?S.headReq:S.headOpt })).concat([{v:"Source row",s:S.headOpt},{v:"Status",s:S.headOpt},{v:"Reason",s:S.headReq}])]
      .concat(rows.map(r=>cols.map(c=>{
        const v=r.raw[c.key];
        if(c.kind==="date" && typeof v==="string" && validISODate(v)) return { v:biSerial(v), s:S.date };
        if(typeof v==="number") return { v, s:c.kind==="money"?S.money:c.kind==="date"?S.date:0 };
        return { v:biShow(v), s:S.text };
      }).concat([r.row, label[r.status], { v:[r.reason].concat(r.warnings).filter(Boolean).join(" · "), s:S.bad }]))) };
  XLSX.download(K.file+"-import-errors-"+TODAY+".xlsx", [sheet], { rich:true });
}
function biDownloadCreds(){
  const st=BI_STATE.employees; if(!st) return;
  const creds=biCreds(st); if(!creds.length) return;
  const S=XLSX.STYLE;
  XLSX.download("employee-credentials-"+TODAY+".xlsx", [
    { name:"Credentials", freeze:true, headerHeight:24,
      cols:[{width:15},{width:26},{width:32},{width:22},{width:26},{width:20}],
      rows:[["Employee code","Full name","Sign-in email","Temporary password","Company","Designation"].map(v=>({v,s:S.headReq}))]
        .concat(creds.map(r=>[r.payload.employeeCode, r.payload.fullName, r.payload.email, r.password,
          companyFullName(r.payload.companyId), r.designationName||ROLE_LABEL[r.payload.role]].map(v=>({v,s:S.text})))) },
    { name:"Read me", headerStyle:S.title, cols:[{width:100}],
      rows:[[{v:"Employee credentials — keep this file private",s:S.title}],
        [{v:FIRM.name+" · created "+fmtDate(TODAY)+" · "+creds.length+" employee"+(creds.length>1?"s":""),s:S.note}], [],
        [{v:"Share each password with that employee only, privately (not in a group message or email thread).",s:S.wrap}],
        [{v:"They sign in with their email and this password, and can change it later from the sign-in screen.",s:S.wrap}],
        [{v:"Anyone who loses their password can use “Forgot password” on the sign-in screen.",s:S.wrap}],
        [{v:"The passwords are not stored by Practice Manager. Delete this file once everyone has signed in.",s:S.wrap}]] }
  ], { rich:true });
  st.credsSaved=true; st.leaving=false; biRefresh("employees");
}
/* ================  END BULK IMPORT  ================ */
</script>
<script type="module">
  import { supabase, supabaseUrl, supabaseAnonKey, createPasswordCheckClient } from './supabaseClient.js';
  window.supabase = supabase;
  window.SUPABASE_ANON_KEY = supabaseAnonKey;
  window.EDGE_FN_URL = supabaseUrl ? supabaseUrl.replace(/\/$/, "") + "/functions/v1/create-employee" : "";
  window.SUPABASE_FN_BASE = supabaseUrl ? supabaseUrl.replace(/\/$/, "") + "/functions/v1/" : "";
  window.createPasswordCheckClient = createPasswordCheckClient;
  // Attendance punches: native GPS in the Capacitor app, browser geolocation elsewhere.
  import { getDevicePosition, locationErrorMessage } from './location.js';
  window.getDevicePosition = getDevicePosition;
  window.locationErrorMessage = locationErrorMessage;
  // Exports/payslips in the mobile app: Filesystem + share sheet instead of browser downloads.
  import { isNativeApp as isNativeFiles, saveNativeFile } from './fileSave.js';
  window.nativeFiles = { isNativeApp: isNativeFiles, saveNativeFile };
  // Payslip PDFs: jsPDF is fetched only when someone downloads one.
  window.loadJsPDF = () => import('jspdf').then(m => m.jsPDF);
  // Desktop app only: update notifications (no-op in the browser).
  import './desktopUpdates.js';
</script>
