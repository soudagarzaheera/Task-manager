<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Employee Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>

:root{
  --paper:#B1CB98;
  --card:#FFFFFF;
  --ink:#3a4555;          /* body ink */
  --ink-2:#234163;        /* secondary */
  --ink-3:#56606b;        /* tertiary */
  --rule:#DCE0D9;         /* hairline, ledger rule */
  --rule-2:#EDEFEA;
  --red:#A4243B;          /* adverse / overdue — used sparingly */
  --red-wash:#FBF0F2;
  --ochre:#c57021;        /* caution */
  --ochre-wash:#FBF4E6;
  --green:#2E6B4F;        /* settled / approved */
  --green-wash:#EDF4F0;
  --blue-wash:#EEF2F7;

  --r:12px;
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --serif:"Newsreader",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans);
  background:var(--paper);
  color:var(--ink);
  font-size:14px;
  line-height:1.5;
  display:flex;
  min-height:100vh;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* ---------- ledger numerals ---------- */
.num,.code,td.num,th.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* ==========================  SIDEBAR  ============================= */
#sidebar{
  width:212px;flex:0 0 212px;
  background:var(--card);
  border-right:1px solid var(--rule);
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;
}
#sidebar[hidden]{display:none}
.brand{padding:18px 18px 14px;border-bottom:1px solid var(--rule)}
.brand-mark{
  font-family:var(--serif);font-size:19px;font-weight:600;
  letter-spacing:-.015em;line-height:1.15;
}
.brand-sub{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-3);margin-top:5px;
}
.nav{padding:12px 10px;flex:1;overflow-y:auto}
.nav-label{
  font-family:var(--mono);font-size:9px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3);
  padding:12px 8px 6px;
}
.nav-item{
  display:flex;align-items:center;gap:9px;width:100%;
  padding:7px 8px;border-radius:var(--r);text-align:left;
  color:var(--ink-2);font-size:13.5px;
}
.nav-item:hover{background:var(--paper);color:var(--ink)}
.nav-item[aria-current="page"]{background:var(--blue-wash);color:var(--ink);font-weight:500}
.nav-item .dot{
  width:5px;height:5px;border-radius:50%;background:var(--ink-3);flex:0 0 5px;
}
.nav-item[aria-current="page"] .dot{background:var(--ink)}
.nav-item .badge{
  margin-left:auto;font-family:var(--mono);font-size:10px;
  background:var(--red);color:#fff;padding:1px 5px;border-radius:8px;
}
.whoami{border-top:1px solid var(--rule);padding:12px}
.whoami label{
  display:block;font-family:var(--mono);font-size:9px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:5px;
}
.whoami select{
  width:100%;padding:6px 7px;border:1px solid var(--rule);
  border-radius:var(--r);background:var(--paper);font-size:12.5px;
}
.whoami .hint{font-size:11px;color:var(--ink-3);margin-top:6px;line-height:1.35}
.whoami-name{font-size:13px;font-weight:500;color:var(--ink)}

/* ==========================  AUTH / LOGIN  ============================= */
.auth-screen{
  width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:24px;background:var(--paper);
  background-image:repeating-linear-gradient(to bottom,transparent 0 27px,var(--rule-2) 27px 28px);
}
.auth-screen[hidden]{display:none}
.auth-card{
  width:min(380px,100%);background:var(--card);border:1px solid var(--rule);
  border-radius:var(--r);padding:28px 26px;box-shadow:0 18px 50px rgba(27,42,65,.12);
}
.auth-brand{text-align:center;margin-bottom:22px}
.auth-mark{font-family:var(--serif);font-size:23px;font-weight:600;letter-spacing:-.015em}
.auth-sub{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-3);margin-top:5px;
}
.auth-title{font-family:var(--serif);font-size:18px;font-weight:600;margin-bottom:14px}
.auth-alert{
  font-size:12.5px;padding:8px 10px;border-radius:var(--r);margin-bottom:14px;line-height:1.4;
}
.auth-alert.bad{background:var(--red-wash);color:var(--red);border:1px solid #E3C2C9}
.auth-alert.ok{background:var(--green-wash);color:var(--green);border:1px solid #BFD6C9}
.auth-submit{width:100%;padding:8px 13px;margin-top:4px}
.auth-link{
  display:block;width:100%;text-align:center;margin-top:14px;font-size:12.5px;
  color:var(--ink-2);text-decoration:underline;text-underline-offset:2px;
}
.auth-link:hover{color:var(--ink)}
.pw-wrap{position:relative}
.pw-wrap input{padding-right:56px}
.pw-toggle{
  position:absolute;right:5px;top:50%;transform:translateY(-50%);
  font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-2);padding:4px 7px;border-radius:3px;
}
.pw-toggle:hover{background:var(--paper)}
@media (max-width:860px){.auth-card{padding:22px 18px}}

/* ==========================  MAIN  ============================= */
main{
  flex:1;min-width:0;
  /* the ledger rule — faint horizontal ruling behind everything */
  background-image:repeating-linear-gradient(
    to bottom,transparent 0 27px,var(--rule-2) 27px 28px);
}
main[hidden]{display:none}
.topbar{
  display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
  padding:22px 28px 16px;border-bottom:1px solid var(--rule);
  background:var(--paper);
}
h1{font-family:var(--serif);font-size:25px;font-weight:500;letter-spacing:-.02em}
.topbar .sub{color:var(--ink-2);font-size:13px}
.topbar .spacer{flex:1}
.mobile-menu-toggle,.mobile-nav-close,.mobile-nav-backdrop{display:none}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.company-ctx{min-width:0;max-width:100%}
.company-ctx .company-name{font-size:13px;font-weight:600;color:var(--ink-2)}
/* Page-level company filter (Team) in a card head, beside its actions. */
.team-filter{display:inline-flex;align-items:center;gap:7px;min-width:0;max-width:100%}
.team-filter > span{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.team-filter select{width:auto;max-width:240px;min-width:0}
.view{padding:22px 28px 60px;max-width:1180px}
.view[hidden]{display:none}

/* ==========================  PRIMITIVES  ============================= */
.card{
  background:var(--card);border:1px solid var(--rule);
  border-radius:var(--r);padding:16px 18px;
}
.card + .card{margin-top:14px}
.payslip .ps-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:10px}
.payslip .ps-co{font-family:var(--serif);font-size:19px;font-weight:600}
.payslip .ps-title{text-align:right}
.payslip .ps-month{font-size:15px;font-weight:600}
.payslip .ps-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 18px;margin:14px 0}
.payslip .ps-kv{display:flex;justify-content:space-between;gap:10px;font-size:13px;border-bottom:1px dotted var(--rule);padding:4px 0;min-width:0}
.payslip .ps-kv span{color:var(--ink-3)}
.payslip .ps-kv strong{text-align:right;overflow-wrap:anywhere}
.payslip .ps-cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.payslip .ps-total td{font-weight:700;border-top:1px solid var(--ink)}
.payslip .ps-net{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px;padding:12px 14px;border-radius:var(--r);background:var(--blue-wash,#eef2fa)}
.payslip .ps-net-amt{font-size:22px;font-weight:700;font-family:var(--mono)}
.payslip .ps-att{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;font-size:12.5px}
@media (max-width:860px){ .payslip .ps-grid,.payslip .ps-cols{grid-template-columns:1fr} .payslip .ps-title{text-align:left} }
/* A grid row of cards (Today summary, Attendance). The stacked-card margin
   above must not apply inside the row — it pushed the second card 14px lower —
   and the card after the row gets the same 14px gap as stacked cards. */
.card-row > .card{margin-top:0}
.card-row + .card{margin-top:14px}
.card-link{cursor:pointer;transition:border-color .15s,box-shadow .15s}
.card-link:hover{border-color:var(--ink-3);box-shadow:0 2px 10px rgba(27,42,65,.08)}
.card-link:focus-visible{outline:2px solid var(--blue,#2457c5);outline-offset:2px}
.card-link .link-text{text-decoration:underline;text-underline-offset:2px}
.card-head{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.card-head h2{
  font-family:var(--serif);font-size:16.5px;font-weight:600;letter-spacing:-.01em;
}
.card-head .spacer{flex:1}
.eyebrow{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3);
}
.grid{display:grid;gap:14px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.muted{color:var(--ink-2)}
.tiny{font-size:12px}

.btn{
  border:1px solid var(--ink);background:var(--ink);color:#fff;
  padding:6px 13px;border-radius:var(--r);font-size:13px;font-weight:500;
}
.btn:hover{opacity:.88}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn.ghost:hover{background:var(--paper);opacity:1;border-color:var(--ink-3)}
.btn.danger{background:var(--red);border-color:var(--red)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.text-link{color:var(--ink);text-decoration:underline;text-underline-offset:2px;font-weight:500}
.text-link:hover{color:var(--green)}

.tag{
  display:inline-flex;align-items:center;gap:5px;
  font-family:var(--mono);font-size:10px;letter-spacing:.06em;
  text-transform:uppercase;padding:2px 7px;border-radius:2px;
  border:1px solid var(--rule);color:var(--ink-2);background:var(--card);
  white-space:nowrap;
}
.tag.ok{color:var(--green);border-color:#BFD6C9;background:var(--green-wash)}
.tag.warn{color:var(--ochre);border-color:#E4D2A8;background:var(--ochre-wash)}
.tag.bad{color:var(--red);border-color:#E3C2C9;background:var(--red-wash)}
.tag.info{color:#3A5578;border-color:#C6D3E3;background:var(--blue-wash)}

.tabbar{display:flex;gap:20px;margin-bottom:16px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.tab{
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  padding:0 0 9px;color:var(--ink-3);border:none;background:transparent;
  border-bottom:2px solid transparent;cursor:pointer;
}
.tab:hover{color:var(--ink)}
.tab[aria-current="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.tab .count{color:var(--ink-3)}

table{width:100%;border-collapse:collapse}
.table-wrap{max-width:100%}              /* scrolls sideways on mobile only — see the 860px block */
th{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-3);text-align:left;
  padding:0 10px 7px 0;font-weight:500;border-bottom:1px solid var(--rule);
}
td{padding:9px 10px 9px 0;border-bottom:1px solid var(--rule-2);vertical-align:middle}
tr:last-child td{border-bottom:none}
th.r,td.r{text-align:right}
th:last-child,td:last-child{padding-right:0}   /* keep a gap after right-aligned columns, none at the table edge */
.code{font-size:12px;color:var(--ink-2)}
.strong{font-weight:500}

input[type=text],input[type=number],input[type=date],input[type=email],input[type=password],select,textarea{
  border:1px solid var(--rule);border-radius:var(--r);
  padding:5px 8px;background:var(--card);width:100%;font-size:13px;
}
input:disabled,select:disabled{background:var(--rule-2);color:var(--ink-3)}
label.field,div.field{display:block;margin-bottom:11px}
label.field > span,div.field > span{
  display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:4px;
}

/* ======================================================================
   SIGNATURE ELEMENT — the budget scale.
   A ruled scale, not a progress bar. The track runs to 125% of budget so
   an overrun is *visible* rather than clipped at a full bar. The 100 line
   is a hard rule; anything past it is hatched in ledger red.
   ====================================================================== */
.scale{position:relative;height:26px;margin:4px 0 2px}
.scale-track{
  position:absolute;inset:6px 0 8px;background:var(--rule-2);
  border:1px solid var(--rule);border-radius:1px;overflow:hidden;
}
.scale-fill{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}
.scale-fill.warn{background:var(--ochre)}
.scale-fill.over{background:var(--red)}
.scale-over{
  position:absolute;top:0;bottom:0;
  background:repeating-linear-gradient(45deg,
    var(--red) 0 3px,transparent 3px 6px);
  opacity:.85;
}
.scale-tick{
  position:absolute;top:2px;bottom:4px;width:1px;background:var(--ink-3);opacity:.5;
}
.scale-tick.hard{background:var(--ink);opacity:1;top:0;bottom:2px;width:1.5px}
.scale-legend{
  position:relative;height:12px;font-family:var(--mono);
  font-size:9px;color:var(--ink-3);
}
.scale-legend span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.scale-legend span.hard{color:var(--ink);font-weight:500}

/* ---------- attendance stamp ---------- */
.stamp{
  border:1.5px solid var(--green);color:var(--green);
  border-radius:var(--r);padding:10px 14px;display:inline-block;
  transform:rotate(-1.1deg);background:var(--green-wash);
}
.stamp.out{border-color:var(--red);color:var(--red);background:var(--red-wash)}
.stamp .t{font-family:var(--mono);font-size:22px;font-weight:500;letter-spacing:-.02em}
.stamp .l{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase}

.kpi{font-family:var(--mono);font-size:27px;font-weight:500;letter-spacing:-.03em;line-height:1.1}
.kpi.bad{color:var(--red)}
.kpi.warn{color:var(--ochre)}
.kpi-label{font-size:12px;color:var(--ink-2);margin-top:3px}

.empty{
  padding:26px;text-align:center;color:var(--ink-2);font-size:13px;
  border:1px dashed var(--rule);border-radius:var(--r);
}

/* ---------- statutory calendar ---------- */
.sd-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sd-grid>.card{margin-top:0}
.sd-card{display:flex;flex-direction:column;height:232px;min-width:0;padding:9px 12px}
.sd-head{flex:none;display:flex;align-items:center;gap:8px;height:30px;padding-bottom:6px;border-bottom:1px solid var(--rule)}
.sd-head h2{white-space:nowrap;font-family:var(--serif);font-size:14.5px;font-weight:600;letter-spacing:-.01em;color:var(--ink-2)}
.sd-head .spacer{flex:1}
.sd-head .btn{padding:2px 9px;font-size:11.5px;white-space:nowrap}
.sd-count{
  display:inline-block;min-width:20px;padding:1px 6px;border-radius:10px;text-align:center;
  font-family:var(--mono);font-size:10.5px;line-height:15px;
  color:var(--ink-3);background:var(--rule-2);
}
.sd-count.bad{color:var(--red);background:var(--red-wash)}
.sd-count.warn{color:var(--ochre);background:var(--ochre-wash)}
.sd-count.info{color:#3A5578;background:var(--blue-wash)}
.sd-list{flex:1;min-height:0;overflow-y:auto}
.sd-row{display:flex;flex-wrap:wrap;align-items:center;gap:0 8px;border-bottom:1px solid var(--rule-2)}
.sd-row>.btn{margin:0 0 6px auto}
.sd-row:last-child{border-bottom:none}
.sd-main{
  flex:1 1 250px;min-width:0;display:flex;align-items:center;gap:9px;padding:4px;
  border:none;background:transparent;font:inherit;color:inherit;text-align:left;
}
button.sd-main{cursor:pointer;border-radius:6px}
button.sd-main:hover{background:var(--blue-wash)}
.sd-dot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.sd-dot.bad{background:var(--red)}
.sd-dot.warn{background:var(--ochre)}
.sd-dot.info{background:#3A5578}
.sd-dot.ok{background:var(--green)}
.sd-who{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.sd-line{display:flex;align-items:baseline;gap:7px;min-width:0}
.sd-name,.sd-sub{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sd-name{font-size:13px;font-weight:500;color:var(--ink-2)}
.sd-name .tiny{font-weight:400}
.sd-state{flex:none;font-size:11px;color:var(--ink-3)}
.sd-sub{font-size:11.5px;color:var(--ink-3)}
.sd-when{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.sd-date{font-size:11.5px;color:var(--ink-2);white-space:nowrap}
.sd-empty{padding:9px 4px;font-size:12.5px;color:var(--ink-3)}
.sd-note{margin:10px 2px 0;font-size:12px;color:var(--ink-2)}
.sd-done{margin-top:10px;padding:9px 14px}
.sd-done summary{cursor:pointer;font-size:13px;color:var(--ink-2)}
.sd-done-title{font-weight:500}
.sd-done .sd-list{margin-top:6px;max-height:230px}
@media (max-width:860px){
  .sd-grid{grid-template-columns:1fr}
  .sd-card{height:auto}
  .sd-list{max-height:260px}
}

/* ---------- modal ---------- */
.veil{
  position:fixed;inset:0;background:rgba(27,42,65,.34);
  display:flex;align-items:center;justify-content:center;padding:20px;z-index:60;
}
.veil[hidden]{display:none}
.modal{
  background:var(--card);border-radius:var(--r);width:min(460px,100%);
  padding:20px 22px;border:1px solid var(--rule);
  box-shadow:0 18px 50px rgba(27,42,65,.2);
}
.modal h3{font-family:var(--serif);font-size:18px;font-weight:600;margin-bottom:4px}
.modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
/* Bulk import (Import clients / Import employees) */
.modal.wide{width:min(1000px,100%);max-height:calc(100dvh - 40px);overflow-y:auto}
.bi-steps{margin:8px 0 12px 18px;line-height:1.7}
.bi-drop{border:1px dashed var(--ink-3);border-radius:var(--r);padding:18px 14px;text-align:center;background:var(--rule-2);margin:10px 0}
.bi-drop.drag{background:var(--blue-wash);border-color:var(--ink)}
.bi-drop input[type=file]{display:block;margin:10px auto 0;max-width:100%}
.bi-stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:12px 0}
.bi-stats.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.bi-stat{border:1px solid var(--rule);border-radius:var(--r);padding:8px 10px}
.bi-stat b{display:block;font-family:var(--mono);font-size:20px;font-weight:600;color:var(--ink)}
.bi-stat span{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.bi-stat.ok b{color:var(--green)}
.bi-stat.bad b{color:var(--red)}
.bi-stat.warn b{color:var(--ochre)}
.bi-table{max-height:340px;overflow:auto;border:1px solid var(--rule);border-radius:var(--r);padding:0 10px}
.bi-table th{position:sticky;top:0;background:var(--card);padding-top:8px;z-index:1}
.bi-table td{font-size:12.5px}
.bi-bar{height:8px;background:var(--rule-2);border:1px solid var(--rule);border-radius:4px;overflow:hidden;margin:10px 0}
.bi-bar > div{height:100%;background:var(--ink);transition:width .2s}
@media (max-width:860px){ .bi-stats,.bi-stats.c3{grid-template-columns:repeat(2,minmax(0,1fr))} }
/* Searchable service picker (New job code) */
.svc-pick{position:relative;margin-bottom:11px}
.svc-list{
  position:absolute;left:0;right:0;top:100%;margin-top:2px;z-index:5;max-height:220px;overflow-y:auto;

<script>
/* ======================================================================
   Practice Manager — data is loaded from and saved to Supabase (see
   loadAppData() and boot() near the end of this script).
   ====================================================================== */

/* ---- dates are derived from the system clock, not hardcoded ---- */
function pad2(n){ return String(n).padStart(2,"0"); }
function toISODate(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function mondayOf(d){
  const x = new Date(d);
  const dow = (x.getDay()+6)%7;                // Mon=0 .. Sun=6
  x.setDate(x.getDate()-dow);
  return toISODate(x);
}

const TODAY = toISODate(new Date());
const WEEK  = mondayOf(new Date());             // Monday of the current app week
let TIMESHEET_DATE = TODAY;
let TIMESHEET_WEEK = WEEK;

/* There is deliberately no weekly expected-hours target: nobody is given
   hours automatically (no schedule, no minimum, no FIRM/IDLE padding).
   Hours are booked only against jobs with budgeted/approved hours — see
   jobRemainingHours(). */
const DAY_NAMES = ["Mon","Tue","Wed","Thu","Fri","Sat"];

/* Populated from Supabase by loadAppData(). Nothing below is seed/demo data. */
/* setupComplete mirrors organizations.setup_completed_at (031): false only
   while a newly created organization has not finished its first-run setup. */
const FIRM = { name:"", office:null, setupComplete:true };
let COMPANIES = [];          // every company of the organization this user may see (RLS), active or not
const activeCompanies = () => COMPANIES.filter(c=>c.active);
const companyFullName = companyIdOrCode => {
  const found = COMPANIES.find(c => c.id === companyIdOrCode || c.code === companyIdOrCode);
  return found ? found.name : (companyIdOrCode || FIRM.name || "Company");
};

/* Company context (028_multi_company.sql). An organization owns several
   companies; every employee belongs to one. Every screen shows everything
   Supabase RLS returned: a partner sees every company of the organization,
   everyone else their own company plus the people/jobs they work with.
   Screens that need one company at a time (Team, Salary) filter on the page.
   HOME_COMPANY_ID is the signed-in user's own company — the header name and
   the default for new records — never a filter on what is loaded.
   ALL_PEOPLE / ALL_JOBS / ALL_CLIENTS are the same arrays as PEOPLE / JOBS /
   CLIENTS. */
let HOME_COMPANY_ID = null;
let ALL_PEOPLE = [], ALL_JOBS = [], ALL_CLIENTS = [];

let PEOPLE = [];
/* profiles.role is the employee's designation (030_employee_designations.sql).
   DESIGNATIONS is the list every dropdown, filter and report uses, lowest to
   highest; "accounts" and "admin" are legacy values the app no longer offers. */
const DESIGNATIONS = ["trainee","associate","senior_associate","senior_executive","assistant_manager","manager","partner"];
const ROLE_LABEL = { trainee:"Trainee", associate:"Associate", senior_associate:"Senior Associate",
                     senior_executive:"Senior Executive", assistant_manager:"Assistant Manager",
                     manager:"Manager", partner:"Partner", accounts:"Accounts", admin:"Admin" };
const staff = () => PEOPLE.filter(p=>p.active);

/* Mirrors auth_rank()/profile_rank() in Supabase (030) — keep both in sync. */
const RANK = { partner:90, manager:70, assistant_manager:60, senior_executive:50, accounts:40,
               senior_associate:30, associate:20, trainee:10 };
/* Job code creation and assigning work: Assistant Manager and above. */
const ASSIGN_RANK = RANK.assistant_manager;
/* "Manager-level" operational permissions — clients and sites, the Team and
   Sites & Clients pages, closing/reopening jobs, budget and claim decisions.
   Assistant Managers have exactly the Manager permissions (036): the same
   bar as auth_rank() >= 60 in the RLS policies. Partner-only rules stay
   at rank 90 / role "partner". */
const MANAGER_RANK = RANK.assistant_manager;
/* Designation labels, highest first — the column order of the hours-by-grade reports. */
const GRADES = () => ASSIGNABLE_ROLES.map(r=>ROLE_LABEL[r]);
/* Client type is free text (047): these are only the suggestions offered in the
   Add Client form and the import template, together with every type already
   used by the firm's clients. Any other type can be typed in. */
const CLIENT_TYPE_SUGGESTIONS = ["Individual","Proprietor","Partnership","LLP","Private Ltd","Public Ltd","Trust","HUF","Society"];
const CLIENT_TYPE_MAX = 100;
const clientTypeOptions = () => {
  const seen = new Set(), out = [];
  CLIENT_TYPE_SUGGESTIONS.concat(ALL_CLIENTS.map(c=>c.type))
    .forEach(t=>{ t=String(t||"").trim(); const k=t.toLowerCase(); if(t && !seen.has(k)){ seen.add(k); out.push(t); } });
  return out;
};
let CLIENTS = [];

/* Every place someone can legitimately punch in from. client:null = own office. */
let LOCATIONS = [];
let PUNCH_SITES = [];
let selectedPunchSiteId = "";
/* "Other Place" (038): punch from the current GPS position without a
   registered site — client visits, department/bank visits. Only the site
   geofence is skipped; GPS, accuracy and the in/out rule still apply. */
const OTHER_PLACE = "__other__";

let JOBS = [];
let PARTNER_TASK_ASSIGNMENTS = [];
let HOLIDAYS = [];
let HOLIDAY_WORKED = [];
let LEAVE = [];
let LEAVE_TYPES = [];
let LEAVE_BALANCES = [];
let SALARY_HISTORY = [];
let MY_SALARY_HISTORY = [];   // the signed-in user's own salary rows (every role; RLS: own rows only)
let salaryMonth = TODAY.slice(0,7);
let salaryEmployee = "all";
let salaryCompany = null;   // Salary page Company filter: a company id or "all"; null = the partner's own company
let salaryPunches = [];
let salaryDetailId = null;
let salaryLoading = false;

/* One flat list of time entries. day 0 = Monday. */
let ENTRIES = [];

let TASKS = [];
let BUDGET_REQUESTS = [];
let JOB_EXTRA_HOURS = {};   // job id -> approved additional hours (job_approved_extra_hours())
let CLAIMS = [];
let COMPLIANCE = [];
let ALL_PUNCHES_TODAY = [];

let ORG_ID = null;
let LOAD_ERROR = null;
let DATA_READY = false;

/* Shared attendance_punches row -> app shape, so the initial "today only"
   load and the on-demand monthly loaders (own history, partner export)
   stay in exact agreement about field names. */
function mapPunch(pu){
  return {
    id:pu.id, who:pu.profile_id, type:pu.punch_type, date:pu.punch_date,
    time:new Date(pu.punch_timestamp).toTimeString().slice(0,5),
    ts:pu.punch_timestamp, place:pu.place_label, dist:pu.distance_meters==null?null:+pu.distance_meters,
    ok:pu.is_within_geofence, flagged:pu.needs_review, locationId:pu.location_id,
    accuracy:pu.accuracy_meters==null?null:+pu.accuracy_meters,
    locType:pu.location_type||"site", note:pu.location_note||"", address:pu.resolved_address||"",
    lat:pu.latitude==null?null:+pu.latitude, lng:pu.longitude==null?null:+pu.longitude,
    companyId:pu.company_id||null
  };
}

/* ===================  SUPABASE DATA LOADING  ===================== */
/* Everything the app shows comes from these tables. There is no
   mock/demo/fallback data — if a table is empty or a query fails, the UI
   shows that state rather than inventing something to fill it in. */
async function loadAppData(orgId, currentProfileId){
  if(!supabase){
    LOAD_ERROR = "Supabase is not configured — check VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY.";
    return;
  }

  // orgId comes from the caller's own linked profile (see startApp()), not a
  // "grab whichever org sorts first" guess — RLS only lets this session see
  // its own organization anyway, but being explicit here avoids relying on
  // that as the sole source of truth.
  const { data: orgs, error: orgErr } = await supabase
    .from("organizations").select("*").eq("id", orgId).limit(1);
  if(orgErr){ console.error("[DATA] Company lookup failed",orgErr); LOAD_ERROR = "Could not load the organization: "+orgErr.message; return; }
  if(!orgs || !orgs.length){
    console.error("[DATA] Company lookup returned no organization",{organizationId:orgId});
    LOAD_ERROR = "Your profile points to an organization that no longer exists. Contact your administrator.";
    return;
  }
  const org = orgs[0];
  ORG_ID = org.id;
  FIRM.name = org.name;
  // Before 031 is applied the column is absent: treat as set up (no redirect).
  FIRM.setupComplete = !("setup_completed_at" in org) || !!org.setup_completed_at;

  // Half-day marks (045) load on their own so the app still opens before 045 is applied.
  const halfDaysP = supabase.from("timesheet_half_days").select("profile_id,work_date").eq("organization_id", ORG_ID);
  const [profilesR, companiesR, clientsR, locationsR, jobsR, tasksR, partnerTaskAssignmentsR, entriesR, holidaysR, holidayWorkedR, leavesR,
         budgetR, claimsR, claimLinesR, complianceR, nilR, punchesR] = await Promise.all([
    supabase.from("profiles").select("id,employee_code,full_name,contact_email,role,reports_to,company,company_id,joining_date,exit_date,cost_per_hour,bill_rate_per_hour,is_active,auth_user_id,created_at,deleted_at").eq("organization_id", ORG_ID).order("created_at",{ascending:true}),
    supabase.from("companies").select("id,code,name,is_active,created_at").eq("organization_id", ORG_ID).order("name"),
    supabase.from("clients").select("*").eq("organization_id", ORG_ID).order("created_at",{ascending:true}),
    supabase.from("locations").select("*").eq("organization_id", ORG_ID).order("created_at",{ascending:true}),
    supabase.from("jobs").select("*").eq("organization_id", ORG_ID).order("created_at",{ascending:true}),
    supabase.from("tasks").select("*").eq("organization_id", ORG_ID).order("created_at",{ascending:true}),
    supabase.rpc("partner_task_assignments"),
    supabase.from("timesheet_entries").select("*").eq("organization_id", ORG_ID),
    supabase.from("holidays").select("*").eq("organization_id", ORG_ID),
    supabase.rpc("holiday_worked_days"),
    supabase.from("leaves").select("*").eq("organization_id", ORG_ID),
    supabase.from("budget_requests").select("*").eq("organization_id", ORG_ID),
    supabase.from("expense_claims").select("*").eq("organization_id", ORG_ID),
    supabase.from("expense_claim_lines").select("*"),
    supabase.from("statutory_compliances").select("*").eq("organization_id", ORG_ID),
    supabase.from("nil_timesheets").select("*").eq("organization_id", ORG_ID),
    supabase.from("attendance_punches").select("*").eq("organization_id", ORG_ID).eq("punch_date", TODAY)
  ]);

  const results = [profilesR,companiesR,clientsR,locationsR,jobsR,tasksR,partnerTaskAssignmentsR,entriesR,holidaysR,holidayWorkedR,leavesR,
    budgetR,claimsR,claimLinesR,complianceR,nilR,punchesR];
  const firstErr = results.find(r=>r.error);
  if(firstErr){ console.error("[DATA] Employee/profile/company data query failed",firstErr.error); LOAD_ERROR = "Could not load data: "+firstErr.error.message; return; }

  COMPANIES = companiesR.data.map(c=>({id:c.id,code:c.code,name:c.name,active:c.is_active,createdAt:c.created_at}));
  PEOPLE = profilesR.data.map(p=>({
    id:p.id, code:p.employee_code, name:p.full_name, email:p.contact_email||"",
    role:p.role, label:ROLE_LABEL[p.role]||p.role, reportsTo:p.reports_to,
    companyId:p.company_id,
    company: (COMPANIES.find(c=>c.id===p.company_id)||{}).code || p.company || p.company_code || "",
    ctc: 0,
    joined:p.joining_date, left:p.exit_date, cost:+p.cost_per_hour||0, bill:+p.bill_rate_per_hour||0,
    active:p.is_active, authUserId:p.auth_user_id,
    // Deleted (039): kept so history still shows who did the work, but never
    // listed on Team, never reactivated, and their code/email are free.
    deleted:!!p.deleted_at
  }));

  CLIENTS = clientsR.data.map(c=>({
    id:c.id, code:c.client_code, name:c.name, type:c.entity_type, pan:c.pan||"", gstin:c.gstin||"",
    partner:c.relationship_partner_id, email:c.email||"", phone:c.phone||"",
    onboarded:c.onboarded_date, active:c.is_active, companyId:c.company_id
  }));

  LOCATIONS = locationsR.data.map(l=>({
    id:l.id, client:l.client_id, label:l.label, lat:+l.latitude, lng:+l.longitude,
    radius:l.radius_meters, active:l.is_active
  }));
  // During first login `me` is assigned only after this loader returns. Use the
  // already-verified profile ID from startApp() so a valid new user's company
  // association is not mistaken for missing data during initial loading.
  const currentProfile=PEOPLE.find(p=>p.id===(currentProfileId||me));
  if(!currentProfile || !currentProfile.companyId){ LOAD_ERROR="Your profile is not associated with a company. Contact an administrator."; return; }
  // Sites are organization-wide (037): every active employee may punch at any
  // active site of the organization, whatever company they belong to.
  const {data:punchSitesR,error:punchSitesError}=await supabase.from("locations").select("*")
    .eq("organization_id",ORG_ID).eq("is_active",true).order("label");
  if(punchSitesError){ LOAD_ERROR="Could not load office sites: "+punchSitesError.message; return; }
  PUNCH_SITES=punchSitesR.map(l=>({
    id:l.id, client:l.client_id, label:l.label, lat:+l.latitude, lng:+l.longitude,
    radius:l.radius_meters, active:l.is_active
  }));
  FIRM.office = LOCATIONS.find(l=>!l.client) || null;

  JOBS = jobsR.data.map(j=>({
    id:j.id, code:j.job_code, client:j.client_id, title:j.title, status:j.status,
    budget:+j.budget_hours||0, due:j.internal_due_date, statDue:j.statutory_due_date,
    overhead:j.is_overhead, openedBy:j.opened_by, openedOn:j.opened_on,
    closedAt:j.closed_at||null, closingNote:j.closing_note||"", companyId:j.company_id,
    service:j.service_category||"", period:j.period_fy||"",
    // Responsible Partner of this job (042) — not the client's Relationship Partner.
    partner:j.responsible_partner_id||null
  }));

  PARTNER_TASK_ASSIGNMENTS = partnerTaskAssignmentsR.data.map(a=>({
    taskId:a.task_id, partnerId:a.partner_id
  }));

  TASKS = tasksR.data.map(t=>{
    let costHistory = [];
    try {
      costHistory = Array.isArray(t.cost_history) ? t.cost_history : (typeof t.cost_history==="string" ? JSON.parse(t.cost_history) : []);
    }catch(_e){}
    let respHistory = [];
    try {
      respHistory = Array.isArray(t.responsibility_history) ? t.responsibility_history : (typeof t.responsibility_history==="string" ? JSON.parse(t.responsibility_history) : []);
    }catch(_e){}

    if(!respHistory.length && t.assigned_to){
      respHistory = [{
        id: "rh_"+t.id,
        assignedTo: t.assigned_to,
        assignedBy: t.assigned_by || null,
        fromDate: (t.created_at ? t.created_at.slice(0,10) : TODAY),
        toDate: null,
        createdAt: t.created_at || new Date().toISOString()
      }];
    }

    const mCost = +t.monthly_cost || 0;
    if(!costHistory.length && mCost > 0){
      costHistory = [{
        effectiveMonth: (t.created_at ? t.created_at.slice(0,7) : TODAY.slice(0,7)),
        monthlyCost: mCost,
        updatedBy: t.assigned_by || null,
        updatedAt: t.created_at || new Date().toISOString()
      }];
    }

    return {
      id: t.id,
      job: t.job_id,
      title: t.title,
      who: t.assigned_to,
      assignedBy: t.assigned_by || (respHistory[0] ? respHistory[0].assignedBy : null),
      status: t.status,
      due: t.due_date,
      est: +t.estimated_hours || 0,
      monthlyCost: mCost,
      costHistory,
      responsibilityHistory: respHistory,
      createdAt: t.created_at || null
    };
  });

  ENTRIES = entriesR.data.map(x=>({
    id:x.id, who:x.profile_id, week:x.week_start_date, date:x.entry_date, job:x.job_id, taskId:x.task_id||null, day:x.day_index,
    hours:+x.hours, note:x.narration||"", status:x.status, query:x.query_reason||"",
    decidedBy:x.decided_by||null, decidedAt:x.decided_at||null
  }));

  HOLIDAYS = holidaysR.data.map(mapHoliday);
  HOLIDAY_WORKED = holidayWorkedR.data.map(mapHolidayWorked);
  LEAVE = leavesR.data.map(l=>({
    id:l.id, who:l.profile_id, date:l.leave_date, part:l.duration_part, type:l.leave_type, status:l.status,
    reason:l.reason||"", requestId:l.request_id||l.id, rejectionReason:l.rejection_reason||"",
    approvedBy:l.approved_by||null, approvedAt:l.approved_at||null, createdAt:l.created_at||null
  }));

  BUDGET_REQUESTS = budgetR.data.map(b=>({
    id:b.id, job:b.job_id, from:+b.from_hours, to:+b.to_hours, by:b.requested_by,
    on:b.requested_date, reason:b.reason, status:b.status,
    decidedBy:b.decided_by||null, decidedAt:b.decided_at||null
  }));

  const linesByClaim = {};
  (claimLinesR.data||[]).forEach(l=>{ (linesByClaim[l.claim_id]=linesByClaim[l.claim_id]||[]).push(l); });
  CLAIMS = claimsR.data.map(c=>({
    id:c.id, who:c.profile_id, month:c.claim_month, status:c.status,
    submittedAt:c.submitted_at||null,
    approvedBy:c.approved_by||null, approvedAt:c.approved_at||null,
    paidBy:c.paid_by||null, paidAt:c.paid_at||null,
    lines:(linesByClaim[c.id]||[]).map(l=>({
      id:l.id, job:l.job_id, date:l.expense_date, cat:l.category, desc:l.description,
      amount:+l.amount, rec:l.is_recoverable_from_client
    }))
  }));

  COMPLIANCE = complianceR.data.map(c=>({
    code:c.compliance_code, name:c.title, client:c.client_id, due:c.statutory_due_date,
    created:c.is_job_raised, job:c.job_id
  }));

  NIL_FILED = nilR.data.map(n=>({ who:n.profile_id, week:n.week_start_date }));
  const halfDaysR = await halfDaysP;
  if(halfDaysR.error){ HALF_DAYS = []; console.warn("[DATA] timesheet_half_days unavailable — run 045_optional_days_and_timesheet_minimum.sql", halfDaysR.error.message); }
  else HALF_DAYS = halfDaysR.data.map(h=>({ who:h.profile_id, date:h.work_date }));

  SALARY_HISTORY = [];
  if(profilesR.data.some(p=>p.role==="partner" && p.auth_user_id===AUTH_UID)){
    const { data: salaryRows, error: salaryErr } = await supabase.from("employee_salary_history")
      .select("id,profile_id,monthly_ctc,effective_from,company_id").eq("organization_id",ORG_ID).order("effective_from");
    if(salaryErr){ LOAD_ERROR = "Could not load salary history: "+salaryErr.message; return; }
    SALARY_HISTORY = salaryRows.map(s=>({id:s.id,who:s.profile_id,ctc:+s.monthly_ctc,effective:s.effective_from,companyId:s.company_id}));
    PEOPLE.forEach(p=>{ p.ctc=salaryAt(p.id,TODAY); });
  }

  /* Everyone sees their own CTC and payslips (My salary). The query asks for
     the caller's own rows, and RLS (salary_own_select, 029) could not return
     anyone else's anyway. Non-fatal: the rest of the app works without it. */
  MY_SALARY_HISTORY = [];
  {
    const myId = currentProfileId || me;
    const { data: mine, error: mineErr } = await supabase.from("employee_salary_history")
      .select("id,profile_id,monthly_ctc,effective_from,company_id")
      .eq("organization_id", ORG_ID).eq("profile_id", myId).order("effective_from");
    if(mineErr) console.warn("[salary] own salary history not available", mineErr);
    else MY_SALARY_HISTORY = mine.map(s=>({id:s.id,who:s.profile_id,ctc:+s.monthly_ctc,effective:s.effective_from,companyId:s.company_id}));
  }

  ALL_PUNCHES_TODAY = punchesR.data.map(mapPunch);

  /* Approved additional hours per job (022_budget_hours_never_overwritten.sql).
     Aggregated server-side because decided budget_requests are only readable
     by the requester and managers/partners. Non-fatal: without it, jobs just
     show their budgeted hours. */
  {
    const { data:extraRows, error:extraErr } = await supabase.rpc("job_approved_extra_hours");
    if(extraErr) console.warn("[jobs] job_approved_extra_hours not available — run supabase/migrations/022_budget_hours_never_overwritten.sql.", extraErr);
    JOB_EXTRA_HOURS = {};
    (extraRows||[]).forEach(r=>{ JOB_EXTRA_HOURS[r.job_id] = +r.extra_hours||0; });
  }

  /* leave_types / employee_leave_balances (007_leave_management.sql) are
     fetched separately from the batch above and never treated as fatal: if
     that migration has not been applied yet to this database, the rest of
     the app must keep working — only the Leave screen degrades (it shows a
     clear "not set up" state instead of a type list; see VIEWS.leave). */
  try{
    const [typesR, balancesR] = await Promise.all([
      supabase.from("leave_types").select("*").eq("organization_id", ORG_ID).order("code",{ascending:true}),
      supabase.from("employee_leave_balances").select("*").eq("organization_id", ORG_ID)
    ]);
    if(typesR.error) throw typesR.error;
    if(balancesR.error) throw balancesR.error;
    LEAVE_TYPES = typesR.data.map(t=>({
      id:t.id, code:t.code, label:t.label,
      annualDays:+t.annual_days || 0, paid:t.is_paid, active:t.is_active
    }));
    LEAVE_BALANCES = balancesR.data.map(b=>({
      id:b.id, who:b.profile_id, code:b.leave_type_code, year:+b.leave_year, allocated:+b.allocated_days
    }));
  }catch(err){
    console.warn("[leave] leave_types/employee_leave_balances not available — run supabase/migrations/007_leave_management.sql.", err);
    LEAVE_TYPES = [
      { id: "cl-def", code: "CL", label: "Casual/Sick Leave", annualDays: 12, paid: true, active: true },
      { id: "el-def", code: "EL", label: "Earned Leave", annualDays: 0, paid: true, active: true },
      { id: "ml-def", code: "ML", label: "Maternity Leave", annualDays: 182, paid: true, active: true },
      { id: "pl-def", code: "PL", label: "Paternity Leave", annualDays: 15, paid: true, active: true },
      { id: "lwp-def", code: "LWP", label: "Leave Without Pay", annualDays: 0, paid: false, active: true }
    ];
    LEAVE_BALANCES = [];
  }
  normalizeLeaveTypes();

  applyCompanyScope(currentProfileId||me);
  await Promise.all([loadPersonalEvents(), loadStatutory(), loadServices(), loadOrgPartners(), loadDesignations()]);

  DATA_READY = true;
  startHolidaySync();
}

/* ======================  COMPANY CONTEXT  ======================== */
/* A partner works across every company of the organization (RLS:
   auth_all_companies(), 028); everyone else within their own. */
const managesAllCompanies = (id=me) => person(id).role==="partner";
/* Companies this user may assign a record to: a partner any active company of
   the organization, everyone else only their own. */
function assignableCompanies(id=me){
  if(managesAllCompanies(id)) return activeCompanies();
  const own = person(id).companyId;
  return COMPANIES.filter(c=>c.id===own);
}
/* Company choices for a form: what the user may assign, plus the record's
   current company so editing an existing record never silently changes it. */
function companyOptions(current){
  const list = assignableCompanies().slice();
  const cur = COMPANIES.find(c=>c.id===current);
  if(cur && !list.some(c=>c.id===cur.id)) list.unshift(cur);
  return list;
}
/* Company filter choices for a page (Team, Salary): the active companies
   RLS let this user see, plus `current` if it is selected but inactive. */
function companyFilterOptions(current){
  return COMPANIES.filter(c=>c.active || c.id===current).sort((a,b)=>a.name.localeCompare(b.name));
}
/* A person's company name. Falls back to the stored company code when RLS
   hides the company row itself (a non-partner seeing a colleague from another
   company), so a raw id is never shown. */
const personCompanyName = p => {
  const c = COMPANIES.find(x=>x.id===p.companyId);
  return c ? c.name : companyFullName(p.company || "");
};

/* Runs at the end of every loadAppData(). Every list keeps everything RLS
   returned — nothing is narrowed to one company — so the ALL_* names are the
   same arrays. Only the user's own company is recorded, for the header and as
   the default company of new records. */
function applyCompanyScope(viewerId){
  ALL_PEOPLE = PEOPLE; ALL_JOBS = JOBS; ALL_CLIENTS = CLIENTS;
  const viewer = ALL_PEOPLE.find(p=>p.id===viewerId);
  HOME_COMPANY_ID = viewer ? viewer.companyId : null;
}

/* Re-reads everything from Supabase. */
async function reloadAppData(){
  DATA_READY = false; render();
  LOAD_ERROR = null;
  try{ await loadAppData(ORG_ID, me); }
  catch(err){ LOAD_ERROR = "Unexpected error while loading: "+(err && err.message ? err.message : String(err)); }
  if(LOAD_ERROR){ renderBlockingScreen("Couldn't load your data", LOAD_ERROR, true, true); return false; }
  refreshMyPunches();
  saveIdentityCache();
  render();
  return true;
}


/* Minimal multi-sheet XLSX writer. Builds a real .xlsx (stored ZIP, no
   compression) so Excel opens it without a format warning and without
   pulling in any library. */
const XLSX = (() => {
  const enc = new TextEncoder();

  let TBL = null;
  function crc32(buf){
    if(!TBL){
      TBL = new Uint32Array(256);
      for(let n=0;n<256;n++){
        let c=n;
        for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320 ^ (c>>>1) : c>>>1;
        TBL[n]=c>>>0;
      }
    }
    let c = 0xFFFFFFFF;
    for(let i=0;i<buf.length;i++) c = TBL[(c ^ buf[i]) & 0xFF] ^ (c>>>8);
    return (c ^ 0xFFFFFFFF)>>>0;
  }

  const xesc = s => String(s==null?"":s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&apos;")
    .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,"");

  function colName(n){                       // 1 -> A
    let s="";
    while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=(n-m-1)/26; }
    return s;
  }

  /* Rich mode (build(sheets,{rich:true}) — the import templates): a cell may
     also be {v, s} with s a STYLE index below; a sheet may carry
     cols:[{width,style}], freeze:true (top row), headerStyle, merges:["A1:F1"]
     and validations:[{sqref, type:"list"|"date"|"decimal", list:"Lists!$A$2:$A$9",
     warnOnly, prompt, error}]. Plain mode is byte-for-byte the original. */
  const STYLE = { plain:0, bold:1, headReq:2, headOpt:3, text:4, date:5, money:6,
                  title:7, wrap:8, boldWrap:9, note:10, bad:11 };
  const RICH_STYLES =
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'+
    '<numFmts count="2"><numFmt numFmtId="164" formatCode="dd-mmm-yyyy"/>'+
      '<numFmt numFmtId="165" formatCode="#,##0.00"/></numFmts>'+
    '<fonts count="7"><font><sz val="11"/><name val="Calibri"/></font>'+
      '<font><b/><sz val="11"/><name val="Calibri"/></font>'+
      '<font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font>'+
      '<font><b/><sz val="14"/><color rgb="FF234163"/><name val="Calibri"/></font>'+
      '<font><i/><sz val="10"/><color rgb="FF56606B"/><name val="Calibri"/></font>'+
      '<font><b/><sz val="11"/><color rgb="FF3A4555"/><name val="Calibri"/></font>'+
      '<font><b/><sz val="11"/><color rgb="FFA4243B"/><name val="Calibri"/></font></fonts>'+
    '<fills count="4"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill>'+
      '<fill><patternFill patternType="solid"><fgColor rgb="FF3A4555"/><bgColor indexed="64"/></patternFill></fill>'+
      '<fill><patternFill patternType="solid"><fgColor rgb="FFDCE0D9"/><bgColor indexed="64"/></patternFill></fill></fills>'+
    '<borders count="2"><border/><border><left style="thin"><color rgb="FFB8BEB3"/></left>'+
      '<right style="thin"><color rgb="FFB8BEB3"/></right><top style="thin"><color rgb="FFB8BEB3"/></top>'+
      '<bottom style="thin"><color rgb="FFB8BEB3"/></bottom><diagonal/></border></borders>'+
    '<cellStyleXfs count="1"><xf/></cellStyleXfs>'+
    '<cellXfs count="12"><xf xfId="0"/><xf xfId="0" fontId="1" applyFont="1"/>'+
      '<xf xfId="0" fontId="2" fillId="2" borderId="1" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment vertical="center" wrapText="1"/></xf>'+
      '<xf xfId="0" fontId="5" fillId="3" borderId="1" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment vertical="center" wrapText="1"/></xf>'+
      '<xf xfId="0" numFmtId="49" applyNumberFormat="1"/>'+
      '<xf xfId="0" numFmtId="164" applyNumberFormat="1"/>'+
      '<xf xfId="0" numFmtId="165" applyNumberFormat="1"/>'+
      '<xf xfId="0" fontId="3" applyFont="1"/>'+
      '<xf xfId="0" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf>'+
      '<xf xfId="0" fontId="1" applyFont="1" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf>'+
      '<xf xfId="0" fontId="4" applyFont="1" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf>'+
      '<xf xfId="0" fontId="6" applyFont="1" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf></cellXfs>'+
    '</styleSheet>';

  function richSheetXML(sh){
    const rows = sh.rows;
    let x = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">';
    if(sh.freeze) x += '<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" '+
      'activePane="bottomLeft" state="frozen"/><selection pane="bottomLeft" activeCell="A2" sqref="A2"/></sheetView></sheetViews>';
    if(sh.cols && sh.cols.length) x += '<cols>'+sh.cols.map((c,i)=>'<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+
      (c.width||12)+'" customWidth="1"'+(c.style?' style="'+c.style+'"':'')+'/>').join("")+'</cols>';
    x += '<sheetData>';
    rows.forEach((row,ri)=>{
      x += '<row r="'+(ri+1)+'"'+(ri===0 && sh.headerHeight ? ' ht="'+sh.headerHeight+'" customHeight="1"' : '')+'>';
      row.forEach((cell,ci)=>{
        const ref = colName(ci+1)+(ri+1);
        let v = cell, s = ri===0 ? (sh.headerStyle==null ? STYLE.bold : sh.headerStyle) : 0;
        if(cell && typeof cell==="object"){ v = cell.v; if(cell.s!=null) s = cell.s; }
        const st = s ? ' s="'+s+'"' : '';
        if(typeof v === "number" && isFinite(v)) x += '<c r="'+ref+'"'+st+'><v>'+v+'</v></c>';
        else if(v===null || v===undefined || v==="") x += '<c r="'+ref+'"'+st+'/>';
        else x += '<c r="'+ref+'"'+st+' t="inlineStr"><is><t xml:space="preserve">'+xesc(v)+'</t></is></c>';
      });
      x += '</row>';
    });
    x += '</sheetData>';
    if(sh.merges && sh.merges.length)
      x += '<mergeCells count="'+sh.merges.length+'">'+sh.merges.map(m=>'<mergeCell ref="'+m+'"/>').join("")+'</mergeCells>';
    const dv = (sh.validations||[]).filter(v=>v.type!=="list" || v.list);
    if(dv.length){
      x += '<dataValidations count="'+dv.length+'">'+dv.map(v=>{
        const head = '<dataValidation type="'+v.type+'"'+
          (v.type==="date" ? ' operator="between"' : v.type==="decimal" ? ' operator="between"' : '')+
          ' allowBlank="1" showInputMessage="1" showErrorMessage="1"'+(v.openList?' errorStyle="information"':v.warnOnly?' errorStyle="warning"':'')+
          (v.error?' errorTitle="Check this value" error="'+xesc(v.error)+'"':'')+
          (v.prompt?' promptTitle="'+xesc((v.promptTitle||"").slice(0,32))+'" prompt="'+xesc(v.prompt.slice(0,255))+'"':'')+
          ' sqref="'+v.sqref+'">';
        const f = v.type==="list" ? '<formula1>'+xesc(v.list)+'</formula1>'
          : v.type==="date" ? '<formula1>1</formula1><formula2>2958465</formula2>'
          : '<formula1>0</formula1><formula2>'+(v.max||9999999999.99)+'</formula2>';
        return head+f+'</dataValidation>';
      }).join("")+'</dataValidations>';
    }
    return x + '</worksheet>';
  }

  /* rows: array of arrays. A cell is a number, or anything else -> text.
     The first row is written bold via style 1. */
  function sheetXML(rows){
    let x = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'+
      '<sheetData>';
    rows.forEach((row,ri)=>{
      x += '<row r="'+(ri+1)+'">';
      row.forEach((cell,ci)=>{
        const ref = colName(ci+1)+(ri+1);
        const st  = ri===0 ? ' s="1"' : '';
        if(typeof cell === "number" && isFinite(cell))
          x += '<c r="'+ref+'"'+st+'><v>'+cell+'</v></c>';
        else if(cell===null || cell===undefined || cell==="")
          x += '<c r="'+ref+'"'+st+'/>';
        else
          x += '<c r="'+ref+'"'+st+' t="inlineStr"><is><t xml:space="preserve">'+xesc(cell)+'</t></is></c>';
      });
      x += '</row>';
    });
    return x + '</sheetData></worksheet>';
  }

  function build(sheets, opts){              // [{name, rows}], opts.rich: see richSheetXML
    const rich = !!(opts && opts.rich);
    const files = [];
    const add = (name, str) => files.push({ name, data: enc.encode(str) });

    add("[Content_Types].xml",
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'+
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'+
      '<Default Extension="xml" ContentType="application/xml"/>'+
      '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+
      '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'+
      sheets.map((_,i)=>'<Override PartName="/xl/worksheets/sheet'+(i+1)+
        '.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join("")+
      '</Types>');

    add("_rels/.rels",
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>'+
      '</Relationships>');

    add("xl/workbook.xml",
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" '+
      'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'+
      sheets.map((s,i)=>'<sheet name="'+xesc(s.name.slice(0,31))+'" sheetId="'+(i+1)+
        '" r:id="rId'+(i+1)+'"/>').join("")+
      '</sheets></workbook>');

    add("xl/_rels/workbook.xml.rels",
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
      sheets.map((_,i)=>'<Relationship Id="rId'+(i+1)+
        '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+
        (i+1)+'.xml"/>').join("")+
      '<Relationship Id="rId'+(sheets.length+1)+
      '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>'+
      '</Relationships>');

    add("xl/styles.xml", rich ? RICH_STYLES :
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'+
      '<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font>'+
      '<font><b/><sz val="11"/><name val="Calibri"/></font></fonts>'+
      '<fills count="1"><fill><patternFill patternType="none"/></fill></fills>'+
      '<borders count="1"><border/></borders>'+
      '<cellStyleXfs count="1"><xf/></cellStyleXfs>'+
      '<cellXfs count="2"><xf xfId="0"/><xf xfId="0" fontId="1" applyFont="1"/></cellXfs>'+
      '</styleSheet>');

    sheets.forEach((s,i)=> add("xl/worksheets/sheet"+(i+1)+".xml", rich ? richSheetXML(s) : sheetXML(s.rows)));

    /* ---- stored (uncompressed) ZIP ---- */
    const parts = [], central = [];
    let offset = 0;

    const u16 = n => [n&0xFF,(n>>8)&0xFF];
    const u32 = n => [n&0xFF,(n>>8)&0xFF,(n>>16)&0xFF,(n>>>24)&0xFF];

    files.forEach(f=>{
      const nameBytes = enc.encode(f.name);
      const crc = crc32(f.data);
      const local = [].concat(
        u32(0x04034b50), u16(20), u16(0), u16(0), u16(0), u16(0),
        u32(crc), u32(f.data.length), u32(f.data.length),
        u16(nameBytes.length), u16(0));
      parts.push(new Uint8Array(local), nameBytes, f.data);
      central.push([[].concat(
        u32(0x02014b50), u16(20), u16(20), u16(0), u16(0), u16(0), u16(0),
        u32(crc), u32(f.data.length), u32(f.data.length),
        u16(nameBytes.length), u16(0), u16(0), u16(0), u16(0), u32(0),
        u32(offset)), nameBytes]);
      offset += local.length + nameBytes.length + f.data.length;
    });

    const cd = [];
    central.forEach(([arr,nameBytes])=>{ cd.push(new Uint8Array(arr), nameBytes); });
    const cdSize = cd.reduce((s,a)=>s+a.length,0);

    const end = new Uint8Array([].concat(
      u32(0x06054b50), u16(0), u16(0),
      u16(files.length), u16(files.length),
      u32(cdSize), u32(offset), u16(0)));

    const all = parts.concat(cd, [end]);
    const total = all.reduce((s,a)=>s+a.length,0);
    const out = new Uint8Array(total);
    let p=0; all.forEach(a=>{ out.set(a,p); p+=a.length; });
    return out;
  }

  function download(filename, sheets, opts){
    const bytes = build(sheets, opts);
    // Mobile app (Capacitor): the WebView ignores <a download>, so save the
    // same bytes with Filesystem and offer them via the share sheet (fileSave.js).
    if(window.nativeFiles && window.nativeFiles.isNativeApp())
      return window.nativeFiles.saveNativeFile(filename, bytes,
        "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
    const blob = new Blob([bytes], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 0);
  }

  return { build, download, STYLE };
})();

/* Every table is placed in a .table-wrap so that on mobile it scrolls
   sideways at its natural width instead of being squeezed (CSS: 860px
   block). Views and modals build tables as HTML strings in many places, so
   this wraps them wherever they appear rather than each call site. The
   wrapper has no styling on desktop, so desktop layout is unchanged. */
function wrapTables(root){
  if(!root || !root.querySelectorAll) return;
  const tables = root.tagName==="TABLE" ? [root] : root.querySelectorAll("table");
  tables.forEach(t=>{
    const parent=t.parentElement;
    if(!parent || parent.classList.contains("table-wrap")) return;
    const wrap=document.createElement("div");
    wrap.className="table-wrap";
    parent.insertBefore(wrap,t);
    wrap.appendChild(t);
  });
}
(function watchTables(){
  const start=()=>{
    wrapTables(document.body);
    new MutationObserver(muts=>muts.forEach(m=>m.addedNodes.forEach(n=>{ if(n.nodeType===1) wrapTables(n); })))
      .observe(document.body,{childList:true,subtree:true});
  };
  if(document.body) start(); else document.addEventListener("DOMContentLoaded",start);
})();

function addDays(d,n){

/* First/last calendar date of a "YYYY-MM" month, as date strings. Anchored

function monthRange(ym){

function fmtShort(d){ const [,m,dd]=d.split("-");

function dueTag(d){

  if(n===0) return '<span class="tag bad">due today</span>';
  if(n<=3)  return '<span class="tag warn">in '+n+'d</span>';

/* The one rule for whether a job or task can still be overdue, used by Work,
   Job codes, Today, My calendar and the Statutory calendar. A job with tasks,
   all of them Done, has no work left: it is not overdue, whichever due date is
   being shown, but it stays open until someone closes it under the usual rules.
   A job with no tasks is not "done". Worked out from TASKS, so reopening a task
   brings the job back. Anyone who can see a job can see all its tasks (RLS). */
function jobWorkDone(j){
  const ts = TASKS.filter(t=>t.job===j.id);

/* Optional working days (045, mirrors optional_days_rule_from()): from this
   date every Saturday and every declared holiday is optional. Not working is
   never an absence; working counts as Present and earns 1 Earned Leave once
   the day has a punch-in and a punch-out (credited by the database). Sundays
   keep the weekly-off rule. Earlier dates keep the old rules below, so past
   payroll does not change. */
const OPTIONAL_DAYS_FROM = "2026-11-01";
/* Timesheet minimum per submitted day (045, trg_timesheet_day_minimum). */
const MIN_FULL_DAY_HOURS = 8, MIN_HALF_DAY_HOURS = 4;
/* Old rule (before OPTIONAL_DAYS_FROM only): 2nd/4th Saturday is a holiday. */
function isSaturdayHoliday(date){
  if(date >= OPTIONAL_DAYS_FROM) return false;
  const day = new Date(date+"T00:00:00Z").getUTCDay();
  const ordinal = Math.ceil(Number(date.slice(8,10))/7);
  return day===6 && (ordinal===2 || ordinal===4);
}
function publicHolidayOn(date){ return HOLIDAYS.find(h=>h.date===date) || null; }
/* Saturday or declared holiday under the new rules (never a Sunday). */
function isOptionalWorkDay(date){
  if(date < OPTIONAL_DAYS_FROM || isSunday(date)) return false;
  return dayOfWeek(date)===6 || !!publicHolidayOn(date);
}
const EL_REASON_LABEL = { saturday_worked:"Saturday worked", holiday_worked:"Holiday worked" };
function elReasonLabel(h){
  return EL_REASON_LABEL[h.reason] || (publicHolidayOn(h.date) ? "Holiday worked" : "Saturday worked");
}
/* Calendar/attendance day numbering is JavaScript's own: Sunday = 0 …
   Saturday = 6, and weeks are drawn Sunday-first. (Timesheet weeks are a
   separate Mon–Sat work week — see mondayOf()/weekdayIndex() — unchanged.)
   Sunday is the weekly off: always a holiday for attendance, never absent.
   It is deliberately NOT returned by holidayOn(), because holidayOn() also
   feeds holiday-worked / earned-leave, which Sundays never earn. */
const WEEKDAY_NAMES = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function dayOfWeek(date){ return new Date(date+"T00:00:00Z").getUTCDay(); }
function isSunday(date){ return dayOfWeek(date)===0; }

}

function holidayOn(date){

  if(publicHoliday) return publicHoliday;
  if(isSaturdayHoliday(date)) return {date,name:"Saturday Holiday"};
  return null;
}
function holidayWorkedOn(who,date){ return HOLIDAY_WORKED.some(h=>h.who===who && h.date===date); }
/* One Earned Leave credit (earned_leave_transactions via holiday_worked_days()).
   reason / credited_at arrive once 045 is applied; older rows fall back. */

/* The salary record in force on `date` (latest effective_from <= date).
   `history` defaults to the partner's SALARY_HISTORY; an employee's own
   payslip passes MY_SALARY_HISTORY (their own rows only — RLS, 029). */
function salaryRecordAt(who, date, history=SALARY_HISTORY){
  return history.filter(s=>s.who===who && s.effective<=date)
    .sort((a,b)=>b.effective.localeCompare(a.effective))[0] || null;
}
function salaryAt(who, date, history=SALARY_HISTORY){

}
/* Which company paid `p` on `date`: the salary record in force then, or the
   person's current company when no record exists yet. */
function salaryCompanyAt(p, date){ return (salaryRecordAt(p.id, date)||{}).companyId || p.companyId; }
/* People on the payroll for `ym`. For one company (`companyId`, the Salary
   page's Company filter) that is everyone it paid that month — including
   someone who has since moved to another company — and not someone it did
   not pay. "all" lists every company's payroll together. */
function salaryStaffFor(ym, companyId="all"){
  const [first,last]=monthRange(ym);
  return PEOPLE.filter(p=>p.joined<=last&&(!p.left||p.left>=first)&&
    (p.active||p.left||SALARY_HISTORY.some(s=>s.who===p.id&&s.effective<=last)||salaryPunches.some(x=>x.who===p.id&&x.date>=first&&x.date<=last))&&
    (companyId==="all" || salaryCompanyAt(p, last)===companyId));
}
function salaryCalculation(profile, ym, punchRows, history=SALARY_HISTORY){
  const [first,last]=monthRange(ym), record=salaryRecordAt(profile.id,last,history), ctc=record?.ctc||0, daily=ctc/30;
  const dates=datesBetween(first,last), holidays=HOLIDAYS.filter(h=>h.date>=first&&h.date<=last);
  const holidaySet=new Set(holidays.map(h=>h.date).concat(dates.filter(isSaturdayHoliday)));
  const punches=punchRows.filter(p=>p.who===profile.id && p.date>=first && p.date<=last);
  const byDate=new Map(); punches.forEach(p=>{const a=byDate.get(p.date)||[];a.push(p);byDate.set(p.date,a);});
  // holidayWorked counts every worked holiday/Saturday; only days under the
  // old rules (before OPTIONAL_DAYS_FROM) are also paid an extra day.
  let present=0, absent=0, half=0, holidayWorked=0, holidayPaidDays=0;
  for(const date of dates){
    if(profile.joined && date<profile.joined) continue;
    if(profile.left && date>profile.left) continue;
    if(date>TODAY) continue;
    if(isSunday(date)) continue; // Sunday is the weekly off — never present/absent/deducted.
    const dayPunches=byDate.get(date)||[], worked=dayPunches.length>0;
    const lv=LEAVE.find(l=>l.who===profile.id&&l.date===date&&l.status==="approved");
    // Optional Saturday/holiday: worked = Present (Earned Leave is the
    // compensation, no extra pay); not worked = nothing, never absent.
    if(isOptionalWorkDay(date)){ if(worked){ present++; holidayWorked++; } continue; }
    if(holidaySet.has(date)){ if(worked || holidayWorkedOn(profile.id,date)){ holidayWorked++; holidayPaidDays++; } continue; }
    if(lv){
      const type=LEAVE_TYPES.find(t=>t.code===lv.type);
      const units=lv.part==="half"?.5:1;
      if(type && !type.paid){ if(units===.5) half++; else absent++; }
      if(worked) present+=units;
      continue;
    }
    if(worked) present++;
    else absent++;
  }
  const earned=HOLIDAY_WORKED.filter(h=>h.who===profile.id && h.date>=first && h.date<=last).length;
  const absenceDeduction=absent*daily, halfDeduction=half*daily*.5, holidayEarning=holidayPaidDays*daily;
  const earnedLeaveBalance=leaveBalanceFor(profile.id,+ym.slice(0,4),last).find(b=>b.code==="EL")?.remaining||0;
  return {who:profile.id,profile,month:ym,ctc,daily,record,hasCtc:!!record,present,absent,half,earned,earnedLeaveBalance,publicHolidays:holidaySet.size,holidayWorked,holidayPaidDays,
    absenceDeduction,halfDeduction,holidayEarning,final:ctc-absenceDeduction-halfDeduction+holidayEarning};
}
async function loadSalaryMonth(){
  if(!CAN.viewSalary()) return;
  salaryLoading=true; render();
  const [first,last]=monthRange(salaryMonth);
  let data=[],from=0;
  while(true){
    const {data:page,error}=await supabase.from("attendance_punches").select("profile_id,punch_date,punch_type")
      .eq("organization_id",ORG_ID).gte("punch_date",first).lte("punch_date",last)
      .order("punch_date").order("id").range(from,from+999);

    data=data.concat(page); if(page.length<1000)break; from+=1000;
  }
  // Partner-only screen; rows are grouped per person, and salaryStaffFor()
  // decides which people belong to the filtered company for that month.
