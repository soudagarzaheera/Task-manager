/* Company logo (029): fetched only when a payslip is produced, then cached. */
const COMPANY_LOGO_CACHE = {};
async function companyLogo(companyId){
  if(!companyId) return null;
  if(companyId in COMPANY_LOGO_CACHE) return COMPANY_LOGO_CACHE[companyId];
  const { data, error } = await supabase.from("companies").select("logo_data_url").eq("id", companyId).maybeSingle();
  COMPANY_LOGO_CACHE[companyId] = (!error && data && data.logo_data_url) || null;
  return COMPANY_LOGO_CACHE[companyId];
}
const imageSize = src => new Promise(res=>{ const i=new Image(); i.onload=()=>res({w:i.naturalWidth,h:i.naturalHeight}); i.onerror=()=>res(null); i.src=src; });

/* A4 payslip PDF — black and white, for official payroll records. Built-in
   PDF fonts have no ₹ glyph, so amounts print as "Rs.". Draws payslipData()
   as-is; nothing here calculates a figure. */
async function buildPayslipPdf(d){
  if(!window.loadJsPDF) throw new Error("PDF library is not available");
  const jsPDF = await window.loadJsPDF();
  const doc = new jsPDF({ unit:"mm", format:"a4" });
  const W = 210, H = 297, M = 18, R = W - M, CW = R - M, FOOT = H - 14;
  const black=[0,0,0], grey=[90,90,90], hair=[200,200,200], fill=[242,242,242];
  const rs = n => "Rs. " + moneyFull(n);
  const font = (size, style, color) => { doc.setFont("helvetica", style||"normal"); doc.setFontSize(size); doc.setTextColor(...(color||black)); };
  const line = (x1, y1, x2, color, w) => { doc.setDrawColor(...(color||hair)); doc.setLineWidth(w||0.2); doc.line(x1, y1, x2, y1); };
  const LH = 4.1;                                   // line height (mm) for 8.5-9pt text
  let y = 18;
  // keep a block on one page; a new page restarts below the top margin
  const room = h => { if(y + h > FOOT - 6){ doc.addPage(); y = 18; } };
  const section = title => {
    room(14);
    font(8, "bold"); doc.setCharSpace(0.6); doc.text(title.toUpperCase(), M, y); doc.setCharSpace(0);
    line(M, y + 1.8, R, black, 0.3);
    y += 6;
  };

  // ---- header: logo + company | PAYSLIP + period ----
  const logo = await companyLogo(d.companyId);
  let textX = M;
  if(logo){
    const sz = await imageSize(logo);
    if(sz && sz.w && sz.h){
      const h = 14, w = Math.min(36, h * sz.w / sz.h);
      doc.addImage(logo, logo.startsWith("data:image/png") ? "PNG" : "JPEG", M, y - 4, w, w * sz.h / sz.w);
      textX = M + w + 5;
    }
  }
  font(15, "bold");
  const coLines = doc.splitTextToSize(d.companyName, R - 58 - textX);
  doc.text(coLines, textX, y + 1);
  let hy = y + 1 + (coLines.length - 1) * 6;
  if(d.organizationName && d.organizationName !== d.companyName){
    font(9, "normal", grey); hy += 5; doc.text(d.organizationName, textX, hy);
  }
  // letter-spaced title, drawn letter by letter so its right edge sits exactly on the margin
  font(16, "bold");
  const tsp = 1.2, title = [..."PAYSLIP"];
  let tx = R - (title.reduce((a,c)=>a+doc.getTextWidth(c),0) + tsp * (title.length - 1));
  title.forEach(c=>{ doc.text(c, tx, y); tx += doc.getTextWidth(c) + tsp; });
  font(10, "bold"); doc.text(d.period, R, y + 6, { align:"right" });
  font(8, "normal", grey); doc.text(fmtDate(d.periodFrom)+" to "+fmtDate(d.periodTo), R, y + 10.5, { align:"right" });
  y = Math.max(hy, y + 10.5) + 4;
  line(M, y, R, black, 0.6);
  y += 6;

  if(d.provisional){
    doc.setDrawColor(...black); doc.setLineWidth(0.3); doc.rect(M, y - 4, CW, 7);
    font(8.5, "bold"); doc.text("PROVISIONAL", M + 3, y + 0.6);
    font(8.5, "normal"); doc.text("Month in progress — attendance counted up to "+fmtDate(TODAY)+".", M + 27, y + 0.6);
    y += 9;
  }

  // ---- employee details: two columns of label / value rows ----
  section("Employee details");
  const details = [["Employee name", d.employeeName], ["Employee ID", d.employeeId], ["Designation", d.designation],
    ["Department", d.department], ["Date of joining", d.joined ? fmtDate(d.joined) : ""],
    ["Pay period", fmtDate(d.periodFrom)+" to "+fmtDate(d.periodTo)],
    ["Monthly CTC", rs(d.monthlyCtc)], ["Annual CTC", rs(d.annualCtc)],
    ["CTC effective from", d.ctcEffectiveFrom ? fmtDate(d.ctcEffectiveFrom) : ""], ["Company", d.companyName]]
    .filter(([,v])=>v);
  const colGap = 10, colW = (CW - colGap) / 2, labW = 32;
  for(let i = 0; i < details.length; i += 2){
    font(9, "bold");
    const pair = details.slice(i, i + 2).map(([l,v]) => [l, doc.splitTextToSize(String(v), colW - labW - 1)]);
    const h = Math.max(...pair.map(([,v]) => v.length)) * LH + 3;
    room(h);
    pair.forEach(([l,v], j) => {
      const x = M + j * (colW + colGap);
      font(8.5, "normal", grey); doc.text(l, x, y + 4);
      font(9, "bold"); doc.text(v, x + labW, y + 4);
      line(x, y + h, x + colW);
    });
    y += h;
  }
  y += 8;

  // ---- earnings | deductions ----
  const tGap = 8, tW = (CW - tGap) / 2;
  room(40);
  const tableTop = y;
  const table = (x, title, list) => {
    let ty = tableTop;
    doc.setFillColor(...fill); doc.rect(x, ty, tW, 7.5, "F");
    line(x, ty, x + tW, black, 0.4);
    font(8.5, "bold"); doc.text(title.toUpperCase(), x + 2.5, ty + 5); doc.text("AMOUNT", x + tW - 2.5, ty + 5, { align:"right" });
    ty += 7.5;
    line(x, ty, x + tW, black, 0.2);
    list.forEach(([l,v])=>{
      font(9, "normal");
      const wrapped = doc.splitTextToSize(l, tW - 36);
      const h = wrapped.length * LH + 3;
      doc.text(wrapped, x + 2.5, ty + 4.8); doc.text(rs(v), x + tW - 2.5, ty + 4.8, { align:"right" });
      line(x, ty + h, x + tW);
      ty += h;
    });
    return ty;
  };
  const eEnd = table(M, "Earnings", d.earnings.length ? d.earnings : [["—", 0]]);
  const dEnd = table(M + tW + tGap, "Deductions", d.deductions.length ? d.deductions : [["No deductions", 0]]);
  const totY = Math.max(eEnd, dEnd);
  [[M, "Gross earnings", d.gross], [M + tW + tGap, "Total deductions", d.totalDeductions]].forEach(([x,l,v])=>{
    line(x, totY, x + tW, black, 0.4);
    font(9.5, "bold"); doc.text(l, x + 2.5, totY + 5.2); doc.text(rs(v), x + tW - 2.5, totY + 5.2, { align:"right" });
    line(x, totY + 7.5, x + tW, black, 0.4);
  });
  y = totY + 7.5 + 8;

  // ---- net pay: bold, grey panel with a black border ----
  font(8.5, "normal");
  const words = doc.splitTextToSize("Amount in words: "+amountInWords(d.net), CW - 8);
  const netH = 16 + words.length * LH + 1;
  room(netH);
  doc.setFillColor(...fill); doc.setDrawColor(...black); doc.setLineWidth(0.2);
  doc.rect(M, y, CW, netH, "FD");
  font(10, "bold"); doc.setCharSpace(0.8); doc.text("NET PAY", M + 4, y + 7); doc.setCharSpace(0);
  font(16, "bold"); doc.text(rs(d.net), R - 4, y + 9, { align:"right" });
  line(M + 4, y + 13.5, R - 4, hair, 0.2);
  font(8.5, "normal"); doc.text(words, M + 4, y + 18);
  y += netH + 9;

  // ---- attendance summary: 4-column grid ----
  section("Attendance summary");
  const per = 4, aW = CW / per, aH = 11.5, rows = Math.ceil(d.attendance.length / per);
  room(rows * aH);
  d.attendance.forEach(([l,v],i)=>{
    const x = M + (i % per) * aW, yy = y + Math.floor(i / per) * aH;
    doc.setDrawColor(...hair); doc.setLineWidth(0.2); doc.rect(x, yy, aW, aH);
    font(7.5, "normal", grey); doc.text(doc.splitTextToSize(l, aW - 5)[0], x + 2.5, yy + 4.3);
    font(10, "bold"); doc.text(String(v), x + 2.5, yy + 9.2);
  });
  y += rows * aH + 9;

  // ---- notes ----
  

  // ---- footer on every page ----
  const pages = doc.getNumberOfPages();
  for(let p = 1; p <= pages; p++){
    doc.setPage(p);
    line(M, FOOT - 4, R, hair, 0.2);
    font(7.5, "normal", grey);
    doc.text("This is a computer-generated payslip and does not require a signature.", M, FOOT);
    doc.text("Generated on "+fmtDate(TODAY)+(pages > 1 ? "  ·  Page "+p+" of "+pages : ""), R, FOOT, { align:"right" });
  }
  return doc;
}

async function savePayslipPdf(d, btn){
  const label = btn ? btn.textContent : "";
  if(btn){ btn.disabled = true; btn.textContent = "Preparing PDF…"; }
  try{
    const doc = await buildPayslipPdf(d);
    const safe = s => String(s||"").replace(/[^A-Za-z0-9_-]+/g,"_");
    doc.save("Payslip_"+safe(d.employeeId||d.employeeName)+"_"+d.month+".pdf");
  }catch(err){
    console.error("[payslip]", err);
    toast("Could not create the PDF — "+(err && err.message ? err.message : err));
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = label; }
  }
}

/* mode "self": the signed-in user's own payslip (My salary).
   mode "partner": any employee in the Salary screen (partner only). */
async function downloadPayslip(who, mode){
  const btn = (typeof event !== "undefined" && event && event.target && event.target.closest) ? event.target.closest("button") : null;
  if(mode === "partner"){
    if(!CAN.viewSalary()) return toast("Salary is available to Partners only");
    const calc = salaryCalculation(person(who), salaryMonth, salaryPunches);
    if(!calc.hasCtc) return toast("Monthly CTC is not set for "+person(who).name);
    return savePayslipPdf(payslipData(calc), btn);
  }
  if(who !== me) return toast("You can only download your own payslip");
  const calc = myPayslipCalc();
  if(!calc) return toast("Payslip not available for this month");
  return savePayslipPdf(payslipData(calc), btn);
}

async function loadMyPayslipMonth(ym){
  MY_PAYSLIP = { month:ym, punches:[], loading:true, error:"" }; render();
  const [first,last] = monthRange(ym);
  const { data, error } = await supabase.from("attendance_punches").select("profile_id,punch_date,punch_type")
    .eq("organization_id", ORG_ID).eq("profile_id", me)
    .gte("punch_date", first).lte("punch_date", last).order("punch_date");
  if(MY_PAYSLIP.month !== ym) return;   // a newer month was picked meanwhile
  MY_PAYSLIP = error
    ? { month:ym, punches:[], loading:false, error:"Could not load your attendance — "+error.message }
    : { month:ym, punches:data.map(p=>({who:p.profile_id,date:p.punch_date,type:p.punch_type})), loading:false, error:"" };
  render();
}
function setMySalaryMonth(v){
  if(!/^\d{4}-\d{2}$/.test(v)) return;
  const [min,max] = payslipMonthRange(person(me));
  mySalaryMonth = v < min ? min : v > max ? max : v;
  loadMyPayslipMonth(mySalaryMonth);
}
function myPayslipCalc(){
  if(MY_PAYSLIP.month !== mySalaryMonth || MY_PAYSLIP.loading || MY_PAYSLIP.error) return null;
  const calc = salaryCalculation(person(me), mySalaryMonth, MY_PAYSLIP.punches, MY_SALARY_HISTORY);
  return calc.hasCtc ? calc : null;
}

      '<div class="card"><div class="eyebrow">Current monthly CTC</div><div class="kpi" style="margin-top:7px">'+(cur?money(cur.ctc):"—")+'</div>'+
        '<div class="kpi-label">'+(cur?"since "+fmtDate(cur.effective):"not set yet — ask your partner")+'</div></div>'+
      '<div class="card"><div class="eyebrow">Annual CTC</div><div class="kpi" style="margin-top:7px">'+(cur?money(cur.ctc*12):"—")+'</div>'+
        '<div class="kpi-label">monthly × 12</div></div>'+
      '<div class="card"><div class="eyebrow">Company</div><div class="kpi" style="margin-top:7px;font-size:18px">'+
        esc(companyFullName((cur&&cur.companyId)||p.companyId))+'</div><div class="kpi-label">'+esc(p.label||"")+'</div></div></div>';

    h += '<div class="card"><div class="card-head"><h2>Payslip</h2><span class="spacer"></span>'+
      '<label class="field" style="margin:0"><span class="sr-only">Month</span><input type="month" id="mySalaryMonth" value="'+mySalaryMonth+
        '" min="'+min+'" max="'+max+'" onchange="setMySalaryMonth(this.value)"></label></div>';
    if(MY_PAYSLIP.loading || MY_PAYSLIP.month !== mySalaryMonth) h += '<div class="empty">Loading your attendance for '+esc(monthLabel(mySalaryMonth))+'…</div>';
    else if(MY_PAYSLIP.error) h += '<div class="empty">'+esc(MY_PAYSLIP.error)+'</div>';
    else {
      const calc = salaryCalculation(p, mySalaryMonth, MY_PAYSLIP.punches, MY_SALARY_HISTORY);
      if(!calc.hasCtc) h += '<div class="empty">No CTC was set for '+esc(monthLabel(mySalaryMonth))+'. Ask your partner to record your CTC.</div>';
      else h += '<div class="row" style="justify-content:flex-end;margin-bottom:10px">'+
          '<button class="btn" id="myPayslipBtn" onclick="downloadPayslip(me,\'self\')">Download payslip (PDF)</button></div>'+
          payslipHTML(payslipData(calc));
    }
    h += '</div>';

    const hist = MY_SALARY_HISTORY.filter(s=>s.who===me).slice().sort((a,b)=>b.effective.localeCompare(a.effective));
    h += '<div class="card"><div class="card-head"><h2>Salary history</h2></div>'+
      (hist.length ? '<table><thead><tr><th>Effective from</th><th>Company</th><th class="r">Monthly CTC</th><th class="r">Annual CTC</th></tr></thead><tbody>'+
        hist.map(s=>'<tr><td class="num">'+fmtDate(s.effective)+'</td><td>'+esc(companyFullName(s.companyId))+'</td>'+
          '<td class="r num">'+money(s.ctc)+'</td><td class="r num">'+money(s.ctc*12)+'</td></tr>').join("")+'</tbody></table>'
        : '<div class="empty">No salary has been recorded for you yet.</div>')+
      '<p class="tiny muted" style="margin-top:10px">Only you (and partners) can see your salary. Each change is kept as a new record from its effective date.</p></div>';
    return h;
  }
};

VIEWS.leave = {
  title:"Leave",
  sub(){
    const mine = leaveRequestsFor(me).filter(r=>r.status==="pending").length;
    const teamPending = pendingLeaveRequests().length;
    if(teamPending && rank(me)>=50) return teamPending+" team request"+(teamPending===1?"":"s")+" waiting for your approval";
    return mine ? mine+" of your request"+(mine===1?"":"s")+" still with your approver"
                : "Apply, track balance, and view history";
  },
  render(){
    if(!LEAVE_TYPES.length){
      return '<div class="card"><div class="card-head"><h2>Leave</h2></div>'+
        '<div class="empty">Leave types are not set up for this organization yet.'+
        (CAN.manageLeavePolicy()?" Add one below.":" Ask a partner to set this up.")+'</div></div>'+
        leavePolicyCardHTML();
    }

    const balances = leaveBalanceFor(me);
    const requests = leaveRequestsFor(me);
    const upcoming = upcomingApprovedLeave(me);
    const teamLeaves = teamLeaveRecords(me);

    let h = '<div class="card"><div class="card-head"><h2>Leave balance</h2><span class="spacer"></span>'+
      '<span class="eyebrow">'+currentLeaveYear()+'</span></div>'+
      '<table><thead><tr><th>Type</th><th class="r">Allocated</th><th class="r">Earned</th><th class="r">Used</th>'+ 
      '<th class="r">Pending</th><th class="r">Remaining</th></tr></thead><tbody>'+
      balances.map(b=>'<tr><td>'+esc(b.label)+(b.paid?"":' <span class="tag">unpaid</span>')+'</td>'+
        '<td class="r num">'+fmtDays(b.allocated)+'</td>'+
        '<td class="r num">'+fmtDays(b.earned)+'</td>'+ 
        '<td class="r num">'+fmtDays(b.used)+'</td>'+
        '<td class="r num '+(b.pending?"":"muted")+'">'+(b.pending?fmtDays(b.pending):"—")+'</td>'+
        '<td class="r num strong '+(b.remaining<0?"bad":"")+'">'+fmtDays(b.remaining)+'</td></tr>').join("")+
      '</tbody></table></div>';

    if(CAN.viewSalary()){
      const earnedLeaveRows=staff().map(p=>{
        const balance=leaveBalanceFor(p.id).find(b=>b.code==="EL");
        const dates=HOLIDAY_WORKED.filter(d=>d.who===p.id&&d.date.slice(0,4)===String(currentLeaveYear()))
          .map(d=>fmtShort(d.date));

      }).join("");
      h+='<div class="card"><div class="card-head"><h2>Team earned leave</h2><span class="spacer"></span>'+ 
        '<span class="eyebrow">'+currentLeaveYear()+'</span></div>'+ 
        '<table><thead><tr><th>Employee</th><th>Holiday-worked dates</th><th class="r">Earned Leave balance</th></tr></thead><tbody>'+ 
        (earnedLeaveRows||'<tr><td colspan="3" class="muted">No employees.</td></tr>')+'</tbody></table></div>';
    }

    h += '<div class="card"><div class="card-head"><h2>Apply for leave</h2></div>'+
      '<button class="btn" onclick="applyLeave()">Apply for leave</button>'+
      (upcoming.length ? '<p class="tiny muted" style="margin-top:12px">Next up: '+esc(leaveTypeLabel(upcoming[0].type))+
        ' from '+fmtDate(upcoming[0].date)+'.</p>' : '')+
      '</div>';

    /* Team Leave Applications & Records (Senior Executive and above, or anyone with reports) */
    if(rank(me)>=50 || staff().some(p=>p.reportsTo===me)){
      h += '<div class="card"><div class="card-head"><h2>Team leave applications &amp; records</h2><span class="spacer"></span>'+
        '<span class="eyebrow">'+teamLeaves.length+' record'+(teamLeaves.length===1?"":"s")+' in your assigned period</span></div>'+
        (teamLeaves.length
          ? teamLeaves.map(r=>{
              const cls = r.status==="approved"?"approved":r.status==="rejected"?"queried":r.status==="pending"?"pending":"";
              const canDecide = r.status==="pending" && CAN.approveLeave(r.who, r);
              return '<div class="line '+cls+'" style="cursor:pointer" onclick="showLeaveDetail(\''+r.requestId+'\',\''+r.who+'\')">'+
                '<div class="line-top">'+
                  '<span class="strong">'+esc(person(r.who).name)+'</span>'+
                  '<span class="code">'+esc(leaveTypeLabel(r.type))+'</span>'+
                  '<span class="tiny muted">'+fmtDate(r.start)+(r.end!==r.start?' – '+fmtDate(r.end):'')+'</span>'+
                  '<span class="num">'+fmtDays(r.days)+'</span>'+
                  '<span class="spacer" style="flex:1"></span>'+
                  (canDecide
                    ? '<span class="line-acts" onclick="event.stopPropagation()">'+
                        '<button class="btn sm" onclick="decideLeaveRequest(\''+r.requestId+'\',\''+r.who+'\',true)">Approve</button> '+
                        '<button class="btn ghost sm" onclick="rejectLeavePrompt(\''+r.requestId+'\',\''+r.who+'\')">Reject</button>'+
                      '</span>'
                    : '<span class="tag '+STATUS_TAG_LEAVE[r.status]+'">'+r.status+'</span>')+
                '</div>'+
                (r.reason?'<p class="tiny muted" style="margin-top:6px">"'+esc(r.reason)+'"</p>':"")+
                (r.approvedBy?'<p class="tiny muted" style="margin-top:4px">'+(r.status==="rejected"?"Rejected":"Approved")+' by '+
                  esc(person(r.approvedBy).name)+(r.approvedAt?", "+fmtDateTime(r.approvedAt):"")+'</p>':"")+

          : '<div class="empty">No team leave records found for your period of responsibility.</div>')+
        '</div>';
    }

    h += '<div class="card"><div class="card-head"><h2>Your leave history</h2></div>';
    h += requests.length ? requests.map(r=>{
      const cls = r.status==="approved"?"approved":r.status==="rejected"?"queried":r.status==="pending"?"pending":"";
      return '<div class="line '+cls+'" style="cursor:pointer" onclick="showLeaveDetail(\''+r.requestId+'\',\''+me+'\')">'+
        '<div class="line-top">'+
          '<span class="strong">'+esc(leaveTypeLabel(r.type))+'</span>'+
          '<span class="tiny muted">'+fmtDate(r.start)+(r.end!==r.start?' – '+fmtDate(r.end):'')+'</span>'+
          '<span class="num">'+fmtDays(r.days)+'</span>'+
          '<span class="spacer" style="flex:1"></span>'+
          '<span class="tag '+STATUS_TAG_LEAVE[r.status]+'">'+r.status+'</span>'+
          (r.status==="pending"?'<button class="btn ghost sm" onclick="event.stopPropagation();cancelLeaveRequest(\''+r.requestId+'\')">Cancel</button>':"")+
        '</div>'+
        (r.reason?'<p class="tiny muted" style="margin-top:6px">"'+esc(r.reason)+'"</p>':"")+
        (r.status==="rejected" && r.rejectionReason?'<p class="tiny" style="margin-top:4px;color:var(--red)">"'+esc(r.rejectionReason)+'"</p>':"")+
      '</div>';
    }).join("") : '<div class="empty">No leave requests yet.</div>';
    h += '</div>';

    h += leavePolicyCardHTML();
    return h;
  }
};

function leavePolicyCardHTML(){
  if(!CAN.manageLeavePolicy()) return "";
  const displayTypes = LEAVE_TYPES.filter(t => !isFoldedLeaveType(t));
  return '<div class="card"><div class="card-head"><h2>Leave policy</h2><span class="spacer"></span>'+
    '<span class="eyebrow">partner only</span>'+
    ' <button class="btn ghost sm" onclick="addLeaveType()">Add leave type</button></div>'+
    (displayTypes.length
      ? '<table><thead><tr><th>Type</th><th class="r">Annual days</th><th>Paid</th><th class="r">Active</th><th></th></tr></thead><tbody>'+
        displayTypes.map(t=>'<tr><td>'+esc(t.label)+' <span class="code">'+t.code+'</span></td>'+
          '<td class="r num">'+fmtDays(t.annualDays)+'</td>'+
          '<td>'+(t.paid?'<span class="tag ok">paid</span>':'<span class="tag">unpaid</span>')+'</td>'+
          '<td class="r">'+(t.active?'<span class="tag ok">active</span>':'<span class="tag">inactive</span>')+'</td>'+
          '<td class="r"><button class="btn ghost sm" onclick="editLeaveType(\''+t.id+'\')">Edit</button></td></tr>').join("")+
        '</tbody></table>'
      : '<div class="empty">No leave types yet.</div>')+
    '<p class="tiny muted" style="margin-top:10px">Changing annual days here updates the default for anyone without '+
    'an individual override. It never changes already-decided leave.</p></div>';
}

/* -------------------------  APPROVALS  --------------------------- */
/* Pending is the action queue; Accepted/Rejected are that same queue's
   history — every decision made here, kept and readable after a refresh,
   scoped to whoever was authorized to make it (see decidedGroupsFor(),
   decidedBudgets(), acceptedClaims()/rejectedClaims() above). */
VIEWS.approvals = {
  title:"Approvals",
  sub(){ const n=approvalCount(); return n?n+" item"+(n===1?"":"s")+" waiting on you":"Nothing waiting"; },
  render(){
    const counts = approvalCounts();
    let h = '<div class="tabbar">'+
      [["pending","Pending"],["accepted","Accepted"],["rejected","Rejected"]].map(([k,label])=>
        '<button class="tab" '+(approvalsTab===k?'aria-current="true"':'')+
        ' onclick="setApprovalsTab(\''+k+'\')">'+label+' <span class="count">('+counts[k]+')</span></button>'
      ).join("")+
      '</div>';
    h += approvalsTab==="pending" ? renderPendingApprovals()
       : renderApprovalHistory(approvalsTab==="accepted" ? "approved" : "rejected");
    return h;
  }
};

function renderPendingApprovals(){
    let h = "";
    const sheets = pendingSheets();

    h += '<div class="card"><div class="card-head"><h2>Timesheets</h2><span class="spacer"></span>'+
      '<span class="eyebrow">approve or query one job code at a time</span></div>';
    if(!sheets.length){
      h += '<div class="empty">No timesheets waiting. Switch to a person who reports to you, submit their week, then come back.</div>';
    } else {
      h += sheets.map(p=>{
        const booked=bookedFor(p.id);
        const gs=groupsFor(p.id);
        return '<div class="sheet"><div class="sheet-head">'+
          '<span class="strong">'+esc(p.name)+'</span><span class="code">'+p.label+'</span>'+
          '<span class="spacer" style="flex:1"></span>'+
          '<span class="num">'+hrs(booked)+'h</span>'+
          '<span class="tiny muted">booked</span>'+
          '</div><div class="sheet-body">'+
          gs.map(g=>{
            const cls = g.status==="approved"?"approved":g.status==="queried"?"queried":"pending";
            const done = g.status==="approved"||g.status==="queried";
            return '<div class="line '+cls+'"><div class="line-top">'+
              '<span class="code strong">'+esc(job(g.job).code)+'</span>'+
              '<span class="tiny muted">'+esc(job(g.job).title)+'</span>'+
              (job(g.job).overhead?'<span class="tag">non-chargeable</span>':"")+
              '<span class="num strong" style="margin-left:auto">'+hrs(g.hours)+'h</span>'+
              '<span class="line-acts">'+
                (done
                  ? '<span class="tag '+(g.status==="approved"?"ok":"bad")+'">'+g.status+'</span>'+
                    '<button class="btn ghost sm" onclick="undoLine(\''+p.id+'\',\''+g.job+'\')">Undo</button>'
                  : '<button class="btn sm" onclick="decideLine(\''+p.id+'\',\''+g.job+'\',true)">Approve</button>'+
                    '<button class="btn ghost sm" onclick="queryLine(\''+p.id+'\',\''+g.job+'\')">Query</button>')+
              '</span></div>'+
              '<div class="line-days">'+g.rows.map(r=>
                '<div class="line-day"><span class="d">'+weekdayDate(dateOf(r))+'</span>'+
                '<span class="h">'+hrs(r.hours)+'h</span>'+taskTag(r)+'<span>'+esc(r.note)+'</span></div>').join("")+
              '</div>'+
              (g.query?'<p class="tiny" style="margin-top:7px;color:var(--red)">"'+esc(g.query)+'"</p>':"")+
              (!job(g.job).overhead ? budgetHint(g.job) : "")+
            '</div>';
          }).join("")+
          '</div></div>';
      }).join("");
    }
    h += '</div>';

    /* budget increases */
    const bq = pendingBudgets();
    h += '<div class="card"><div class="card-head"><h2>Budget increases</h2></div>';
    h += bq.length ? bq.map(b=>
      '<div class="line pending"><div class="line-top">'+
      '<span class="code strong">'+esc(job(b.job).code)+'</span>'+
      '<span class="num">+'+hrs(b.to-b.from)+'h additional</span>'+
      '<span class="tiny muted">'+hrs(job(b.job).budget)+'h budgeted stays unchanged</span>'+
      '<span class="tiny muted">'+esc(person(b.by).name)+', '+fmtDate(b.on)+'</span>'+
      '<span class="line-acts">'+
        '<button class="btn sm" onclick="decideBudget(\''+b.id+'\',true)">Approve</button>'+
        '<button class="btn ghost sm" onclick="decideBudget(\''+b.id+'\',false)">Reject</button></span></div>'+
      '<p class="tiny" style="margin-top:7px;max-width:64ch">"'+esc(b.reason)+'"</p>'+
      budgetHint(b.job)+'</div>').join("")
      : '<div class="empty">'+(rank()>=70?"None waiting.":"Only managers and partners decide these.")+'</div>';
    h += '</div>';

    /* expense claims */
    const cq = pendingClaims();
    h += '<div class="card"><div class="card-head"><h2>Expense claims</h2></div>';
    h += cq.length ? cq.map(c=>{
      const tot=sum(c.lines.map(l=>l.amount)), rec=sum(c.lines.filter(l=>l.rec).map(l=>l.amount));
      const payable = c.status==="approved" && CAN.payClaim(c);
      return '<div class="line pending"><div class="line-top">'+
        '<span class="strong">'+esc(person(c.who).name)+'</span>'+
        '<span class="tiny muted">'+c.month+'</span>'+
        '<span class="num strong" style="margin-left:auto">'+money(tot)+'</span>'+
        '<span class="line-acts">'+
          (payable
            ? '<button class="btn sm" onclick="payClaim(\''+c.id+'\')">Mark paid</button>'
            : '<button class="btn sm" onclick="decideClaim(\''+c.id+'\',true)">Approve</button>'+
              '<button class="btn ghost sm" onclick="decideClaim(\''+c.id+'\',false)">Reject</button>')+
        '</span></div><div class="line-days">'+
        c.lines.map(l=>'<div class="line-day"><span class="d">'+fmtShort(l.date)+'</span>'+
          '<span class="h">'+money(l.amount)+'</span><span>'+esc(l.desc)+' — <span class="code">'+
          esc(job(l.job).code)+'</span>'+(l.rec?' <span class="tag ok">client</span>':' <span class="tag">firm</span>')+
          '</span></div>').join("")+'</div>'+
        '<p class="tiny muted" style="margin-top:6px">'+money(rec)+' recoverable from clients.</p></div>';
    }).join("") : '<div class="empty">'+
      (CAN.payClaim()?"Nothing approved and awaiting payment.":rank()>=70?"None waiting.":"Only managers and partners approve claims.")+'</div>';
    h += '</div>';

    /* leave requests */
    const lq = pendingLeaveRequests();
    h += '<div class="card"><div class="card-head"><h2>Leave requests</h2></div>';
    h += lq.length ? lq.map(r=>
      '<div class="line pending"><div class="line-top">'+
        '<span class="strong">'+esc(r.person.name)+'</span>'+
        '<span class="code">'+esc(leaveTypeLabel(r.type))+'</span>'+
        '<span class="tiny muted">'+fmtDate(r.start)+(r.end!==r.start?' – '+fmtDate(r.end):'')+'</span>'+
        '<span class="num">'+fmtDays(r.days)+'</span>'+
        '<span class="line-acts">'+
          '<button class="btn sm" onclick="decideLeaveRequest(\''+r.requestId+'\',\''+r.who+'\',true)">Approve</button>'+
          '<button class="btn ghost sm" onclick="rejectLeavePrompt(\''+r.requestId+'\',\''+r.who+'\')">Reject</button>'+
        '</span></div>'+
        (r.reason?'<p class="tiny" style="margin-top:7px;max-width:64ch">"'+esc(r.reason)+'"</p>':"")+
      '</div>').join("")
      : '<div class="empty">No leave requests waiting.</div>';
    h += '</div>';

    return h;
}

function budgetHint(jid){
  const total=jobBudgetTotal(jid); if(!total) return "";
  const used=jobHours(jid), pct=used/total*100;
  if(pct<90) return "";
  return '<p class="tiny" style="margin-top:6px;color:'+(pct>100?"var(--red)":"var(--ochre)")+'">'+
    'This job is at '+Math.round(pct)+'% of its '+esc(budgetBreakdown(jid))+
    (jobExtraHours(jid)?'':' budget')+
    (pct>100?' — approving adds to an overrun.':'.')+'</p>';
}

/* -------------------  APPROVALS: ACCEPTED / REJECTED HISTORY  ------------------- */
function renderApprovalHistory(status){          // status: "approved" | "rejected"
  const accepted = status==="approved";
  const word = accepted ? "accepted" : "rejected";
  let h = "";

  /* timesheets */
  const groups = decidedGroupsFor(accepted ? "approved" : "queried");
  h += '<div class="card"><div class="card-head"><h2>Timesheets</h2><span class="spacer"></span>'+
    '<span class="eyebrow">'+word+'</span></div>';
  h += groups.length ? groups.map(g=>
      '<div class="line '+(accepted?"approved":"queried")+'" style="cursor:pointer" '+
      'onclick="showTimesheetDecisionDetail(\''+g.person.id+'\',\''+g.job+'\',\''+g.week+'\')">'+
      '<div class="line-top">'+
        '<span class="strong">'+esc(g.person.name)+'</span>'+
        '<span class="code strong">'+esc(job(g.job).code)+'</span>'+
        '<span class="tiny muted">wk of '+fmtDate(g.week)+'</span>'+
        '<span class="num strong" style="margin-left:auto">'+hrs(g.hours)+'h</span>'+
        '<span class="tag '+(accepted?"ok":"bad")+'">'+(accepted?"accepted":"rejected")+'</span>'+
      '</div>'+
      (g.decidedBy?'<p class="tiny muted" style="margin-top:6px">'+(accepted?"Approved":"Rejected")+' by '+
        esc(person(g.decidedBy).name)+(g.decidedAt?", "+fmtDateTime(g.decidedAt):"")+'</p>':"")+
      (!accepted && g.query?'<p class="tiny" style="margin-top:4px;color:var(--red)">"'+esc(g.query)+'"</p>':"")+
      '</div>'
    ).join("")
    : '<div class="empty">No '+word+' timesheets yet.</div>';
  h += '</div>';

  /* budget increases */
  const budgets = decidedBudgets(accepted ? "approved" : "rejected");
  h += '<div class="card"><div class="card-head"><h2>Budget increases</h2></div>';
  h += rank()<70 ? '<div class="empty">Only managers and partners can view this history.</div>'
    : budgets.length ? budgets.map(b=>
      '<div class="line '+(accepted?"approved":"queried")+'" style="cursor:pointer" onclick="showBudgetDetail(\''+b.id+'\')">'+
      '<div class="line-top">'+
        '<span class="code strong">'+esc(job(b.job).code)+'</span>'+
        '<span class="num">+'+hrs(b.to-b.from)+'h additional</span>'+
        '<span class="tiny muted">'+esc(person(b.by).name)+', requested '+fmtDate(b.on)+'</span>'+
        '<span class="spacer" style="flex:1"></span>'+
        '<span class="tag '+(accepted?"ok":"bad")+'">'+(accepted?"accepted":"rejected")+'</span>'+
      '</div>'+
      (b.decidedBy?'<p class="tiny muted" style="margin-top:6px">'+(accepted?"Approved":"Rejected")+' by '+
        esc(person(b.decidedBy).name)+(b.decidedAt?", "+fmtDateTime(b.decidedAt):"")+'</p>':"")+
      '</div>'
    ).join("") : '<div class="empty">No '+word+' budget requests yet.</div>';
  h += '</div>';

  /* expense claims */
  const claims = accepted ? acceptedClaims() : rejectedClaims();
  h += '<div class="card"><div class="card-head"><h2>Expense claims</h2></div>';
  h += (rank()<70 && !(accepted && CAN.payClaim())) ? '<div class="empty">Only managers and partners can view this history.</div>'
    : claims.length ? claims.map(c=>{
      const tot=sum(c.lines.map(l=>l.amount));
      const label = c.status==="paid" ? "paid" : accepted ? "accepted" : "rejected";
      return '<div class="line '+(c.status==="rejected"?"queried":"approved")+'" style="cursor:pointer" onclick="showClaimDetail(\''+c.id+'\')">'+
        '<div class="line-top">'+
          '<span class="strong">'+esc(person(c.who).name)+'</span>'+
          '<span class="tiny muted">'+monthLabel(c.month)+'</span>'+
          '<span class="num strong" style="margin-left:auto">'+money(tot)+'</span>'+

/* Shared by the monthly history table and the partner Excel report, so the
   two always agree on what counts as "present"/"absent" for a given day. */
function attendanceDayStatus(who, d, inP, outP){
  const st = attendanceDayStatusOf(who, d, inP, outP);
  logAttendanceDate(d, st.label);
  return st;
}
function attendanceDayStatusOf(who, d, inP, outP){
  const hol = holidayOn(d);
  const lv = leaveOn(who, d);
  if(hol){
    if(holidayWorkedOn(who,d)) return { label:"Holiday Worked", tag:"ok" };
    return { label:isSaturdayHoliday(d)?"Saturday Holiday":"Holiday — "+hol.name, tag:"info" };
  }
  if(isSunday(d)) return { label:"Holiday", tag:"info" };
  if(lv) return { label:esc(leaveTypeLabel(lv.type))+(lv.part!=="full"?" (half day)":""), tag:"info" };
  if(inP && outP){
    const flagged = inP.flagged || outP.flagged || inP.ok===false || outP.ok===false;
    return { label: flagged?"Present — flagged":"Present", tag: flagged?"warn":"ok" };
  }
  if(inP && !outP) return d===TODAY ? { label:"Punched in — not out yet", tag:"warn" }
                                     : { label:"Missing punch-out", tag:"bad" };
  if(d>TODAY) return { label:"—", tag:"" };
  if(d===TODAY) return { label:"Not marked yet", tag:"" };
  return { label:"Absent", tag:"bad" };
}
function teamTodayRows(){
  return staff().filter(p=>p.id!==me).map(p=>{
    const mine = ALL_PUNCHES_TODAY.filter(x=>x.who===p.id).slice().sort((a,b)=>a.ts<b.ts?-1:a.ts>b.ts?1:0);
    const inP = mine.find(x=>x.type==="in");

  });
}

let workFilterAssignedBy = "all";
let workFilterAssignedTo = "all";
/* Due date filter: all | today | tomorrow | week | overdue | custom.
   "custom" uses workFilterDueFrom..workFilterDueTo (either end may be blank). */
let workFilterDue = "all";
let workFilterDueFrom = "";
let workFilterDueTo = "";

function setWorkFilter(field, val){
  if(field==="by") workFilterAssignedBy = val;
  if(field==="to") workFilterAssignedTo = val;
  if(field==="due"){
    workFilterDue = val;
    if(val==="custom" && !workFilterDueFrom && !workFilterDueTo){ workFilterDueFrom = TODAY; workFilterDueTo = TODAY; }
  }
  if(field==="dueFrom") workFilterDueFrom = validISODate(val) ? val : "";
  if(field==="dueTo")   workFilterDueTo   = validISODate(val) ? val : "";
  render();
}
function resetWorkFilters(){
  workFilterAssignedBy = "all"; workFilterAssignedTo = "all";
  workFilterDue = "all"; workFilterDueFrom = ""; workFilterDueTo = "";
  render();
}

/* Does a task's due date match the Due date filter? Dates are the app's local
   calendar dates (TODAY), compared as YYYY-MM-DD strings. "This week" is
   Monday–Sunday of the current week, the same week the timesheet uses.
   "Overdue" means due before today and not yet done. */
function matchesDueFilter(t){
  const due = t.due;
  switch(workFilterDue){
    case "today":    return due === TODAY;
    case "tomorrow": return due === addDays(TODAY, 1);
    case "week":     { const mon = mondayOfISO(TODAY); return !!due && due >= mon && due <= addDays(mon, 6); }
    case "overdue":  return !!due && due < TODAY && t.status !== "completed";
    case "custom": {
      let from = workFilterDueFrom, to = workFilterDueTo;
      if(from && to && from > to) [from, to] = [to, from];
      return !!due && (!from || due >= from) && (!to || due <= to);
    }
    default: return true;
  }
}

function getTaskCostForMonth(task, ym){
  if(!task) return 0;
  const targetYm = ym || TODAY.slice(0,7);
  const history = task.costHistory || [];
  if(!history.length) return +task.monthlyCost || 0;
  const sorted = [...history].sort((a,b)=> (a.effectiveMonth||"").localeCompare(b.effectiveMonth||""));
  let cost = 0;
  for(const entry of sorted){
    if(entry.effectiveMonth <= targetYm){
      cost = +entry.monthlyCost || 0;
    }
  }
  return cost;
}

function getTaskCurrentResponsibility(task){
  if(!task || !task.responsibilityHistory || !task.responsibilityHistory.length) return null;
  return task.responsibilityHistory.find(r=>!r.toDate) || task.responsibilityHistory[task.responsibilityHistory.length-1];
}

            '<option value="all"'+(workFilterAssignedTo==="all"?" selected":"")+'>All</option>'+
            assigneeOptions+
          '</select></label>'+
        '<label class="field" style="margin:0;min-width:150px"><span class="tiny muted">Due date</span>'+
          '<select id="workFilterDue" onchange="setWorkFilter(\'due\',this.value)">'+
            [["all","All"],["today","Today"],["tomorrow","Tomorrow"],["week","This week"],["overdue","Overdue"],["custom","Custom date / range"]]
              .map(([v,l])=>'<option value="'+v+'"'+(workFilterDue===v?" selected":"")+'>'+l+'</option>').join("")+
          '</select></label>'+
        (workFilterDue==="custom" ?
          '<label class="field" style="margin:0;min-width:140px"><span class="tiny muted">Due from</span>'+
            '<input type="date" id="workFilterDueFrom" value="'+esc(workFilterDueFrom)+'" onchange="setWorkFilter(\'dueFrom\',this.value)"></label>'+
          '<label class="field" style="margin:0;min-width:140px"><span class="tiny muted">Due to</span>'+
            '<input type="date" id="workFilterDueTo" value="'+esc(workFilterDueTo)+'" onchange="setWorkFilter(\'dueTo\',this.value)"></label>' : '')+
        ((workFilterAssignedBy!=="all" || workFilterAssignedTo!=="all" || workFilterDue!=="all") ?
          '<button class="btn ghost sm" style="margin-bottom:2px" onclick="resetWorkFilters()">Reset filters</button>' : '')+
      '</div>'+
      '<p class="tiny muted" style="margin-top:10px">Filter tasks by assigner, assignee or due date — the filters combine. '+
      'For a single day, set the same from and to date. Task responsibility history and recurring monthly costs are tracked per engagement.</p></div>';

    const byJob = {};
    TASKS.forEach(t=>{
      const matchesTo = (workFilterAssignedTo === "all" || t.who === workFilterAssignedTo);
      const partnerAssignments = PARTNER_TASK_ASSIGNMENTS.filter(a=>a.taskId===t.id);
      const matchesBy = workFilterAssignedBy === "all"
        ? partnerAssignments.length > 0
        : partnerAssignments.some(a=>a.partnerId===workFilterAssignedBy);

      if (matchesTo && matchesBy && matchesDueFilter(t)) {
        (byJob[t.job] = byJob[t.job] || []).push(t);
      }
    });

    const isFiltered = (workFilterAssignedBy !== "all" || workFilterAssignedTo !== "all" || workFilterDue !== "all");
    let jids = JOBS.filter(j => !j.overhead && j.status !== "closed").map(j => j.id);
    // Closed jobs with tasks stay viewable, in their own section, for reference.
    let closedIds = JOBS.filter(j => j.status === "closed" && byJob[j.id] && byJob[j.id].length).map(j => j.id);

    if (isFiltered) {
      jids = jids.filter(jid => byJob[jid] && byJob[jid].length > 0);
    }

    if (!jids.length && !closedIds.length) {
      h += '<div class="card"><div class="empty">No work matching the selected filters.</div></div>';
      return h;
    }

    const workCard = jid => {
      const j = job(jid);
      const closed = j.status === "closed";
      const list = byJob[jid] || [];
      return '<div class="card"><div class="card-head"><h2>' + esc(j.title) + '</h2>' +
        '<span class="code">' + esc(j.code) + '</span><span class="spacer"></span>' +
        (closed
          ? '<span class="tag">Closed — no new assignments</span>'
          : (CAN.createJob() ? '<button class="btn ghost sm" onclick="newTask(\'' + jid + '\')">Add task</button> ' : '') + dueTag(j.due)) +
        '</div>' +
        (!list.length ? '<div class="empty">No tasks on this job yet.</div>' :
        '<table><thead><tr><th>Task</th><th style="width:140px">Assigned to</th><th style="width:130px">Assigned by</th>' +
        (isPartner ? '<th class="r" style="width:130px">Monthly Cost</th>' : '') +
        '<th style="width:160px">Status</th><th style="width:110px">Due</th><th class="r" style="width:60px">Est.</th><th class="r" style="width:70px"></th></tr></thead><tbody>' +
        list.map(t => {
          const curResp = getTaskCurrentResponsibility(t);
          const assignerName = t.assignedBy ? (person(t.assignedBy).name || "—") : (curResp && curResp.assignedBy ? person(curResp.assignedBy).name : "—");
          const curCost = getTaskCostForMonth(t, curMonth);

          return '<tr><td class="wrap">' + esc(t.title) + '</td>' +
            '<td>' + (CAN.reassignTask() && !closed
              ? '<select onchange="reassign(\'' + t.id + '\',this.value)">' + staff().map(p =>
                  '<option value="' + p.id + '"' + (p.id === t.who ? " selected" : "") + '>' + esc(p.name) + '</option>').join("") + '</select>'
              : esc(person(t.who).name)) + '</td>' +
            '<td class="tiny muted">' + esc(assignerName) + '</td>' +
            (isPartner ? '<td class="r num">' + (curCost ? money(curCost) + '<span class="tiny muted">/mo</span>' : '<span class="muted">—</span>') +
              ' <button class="btn ghost sm" style="padding:2px 5px;font-size:11px" onclick="editTaskCost(\'' + t.id + '\')" title="Edit recurring monthly cost">₹</button></td>' : '') +
            '<td>' + (CAN.editTaskStatus(t) && !closed
              ? '<select onchange="setTaskStatus(\'' + t.id + '\',this.value)">' +
                ["todo", "in_progress", "blocked_on_client", "submitted_for_review", "changes_requested", "completed"]
                .map(s => '<option value="' + s + '"' + (s === t.status ? " selected" : "") + '>' + STATUS_LABEL[s] + '</option>').join("") + '</select>'
              : '<span class="tag">' + STATUS_LABEL[t.status] + '</span>') + '</td>' +
            '<td>' + dueTag(t.due) + '</td><td class="r num">' + hrs(t.est) + 'h</td>' +
            '<td class="r"><button class="btn ghost sm" style="padding:2px 6px;font-size:11px" onclick="viewTaskHistory(\'' + t.id + '\')">History</button></td></tr>';
        }).join("") +
        '</tbody></table>') + '</div>';
    };

    h += jids.length ? jids.map(workCard).join("")
      : '<div class="card"><div class="empty">No active jobs matching the selected filters.</div></div>';
    if (closedIds.length) {
      h += '<div class="card-head" style="margin:22px 0 10px"><h2>Job closed</h2><span class="spacer"></span>' +
        '<span class="eyebrow">tasks kept for reference · reopen the job to assign again</span></div>' +
        closedIds.map(workCard).join("");
    }

    return h;
  }
};

function go(v){ closeMobileMenu(true); if(v==="salary"&&!CAN.viewSalary())return; jobsFilter="all"; view=v; window.scrollTo(0,0); if(v==="salary")loadSalaryMonth(); else render(); }

/* --- time entry --- */
async function quickAdd(){
  const jid=$("#qJob").value, date=$("#qDate").value, h=+$("#qHrs").value, note=$("#qNote").value.trim();
  const taskId=($("#qTask")&&$("#qTask").value)||null;
  if(!validISODate(date)) return toast("Choose a valid date");
  if(taskId && !TASKS.some(t=>t.id===taskId && t.job===jid)) return toast("That task does not belong to the selected job code");
  const week=mondayOfISO(date), day=weekdayIndex(date);
  if(!h||h<=0) return toast("Enter the hours");
  if(!note) return toast("Say what you did — the approver reads this");
  const openDay = firstOpenDay(me,week);
  if(day<6 && openDay!==null && day>openDay && !isSaturdayHoliday(date))
    return toast("Log "+DAY_NAMES[openDay]+" first — working days must be filled in order");
  if(!CAN.exceedJobBudget() && h > jobRemainingHours(jid)) return budgetBlocked(jid, h);
  const { data, error } = await supabase.from("timesheet_entries").insert({
    organization_id:ORG_ID, profile_id:me, job_id:jid, task_id:taskId, week_start_date:week,
    entry_date:date, day_index:day, hours:h, narration:note, status:"draft"
  }).select().single();
  // trg_timesheet_job_budget_limit re-checks in the database (someone else
  // may have booked the job since this screen loaded).
  if(error && /request additional hours/i.test(error.message||"")) return budgetBlocked(jid, h, error.message);
  if(error) return toast("Could not save — "+error.message);
  TIMESHEET_WEEK=week;
  TIMESHEET_DATE=date;
  if(date<=TODAY && holidayOn(date) && !holidayWorkedOn(me,date)) HOLIDAY_WORKED.push({who:me,date});
  ENTRIES.push({ id:data.id, who:me, week, date, job:jid, taskId, day, hours:h, note, status:"draft", query:"" });
  toast(hrs(h)+"h added to "+job(jid).code);
  render();
}
function setTimesheetDate(date){
  if(!validISODate(date)) return;
  TIMESHEET_DATE=date;
  TIMESHEET_WEEK=mondayOfISO(date);
  render();
}
function logTo(jid){
  go("mytime");
  setTimeout(()=>{ const s=$("#qJob"); if(s){ s.value=jid; refreshTaskOptions(); $("#qHrs").focus(); } },40);
}
async function dropEntry(id){
  if(id){
    const { error } = await supabase.from("timesheet_entries").delete().eq("id", id);
    if(error) return toast("Could not remove — "+error.message);
  }
  ENTRIES = ENTRIES.filter(x=>x.id!==id); render();
}

async function submitSheet(){
  const rows=entriesFor(me,TIMESHEET_WEEK);
  // No weekly hours target: a week with nothing booked is recorded as a nil timesheet.
  if(!rows.length){
    if(!NIL_FILED.some(n=>n.who===me && n.week===TIMESHEET_WEEK)){
      const { error } = await supabase.from("nil_timesheets")
        .insert({ organization_id:ORG_ID, profile_id:me, week_start_date:TIMESHEET_WEEK });
      if(error) return toast("Could not record — "+error.message);
      NIL_FILED.push({who:me,week:TIMESHEET_WEEK});
    }
    toast("Nil timesheet recorded — nothing booked this week");
    return render();
  }
  const missing = rows.filter(r=>!r.note.trim());
  if(missing.length) return toast(missing.length+" entr"+(missing.length===1?"y needs":"ies need")+" a narration");

  const toSubmit = rows.filter(r=>r.status==="draft"||r.status==="queried");
  const nextStatus = CAN.selfCertify() ? "approved" : "pending";
  const { error } = await supabase.from("timesheet_entries")
    .update({ status:nextStatus, query_reason:"" }).in("id", toSubmit.map(r=>r.id));
  if(error) return toast("Could not submit — "+error.message);
  toSubmit.forEach(r=>{ r.status = nextStatus; r.query=""; });
  if(nextStatus==="approved") await reloadLinkedTasks(toSubmit);
  toast(CAN.selfCertify() ? "Certified and recorded"
       : "Sent to "+person(person(me).reportsTo).name);
  render();
}

/* Approving an entry that names a task marks that task Done in the database
   (trg_timesheet_task_approved, same transaction as the approval). Re-read
   just those tasks so the Work screen shows what was actually committed. */
async function reloadLinkedTasks(rows){
  const ids=[...new Set(rows.map(r=>r.taskId).filter(Boolean))];
  if(!ids.length) return;
  const { data, error } = await supabase.from("tasks").select("id,status").in("id", ids);
  if(error) return console.error("[DATA] Could not refresh linked tasks",error);
  data.forEach(d=>{ const t=TASKS.find(x=>x.id===d.id); if(t) t.status=d.status; });
}

/* per job code, not per week */
async function decideLine(who, jid, ok, note){
  const rows = ENTRIES.filter(x=>x.who===who && x.week===WEEK && x.job===jid && x.status==="pending");
  const nextStatus = ok?"approved":"queried", nextQuery = ok?"":(note||"");
  const decidedAt = new Date().toISOString();
  const { error } = await supabase.from("timesheet_entries")
    .update({ status:nextStatus, query_reason:nextQuery, decided_by:me, decided_at:decidedAt }).in("id", rows.map(r=>r.id));
  if(error) return toast("Could not save — "+error.message);
  rows.forEach(x=>{ x.status = nextStatus; x.query = nextQuery; x.decidedBy = me; x.decidedAt = decidedAt; });
  if(ok) await reloadLinkedTasks(rows);
  toast((ok?"Approved ":"Queried ")+job(jid).code+" — "+person(who).name.split(" ")[0]);
  render();
}

  modal('<h3>Query '+esc(job(jid).code)+'</h3>'+

async function submitBudget(jid){
  if(!CAN.requestBudget()) return toast("Partners can book beyond the budget — no request needed");
  const raw=$("#mbHours").value.trim(), add=+raw, r=$("#mbReason").value.trim();
  if(!raw) return toast("Enter the additional hours requested");
  if(!(add>0)) return toast("Additional hours must be more than 0");
  if(r.length<10) return toast("Give a reason of at least 10 characters");
  if(BUDGET_REQUESTS.some(b=>b.job===jid && b.status==="pending")) return toast("A request for this job is already waiting for a decision");
  // from/to record the hours available before and after this request; the
  // additional hours are (to − from). jobs.budget_hours itself is not touched.
  const from=jobBudgetTotal(jid), to=+(from+add).toFixed(2);
  const { data, error } = await supabase.from("budget_requests").insert({
    organization_id:ORG_ID, job_id:jid, from_hours:from, to_hours:to, requested_by:me,
    requested_date:TODAY, reason:r, status:"pending"
  }).select().single();
  if(error) return toast("Could not send the request — "+error.message);
  BUDGET_REQUESTS.push({ id:data.id, job:jid, from, to, reason:r, by:me, on:TODAY, status:"pending" });
  closeModal(); toast("Sent for approval"); render();
}
async function decideBudget(id,ok){
  const b=BUDGET_REQUESTS.find(x=>x.id===id);
  if(!CAN.approveBudget(b)) return toast("You cannot decide this one");
  const status = ok?"approved":"rejected";
  const decidedAt = new Date().toISOString();
  const { error } = await supabase.from("budget_requests")
    .update({ status, decided_by:me, decided_at:decidedAt }).eq("id", id);
  if(error) return toast("Could not save — "+error.message);
  // Budgeted Hours on the job is left exactly as it was; the approved
  // additional hours live on this request and are added on top.
  if(ok) JOB_EXTRA_HOURS[b.job] = jobExtraHours(b.job) + (b.to - b.from);
  b.status=status; b.decidedBy=me; b.decidedAt=decidedAt;
  toast(ok ? "Approved +"+hrs(b.to-b.from)+"h — "+budgetBreakdown(b.job) : "Request rejected"); render();
}

async function reassign(id,who){
  const t = TASKS.find(x=>x.id===id);
  if(!t) return;
  if(t.who === who) return;
  if(!CAN.reassignTask()){ toast("Assistant Manager and above can assign work"); return render(); }
  if(jobClosed(t.job)){ toast(job(t.job).code+" is closed — reopen it before reassigning tasks"); return render(); }

  const nowTs = new Date().toISOString();
  const hist = (t.responsibilityHistory ? [...t.responsibilityHistory] : []);
  hist.forEach(r => {
    if(!r.toDate){
      r.toDate = TODAY;
    }
  });
  hist.push({
    id: "rh_"+Date.now()+"_"+Math.random().toString(36).slice(2,7),
    assignedTo: who,
    assignedBy: me,
    fromDate: TODAY,
    toDate: null,
    createdAt: nowTs
  });

  const updatePayload = {
    assigned_to: who,
    assigned_by: me,
    responsibility_history: hist
  };

  let { error } = await supabase.from("tasks").update(updatePayload).eq("id", id);
  if(error && (error.message.includes("responsibility_history") || error.message.includes("assigned_by"))){
    delete updatePayload.responsibility_history;
    delete updatePayload.assigned_by;
    const retry = await supabase.from("tasks").update(updatePayload).eq("id", id);
    error = retry.error;
  }
  if(error) return toast("Could not reassign — "+error.message);

  t.who = who;
  t.assignedBy = me;
  t.responsibilityHistory = hist;
  toast("Reassigned to "+person(who).name+" (responsibility history updated)");
  render();
}

async function saveTaskCost(id){

  if(!isPartner) return toast("Only partners can view and edit task costs");
  const t = TASKS.find(x=>x.id===id);

  const cost = Math.max(0, +$("#etcCost").value||0);
  const effMonth = $("#etcMonth").value || TODAY.slice(0,7);
  if(!effMonth) return toast("Select an effective month");

  const history = t.costHistory ? [...t.costHistory] : [];
  const existingIdx = history.findIndex(h=>h.effectiveMonth === effMonth);
  const newEntry = {
    effectiveMonth: effMonth,
    monthlyCost: cost,
    updatedBy: me,
    updatedAt: new Date().toISOString()
  };

  if(existingIdx >= 0){
    history[existingIdx] = newEntry;
  } else {
    history.push(newEntry);
  }
  history.sort((a,b)=> (a.effectiveMonth||"").localeCompare(b.effectiveMonth||""));

  const updatePayload = {
    monthly_cost: cost,
    cost_history: history
  };

  let { error } = await supabase.from("tasks").update(updatePayload).eq("id", id);
  if(error && (error.message.includes("monthly_cost") || error.message.includes("cost_history"))){
    delete updatePayload.monthly_cost;
    delete updatePayload.cost_history;
    const retry = await supabase.from("tasks").update(updatePayload).eq("id", id);
    error = retry.error;
  }
  if(error) return toast("Could not update cost — "+error.message);

  t.monthlyCost = cost;
  t.costHistory = history;
  closeModal();
  toast("Task cost updated effective "+effMonth);
  render();
}

   been applied yet to this database (request_id/rejection_reason missing) —

   without the column that doesn't exist yet, rather than breaking the
   action outright. */
async function insertLeaveRows(rows){
  let { data, error } = await supabase.from("leaves").insert(rows).select();
  if(error && /request_id/.test(error.message||"")){
    console.warn("[leave] request_id column not found — run supabase/migrations/007_leave_management.sql. Submitting without request grouping.");
    ({ data, error } = await supabase.from("leaves").insert(rows.map(({request_id, ...r})=>r)).select());
  }
  return { data, error };
}
async function updateLeaveRows(ids, patch){
  let { error } = await supabase.from("leaves").update(patch).in("id", ids);
  if(error && /rejection_reason/.test(error.message||"")){
    console.warn("[leave] rejection_reason column not found — run supabase/migrations/007_leave_management.sql.");
    const rest = Object.assign({}, patch); delete rest.rejection_reason;
    ({ error } = await supabase.from("leaves").update(rest).in("id", ids));
  }
  return { error };
}

  const nowIso = new Date().toISOString();
  const rows = dates.map(d=>Object.assign({
    organization_id:ORG_ID, profile_id:me, leave_date:d,
    duration_part: half?"half":"full", leave_type:typeCode, status:status, reason:reason, request_id:requestId
  }, selfCert ? { approved_by:me, approved_at:nowIso } : {}));

  const { data, error } = await insertLeaveRows(rows);
  if(error){
    if(/duplicate key|unique/i.test(error.message||"")) return toast("You already have a leave request covering one of these dates");
    return toast("Could not submit — "+error.message);

  data.forEach(l=>LEAVE.push(mapLeaveRow(l)));
  closeModal();
  toast(selfCert ? "Leave recorded and certified — there is nobody above you"
       : (person(me).reportsTo ? "Sent to "+person(person(me).reportsTo).name : "Submitted for approval"));
  render();
}

  const { error } = await updateLeaveRows(rows.map(r=>r.id),
    { status:status, approved_by:me, approved_at:approvedAt, rejection_reason: ok?null:(note||"") });

  rows.forEach(r=>{ r.status=status; r.approvedBy=me; r.approvedAt=approvedAt; r.rejectionReason= ok?"":(note||""); });

/* --- attendance / geofencing -----------------------------------------------
   Argument order is always latitude, longitude, latitude, longitude.
   Coordinates and the configured radius are measured in degrees and metres. */
function calculateDistanceMeters(lat1, lon1, lat2, lon2){
  const R=6371000;
  const toRadians=degrees=>degrees*Math.PI/180;
  const dLat=toRadians(lat2-lat1);
  const dLon=toRadians(lon2-lon1);
  const a=Math.sin(dLat/2)**2+
    Math.cos(toRadians(lat1))*Math.cos(toRadians(lat2))*Math.sin(dLon/2)**2;
  const c=2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
  return R*c;
}

/* A device/network location reading of 50-300m+ error is routine indoors or
   on a device with no GPS chip — enableHighAccuracy only asks for the best
   *available* source, it does not guarantee a GPS-grade fix. Comparing
   distance<=radius with zero tolerance for that error is what turns a
   correct "you are inside" position into a false "outside fence". This caps
   how much benefit of the doubt a poor reading can buy, so bad accuracy
   can't quietly swallow the geofence entirely (see req. #20) — it is not
   the same as enlarging the configured radius, which stays exactly as set. */
const ACCURACY_TOLERANCE_CAP_M = 50;

function geofenceCheck(latitude, longitude, accuracy, site){
  const tolerance = Number.isFinite(accuracy) ? Math.min(Math.max(accuracy,0), ACCURACY_TOLERANCE_CAP_M) : 0;
  if(!site || !site.active || !PUNCH_SITES.some(s=>s.id===site.id))
    return {state:"no_site",match:null,nearest:null,tolerance};
  const office={latitude:site.lat,longitude:site.lng};
  const hasValue=value=>value!==null&&value!==undefined&&String(value).trim()!=="";
  if(!hasValue(latitude)||!hasValue(longitude))
    return {state:"invalid_location",reason:"Device coordinates are missing.",match:null,nearest:null,tolerance};
  if(!hasValue(office.latitude)||!hasValue(office.longitude))
    return {state:"invalid_site",reason:"The selected office site is missing latitude or longitude.",match:{site,dist:null},nearest:{site,dist:null},tolerance};

  const userLat=Number(latitude);
  const userLon=Number(longitude);
  const officeLat=Number(office.latitude);
  const officeLon=Number(office.longitude);
  const radiusMeters=Number(site.radius);
    if(!Number.isFinite(userLat)||!Number.isFinite(userLon)||
      Math.abs(userLat)>90||Math.abs(userLon)>180)
     return {state:"invalid_location",reason:"The device returned invalid latitude or longitude coordinates.",match:null,nearest:null,tolerance};
    if(!Number.isFinite(officeLat)||!Number.isFinite(officeLon)||!Number.isFinite(radiusMeters)||
      Math.abs(officeLat)>90||Math.abs(officeLon)>180)
    return {state:"invalid_site",reason:"The selected office site has invalid coordinates or radius.",match:{site,dist:null},nearest:{site,dist:null},tolerance};
  if(officeLat===0||officeLon===0)
    return {state:"invalid_site",reason:"The selected office site has a zero latitude or longitude. Update its coordinates before punching.",match:{site,dist:null},nearest:{site,dist:null},tolerance};
  if(radiusMeters<=0)
    return {state:"invalid_site",reason:"The selected office site has an invalid geofence radius.",match:{site,dist:null},nearest:{site,dist:null},tolerance};

  console.log("[GEOFENCE DEBUG]",{
    userLatitude:userLat,
    userLongitude:userLon,
    officeLatitude:officeLat,
    officeLongitude:officeLon,
  });
  const dist=calculateDistanceMeters(userLat,userLon,officeLat,officeLon);
  const inside=dist<=radiusMeters;
  console.log("[GEOFENCE DEBUG] Distance:",dist,"meters");
  console.log("[GEOFENCE DEBUG] Radius:",radiusMeters,"meters");
  console.log("[GEOFENCE DEBUG] Inside:",inside);

  const match={site,dist};
  if(inside) return {state:"inside",match,nearest:match,tolerance};
  if(dist<=radiusMeters+tolerance) return {state:"inside_uncertain",match,nearest:match,tolerance};
  return {state:"outside",match,nearest:match,tolerance};
}

function stampHTML(p){
  return '<div class="stamp '+(p.type==="out"?"out":"")+'">'+
    '<div class="l">Punched '+p.type+'</div><div class="t">'+p.time+'</div>'+
    '<div class="l">'+esc(p.place)+(p.dist!==null?" · "+Math.round(p.dist)+"m":"")+'</div></div>'+
    (p.resultMessage?'<p class="tiny" style="margin-top:10px">'+esc(p.resultMessage)+'</p>':"")+
    debugDetailsHTML(p);
}
/* Requirement: a visible, collapsed-by-default debug section showing exactly
   what was compared — not just the configured office coordinates, but the
   device coordinates actually returned and the resulting calculation.
   Collapsed by default so normal users see the plain-language result only. */
function debugDetailsHTML(p){
  if(!p.debug) return "";
  const d=p.debug;
  const site = d.site;
  return '<details class="tiny" style="margin-top:10px;font-family:var(--mono)">'+
    '<summary class="muted" style="cursor:pointer">Debug details</summary>'+
    '<pre style="white-space:pre-wrap;margin-top:6px">'+esc(
      "Your location\n"+
      "  Latitude: "+(d.lat??"—")+"\n"+
      "  Longitude: "+(d.lng??"—")+"\n"+
      "  Accuracy: "+(Number.isFinite(d.accuracy)?Math.round(d.accuracy)+" m":"unknown")+"\n\n"+
      (site
        ? "Office ("+site.label+")\n  Latitude: "+site.lat+"\n  Longitude: "+site.lng+"\n  Radius: "+site.radius+" m\n\n"
        : "Office\n  No active site with numeric coordinates was found.\n\n")+
      "Calculated distance: "+(d.dist!==null && d.dist!==undefined ? Math.round(d.dist)+" m" : "n/a")+"\n"+
      "Accuracy tolerance applied: "+d.tolerance+" m\n"+
      "Result: "+d.state.toUpperCase()
    )+'</pre></details>';
}
/* Today's-log Result column: don't collapse "no location obtained" and
   "genuinely outside" into the same "outside fence" tag (req. #12) — a
   permission/timeout/GPS error is not the same situation as a distance
   calculation that came out over the radius. */
function resultTag(p){
  if(p.dist===null) return '<span class="tag">location unknown</span>';
  if(p.ok && !p.flagged) return '<span class="tag ok">within fence</span>';
  if(p.ok && p.flagged) return '<span class="tag warn">within fence · low accuracy</span>';
  return '<span class="tag bad">outside fence</span>';
}

/* A rejected punch shows the same Debug details as a recorded one, so the
   coordinates the browser actually returned are visible — not just the verdict. */
function punchFailure(message, debug){
  toast(message);
  const btn=$("#punchBtn");
  if(btn){btn.disabled=false;btn.textContent="Punch "+(punches.length&&punches[punches.length-1].type==="in"?"Out":"In");}
  const result=$("#punchResult");
  if(result) result.innerHTML='<p class="tiny" style="color:var(--red)">'+esc(message)+'</p>'+debugDetailsHTML({debug});
}
function fmtDistance(m){
  return m>=1000 ? Math.round(m)+" m (≈"+(m/1000).toFixed(1)+" km)" : Math.round(m)+" m";
}
/* Above this, the fix is almost certainly network/IP-derived rather than
   GPS/Wi-Fi — the position can be in another city entirely. Only changes
   the message; the punch is still rejected by the same radius check. */
const LOW_ACCURACY_WARN_M = 1000;

async function recordPunch(type, siteId, lat, lng, accuracy){
  const site=PUNCH_SITES.find(s=>s.id===siteId && s.active);
  if(!site) return punchFailure("Select an active office site for your company.");
  let dist=null, ok=false, place=site.label, resultMessage="", locId=site.id, needsReview=true, debug=null;

  const haveFix = lat!==null && lng!==null && Number.isFinite(lat) && Number.isFinite(lng);
  if(!haveFix) return punchFailure("Your current GPS location could not be verified. Please enable location and try again.");
  const check=geofenceCheck(lat,lng,accuracy,site);
  dist=check.match?check.match.dist:null;
  debug={lat,lng,accuracy,dist,tolerance:check.tolerance,state:check.state,
    site:{label:site.label,lat:site.lat,lng:site.lng,radius:site.radius}};
  if(check.state==="invalid_location"||check.state==="invalid_site")
    return punchFailure(check.reason||"The selected office site has invalid location data. Contact an administrator.",debug);
  if(check.state!=="inside"){
    const distance=dist===null?"unknown":fmtDistance(dist);
    const coarse=Number.isFinite(accuracy)&&accuracy>LOW_ACCURACY_WARN_M;
    return punchFailure("You are outside the allowed location for "+site.label+". Current distance: "+
      distance+". Allowed radius: "+site.radius+" m. Your device reported "+
      Number(lat).toFixed(6)+", "+Number(lng).toFixed(6)+
      (Number.isFinite(accuracy)?" (±"+fmtDistance(accuracy)+")":"")+"."+
      (coarse?" That reading is very imprecise — it usually comes from your network/IP address, not GPS. "+
        "Turn on precise location / Wi-Fi, disable any VPN, or punch from your phone.":""),debug);
  }
  ok=true; needsReview=false;
  resultMessage="You are within "+site.label+" ("+Math.round(dist)+" m of "+site.radius+" m).";

  const now=new Date();
  const base = {
    organization_id:ORG_ID, profile_id:me, punch_type:type, punch_timestamp:now.toISOString(),
    punch_date:TODAY, location_id:locId, place_label:place, latitude:lat, longitude:lng,
    distance_meters:dist, is_within_geofence:ok, needs_review:needsReview
  };
  let { data, error } = await supabase.from("attendance_punches")
    .insert({ ...base, accuracy_meters:Number.isFinite(accuracy)?accuracy:null }).select().single();
  if(error && /accuracy_meters/.test(error.message||"")){
    // 006_punch_accuracy.sql (adds attendance_punches.accuracy_meters) has not
    // been applied to this database yet — degrade gracefully rather than
    // breaking Punch In/Out. Accuracy just won't be persisted until it's run.
    console.warn("[geofence] accuracy_meters column not found — run supabase/migrations/006_punch_accuracy.sql. Falling back without it.");
    ({ data, error } = await supabase.from("attendance_punches").insert(base).select().single());
  }
  if(error) return toast("Could not record the punch — "+error.message);
  const rec = { id:data.id, who:me, type, date:TODAY,
    time:String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0"),
    ts:data.punch_timestamp, place, dist, ok, flagged:needsReview, locationId:locId,
    accuracy:Number.isFinite(accuracy)?accuracy:null, resultMessage, debug };
  ALL_PUNCHES_TODAY.push(rec);
  refreshMyPunches();
  // Keep the monthly history table in sync if it's already showing this
  // month — it's a separate on-demand fetch (see loadMyMonthPunches()),
  // not part of ALL_PUNCHES_TODAY, so a fresh punch wouldn't otherwise
  // appear there until the month picker was touched again.
  if(MY_MONTH.month===TODAY.slice(0,7)) MY_MONTH.rows.push(rec);
  render();
  const r=$("#punchResult");
  if(r) r.innerHTML = stampHTML(rec) + (ok?"":
    '<p class="tiny muted" style="margin-top:6px">Recorded and flagged for review — nothing is ever rejected.</p>');
}

function doPunch(type){
  const site=PUNCH_SITES.find(s=>s.id===selectedPunchSiteId && s.active);
  if(!site) return punchFailure("Select an active office site for your company.");
  const btn=$("#punchBtn"); if(btn){btn.disabled=true;btn.textContent="Finding you…";}
  if(!navigator.geolocation)
    return punchFailure("This browser does not support location. Punch was not recorded.");
  navigator.geolocation.getCurrentPosition(
    p=>{
      console.log("[GEOFENCE DEBUG] Browser position",{
        latitude:p.coords.latitude, longitude:p.coords.longitude,
        accuracy:p.coords.accuracy, timestamp:new Date(p.timestamp).toISOString()
      });
      recordPunch(type,site.id,p.coords.latitude,p.coords.longitude,p.coords.accuracy);
    },
    err=>{
      // Different situations, different messages (req. #12) — a permission
      // refusal, a timeout and "no GPS" are not "outside the fence".
      const REASONS = {
        1:"Location permission denied — allow location access and try again",
        2:"Location unavailable — check GPS/network and try again",
        3:"Location request timed out — try again, ideally outdoors or near a window"
      };
      const reason = REASONS[err.code] || ("Location error — "+err.message);
      punchFailure(reason+". Punch was not recorded.");
    },
    /* enableHighAccuracy requests the best *available* source, it does not
       guarantee a GPS-grade fix (desktop browsers in particular usually have
       no GPS chip at all). timeout raised from 8s to 15s — indoor/first-fix
       GPS acquisition routinely takes longer than 8s and was very likely
       timing out here, which (before this fix) silently read as "outside".
       maximumAge:0 is made explicit — every punch already requested a fresh
       reading (this was the spec default, so req. #11's "stale location"
       concern did not apply, but it is now explicit rather than implied. */
    {enableHighAccuracy:true, timeout:15000, maximumAge:0});
}

let toastT;
function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.hidden=false;
  clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2800);
}

function currentFY(){
  const [y,m] = TODAY.split("-").map(Number);
  const startY = m>=4 ? y : y-1;                  // Indian FY starts 1 April
  return startY+"-"+String((startY+1)%100).padStart(2,"0");
}

function suggestCode(){
  const cl = CLIENTS.find(c=>c.id===$("#njClient").value);
  const sv = $("#njService").value;
  const pd = $("#njPeriod").value || currentFY();
  const code = (cl?cl.code:"CLIENT")+"/"+sv+"/"+pd;
  $("#njCode").value = code;
  const t = SERVICES.find(x=>x[0]===sv);
  if(!$("#njTitle").dataset.touched) $("#njTitle").value = (t?t[1]:"")+" "+pd;
}

async function saveJob(){
  if(!CAN.createJob()) return toast("Assistant Manager and above can raise a job code");
  const code=$("#njCode").value.trim(), title=$("#njTitle").value.trim();
  const budgetRaw=$("#njBudget").value.trim(), budget=+budgetRaw;
  const due=$("#njDue").value||TODAY, statDue=$("#njDueStat").value||null;
  const clientId=$("#njClient").value;
  const service=$("#njService").value, period=$("#njPeriod").value.trim()||null;
  if(!code) return toast("A job code is required");
  if(ALL_JOBS.some(j=>j.code.toUpperCase()===code.toUpperCase())) return toast("That job code already exists");
  if(!title) return toast("Give the job a title");
  if(!budgetRaw) return toast("Enter the budgeted hours");
  if(!(budget>0)) return toast("Budgeted hours must be more than 0");

  const { data, error } = await supabase.from("jobs").insert({
    organization_id:ORG_ID, client_id:clientId, job_code:code, title, status:"open",
    service_category:service, period_fy:period,
    budget_hours:budget, internal_due_date:due, statutory_due_date:statDue,
    is_overhead:false, opened_by:me, opened_on:TODAY, company_id:ACTIVE_COMPANY_ID
  }).select().single();
  if(error) return toast("Could not raise the job code — "+error.message);
  const jobRow = { id:data.id, code, title, client:clientId, status:"open",
    budget, due, statDue, overhead:false, openedBy:me, openedOn:TODAY, companyId:data.company_id };
  addScoped(ALL_JOBS, JOBS, jobRow, jobRow.companyId);

  const assignees = [...document.querySelectorAll(".njTeam")].filter(c=>c.checked).map(c=>c.value);
  if(assignees.length){
    const starterTasks = assignees.map(who=>({
      organization_id:ORG_ID, job_id:jobRow.id, title:"Set up the file and checklist",
      assigned_to:who, assigned_by:me, status:"todo", due_date:due, estimated_hours:1,
      responsibility_history:[{
        id: "rh_"+Date.now()+"_"+Math.random().toString(36).slice(2,7),
        assignedTo: who,
        assignedBy: me,
        fromDate: TODAY,
        toDate: null,
        createdAt: new Date().toISOString()
      }]
    }));
    let { data: taskRows, error: taskErr } = await supabase.from("tasks").insert(starterTasks).select();
    if(taskErr && (taskErr.message.includes("responsibility_history") || taskErr.message.includes("assigned_by"))){
      starterTasks.forEach(st => { delete st.responsibility_history; delete st.assigned_by; });
      const retry = await supabase.from("tasks").insert(starterTasks).select();
      taskRows = retry.data;
      taskErr = retry.error;
    }
    if(taskErr) toast("Job raised, but the starter tasks could not be created — "+taskErr.message);
    else if(taskRows) taskRows.forEach(t=>TASKS.push({
      id:t.id, job:jobRow.id, title:t.title, who:t.assigned_to, assignedBy:me,
      status:t.status, due:t.due_date, est:+t.estimated_hours||0, monthlyCost:0, costHistory:[],
      responsibilityHistory:[{ id:"rh_"+t.id, assignedTo:t.assigned_to, assignedBy:me, fromDate:TODAY, toDate:null, createdAt:new Date().toISOString() }]
    }));
  }
  closeModal(); toast("Raised "+code); go("jobs");
}

async function saveTask(jid){
  if(!CAN.createJob()) return toast("Assistant Manager and above can assign tasks");
  if(jobClosed(jid)) return toast(job(jid).code+" is closed — reopen it before assigning tasks");
  const t=$("#ntTitle").value.trim();
  if(!t) return toast("Say what needs doing");
  const who=$("#ntWho").value, due=$("#ntDue").value||TODAY, est=+$("#ntEst").value||1;
  const isPartner = person(me).role === "partner";
  const cost = isPartner && $("#ntCost") ? Math.max(0, +$("#ntCost").value||0) : 0;
  const effMonth = isPartner && $("#ntEffMonth") && $("#ntEffMonth").value ? $("#ntEffMonth").value : TODAY.slice(0,7);

  const initialRespHistory = [{
    id: "rh_"+Date.now()+"_"+Math.random().toString(36).slice(2,7),
    assignedTo: who,
    assignedBy: me,
    fromDate: TODAY,
    toDate: null,
    createdAt: new Date().toISOString()
  }];

  const initialCostHistory = cost > 0 ? [{
    effectiveMonth: effMonth,
    monthlyCost: cost,
    updatedBy: me,
    updatedAt: new Date().toISOString()
  }] : [];

  const insertPayload = {
    organization_id: ORG_ID,
    job_id: jid,
    title: t,
    assigned_to: who,
    assigned_by: me,
    status: "todo",
    due_date: due,
    estimated_hours: est,
    monthly_cost: cost,
    cost_history: initialCostHistory,
    responsibility_history: initialRespHistory
  };

  let { data, error } = await supabase.from("tasks").insert(insertPayload).select().single();
  if(error && (error.message.includes("monthly_cost") || error.message.includes("cost_history") || error.message.includes("responsibility_history") || error.message.includes("assigned_by"))){
    delete insertPayload.monthly_cost;
    delete insertPayload.cost_history;
    delete insertPayload.responsibility_history;
    delete insertPayload.assigned_by;
    const retry = await supabase.from("tasks").insert(insertPayload).select().single();
    data = retry.data;
    error = retry.error;
  }
  if(error) return toast("Could not add the task — "+error.message);

  TASKS.push({
    id: data.id,
    job: jid,
    title: t,
    who,
    assignedBy: me,
    status: "todo",
    due,
    est,
    monthlyCost: cost,
    costHistory: initialCostHistory,
    responsibilityHistory: initialRespHistory,
    createdAt: data.created_at || new Date().toISOString()
  });
  closeModal(); toast("Task added"); render();
}

/* =====================  MY CALENDAR  ========================== */
let calMonth = TODAY.slice(0,7);
let calSel = null;

function monthShift(n){
  const [y,m]=calMonth.split("-").map(Number);
  const d=new Date(Date.UTC(y,m-1+n,1));
  calMonth=d.toISOString().slice(0,7); calSel=null; render();
}

function tasksOn(who,date){ return TASKS.filter(t=>t.who===who && t.due===date); }
function jobsDueOn(who,date){
  const mine=new Set(ENTRIES.filter(x=>x.who===who).map(x=>x.job));
  return JOBS.filter(j=>!j.overhead && j.due===date && mine.has(j.id));
}

      if(lv)  h+='<span class="chip lv">'+esc(lv.type)+(lv.part!=="full"?" ½":"")+' leave</span>';
      jd.forEach(j=>h+='<span class="chip late">Due: '+esc(j.code.split("/")[1]||j.code)+'</span>');

      if(ts.length>2) h+='<span class="chip task">+'+(ts.length-2)+' more</span>';

    }

    /* past submissions */

    h+='<div class="card"><div class="card-head"><h2>Your submissions</h2><span class="spacer"></span>'+

function calPick(d){
  calSel = (calSel===d? null : d); render();
  // On a phone the details card sits below the whole month — bring it into view.
  if(calSel && window.matchMedia && window.matchMedia("(max-width:860px)").matches){
    const el=$(".cal-detail"); if(el) el.scrollIntoView({behavior:"smooth", block:"start"});
  }
}

/* =====================  REPORTS  ========================== */
let repFrom = addDays(TODAY,-28), repTo = TODAY, repWho = "all";

function repRows(){
  return ENTRIES.filter(x=>{
    const d=dateOf(x);
    return d>=repFrom && d<=repTo && (repWho==="all" || x.who===repWho);
  });
}
function setRep(k,v){ if(k==="from")repFrom=v; if(k==="to")repTo=v; if(k==="who")repWho=v; render(); }

function sheetAssignment(){
  const rows=[["Job code","Client","Title","Status","Budgeted hrs","Additional approved hrs","Total available hrs",
    "Actual hrs","Variance hrs","Consumed %",
    ...GRADES().map(g=>g+" hrs"),"Chargeable","Internal due"]];
  JOBS.filter(j=>!j.overhead).forEach(j=>{
    const rs=repRows().filter(x=>x.job===j.id);
    const tot=sum(rs.map(x=>+x.hours||0));
    const by=g=>sum(rs.filter(x=>person(x.who).label===g).map(x=>+x.hours||0));
    const extra=jobExtraHours(j.id), avail=jobBudgetTotal(j.id);
    rows.push([j.code, clientOf(j.client).name, j.title, STATUS_LABEL[j.status]||j.status,
      j.budget||0, extra, avail, +tot.toFixed(2), +(avail-tot).toFixed(2),
      avail?+(tot/avail).toFixed(4):0,
      ...GRADES().map(by), "Yes", j.due||""]);
  });
  JOBS.filter(j=>j.overhead).forEach(j=>{
    const tot=sum(repRows().filter(x=>x.job===j.id).map(x=>+x.hours||0));
    rows.push([j.code,"—",j.title,"Open","","","","",+tot.toFixed(2),"","","","","","No",""]);
  });
  return rows;
}

function sheetEmployee(){
  const rows=[["Person","Grade","Reports to","Total hrs","Chargeable hrs","Non-chargeable hrs",
    "Chargeable %","Days worked","Weeks on record","Tasks open","Tasks done"]];
  const list = repWho==="all" ? PEOPLE : PEOPLE.filter(p=>p.id===repWho);
  list.forEach(p=>{
    const rs=repRows().filter(x=>x.who===p.id);
    const tot=sum(rs.map(x=>+x.hours||0));
    const ch=sum(rs.filter(x=>!job(x.job).overhead).map(x=>+x.hours||0));
    rows.push([p.name, p.label, p.reportsTo?person(p.reportsTo).name:"—",
      +tot.toFixed(2), +ch.toFixed(2), +(tot-ch).toFixed(2),
      tot?+(ch/tot).toFixed(4):0,
      new Set(rs.map(dateOf)).size, new Set(rs.map(x=>x.week)).size,
      TASKS.filter(t=>t.who===p.id&&t.status!=="completed").length,
