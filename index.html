async function exportReportAttendance(){
  const btn = $("#repAttBtn");
  if(btn){ btn.disabled=true; btn.textContent="Building…"; }
  try{
    let query = supabase.from("attendance_punches").select("*")
      .eq("organization_id", ORG_ID)
      .gte("punch_date", repFrom).lte("punch_date", repTo)
      .order("punch_timestamp", {ascending:true});
    if(repWho!=="all") query = query.eq("profile_id", repWho);
    const { data, error } = await query;
    if(error){
      if(btn){ btn.disabled=false; btn.textContent="Download Report"; }
      return toast("Could not build the report — "+error.message);
    }
    const rows = data.map(mapPunch).filter(r=>inActiveCompany(r.who));
    const cap = repTo < TODAY ? repTo : TODAY;
    const days = cap < repFrom ? [] : datesBetween(repFrom, cap);
    const targetPeople = repWho==="all" ? PEOPLE.filter(p=>p.active || rows.some(r=>r.who===p.id)) : PEOPLE.filter(p=>p.id===repWho);

    const summary = [["Date","Person","Grade","Punch in","Punch out","Status"]];
    days.forEach(d=>{
      targetPeople.forEach(p=>{
        const dayRows = rows.filter(x=>x.who===p.id && x.date===d);
        const inP = dayRows.find(x=>x.type==="in");
        const outP = dayRows.slice().reverse().find(x=>x.type==="out");
        const st = attendanceDayStatus(p.id, d, inP, outP);
        summary.push([d, p.name, p.label, inP?inP.time:"", outP?outP.time:"", st.label]);
      });
    });

    const raw = [["Date","Time","Person","Grade","Type","Place","Distance (m)","Within fence","Flagged for review"]];
    rows.slice().sort((a,b)=>a.ts<b.ts?-1:a.ts>b.ts?1:0).forEach(x=>{
      const p=person(x.who);
      raw.push([x.date, x.time, p.name, p.label, x.type==="in"?"In":"Out", x.place,
        x.dist===null?"":Math.round(x.dist), x.ok?"Yes":"No", x.flagged?"Yes":"No"]);
    });

    XLSX.download(FIRM.name.replace(/\s+/g,"-")+"-attendance-report-"+repFileSuffix()+".xlsx", [
      {name:"Daily summary", rows:summary},
      {name:"Raw punches",   rows:raw}

    toast("Error downloading attendance report: "+err.message);
  }finally{
    if(btn){ btn.disabled=false; btn.textContent="Download Report"; }
  }
}

function suggestCompanyCode(name){
  const base = (name.split(/\s+/).map(w=>w.replace(/[^A-Za-z0-9]/g,"")).filter(Boolean)
    .map(w=>w.length<=4 && w===w.toUpperCase() ? w : w[0]).join("").toUpperCase() || "CO").slice(0,8);
  let code=base, n=2;
  while(COMPANIES.some(c=>c.code.toUpperCase()===code)) code=(base.slice(0,6)+n++);
  return code;
}

function syncCompanyCode(name){

  if(k && !k.dataset.touched) k.value = name.trim() ? suggestCompanyCode(name) : "";
}

/* Pending logo change in the company modal: undefined = unchanged,
   null = remove, string = new data URL. */
let COMPANY_LOGO_PENDING;
function showCompanyLogo(src){
  const img=$("#coLogoPreview"), rm=$("#coLogoRemove");
  if(!img) return;
  img.style.display = src ? "" : "none"; if(src) img.src = src;
  if(rm) rm.style.display = src ? "" : "none";
}
function clearCompanyLogo(){ COMPANY_LOGO_PENDING = null; const f=$("#coLogo"); if(f) f.value=""; showCompanyLogo(null); }
/* Scales the chosen image down to at most 480×160 so it stays small. */
function pickCompanyLogo(input){
  const file = input.files && input.files[0];
  if(!file) return;
  if(!/^image\/(png|jpeg)$/.test(file.type)){ input.value=""; return toast("Choose a PNG or JPEG image"); }
  if(file.size > 5*1024*1024){ input.value=""; return toast("That image is larger than 5 MB"); }
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, 480/img.naturalWidth, 160/img.naturalHeight);
      const c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(img.naturalWidth*s)); c.height = Math.max(1, Math.round(img.naturalHeight*s));
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      let url = c.toDataURL("image/png");
      if(url.length > 380000){
        const j = document.createElement("canvas"); j.width=c.width; j.height=c.height;
        const g = j.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,j.width,j.height); g.drawImage(c,0,0);
        url = j.toDataURL("image/jpeg", 0.85);
      }
      if(url.length > 380000){ input.value=""; return toast("That logo is too detailed — use a simpler or smaller image"); }
      COMPANY_LOGO_PENDING = url; showCompanyLogo(url);
    };
    img.onerror = () => { input.value=""; toast("That file could not be read as an image"); };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

async function saveCompany(id){
  if(!CAN.manageCompanies()) return toast("Only a partner can manage companies");
  const err = msg => { const el=$("#coError"); if(el){ el.textContent=msg; el.hidden=false; } return false; };
  const name=$("#coName").value.trim().replace(/\s+/g," ");
  const code=$("#coCode").value.trim().toUpperCase();
  if(!name) return err("Enter the company name");
  if(!code) return err("Enter a short code");
  if(!/^[A-Z0-9][A-Z0-9&.\-]{0,19}$/.test(code)) return err("Short code: letters, digits, & . - only, no spaces");
  if(COMPANIES.some(c=>c.id!==id && c.name.toLowerCase()===name.toLowerCase())) return err("A company with this name already exists");
  if(COMPANIES.some(c=>c.id!==id && c.code.toUpperCase()===code)) return err("That code is already used");
  const btn=$("#coSave"); if(btn) btn.disabled=true;
  const fields = { name, code };
  if(COMPANY_LOGO_PENDING !== undefined) fields.logo_data_url = COMPANY_LOGO_PENDING;
  const q = id
    ? supabase.from("companies").update(fields).eq("id", id).select("id,code,name,is_active,created_at").single()
    : supabase.from("companies").insert({ organization_id:ORG_ID, ...fields }).select("id,code,name,is_active,created_at").single();
  const { data, error } = await q;
  if(btn) btn.disabled=false;
  if(error) return err(/duplicate|unique/i.test(error.message||"") ? "A company with this name or code already exists" : "Could not save — "+error.message);
  const row = { id:data.id, code:data.code, name:data.name, active:data.is_active, createdAt:data.created_at };
  if(COMPANY_LOGO_PENDING !== undefined) COMPANY_LOGO_CACHE[data.id] = COMPANY_LOGO_PENDING;
  if(id){
    Object.assign(COMPANIES.find(c=>c.id===id), row);
    // keep the text code on this company's people in step (profiles.company, 008)
    ALL_PEOPLE.filter(p=>p.companyId===id).forEach(p=>{ p.company=row.code; });
    const { error:codeErr } = await supabase.from("profiles").update({ company:row.code })
      .eq("organization_id", ORG_ID).eq("company_id", id);
    if(codeErr) console.warn("[companies] profiles.company not refreshed", codeErr);
  } else COMPANIES.push(row);
  if(id===ACTIVE_COMPANY_ID) saveIdentityCache();
  closeModal(); toast(id ? "Saved" : name+" added"); render();
}

async function setCompanyActive(id, active){
  if(!CAN.manageCompanies()) return toast("Only a partner can manage companies");
  const c = COMPANIES.find(x=>x.id===id); if(!c) return;
  if(!active && ALL_PEOPLE.some(p=>p.active && p.companyId===id))
    return toast(c.name+" still has active employees — move or deactivate them first");
  if(!active && activeCompanies().length<=1) return toast("At least one company must stay active");
  const { error } = await supabase.from("companies").update({ is_active:active }).eq("id", id);
  if(error) return toast("Could not update — "+error.message);
  c.active = active;
  toast(c.name+(active?" activated":" deactivated"));
  if(!active && id===ACTIVE_COMPANY_ID){
    saveActiveCompanyPref(person(me).companyId||"");
    await reloadAppData(); return;
  }
  render();
}

async function savePerson(id){
  if(!CAN.manageTeam()) return toast("Only a partner can change the team");
  const name=$("#pfName").value.trim();
  const role=$("#pfRole").value;
  const boss=$("#pfBoss").value||null;
  const code=$("#pfCode").value.trim();
  const companyId=$("#pfCompany") ? $("#pfCompany").value : "";
  const selectedCompany=COMPANIES.find(c=>c.id===companyId);
  const ctc=Math.max(0,+$("#pfCTC").value||0);
  const email=$("#pfEmail").value.trim(), joined=$("#pfJoined").value;
  const cost=Math.max(0,+$("#pfCost").value||0), bill=Math.max(0,+$("#pfBill").value||0);
  if(!name) return toast("Enter a name");
  if(!code) return toast("An employee code is required");
  if(ALL_PEOPLE.some(p=>p.id!==id && p.code===code)) return toast("That employee code is already used");
  if(id && wouldCycle(id, boss)) return toast("That makes a loop in the reporting line");
  if(id && boss===id) return toast("Nobody reports to themselves");
  if(!selectedCompany) return pfShowError("Select a company");

  if(id){
    const p=person(id);
    const companyChanged = companyId!==p.companyId;
    if(companyChanged && !selectedCompany.active) return pfShowError("That company is inactive — choose an active company");
    const effective=($("#pfEffective") && $("#pfEffective").value) || TODAY;
    if(!validISODate(effective)) return pfShowError("Choose a valid effective date");
    const company=selectedCompany.code;
    if(p.id===me && role!==p.role) return toast("You cannot change your own designation — ask another partner");
    if(p.role==="partner" && role!=="partner" && activePartners()<=1)
      return toast("The firm would be left without a partner to approve anything");
    const updatePayload = {
      full_name:name, employee_code:code, contact_email:email, role,
      reports_to:boss, joining_date:joined, cost_per_hour:cost, bill_rate_per_hour:bill,
      company, company_id:companyId
    };
    const { error } = await supabase.from("profiles").update(updatePayload).eq("id", id);
    if(error) return toast("Could not save — "+error.message);
    // A new company and/or CTC starts a new salary record from the effective
    // date. Earlier rows keep their CTC and their company. Same-date edits
    // correct that date's record instead of adding a duplicate.
    const oldCtc=salaryAt(id, effective);
    if(companyChanged || oldCtc!==ctc){
      const {data:salaryRow,error:salaryError}=await supabase.from("employee_salary_history").upsert({
        organization_id:ORG_ID,profile_id:id,company_id:companyId,monthly_ctc:ctc,effective_from:effective,created_by:me
      },{onConflict:"profile_id,effective_from"}).select("id,profile_id,monthly_ctc,effective_from,company_id").single();
      if(salaryError) return toast("Profile saved, but salary history could not be saved — "+salaryError.message);
      SALARY_HISTORY=SALARY_HISTORY.filter(s=>!(s.who===id&&s.effective===salaryRow.effective_from));
      if(!canSwitchCompany() || salaryRow.company_id===ACTIVE_COMPANY_ID)
        SALARY_HISTORY.push({id:salaryRow.id,who:id,ctc:+salaryRow.monthly_ctc,effective:salaryRow.effective_from,companyId:salaryRow.company_id});
    }
    closeModal(); toast("Saved");
    // A company move changes which company's lists this person belongs to
    // (and, for yourself, your punch sites) — reload rather than patch.
    if(companyChanged){ await reloadAppData(); return; }
    Object.assign(p,{ name, code, email, role, label:ROLE_LABEL[role], reportsTo:boss,
      joined, cost, bill, company, companyId, ctc:salaryAt(id,TODAY) });
    if(p.id===me) saveIdentityCache();
    return render();
  }

  // New employee: their Supabase Auth account + linked profile are created
  // together by the create-employee Edge Function (service-role key, never
  // exposed here), not by inserting into `profiles` directly — see
  // migrations/003_auth_integration.sql for why the client can't do that insert.
  if(!selectedCompany.active) return pfShowError("That company is inactive — choose an active company");
  if(!email) return pfShowError("Enter an email address");
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return pfShowError("Enter a valid email address");
  const pw1=$("#pfPassword").value, pw2=$("#pfPassword2").value;
  if(pw1.length<8) return pfShowError("Password must be at least 8 characters");
  if(pw1!==pw2) return pfShowError("Passwords do not match");

  const btn=$("#pfSaveBtn");
  if(btn){ btn.disabled=true; btn.textContent="Creating employee..."; }
  const result = await createEmployeeAccount({
    fullName:name, email, password:pw1, employeeCode:code, role, companyId,
    reportsTo:boss, joiningDate:joined, costPerHour:cost, billRatePerHour:bill
  });
  if(btn){ btn.disabled=false; btn.textContent="Add employee"; }

  if(!result.ok) return pfShowError(result.message);

  const prof = result.profile;
  const assignedCompany=COMPANIES.find(c=>c.id===prof.company_id);
  const {data:salaryRow,error:salaryError}=await supabase.from("employee_salary_history").insert({
    organization_id:ORG_ID,profile_id:prof.id,company_id:prof.company_id,monthly_ctc:ctc,effective_from:joined||TODAY,created_by:me
  }).select("id,profile_id,monthly_ctc,effective_from,company_id").single();
  if(salaryError) return pfShowError("Employee created, but salary history could not be saved — "+salaryError.message);
  const inView = !canSwitchCompany() || prof.company_id===ACTIVE_COMPANY_ID;
  if(inView) SALARY_HISTORY.push({id:salaryRow.id,who:prof.id,ctc:+salaryRow.monthly_ctc,effective:salaryRow.effective_from,companyId:salaryRow.company_id});

  addScoped(ALL_PEOPLE, PEOPLE, { id:prof.id, code, name, email, role, label:ROLE_LABEL[role], reportsTo:boss,
    joined, cost, bill, company:prof.company||assignedCompany?.code||"", companyId:prof.company_id, ctc, active:true, authUserId:prof.auth_user_id },
    prof.company_id);
  closeModal();
  toast(name+" added to "+companyFullName(prof.company_id)+" — they can sign in with the email and password you set");
  render();
}

function pfShowError(msg){

  if(el){ el.textContent=msg; el.hidden=false; } else toast(msg);
  return false;

async function createEmployeeAccount(payload){
  try{
    const { data:{ session } } = await supabase.auth.getSession();
    if(!session) return { ok:false, message:"Your session has expired — sign in again." };
    if(!window.EDGE_FN_URL) return { ok:false, message:"Server is not configured — missing Supabase URL." };
    const res = await fetch(window.EDGE_FN_URL, {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization":"Bearer "+session.access_token,
        "apikey": window.SUPABASE_ANON_KEY || ""
      },
      body: JSON.stringify(payload)
    });
    let body=null;
    try{ body = await res.json(); }catch(_e){}
    if(!res.ok){
      // The function's own { error, detail } is shown as-is (detail is the
      // backend cause — omitted server-side when HIDE_ERROR_DETAILS is set).
      // Fallbacks only apply when the platform gateway, not our code, answered.
      if(body && body.error){
        console.error("[create-employee]", res.status, body);
        return { ok:false, message: body.error + (body.detail ? " ("+body.detail+")" : "") };
      }
      if(res.status===401) return { ok:false, message:"Your session has expired. Please sign in again." };
      if(res.status===403) return { ok:false, message:"You do not have permission to add employees." };
      return { ok:false, message:"Employee could not be created (HTTP "+res.status+"). Please try again." };
    }
    return { ok:true, profile: body && body.profile };
  }catch(err){
    return { ok:false, message:"Network error — could not reach the server. Try again." };
  }
}

function offboard(id){
  if(!CAN.manageTeam()) return toast("Only a partner can remove someone");
  const p=person(id);
  if(id===me) return toast("You cannot remove yourself");
  if(p.role==="partner" && activePartners()<=1)
    return toast("The firm would be left without a partner");

  const reps=directReports(id);
  const openTasks=TASKS.filter(t=>t.who===id && t.status!=="completed");
  const pendSheet=sheetStatus(id)==="submitted";
  const history=hasHistory(id);

  let blockers="";
  if(reps.length) blockers+='<li>'+reps.length+' person'+(reps.length>1?"s":"")+' report'+
    (reps.length>1?"":"s")+' to them — reassign first: '+reps.map(r=>esc(r.name)).join(", ")+'</li>';
  if(openTasks.length) blockers+='<li>'+openTasks.length+' open task'+(openTasks.length>1?"s":"")+
    ' still assigned to them</li>';
  if(pendSheet) blockers+='<li>a submitted timesheet is still waiting for approval</li>';

  modal('<h3>Remove '+esc(p.name)+'</h3>'+
    (blockers
      ? '<p class="tiny muted" style="margin-bottom:8px">Sort these out first:</p>'+
        '<ul class="tiny" style="margin:0 0 14px 18px;line-height:1.7">'+blockers+'</ul>'+
        '<div class="row"><button class="btn ghost" onclick="closeModal()">Close</button></div>'
      : (history
        ? '<p class="tiny muted" style="margin-bottom:14px">They have time entries on record, so they are '+
          'deactivated rather than deleted. They can no longer sign in, but their hours stay on every job '+
          'they worked on and in every report. You can reactivate them later.</p>'+
          '<div class="row"><button class="btn ghost" onclick="closeModal()">Cancel</button>'+
          '<button class="btn danger" onclick="doOffboard(\''+id+'\',false)">Deactivate</button></div>'
        : '<p class="tiny muted" style="margin-bottom:14px">They have never booked time, so there is nothing '+
          'to preserve. This deletes the record outright.</p>'+
          '<div class="row"><button class="btn ghost" onclick="closeModal()">Cancel</button>'+
          '<button class="btn ghost" onclick="doOffboard(\''+id+'\',false)">Deactivate instead</button>'+
          '<button class="btn danger" onclick="doOffboard(\''+id+'\',true)">Delete</button></div>')));
}
async function doOffboard(id, hard){
  const p=person(id);
  if(hard){
    const { error } = await supabase.from("profiles").delete().eq("id", id);
    if(error) return toast("Could not delete — "+error.message);
    ALL_PEOPLE.splice(ALL_PEOPLE.findIndex(x=>x.id===id),1);
    if(PEOPLE!==ALL_PEOPLE && PEOPLE.some(x=>x.id===id)) PEOPLE.splice(PEOPLE.findIndex(x=>x.id===id),1);
    toast(p.name+" deleted");
  } else {
    const { error } = await supabase.from("profiles")

async function saveClient(id){
  if(!CAN.manageClients()) return toast("Manager and above can change clients");
  const code=$("#cfCode").value.trim().toUpperCase();
  const name=$("#cfName").value.trim();
  const pan=$("#cfPan").value.trim().toUpperCase();
  const gstin=$("#cfGst").value.trim().toUpperCase();
  if(!code) return toast("A short code is required");
  if(!/^[A-Z0-9]{2,8}$/.test(code)) return toast("Short code: 2–8 letters or digits, no spaces");
  if(ALL_CLIENTS.some(c=>c.id!==id && c.code===code)) return toast("That code is already used");
  if(!name) return toast("Enter the client name");
  if(pan && !/^[A-Z]{5}[0-9]{4}[A-Z]$/.test(pan)) return toast("PAN should look like AABCS1234K");
  if(gstin && gstin.length!==15) return toast("A GSTIN is 15 characters");

  const type=$("#cfType").value, email=$("#cfEmail").value.trim(),
        phone=$("#cfPhone").value.trim(), partner=$("#cfPartner").value;

  if(id){
    const { error } = await supabase.from("clients").update({
      client_code:code, name, entity_type:type, pan, gstin, email, phone, relationship_partner_id:partner
    }).eq("id", id);
    if(error) return toast("Could not save — "+error.message);
    Object.assign(clientOf(id), { code, name, type, pan, gstin, email, phone, partner });
    closeModal(); toast("Saved"); return render();
  }
  const { data, error } = await supabase.from("clients").insert({
    organization_id:ORG_ID, client_code:code, name, entity_type:type, pan, gstin, email, phone,
    relationship_partner_id:partner, onboarded_date:TODAY, is_active:true, company_id:ACTIVE_COMPANY_ID
  }).select().single();
  if(error) return toast("Could not add the client — "+error.message);
  addScoped(ALL_CLIENTS, CLIENTS, { id:data.id, code, name, type, pan, gstin, email, phone, partner, onboarded:TODAY, active:true, companyId:data.company_id }, data.company_id);
  closeModal(); toast(name+" added — you can raise a job code for them now"); render();
}
async function archiveClient(id){
  const open=JOBS.filter(j=>j.client===id && j.status!=="closed");
  if(open.length) return toast(open.length+" job code"+(open.length>1?"s are":" is")+
    " still open for this client");
  const { error } = await supabase.from("clients").update({ is_active:false }).eq("id", id);
  if(error) return toast("Could not archive — "+error.message);
  const siteIds = LOCATIONS.filter(l=>l.client===id).map(l=>l.id);
  if(siteIds.length){
    const { error: siteErr } = await supabase.from("locations").update({ is_active:false }).in("id", siteIds);
    if(siteErr) toast("Client archived, but its sites could not be turned off — "+siteErr.message);
  }
  clientOf(id).active=false;
  LOCATIONS.filter(l=>l.client===id).forEach(l=>l.active=false);
  toast("Archived — history and closed jobs are kept"); render();
}
async function unarchiveClient(id){
  const { error } = await supabase.from("clients").update({ is_active:true }).eq("id", id);
  if(error) return toast("Could not restore — "+error.message);
  clientOf(id).active=true; toast("Restored"); render();
}

async function saveSite(id){
  if(!CAN.manageClients()) return toast("Manager and above can change sites");
  const label=$("#sfLabel").value.trim();
  const companyId=$("#sfCompany").value;
  const latValue=$("#sfLat").value.trim(), lngValue=$("#sfLng").value.trim();
  const lat=+$("#sfLat").value, lng=+$("#sfLng").value, rad=+$("#sfRad").value;
  if(!label) return toast("Give the site a name");
  if(!companyId || !siteCompanyOptions(companyId).some(c=>c.id===companyId)) return toast("Select a company/office");
  if(!latValue || !lngValue) return toast("Enter the site's latitude and longitude");
  if(!isFinite(lat)||lat<-90||lat>90) return toast("Latitude must be between −90 and 90");
  if(!isFinite(lng)||lng<-180||lng>180) return toast("Longitude must be between −180 and 180");
  if(!(rad>=25&&rad<=5000)) return toast("Radius must be between 25 m and 5000 m");
  const clientId=$("#sfClient").value||null;
  if(id){
    const { error } = await supabase.from("locations").update({
      label, company_id:companyId, client_id:clientId, latitude:lat, longitude:lng, radius_meters:rad
    }).eq("id", id);
    if(error) return toast("Could not save — "+error.message);
    const site=LOCATIONS.find(l=>l.id===id);
    Object.assign(site, { label, companyId, client:clientId, lat, lng, radius:rad });
    syncPunchSite(site);
    closeModal(); toast("Saved"); return render();
  }
  const { data, error } = await supabase.from("locations").insert({
    organization_id:ORG_ID, company_id:companyId, client_id:clientId, label, latitude:lat, longitude:lng,
    radius_meters:rad, is_active:true
  }).select().single();
  if(error) return toast("Could not add the site — "+error.message);
  const site={ id:data.id, companyId, label, client:clientId, lat, lng, radius:rad, active:true };
  if(!canSwitchCompany() || companyId===ACTIVE_COMPANY_ID) LOCATIONS.push(site);
  syncPunchSite(site);
  closeModal(); toast("Site added — punches here will now match"); render();
}
async function toggleSite(id){
  const l=LOCATIONS.find(x=>x.id===id);
  if(l.active && LOCATIONS.filter(x=>x.active).length<=1)
    return toast("Keep at least one active site, or every punch is flagged");
  const { error } = await supabase.from("locations").update({ is_active:!l.active }).eq("id", id);
  if(error) return toast("Could not update — "+error.message);
  l.active=!l.active; syncPunchSite(l); render();
}

/* The signed-in user's own profile. Always loaded by the Supabase session's
   user id (profiles.auth_user_id) — never by an id from the page — so the
   page can only ever show or edit the caller's own row. Editing follows the
   existing rule (profiles_update RLS, CAN.manageTeam()): only a partner may
   update a profile, and only name and phone are offered here. Role, company,
   status, rates and reporting line stay with the Team screen. */
let PROFILE = { forUid:undefined, loading:false, row:null, company:null, email:"", error:"" };

function initialsOf(name){
  const parts=String(name||"").trim().split(/\s+/).filter(Boolean);
  if(!parts.length) return "?";
  return ((parts[0][0]||"")+(parts.length>1?parts[parts.length-1][0]:"")).toUpperCase();
}

async function loadMyProfile(){
  const forUid=AUTH_UID;   // one load per signed-in user; retry only via "Try again"
  PROFILE={ forUid, loading:true, row:null, company:null, email:"", error:"" };
  const fail=msg=>{ PROFILE={ forUid, loading:false, row:null, company:null, email:"", error:msg }; };
  try{
    const { data:{ user }, error:userErr } = await supabase.auth.getUser();
    if(userErr || !user) fail("You're not signed in. Please sign in again.");
    else{
      const { data:row, error } = await supabase.from("profiles")
        .select("id,employee_code,full_name,contact_email,phone,role,reports_to,company,company_id,joining_date,exit_date,is_active,created_at")
        .eq("auth_user_id", user.id).maybeSingle();
      if(error) fail("Could not load your profile — "+(error.message||"please try again."));
      else if(!row) fail("No employee profile is linked to this account. Contact your administrator.");
      else{
        let company=null;
        if(row.company_id){
          const { data:c } = await supabase.from("companies").select("id,code,name").eq("id", row.company_id).maybeSingle();
          company=c||null;
        }
        PROFILE={ forUid, loading:false, row, company, email:user.email||"", error:"" };
      }
    }
  }catch(err){
    fail("Network error — could not load your profile. Check your connection and try again.");
  }
  if(view==="profile") render();
}

async function saveMyProfile(ev){
  ev.preventDefault();
  if(!CAN.manageTeam() || !PROFILE.row) return false;
  const name=$("#pmName").value.trim(), phone=$("#pmPhone").value.trim();
  if(!name) { profileMsg("pmMsg","Enter your full name."); return false; }
  if(phone && !/^\+?[0-9][0-9 ()-]{5,19}$/.test(phone)) { profileMsg("pmMsg","Enter a valid phone number (digits, spaces, +, - or brackets)."); return false; }
  const btn=$("#pmSave"); btn.disabled=true; btn.textContent="Saving…";
  try{
    const { data:{ user } } = await supabase.auth.getUser();
    if(!user){ profileMsg("pmMsg","You're not signed in. Please sign in again."); return false; }
    // Scoped to the caller's own linked row; RLS (profiles_update) still decides.
    const { data, error } = await supabase.from("profiles")
      .update({ full_name:name, phone:phone||null })
      .eq("id", PROFILE.row.id).eq("auth_user_id", user.id).select("id,full_name,phone");
    if(error){ profileMsg("pmMsg","Could not save your changes — "+(error.message||"please try again.")); return false; }
    if(!data || !data.length){ profileMsg("pmMsg","Your profile could not be updated — you may not have permission to change it."); return false; }
    PROFILE.row.full_name=data[0].full_name; PROFILE.row.phone=data[0].phone;
    const p=PEOPLE.find(x=>x.id===PROFILE.row.id); if(p) p.name=data[0].full_name;
    saveIdentityCache();
    render(); toast("Profile updated");
  }catch(err){
    profileMsg("pmMsg","Network error — your changes were not saved. Try again.");
  }finally{
    const b=$("#pmSave"); if(b){ b.disabled=false; b.textContent="Save changes"; }
  }
  return false;
}

/* Change password for the signed-in user, via Supabase Auth only.
   1. Confirm the current password on a separate in-memory client
      (createPasswordCheckClient) so the app's own session is untouched.
   2. Update the password on the real session with updateUser() — the user
      stays signed in. Passwords are never logged, stored, or cached. */
async function changeMyPassword(ev){
  ev.preventDefault();
  const cur=$("#cpCurrent").value, p1=$("#cpNew").value, p2=$("#cpConfirm").value;
  $("#cpMsg").hidden=true;
  if(!cur) { profileMsg("cpMsg","Enter your current password."); return false; }
  if(!p1) { profileMsg("cpMsg","Enter a new password."); return false; }
  if(p1.length<8) { profileMsg("cpMsg","New password must be at least 8 characters."); return false; }
  if(p1!==p2) { profileMsg("cpMsg","New password and confirmation do not match."); return false; }
  if(p1===cur) { profileMsg("cpMsg","New password must be different from your current password."); return false; }

  const btn=$("#cpSubmit"); btn.disabled=true; btn.textContent="Changing…";
  const done=()=>{ const b=$("#cpSubmit"); if(b){ b.disabled=false; b.textContent="Change password"; } };
  try{
    const { data:{ user }, error:userErr } = await supabase.auth.getUser();
    if(userErr || !user || !user.email){ profileMsg("cpMsg","Your session has expired. Sign in again, then change your password."); return false; }

    const checker = window.createPasswordCheckClient ? window.createPasswordCheckClient() : null;
    if(!checker){ profileMsg("cpMsg","Password change is not available — the app is not configured."); return false; }
    const { data:chk, error:chkErr } = await checker.auth.signInWithPassword({ email:user.email, password:cur });
    if(chkErr){
      const code=chkErr.code||"", msg=chkErr.message||"";
      if(code==="invalid_credentials" || /invalid login credentials/i.test(msg)) profileMsg("cpMsg","Current password is incorrect.");
      else if(/rate limit|too many/i.test(msg) || code==="over_request_rate_limit") profileMsg("cpMsg","Too many attempts. Wait a few minutes and try again.");
      else if(/network|fetch/i.test(msg)) profileMsg("cpMsg","Network error — check your connection and try again.");
      else profileMsg("cpMsg","Could not verify your current password. Please try again.");
      return false;
    }
    // End the throwaway verification session (server-side too); ignore failures.
    if(chk && chk.session) await checker.auth.signOut({ scope:"local" }).catch(()=>{});
    if(!chk || !chk.user || chk.user.id!==user.id){ profileMsg("cpMsg","Could not verify your current password. Please try again."); return false; }

    const { error } = await supabase.auth.updateUser({ password:p1, current_password:cur });
    if(error){
      const code=error.code||"", msg=error.message||"";
      if(code==="same_password") profileMsg("cpMsg","New password must be different from your current password.");
      else if(code==="weak_password") profileMsg("cpMsg","That password is too weak"+(msg?" — "+msg:"")+".");
      else if(code==="reauthentication_needed" || code==="reauthentication_not_valid")
        profileMsg("cpMsg","For security, sign out and sign in again, then change your password.");
      else if(/network|fetch/i.test(msg)) profileMsg("cpMsg","Network error — your password was not changed. Try again.");
      else profileMsg("cpMsg","Could not change your password"+(msg?" — "+msg:"")+".");
      return false;
    }
    ["cpCurrent","cpNew","cpConfirm"].forEach(id=>{ const el=$("#"+id); if(el) el.value=""; });
    profileMsg("cpMsg","Password changed. Use your new password the next time you sign in.", true);
    toast("Password changed");
  }catch(err){
    profileMsg("cpMsg","Network error — your password was not changed. Try again.");
  }finally{ done(); }
  return false;
}

function setMobileMenuOpen(open){
  const sidebar=$("#sidebar"), backdrop=$("#mobileNavBackdrop"), toggle=$("#mobileMenuToggle");
  const isMobile=window.matchMedia("(max-width: 860px)").matches;
  if(!isMobile){
    sidebar.classList.remove("mobile-open");
    sidebar.removeAttribute("aria-hidden");
    backdrop.hidden=true;
    document.body.classList.remove("mobile-menu-open");
    toggle.setAttribute("aria-expanded","false");
    toggle.setAttribute("aria-label","Open navigation menu");
    return;
  }
  if(open){
    sidebar.classList.add("mobile-open");
    sidebar.setAttribute("aria-hidden","false");
    backdrop.hidden=false;
    document.body.classList.add("mobile-menu-open");
    toggle.setAttribute("aria-expanded","true");
    toggle.setAttribute("aria-label","Close navigation menu");
    $("#mobileNavClose").focus();
  }else{
    sidebar.classList.remove("mobile-open");
    sidebar.setAttribute("aria-hidden","true");
    backdrop.hidden=true;
    document.body.classList.remove("mobile-menu-open");
    toggle.setAttribute("aria-expanded","false");
    toggle.setAttribute("aria-label","Open navigation menu");
  }
}
function toggleMobileMenu(){
  if(!window.matchMedia("(max-width: 860px)").matches) return;
  setMobileMenuOpen(!$("#sidebar").classList.contains("mobile-open"));
}
function closeMobileMenu(restoreFocus=false){
  setMobileMenuOpen(false);
  if(restoreFocus && window.matchMedia("(max-width: 860px)").matches && !$("#sidebar").hidden)
    $("#mobileMenuToggle").focus();
}
window.addEventListener("resize",()=>{
  if(!window.matchMedia("(max-width: 860px)").matches) closeMobileMenu(false);
});

  if(v==="firmtime")  return CAN.seeFirmTime();
  if(v==="reports")   return CAN.seeReports();

function render(){
  if(!visible(view)) view="today";
  const curComp = ACTIVE_COMPANY_ID || (me ? (person(me).companyId || person(me).company) : "");
  $("#firmName").textContent = companyFullName(curComp);
  renderCompanySwitcher(curComp);
  $("#todayStamp").textContent = fmtDate(TODAY);

  $("#nav").innerHTML = NAV.map(g=>{
    const items = g.items.filter(([k])=>visible(k));
    if(!items.length) return "";
    return '<div class="nav-label">'+g.g+'</div>'+items.map(([k,l])=>{
      let badge="";
      if(k==="approvals" && approvalCount()) badge='<span class="badge">'+approvalCount()+'</span>';
      if(k==="mytime"){
        const st=sheetStatus(me);
        if(st==="draft"||st==="not started"||st==="sent back") badge='<span class="badge">!</span>';
      }
      return '<button class="nav-item" '+(view===k?'aria-current="page"':"")+
        ' onclick="go(\''+k+'\')"><span class="dot"></span>'+l+badge+'</button>';
    }).join("");
  }).join("");

  $("#whoamiName").textContent = person(me).name+" — "+person(me).label;
  $("#roleHint").textContent = person(me).reportsTo
    ? "Timesheet and claims go to "+person(person(me).reportsTo).name+"."
    : "Nobody above you — you certify your own timesheet.";

  $("#viewTitle").textContent = titleOf(view);
  /* DATA_READY false means the chrome above was painted from the cached
     identity (see paintFromCache()) while the real, RLS-governed fetch is
     still in flight — every array a view would read (TASKS, ENTRIES, …) is
     still empty at this point, so calling VIEWS[view].render()/.sub() now
     would show honest-looking but WRONG zeros ("0 tasks due" when there may
     be 5) instead of real data. Show a plain loading note in the content
     pane only — the nav/topbar stay live and clickable — until the real
     fetch lands and calls render() again for real. */
  if(!DATA_READY){
    $("#viewSub").textContent = "";
    $("#views").innerHTML = '<div class="view"><div class="card">'+
      '<div class="card-head"><h2>Loading '+esc(titleOf(view).toLowerCase())+'…</h2></div>'+
      '<p class="tiny muted">Fetching the latest from Supabase.</p></div></div>';
    return;
  }
  $("#viewSub").textContent   = VIEWS[view].sub();
  $("#views").innerHTML = '<div class="view">'+VIEWS[view].render()+'</div>';
}

/* Header company context: a dropdown for a partner with more than one active
   company, otherwise just the company name (the sidebar brand shows it too,
   but the sidebar is off-screen on phones). */
function renderCompanySwitcher(curComp){
  const box = $("#companyCtx");
  if(!box) return;
  const options = me && DATA_READY ? switchableCompanies() : [];
  if(!curComp){ box.innerHTML = ""; return; }
  if(canSwitchCompany() && options.length > 1){
    box.innerHTML = '<label class="company-switch"><span class="sr-only">Company</span>'+
      '<select aria-label="Switch company" onchange="switchCompany(this.value)">'+
      options.map(c=>'<option value="'+c.id+'"'+(c.id===curComp?" selected":"")+'>'+esc(c.name)+'</option>').join("")+
      '</select></label>';
  } else {
    box.innerHTML = '<span class="company-name">'+esc(companyFullName(curComp))+'</span>';
  }
}

/* Sign-in and account creation use Supabase Auth. The first Partner profile is
   provisioned through the existing one-time, database-gated bootstrap RPC. */

let AUTH_VIEW = "login";   // "login" | "signup" | "forgot" | "recovery"

/* ==================  LOCAL IDENTITY CACHE (display-only)  ==================
   Fixes the "Checking your database…" screen reappearing on every launch and
   every tab focus. This cache is NEVER used for authorization — every real
   check (auth.getUser(), the my_profile() RPC, is_active, and every
   RLS-governed query inside loadAppData()) still runs in full, every single
   time startApp() is called, exactly as before. All this does is let the
   app paint its OWN chrome — organization name, your name/role, a
   correctly-gated nav — immediately from the last values this exact signed-
   in user legitimately saw, while that same data is re-fetched for real in
   the background. If the re-fetch disagrees (deactivated, reassigned,
   session actually invalid), the real check wins outright — see startApp().
   Nothing here is fabricated: every cached field is a value Supabase
   returned to this user in an earlier, fully-authorized session. */
const IDENTITY_CACHE_KEY = "pm_identity_v1";
function saveIdentityCache(){
  try{
    const p = person(me);
    const comp = p.company || "";
    localStorage.setItem(IDENTITY_CACHE_KEY, JSON.stringify({
      uid:AUTH_UID, profileId:me, orgId:ORG_ID, orgName:FIRM.name,
      company:comp, companyId:p.companyId, companyName:companyFullName(p.companyId||comp),
      activeCompanyId:ACTIVE_COMPANY_ID, activeCompanyName:companyFullName(ACTIVE_COMPANY_ID||p.companyId||comp),
      name:p.name, role:p.role, label:p.label, reportsTo:p.reportsTo
    }));
  }catch(e){ /* localStorage unavailable (private browsing etc.) — cache is optional, not required */ }
}
function loadIdentityCache(uid){
  try{
    const raw = localStorage.getItem(IDENTITY_CACHE_KEY);
    if(!raw) return null;
    const c = JSON.parse(raw);
    return (c && c.uid && c.uid===uid && c.profileId && c.orgId) ? c : null;
  }catch(e){ return null; }
}
function clearIdentityCache(){
  try{ localStorage.removeItem(IDENTITY_CACHE_KEY); }catch(e){}
}
/* Paints the app chrome from a cached identity and seeds a one-row PEOPLE
   so person(me)/rank()/CAN.* resolve correctly for that paint. DATA_READY
   stays false, so render() (see above) shows a plain loading note in the
   content pane only, never fabricated numbers, until the real
   loadAppData() lands and replaces PEOPLE wholesale. */
function paintFromCache(cache){
  FIRM.name = cache.orgName || "";
  ORG_ID = cache.orgId;
  const comp = cache.company || "";
  PEOPLE = [{ id:cache.profileId, name:cache.name, label:cache.label, role:cache.role,
    reportsTo:cache.reportsTo, company:comp, companyId:cache.companyId||null,
    active:true, email:"", joined:null, left:null, cost:0, bill:0, ctc:0, authUserId:cache.uid }];
  ALL_PEOPLE = PEOPLE;
  ACTIVE_COMPANY_ID = cache.activeCompanyId || cache.companyId || null;
  COMPANIES = ACTIVE_COMPANY_ID
    ? [{ id:ACTIVE_COMPANY_ID, code:comp, name:cache.activeCompanyName||cache.companyName||comp, active:true }] : [];
  me = cache.profileId;
  DATA_READY = false;
  $("#authScreen").hidden = true;
  $("#sidebar").hidden = false;
  $("main").hidden = false;
  render();
}

async function doSignup(ev){
  ev.preventDefault();
  const name=$("#suName").value.trim(), email=$("#suEmail").value.trim().toLowerCase(), companyName=$("#suCompany").value.trim(), password=$("#suPassword").value, confirm=$("#suConfirm").value;
  const errEl=$("#authError"), btn=$("#suSubmit"); errEl.hidden=true;
  if(!name){errEl.textContent="Enter your full name.";errEl.hidden=false;return false;}
  if(!email){errEl.textContent="Enter your email address.";errEl.hidden=false;return false;}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){errEl.textContent="Enter a valid email address.";errEl.hidden=false;return false;}
  if(!password){errEl.textContent="Enter a password.";errEl.hidden=false;return false;}
  if(!confirm){errEl.textContent="Confirm your password.";errEl.hidden=false;return false;}
  if(password.length<8){errEl.textContent="Password must be at least 8 characters.";errEl.hidden=false;return false;}
  if(password!==confirm){errEl.textContent="Passwords do not match.";errEl.hidden=false;return false;}
  if(!companyName){errEl.textContent="Enter your company name.";errEl.hidden=false;return false;}
  if(!supabase){errEl.textContent="Supabase is not configured.";errEl.hidden=false;return false;}
  btn.disabled=true;btn.textContent="Creating account...";
  try{
    const {data,error}=await supabase.auth.signUp({email,password,options:{data:{full_name:name,company_name:companyName}}});
    if(error) throw error;
    if(data.session) return false;
    errEl.className="auth-alert ok";
    errEl.textContent="Account created. Confirm your email, then sign in to enter your workspace.";
    errEl.hidden=false;
  }catch(e){console.error("[AUTH] Signup request failed",e);errEl.textContent=e.message||"Registration failed. Please try again.";errEl.hidden=false;}
  finally{btn.disabled=false;btn.textContent="Sign Up";}
  return false;
}

function authErrorMessage(err, fallback){
  const msg = (err && err.message) || "";
  if(/invalid login credentials/i.test(msg)) return "Invalid email or password.";
  if(/email not confirmed/i.test(msg)) return "This account isn't confirmed yet — contact your administrator.";
  if(/network|fetch/i.test(msg)) return "Network error — check your connection and try again.";
  return fallback+(msg?" — "+msg:"");
}

async function doLogin(ev){
  ev.preventDefault();
  const email = $("#liEmail").value.trim();
  const password = $("#liPassword").value;
  const errEl = $("#authError"), btn = $("#liSubmit");
  errEl.hidden = true;
  if(!email || !password){ errEl.textContent = "Enter your email and password."; errEl.hidden = false; return false; }
  if(!supabase){ errEl.textContent = "Supabase is not configured."; errEl.hidden = false; return false; }
  btn.disabled = true; btn.textContent = "Signing in…";
  let error=null;
  try{
    const result=await supabase.auth.signInWithPassword({ email, password });
    error=result.error;
  }catch(err){
    console.error("[AUTH] Sign-in request failed",err);
    errEl.textContent=authErrorMessage(err,"Could not sign in");
    errEl.hidden=false;
    btn.disabled=false; btn.textContent="Sign in";
    return false;
  }
  btn.disabled = false; btn.textContent = "Sign in";
  if(error){
    console.error("[AUTH] Sign-in rejected by Supabase",error);
    errEl.textContent = authErrorMessage(error, "Could not sign in");
    errEl.hidden = false;
    return false;
  }
  // supabase.auth.onAuthStateChange picks up SIGNED_IN and loads the app.
  return false;
}

async function doForgot(ev){
  ev.preventDefault();
  const email = $("#fpEmail").value.trim();
  const errEl = $("#authError"), infoEl = $("#authInfo"), btn = $("#fpSubmit");
  errEl.hidden = true; infoEl.hidden = true;
  if(!email){ errEl.textContent = "Enter your email."; errEl.hidden = false; return false; }
  btn.disabled = true; btn.textContent = "Sending…";
  const { error } = await supabase.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + window.location.pathname
  });
  btn.disabled = false; btn.textContent = "Send reset link";
  if(error){
    errEl.textContent = authErrorMessage(error, "Could not send the reset email");
    errEl.hidden = false;
  } else {
    infoEl.textContent = "If an account exists for that email, a reset link is on its way.";
    infoEl.hidden = false;
  }
  return false;
}

async function doSetNewPassword(ev){
  ev.preventDefault();
  const p1 = $("#npPassword").value, p2 = $("#npConfirm").value;
  const errEl = $("#authError"), btn = $("#npSubmit");
  errEl.hidden = true;
  if(p1.length<8){ errEl.textContent = "Password must be at least 8 characters."; errEl.hidden = false; return false; }
  if(p1!==p2){ errEl.textContent = "Passwords do not match."; errEl.hidden = false; return false; }
  btn.disabled = true; btn.textContent = "Updating…";
  const { error } = await supabase.auth.updateUser({ password: p1 });
  btn.disabled = false; btn.textContent = "Update password";
  if(error){
    errEl.textContent = authErrorMessage(error, "Could not update your password");
    errEl.hidden = false;
    return false;
  }
  await supabase.auth.signOut();
  showAuthScreen("login");
  toast("Password updated — sign in with your new password");
  return false;
}

async function doSignOut(){
  if(supabase) await supabase.auth.signOut();
}

/* =========================  BOOT  ============================= */
/* Two questions, asked in this order, and never conflated:
     1. "Am I authenticated?" — Supabase Auth already answered that by the
        time startApp() runs.
     2. "Which organization/profile/role do I have?" — answered here, via
        my_profile() first. Querying `organizations` before knowing that
        is what used to produce the misleading "No organization is set up"
        message for a merely-unlinked account (see migrations/
        004_profile_lookup_and_bootstrap.sql for the full explanation). */
async function provisionDirectSignup(user){
  // A direct signup creates its own tenant. The security-definer RPC links the
  // authenticated user to a Partner profile and company atomically; invited
  // employees already have a linked profile and never enter this branch.
  const meta=(user&&user.user_metadata)||{};
  const orgName=String(meta.company_name||"").trim();
  const name=String(meta.full_name||"").trim();
  if(!orgName||!name){
    return false;
  }
  const {error}=await supabase.rpc("provision_signup_company");
  if(error){
    // A repeated auth callback can overlap a successful provisioning request.
    // Recheck only this caller's profile before treating the error as final.
    let linkedRows=null, linkedErr=null;
    try{
      const linkedResult=await supabase.rpc("my_profile");
      linkedRows=linkedResult.data;
      linkedErr=linkedResult.error;
    }catch(err){ linkedErr=err; }
    if(linkedErr){ console.error("[SIGNUP] Post-provision profile recheck failed",linkedErr); throw linkedErr; }
    if(linkedRows?.some(p=>p.auth_user_id===user.id)) return true;
    console.error("[SIGNUP] Tenant provisioning RPC failed",error);
    throw error;
  }
  return true;
}

/* opts.quiet: true whenever the chrome/dashboard is already showing
   something reasonable — either fully loaded earlier this page-life, or
   optimistically painted from the identity cache (see paintFromCache()) —
   so there is no need to blank the screen with the two-step "Confirming
   your account." / "Fetching your firm's data." progress screens while
   this re-verifies. Every actual check below still runs in full every
   time; quiet only ever suppresses those two BENIGN progress screens — any
   real problem (session invalid, deactivated, load error, unmatched
   profile) still shows its normal blocking screen unconditionally, exactly
   as before, so nothing here weakens auth, RLS, or error visibility. */
async function startApp(opts){
  const quiet = !!(opts && opts.quiet);

  $("#authScreen").hidden = true;
  $("#sidebar").hidden = false;
  $("main").hidden = false;
  if(!quiet) renderBlockingScreen("Loading…", "Confirming your account.");

  let user=null, userErr=null;
  try{
    const authResult=await supabase.auth.getUser();
    user=authResult.data?.user||null;
    userErr=authResult.error||null;
  }catch(err){ userErr=err; }
  if(userErr || !user){
    AUTH_UID = null; clearIdentityCache();
    renderBlockingScreen("Session error", "We couldn't confirm your session. Please sign in again.", true, true);
    return;
  }

  // Case C/D split: is this session linked to a profile at all, independent
  // of organization RLS (see my_profile() — it can only ever return the
  // caller's own row, so it works even before any org relationship exists).
  let myRows=null, myErr=null;
  try{
    const profileResult=await supabase.rpc("my_profile");
    myRows=profileResult.data;
    myErr=profileResult.error;
  }catch(err){ myErr=err; }
  if(myErr){
    console.error("[AUTH] Profile lookup failed",myErr);
    renderBlockingScreen("Couldn't load your data",
      "Please check your connection and try again.", true, true);
    return;
  }
  const myRow = (myRows && myRows[0]) || null;

  if(!myRow){
    // A direct signup carries company/name metadata and receives its own
    // tenant. Invited employees have a linked profile and never enter this
    // branch; never infer their role or permissions from login history.
    try{
      if(await provisionDirectSignup(user)) return startApp(opts);
    }catch(err){
      renderBlockingScreen("Couldn't load your data",
        "We couldn't finish loading your workspace. Please try again or contact support.",true,true);
      return;
    }
    renderBlockingScreen("Account not assigned",
      "This login is not linked to an active employee profile. Ask your Partner to invite or assign your account.",true,true);
    return;
  }

  if(!myRow.is_active){
    AUTH_UID = null; clearIdentityCache();
    renderBlockingScreen("Account deactivated",
      "Your employee account has been deactivated. Contact your administrator.", true, true);
    return;
  }

  // Case A: linked and active — load the rest of the firm's data, scoped to
  // the organization this profile actually belongs to.
  // Data loading includes role-aware queries (such as Partner salary history),
  // so set the verified auth UID before those queries run.
  AUTH_UID = user.id;
  if(!quiet) renderBlockingScreen("Loading…", "Fetching your firm's data from Supabase.");
  LOAD_ERROR = null;
  try{
    await loadAppData(myRow.organization_id,myRow.id);
  }catch(err){
    console.error("[AUTH] Employee/company data load failed",err);
    LOAD_ERROR = "Unexpected error while loading: "+(err && err.message ? err.message : String(err));
  }
  if(LOAD_ERROR){
    renderBlockingScreen("Couldn't load your data", LOAD_ERROR, true, true);
    return;
  }

  const myProfile = PEOPLE.find(p=>p.id===myRow.id);
  if(!myProfile){
    renderBlockingScreen("Couldn't load your data",
      "Your profile could not be matched to the loaded organization data. Contact your administrator.",
      true, true);
    return;
  }

  me = myProfile.id;
  AUTH_UID = user.id;
  // First Partners land on Sites & Clients. Other roles keep their normal
  // Today landing page; this decision comes from the verified profile role.
  view = myProfile.role === "partner" ? "clients" : "today";
  refreshMyPunches();
  saveIdentityCache();
  render();
}

async function initAuth(){
  if(!supabase){
    renderBlockingScreen("Couldn't load your data",
      "Supabase is not configured — check VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY.", true, false);
    $("#sidebar").hidden = false; $("main").hidden = false; $("#authScreen").hidden = true;
    return;
  }

  supabase.auth.onAuthStateChange((event, session)=>{
    if(event==="PASSWORD_RECOVERY"){ showAuthScreen("recovery"); return; }
    if(event==="SIGNED_IN" && AUTH_VIEW!=="recovery"){
      // supabase-js re-fires SIGNED_IN for reasons that are not a new
      // sign-in — a tab regaining focus, its own internal session
      // revalidation — not just an actual login. If it's the exact same
      // user we already fully loaded this page-life, that is a redundant
      // re-fire: skip the blocking screens and, throttled, just refresh
      // quietly. A DIFFERENT user id (a real new sign-in, or switching
      // accounts) always gets the full, non-quiet flow — this is what
      // preserves logout/account-switching correctness.
      if(session && session.user && AUTH_UID && session.user.id===AUTH_UID){
        const now = Date.now();
        if(now - LAST_QUIET_REFRESH < 30000) return;
        LAST_QUIET_REFRESH = now;
        startApp({quiet:true});
      } else {
        startApp();
      }
      return;
    }
    if(event==="SIGNED_OUT"){ me=null; DATA_READY=false; AUTH_UID=null; clearIdentityCache(); showAuthScreen("login"); return; }
  });

  let session=null, sessionError=null;
  try{
    const sessionResult=await supabase.auth.getSession();
    session=sessionResult.data?.session||null;
    sessionError=sessionResult.error||null;
  }catch(err){ sessionError=err; }
  if(sessionError){
    renderBlockingScreen("Session error","We couldn't restore your session. Please sign in again.",true,true);
    return;
  }
  if(session){
    // A cached identity for THIS exact user paints the chrome instantly;
    // the real check below still always runs — see startApp()'s header
    // comment. No cache, or a different user than last time on this
    // device/browser: the normal first-time blocking flow, unchanged.
    const cache = loadIdentityCache(session.user.id);
    if(cache){ paintFromCache(cache); LAST_QUIET_REFRESH = Date.now(); }
    startApp({ quiet: !!cache });
  } else {
    showAuthScreen("login");
  }
}

/* The Supabase client is created by the module script below, which (being a
   module) is deferred and runs before DOMContentLoaded but after this classic
   script's top-level code. Wait for that event so `supabase` is defined. */
document.addEventListener("DOMContentLoaded", initAuth);
</script>
<script type="module">
  import { supabase, supabaseUrl, supabaseAnonKey, createPasswordCheckClient } from './supabaseClient.js';
  window.supabase = supabase;
  window.SUPABASE_ANON_KEY = supabaseAnonKey;
  window.EDGE_FN_URL = supabaseUrl ? supabaseUrl.replace(/\/$/, "") + "/functions/v1/create-employee" : "";
  window.createPasswordCheckClient = createPasswordCheckClient;
  // Payslip PDFs: jsPDF is fetched only when someone downloads one.
  window.loadJsPDF = () => import('jspdf').then(m => m.jsPDF);
  // Desktop app only: update notifications (no-op in the browser).
  import './desktopUpdates.js';
</script>
