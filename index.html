async function submitLeaveForm(){
  const typeCode = $("#lvType").value;
  const start = $("#lvStart").value, end = $("#lvEnd").value || start;
  const half = $("#lvHalf").checked;
  const reason = $("#lvReason").value.trim();
  if(!start) return toast("Choose a start date");
  if(end < start) return toast("End date can't be before the start date");
  const range = datesBetween(start, end);
  if(half && range.length > 1) return toast("Half day only applies to a single date — set the same start and end date");
  // Saturdays and holidays are optional working days — no leave is needed for them.
  const dates = range.filter(d=>!isOptionalWorkDay(d));
  if(!dates.length) return toast("Saturdays and holidays are optional working days — no leave is needed");
  if(!reason) return toast("Give a reason for the leave");

  // Friendly pre-check — the DB's UNIQUE(profile_id, leave_date) catches this
  // too, but this gives a clear message before that raw error would.
  const clash = dates.find(d=>LEAVE.some(l=>l.who===me && l.date===d && l.status!=="cancelled" && l.status!=="rejected"));
  if(clash) return toast("You already have a leave request covering "+fmtDate(clash));

  const requestId = (crypto && crypto.randomUUID) ? crypto.randomUUID()
    : ("xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{
        const r=Math.random()*16|0; return (c==="x"?r:(r&0x3|0x8)).toString(16); }));
  const selfCert = CAN.selfCertify();
  const status = selfCert ? "approved" : "pending";
  const nowIso = new Date().toISOString();
  const rows = dates.map(d=>Object.assign({
    organization_id:ORG_ID, profile_id:me, leave_date:d,
    duration_part: half?"half":"full", leave_type:typeCode, status:status, reason:reason, request_id:requestId
  }, selfCert ? { approved_by:me, approved_at:nowIso } : {}));

  const { data, error } = await insertLeaveRows(rows);
  if(error){
    if(/duplicate key|unique/i.test(error.message||"")) return toast("You already have a leave request covering one of these dates");
    return toast("Could not submit — "+error.message);
  }
  data.forEach(l=>LEAVE.push(mapLeaveRow(l)));
  closeModal();
  toast(selfCert ? "Leave recorded and certified — there is nobody above you"
       : (person(me).reportsTo ? "Sent to "+person(person(me).reportsTo).name : "Submitted for approval"));
  render();
}

/* --- attendance / geofencing -----------------------------------------------
   Argument order is always latitude, longitude, latitude, longitude.
   Coordinates and the configured radius are measured in degrees and metres. */
function calculateDistanceMeters(lat1, lon1, lat2, lon2){
  const R=6371000;
  const toRadians=degrees=>degrees*Math.PI/180;
  const dLat=toRadians(lat2-lat1);
  const dLon=toRadians(lon2-lon1);
  const a=Math.sin(dLat/2)**2+
    Math.cos(toRadians(lat1))*Math.cos(toRadians(lat2))*Math.sin(dLon/2)**2;
  const c=2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
  return R*c;
}

/* A device/network location reading of 50-300m+ error is routine indoors or
   on a device with no GPS chip — enableHighAccuracy only asks for the best
   *available* source, it does not guarantee a GPS-grade fix. Comparing
   distance<=radius with zero tolerance for that error is what turns a
   correct "you are inside" position into a false "outside fence". This caps
   how much benefit of the doubt a poor reading can buy, so bad accuracy
   can't quietly swallow the geofence entirely (see req. #20) — it is not
   the same as enlarging the configured radius, which stays exactly as set. */
const ACCURACY_TOLERANCE_CAP_M = 50;

function geofenceCheck(latitude, longitude, accuracy, site){
  const tolerance = Number.isFinite(accuracy) ? Math.min(Math.max(accuracy,0), ACCURACY_TOLERANCE_CAP_M) : 0;
  if(!site || !site.active || !PUNCH_SITES.some(s=>s.id===site.id))
    return {state:"no_site",match:null,nearest:null,tolerance};
  const office={latitude:site.lat,longitude:site.lng};
  const hasValue=value=>value!==null&&value!==undefined&&String(value).trim()!=="";
  if(!hasValue(latitude)||!hasValue(longitude))
    return {state:"invalid_location",reason:"Device coordinates are missing.",match:null,nearest:null,tolerance};
  if(!hasValue(office.latitude)||!hasValue(office.longitude))
    return {state:"invalid_site",reason:"The selected office site is missing latitude or longitude.",match:{site,dist:null},nearest:{site,dist:null},tolerance};

  const userLat=Number(latitude);
  const userLon=Number(longitude);
  const officeLat=Number(office.latitude);
  const officeLon=Number(office.longitude);
  const radiusMeters=Number(site.radius);
    if(!Number.isFinite(userLat)||!Number.isFinite(userLon)||
      Math.abs(userLat)>90||Math.abs(userLon)>180)
     return {state:"invalid_location",reason:"The device returned invalid latitude or longitude coordinates.",match:null,nearest:null,tolerance};
    if(!Number.isFinite(officeLat)||!Number.isFinite(officeLon)||!Number.isFinite(radiusMeters)||
      Math.abs(officeLat)>90||Math.abs(officeLon)>180)
    return {state:"invalid_site",reason:"The selected office site has invalid coordinates or radius.",match:{site,dist:null},nearest:{site,dist:null},tolerance};
  if(officeLat===0||officeLon===0)
    return {state:"invalid_site",reason:"The selected office site has a zero latitude or longitude. Update its coordinates before punching.",match:{site,dist:null},nearest:{site,dist:null},tolerance};
  if(radiusMeters<=0)
    return {state:"invalid_site",reason:"The selected office site has an invalid geofence radius.",match:{site,dist:null},nearest:{site,dist:null},tolerance};

  console.log("[GEOFENCE DEBUG]",{
    userLatitude:userLat,
    userLongitude:userLon,
    officeLatitude:officeLat,
    officeLongitude:officeLon,
  });
  const dist=calculateDistanceMeters(userLat,userLon,officeLat,officeLon);
  const inside=dist<=radiusMeters;
  console.log("[GEOFENCE DEBUG] Distance:",dist,"meters");
  console.log("[GEOFENCE DEBUG] Radius:",radiusMeters,"meters");
  console.log("[GEOFENCE DEBUG] Inside:",inside);

  const match={site,dist};
  if(inside) return {state:"inside",match,nearest:match,tolerance};
  if(dist<=radiusMeters+tolerance) return {state:"inside_uncertain",match,nearest:match,tolerance};
  return {state:"outside",match,nearest:match,tolerance};
}

function stampHTML(p){

    (p.resultMessage?'<p class="tiny" style="margin-top:10px">'+esc(p.resultMessage)+'</p>':"")+

}
/* Requirement: a visible, collapsed-by-default debug section showing exactly
   what was compared — not just the configured office coordinates, but the
   device coordinates actually returned and the resulting calculation.
   Collapsed by default so normal users see the plain-language result only. */
function debugDetailsHTML(p){
  if(!p.debug) return "";
  const d=p.debug;
  const site = d.site;
  return '<details class="tiny" style="margin-top:10px;font-family:var(--mono)">'+
    '<summary class="muted" style="cursor:pointer">Debug details</summary>'+
    '<pre style="white-space:pre-wrap;margin-top:6px">'+esc(
      "Your location\n"+
      "  Latitude: "+(d.lat??"—")+"\n"+
      "  Longitude: "+(d.lng??"—")+"\n"+
      "  Accuracy: "+(Number.isFinite(d.accuracy)?Math.round(d.accuracy)+" m":"unknown")+"\n\n"+
      (site
        ? "Office ("+site.label+")\n  Latitude: "+site.lat+"\n  Longitude: "+site.lng+"\n  Radius: "+site.radius+" m\n\n"
        : "Office\n  No active site with numeric coordinates was found.\n\n")+
      "Calculated distance: "+(d.dist!==null && d.dist!==undefined ? Math.round(d.dist)+" m" : "n/a")+"\n"+
      "Accuracy tolerance applied: "+d.tolerance+" m\n"+
      "Result: "+d.state.toUpperCase()
    )+'</pre></details>';
}
/* Today's-log Result column: don't collapse "no location obtained" and
   "genuinely outside" into the same "outside fence" tag (req. #12) — a
   permission/timeout/GPS error is not the same situation as a distance
   calculation that came out over the radius. */
function resultTag(p){
  if(p.locType==="other") return '<span class="tag info">other place'+
    (Number.isFinite(p.accuracy)?' · ±'+Math.round(p.accuracy)+' m':'')+'</span>';
  if(p.dist===null) return '<span class="tag">location unknown</span>';
  if(p.ok && !p.flagged) return '<span class="tag ok">within fence</span>';
  if(p.ok && p.flagged) return '<span class="tag warn">within fence · low accuracy</span>';
  return '<span class="tag bad">outside fence</span>';
}

/* A rejected punch shows the same Debug details as a recorded one, so the
   coordinates the browser actually returned are visible — not just the verdict. */
function punchFailure(message, debug){
  toast(message);
  const btn=$("#punchBtn");
  if(btn){btn.disabled=false;btn.textContent="Punch "+(punches.length&&punches[punches.length-1].type==="in"?"Out":"In");}
  const result=$("#punchResult");
  if(result) result.innerHTML='<p class="tiny" style="color:var(--red)">'+esc(message)+'</p>'+debugDetailsHTML({debug});
}
function fmtDistance(m){
  return m>=1000 ? Math.round(m)+" m (≈"+(m/1000).toFixed(1)+" km)" : Math.round(m)+" m";
}
/* Above this, the fix is almost certainly network/IP-derived rather than
   GPS/Wi-Fi — the position can be in another city entirely. Only changes
   the message; the punch is still rejected by the same radius check. */
const LOW_ACCURACY_WARN_M = 1000;

async function recordPunch(type, siteId, lat, lng, accuracy){
  const site=PUNCH_SITES.find(s=>s.id===siteId && s.active);
  if(!site) return punchFailure("Select an active office site.");
  let dist=null, ok=false, place=site.label, resultMessage="", locId=site.id, needsReview=true, debug=null;

  const haveFix = lat!==null && lng!==null && Number.isFinite(lat) && Number.isFinite(lng);
  if(!haveFix) return punchFailure("Your current GPS location could not be verified. Please enable location and try again.");
  const check=geofenceCheck(lat,lng,accuracy,site);
  dist=check.match?check.match.dist:null;
  debug={lat,lng,accuracy,dist,tolerance:check.tolerance,state:check.state,
    site:{label:site.label,lat:site.lat,lng:site.lng,radius:site.radius}};
  if(check.state==="invalid_location"||check.state==="invalid_site")
    return punchFailure(check.reason||"The selected office site has invalid location data. Contact an administrator.",debug);
  if(check.state!=="inside"){
    const distance=dist===null?"unknown":fmtDistance(dist);
    const coarse=Number.isFinite(accuracy)&&accuracy>LOW_ACCURACY_WARN_M;
    return punchFailure("You are outside the allowed location for "+site.label+". Current distance: "+
      distance+". Allowed radius: "+site.radius+" m. Your device reported "+
      Number(lat).toFixed(6)+", "+Number(lng).toFixed(6)+
      (Number.isFinite(accuracy)?" (±"+fmtDistance(accuracy)+")":"")+"."+
      (coarse?" That reading is very imprecise — it usually comes from your network/IP address, not GPS. "+
        "Turn on precise location / Wi-Fi, disable any VPN, or punch from your phone.":""),debug);
  }
  ok=true; needsReview=false;
  resultMessage="You are within "+site.label+" ("+Math.round(dist)+" m of "+site.radius+" m).";

  const now=new Date();
  const base = {
    organization_id:ORG_ID, profile_id:me, punch_type:type, punch_timestamp:now.toISOString(),
    punch_date:TODAY, location_id:locId, place_label:place, latitude:lat, longitude:lng,
    distance_meters:dist, is_within_geofence:ok, needs_review:needsReview
  };
  let { data, error } = await supabase.from("attendance_punches")
    .insert({ ...base, accuracy_meters:Number.isFinite(accuracy)?accuracy:null }).select().single();
  if(error && /accuracy_meters/.test(error.message||"")){
    // 006_punch_accuracy.sql (adds attendance_punches.accuracy_meters) has not
    // been applied to this database yet — degrade gracefully rather than
    // breaking Punch In/Out. Accuracy just won't be persisted until it's run.
    console.warn("[geofence] accuracy_meters column not found — run supabase/migrations/006_punch_accuracy.sql. Falling back without it.");
    ({ data, error } = await supabase.from("attendance_punches").insert(base).select().single());
  }
  if(error) return toast("Could not record the punch — "+error.message);
  const rec = { id:data.id, who:me, type, date:TODAY,
    time:String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0"),
    ts:data.punch_timestamp, place, dist, ok, flagged:needsReview, locationId:locId,
    accuracy:Number.isFinite(accuracy)?accuracy:null, resultMessage, debug };
  ALL_PUNCHES_TODAY.push(rec);
  refreshMyPunches();
  // Keep the monthly history table in sync if it's already showing this
  // month — it's a separate on-demand fetch (see loadMyMonthPunches()),
  // not part of ALL_PUNCHES_TODAY, so a fresh punch wouldn't otherwise
  // appear there until the month picker was touched again.
  if(MY_MONTH.month===TODAY.slice(0,7)) MY_MONTH.rows.push(rec);
  render();
  afterPunchRecorded(type);
  const r=$("#punchResult");
  if(r) r.innerHTML = stampHTML(rec) + (ok?"":
    '<p class="tiny muted" style="margin-top:6px">Recorded and flagged for review — nothing is ever rejected.</p>');
}

function doPunch(type){
  if(selectedPunchSiteId===OTHER_PLACE) return startOtherPlacePunch(type);
  const site=PUNCH_SITES.find(s=>s.id===selectedPunchSiteId && s.active);
  if(!site) return punchFailure("Select an active office site.");
  const btn=$("#punchBtn"); if(btn){btn.disabled=true;btn.textContent="Finding you…";}
  /* getDevicePosition (location.js): native GPS via @capacitor/geolocation in
     the mobile app (with permission check/request), navigator.geolocation in
     the browser/desktop app. Options are unchanged: enableHighAccuracy,
     timeout 15s, maximumAge 0 — every punch takes a fresh reading. */
  if(typeof window.getDevicePosition!=="function")
    return punchFailure("Location is still loading — try again in a moment. Punch was not recorded.");
  window.getDevicePosition().then(
    p=>{
      console.log("[GEOFENCE DEBUG] Device position",{
        latitude:p.coords.latitude, longitude:p.coords.longitude,
        accuracy:p.coords.accuracy, timestamp:new Date(p.timestamp).toISOString()
      });
      recordPunch(type,site.id,p.coords.latitude,p.coords.longitude,p.coords.accuracy);
    },
    err=>{
      // Different situations, different messages (req. #12) — a permission
      // refusal, GPS switched off, a timeout and "no GPS" are not "outside the fence".
      console.warn("[geofence] location error",err);
      punchFailure(window.locationErrorMessage(err)+". Punch was not recorded.");
    });
}

/* Best-effort readable address (OpenStreetMap Nominatim). Sends only the
   coordinates; any failure or a slow answer just leaves the address blank —
   the punch never depends on it. Set to false to turn it off. */
const REVERSE_GEOCODE = true;
async function reverseGeocode(lat, lng){
  if(!REVERSE_GEOCODE) return "";
  const ctl = new AbortController(); const t = setTimeout(()=>ctl.abort(), 6000);
  try{
    const r = await fetch("https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&lat="+
      encodeURIComponent(lat)+"&lon="+encodeURIComponent(lng), { signal:ctl.signal, headers:{ "Accept-Language":"en" } });
    if(!r.ok) return "";
    const j = await r.json();
    return typeof j.display_name==="string" ? j.display_name.slice(0,500) : "";
  }catch(e){ return ""; }
  finally{ clearTimeout(t); }
}

/* A confirmed fix older than this is not used — the employee re-captures. */
const OTHER_PLACE_FIX_MAX_AGE_MS = 2*60*1000;
let PENDING_OTHER = null;   // { type, lat, lng, accuracy, at, address }

function startOtherPlacePunch(type){
  const btn=$("#punchBtn"); if(btn){btn.disabled=true;btn.textContent="Finding you…";}
  if(typeof window.getDevicePosition!=="function")
    return punchFailure("Location is still loading — try again in a moment. Punch was not recorded.");
  window.getDevicePosition().then(async p=>{
    const lat=p.coords.latitude, lng=p.coords.longitude, accuracy=p.coords.accuracy;
    if(!Number.isFinite(lat)||!Number.isFinite(lng)||Math.abs(lat)>90||Math.abs(lng)>180)
      return punchFailure("Your current GPS location could not be verified. Punch was not recorded.");
    if(!Number.isFinite(accuracy)||accuracy<0)
      return punchFailure("Your device did not report GPS accuracy. Punch was not recorded.");
    if(btn) btn.textContent="Looking up address…";
    const address = await reverseGeocode(lat, lng);
    PENDING_OTHER = { type, lat, lng, accuracy, at:Date.now(), address };
    if(btn){ btn.disabled=false; btn.textContent="Punch "+(type==="in"?"In":"Out"); }
    const coarse = accuracy>LOW_ACCURACY_WARN_M;
    modal('<h3>Confirm Other Place punch '+(type==="in"?"in":"out")+'</h3>'+
      '<p class="tiny muted" style="margin-bottom:10px">This location comes from your device and cannot be edited.</p>'+
      '<table><tbody>'+
        '<tr><td class="tiny muted">Location</td><td class="num">'+lat.toFixed(6)+', '+lng.toFixed(6)+
          ' <a class="tiny" href="https://www.google.com/maps?q='+lat+','+lng+'" target="_blank" rel="noopener noreferrer">map</a></td></tr>'+
        '<tr><td class="tiny muted">Accuracy</td><td class="num">±'+esc(fmtDistance(accuracy))+'</td></tr>'+
        '<tr><td class="tiny muted">Address</td><td class="tiny">'+(address?esc(address):'<span class="muted">Not available</span>')+'</td></tr>'+
      '</tbody></table>'+
      (coarse?'<p class="tiny" style="color:var(--ochre);margin-top:8px">That reading is very imprecise — it usually comes from your network, not GPS. '+
        'Turn on precise location / Wi-Fi, or punch from your phone, for an accurate record.</p>':'')+
      '<label class="field" style="margin-top:12px"><span>Description (optional)</span>'+
        '<input type="text" id="opNote" maxlength="200" placeholder="e.g. Client visit – ABC Ltd., GST department visit, bank visit"></label>'+
      '<div class="row"><button class="btn ghost" onclick="cancelOtherPlacePunch()">Cancel</button>'+
      '<button class="btn" id="opConfirm" onclick="confirmOtherPlacePunch()">Confirm punch '+(type==="in"?"in":"out")+'</button></div>');
  }, err=>{
    console.warn("[other place] location error",err);
    punchFailure(window.locationErrorMessage(err)+". Punch was not recorded.");
  });
}
function cancelOtherPlacePunch(){ PENDING_OTHER=null; closeModal(); }
async function confirmOtherPlacePunch(){
  const op = PENDING_OTHER;
  if(!op) return closeModal();
  if(Date.now()-op.at > OTHER_PLACE_FIX_MAX_AGE_MS){
    PENDING_OTHER=null; closeModal();
    return punchFailure("That location reading is more than 2 minutes old. Punch again to capture a fresh one.");
  }
  const note = ($("#opNote")?.value||"").trim().slice(0,200);

    organization_id:ORG_ID, profile_id:me, punch_type:op.type, punch_timestamp:now.toISOString(),
    punch_date:TODAY, location_type:"other", location_id:null, place_label:"Other Place",

    location_note:note||null, resolved_address:op.address||null,
    distance_meters:null, is_within_geofence:false, needs_review:false
  }).select().single();
  if(error){
    if(cbtn){ cbtn.disabled=false; cbtn.textContent="Confirm punch "+(op.type==="in"?"in":"out"); }
    return toast("Could not record the punch — "+error.message);
  }
  PENDING_OTHER=null; closeModal();
  const rec = { ...mapPunch(data),
    time:String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0"),
    resultMessage:"Recorded at Other Place"+(data.location_note?" — "+data.location_note:"")+
      " (±"+fmtDistance(op.accuracy)+").", debug:null };
  ALL_PUNCHES_TODAY.push(rec);
  refreshMyPunches();
  if(MY_MONTH.month===TODAY.slice(0,7)) MY_MONTH.rows.push(rec);

  afterPunchRecorded(op.type);

/* Services: one list per organization (job_services, 035). jobs.service_category
   stores the service's code, which is also what the suggested job code uses. */
let SERVICES = [], SERVICES_ERROR = "";
const SVC_COLS = "id,code,name,is_active,sort_order";
const SVC_CODE_RE = /^[A-Z][A-Z0-9]{1,9}$/;   // same as job_services' code check
const mapService = s => ({ id:s.id, code:s.code, name:s.name, active:s.is_active, sort:s.sort_order });
const sortServices = () => SERVICES.sort((a,b)=>(a.sort-b.sort) || a.name.localeCompare(b.name));
const serviceName = code => (SERVICES.find(s=>s.code===code)||{}).name || code || "";

async function loadServices(){
  const org = ORG_ID;
  SERVICES = []; SERVICES_ERROR = "";
  if(!org) return;
  const { data, error } = await supabase.from("job_services").select(SVC_COLS).eq("organization_id", org);
  if(org !== ORG_ID) return;   // signed out / switched account meanwhile
  if(error){ console.error("[SVC] Services load failed — run supabase/migrations/035_job_services.sql.", error); SERVICES_ERROR = error.message || "unknown error"; return; }
  SERVICES = data.map(mapService); sortServices();
}

/* "Statutory Audit" → STATAUD: first word's first 4 characters, then 3 from
   each further word, at most 10; a code already in use gets a digit. */
function serviceCodeFor(name){
  const words = name.toUpperCase().split(/[^A-Z0-9]+/).filter(Boolean);
  let code = words.length===1 ? words[0].slice(0,6)
    : words.map((w,i)=>w.slice(0, i ? 3 : 4)).join("").slice(0,10);
  code = code.replace(/^[0-9]+/, "");
  if(code.length<2) return code;
  const taken = c => SERVICES.some(s=>s.code===c);
  for(let n=2; taken(code) && n<10; n++) code = code.replace(/\d$/, "").slice(0,9)+n;
  return code;
}

/* Searchable service picker in the job form. #njService (hidden) holds the

function svcHighlight(i){
  const opts = document.querySelectorAll("#njServiceList .svc-opt"); if(!opts.length) return;
  svcPick.at = (i + opts.length) % opts.length;
  opts.forEach((o,k)=>o.classList.toggle("on", k===svcPick.at));

function svcKey(e){

async function saveService(){
  const err = m => { const el=$("#nsError"); el.textContent=m; el.hidden=false; };
  if(!CAN.createJob()) return err("Assistant Manager and above can add a service.");
  const name=$("#nsName").value.trim().replace(/\s+/g," "), code=$("#nsCode").value.trim().toUpperCase();
  if(!name) return err("Enter a service name.");
  if(name.length>80) return err("Service name must be 80 characters or fewer.");
  if(!code) return err("Enter a short code.");
  if(!SVC_CODE_RE.test(code)) return err("Short code must be 2–10 letters or digits, starting with a letter.");
  if(SERVICES.some(s=>s.name.trim().toLowerCase()===name.toLowerCase())) return err("A service with this name already exists.");
  if(SERVICES.some(s=>s.code===code)) return err("The short code "+code+" is already used by "+serviceName(code)+".");
  const btn=$("#nsSave"); btn.disabled=true;
  const { data, error } = await supabase.from("job_services")
    .insert({ organization_id:ORG_ID, code, name, sort_order:1000 }).select(SVC_COLS).single();
  btn.disabled=false;
  if(error){
    // Added by someone else since this list was loaded, or blocked by job_services_insert.
    if(error.code==="23505") return err(/code/.test(error.message||"") ? "The short code "+code+" is already in use." : "A service with this name already exists.");
    if(error.code==="42501") return err("You do not have permission to add a service.");
    return err("Could not add the service — "+error.message);
  }
  const row = mapService(data);
  SERVICES.push(row); sortServices();
  svcPick.list.push(row);
  svcCancelAdd();
  svcChoose(row.code);
  toast(row.name+" added");
}

/* =====================  RESPONSIBLE PARTNER (per job code, 042)  ===================== */
/* A client keeps ONE Relationship Partner (clients.relationship_partner_id —
   client ownership, edited only on the client). Each job code has its own
   Responsible Partner (jobs.responsible_partner_id): any active Partner of the
   organization. It defaults to the client's Relationship Partner when that
   person is an active Partner (the client field also accepts AM / Manager).
   Changing it never touches the client. The database enforces the same rules
   (trg_jobs_responsible_partner) and e-mails the partners (job_partner_changed).
   Partners come from org_partners(): profiles RLS hides other-company partners
   from non-partners, which would leave names blank. */
let ORG_PARTNERS = [], ORG_PARTNERS_ERROR = "";
async function loadOrgPartners(){
  const org = ORG_ID;
  ORG_PARTNERS = []; ORG_PARTNERS_ERROR = "";
  if(!org) return;
  const { data, error } = await supabase.rpc("org_partners");
  if(org !== ORG_ID) return;   // signed out / switched account meanwhile
  if(error){
    console.error("[PARTNERS] org_partners() failed — run supabase/migrations/042_job_responsible_partner.sql.", error);
    ORG_PARTNERS_ERROR = error.message || "unknown error";
    // Fall back to the partners this user can see directly.
    ORG_PARTNERS = ALL_PEOPLE.filter(p=>p.role==="partner" && !p.deleted)
      .map(p=>({ id:p.id, name:p.name, companyId:p.companyId, active:p.active }));
    return;
  }
  ORG_PARTNERS = (data||[]).map(p=>({ id:p.id, name:p.full_name, companyId:p.company_id, active:!!p.is_active }));
}
const activeJobPartners = () => ORG_PARTNERS.filter(p=>p.active).sort((a,b)=>a.name.localeCompare(b.name));
const isActiveJobPartner = id => !!id && activeJobPartners().some(p=>p.id===id);
const partnerName = id => {
  if(!id) return "";
  const p = ORG_PARTNERS.find(x=>x.id===id);
  if(p) return p.name + (p.active ? "" : " (inactive)");
  const q = person(id); return q.name!=="—" ? q.name : "";
};
/* The client's Relationship Partner when they are an active Partner, else null. */
const defaultJobPartner = clientId => { const rp = clientOf(clientId).partner; return isActiveJobPartner(rp) ? rp : null; };
const jobPartnerOptions = (selected, exclude) =>
  activeJobPartners().filter(p=>p.id!==exclude).map(p=>'<option value="'+p.id+'"'+(p.id===selected?" selected":"")+'>'+
    esc(p.name)+(COMPANIES.length>1 && p.companyId ? ' — '+esc(companyFullName(p.companyId)) : '')+'</option>').join("");

/* New job form: the Responsible Partner field for the chosen client. */
function njPartnerFieldHTML(clientId){
  const def = defaultJobPartner(clientId);
  const company = clientOf(clientId).companyId || HOME_COMPANY_ID;
  // Without a default anyone who may raise the job has to name a partner.
  const locked = !!def && !CAN.setJobPartner(company);
  const rp = clientOf(clientId).partner;
  return '<label class="field"><span>Responsible Partner *</span><select id="njPartner"'+(locked?' disabled':'')+
      ' onchange="this.dataset.touched=1">'+
      (def ? '' : '<option value="">Choose a partner…</option>')+jobPartnerOptions(def)+'</select></label>'+
    '<p class="tiny muted" style="margin:-6px 0 10px">'+
      (rp ? 'Client\'s relationship partner: '+esc(person(rp).name!=="—" ? person(rp).name : partnerName(rp))+
            (def ? ' (the default)' : ' — not a Partner, so choose who is responsible for this job')
          : 'This client has no relationship partner — choose who is responsible for this job')+
      (locked ? '. Only a Partner, or a Manager for their own company, can choose someone else.' : '.')+
      ' This applies to this job only; the client is not changed.</p>';
}
/* Client changed on the new-job form: re-default the partner unless the user picked one. */
function njClientChanged(){

/* Change Responsible Partner: current → choose → confirm → save that one field.
   Opened from the job card, or from the Edit job form (whose unsaved values
   are put back afterwards). */
let jpState = null;
function changeJobPartner(jid, fromEdit){
  const j = job(jid);
  if(!j.id) return;
  if(!CAN.setJobPartner(j.companyId)) return toast("Only a Partner, or a Manager for their own company's jobs, can change the responsible partner");
  const back = fromEdit ? [...document.querySelectorAll("#modal input[id], #modal select[id]")]
    .map(el=>[el.id, el.value, el.dataset.touched||""]) : null;
  jpState = { jid, back, pick:"" };
  jpChooseStep();
}
function jpHeader(j){
  const rp = clientOf(j.client).partner;
  return '<p class="tiny muted" style="margin:-4px 0 12px"><span class="code">'+esc(j.code)+'</span> — '+esc(j.title)+
    (clientOf(j.client).name ? ' · '+esc(clientOf(j.client).name) : '')+'</p>'+
    '<table style="margin-bottom:12px"><tbody>'+
    '<tr><td class="tiny muted">Current responsible partner</td><td class="strong">'+(j.partner ? esc(partnerName(j.partner)) : '<span class="muted">None</span>')+'</td></tr>'+
    '<tr><td class="tiny muted">Client\'s relationship partner</td><td>'+(rp ? esc(person(rp).name!=="—" ? person(rp).name : partnerName(rp)) : '—')+
      ' <span class="tiny muted">(not changed)</span></td></tr></tbody></table>';
}
function jpChooseStep(){
  const j = job(jpState.jid);
  const opts = jobPartnerOptions(jpState.pick, j.partner);
  modal('<h3>Change Responsible Partner</h3>'+jpHeader(j)+
    (opts
      ? '<label class="field"><span>New responsible partner</span><select id="jpNew">'+
          '<option value="">Choose a partner…</option>'+opts+'</select></label>'
      : '<p class="tiny muted">There is no other active Partner to choose.</p>')+
    '<div class="row"><button class="btn ghost" onclick="jpBack()">'+(jpState.back?'Back':'Cancel')+'</button>'+
    (opts ? '<button class="btn" onclick="jpConfirmStep()">Continue</button>' : '')+'</div>');
}
function jpConfirmStep(){
  const pick = $("#jpNew") ? $("#jpNew").value : "";
  if(!pick) return toast("Choose the new responsible partner");
  jpState.pick = pick;
  const j = job(jpState.jid), c = clientOf(j.client);
  modal('<h3>Confirm change</h3>'+
    '<p style="margin:0 0 10px">Change the responsible partner of <span class="code">'+esc(j.code)+'</span> from <strong>'+
      (j.partner ? esc(partnerName(j.partner)) : 'nobody')+'</strong> to <strong>'+esc(partnerName(pick))+'</strong>?</p>'+
    '<p class="tiny muted">Only this job changes. '+(c.name ? esc(c.name)+'\'s relationship partner and other jobs stay as they are. ' : '')+
      'Both partners are notified by e-mail, and job e-mails go to the new partner from now on.</p>'+
    '<div class="row"><button class="btn ghost" onclick="jpChooseStep()">Back</button>'+
    '<button class="btn" id="jpSave" onclick="saveJobPartner()">Confirm change</button></div>');
}
async function saveJobPartner(){
  const btn = $("#jpSave"); if(btn.disabled) return; btn.disabled = true;
  const j = job(jpState.jid), pick = jpState.pick;
  const { data, error } = await supabase.from("jobs").update({ responsible_partner_id:pick })
    .eq("id", j.id).select("id,responsible_partner_id").maybeSingle();
  btn.disabled = false;
  if(error) return toast("Could not change the responsible partner — "+error.message);
  if(!data) return toast("Could not change the responsible partner — you do not have permission to edit this job");
  j.partner = data.responsible_partner_id;
  toast(j.code+" — responsible partner is now "+partnerName(j.partner));
  jpBack(true);
}
function jpBack(saved){
  const st = jpState; jpState = null;
  if(st && st.back){
    newJob(st.jid);
    st.back.forEach(([id, v, t])=>{
      if(id==="jpNew") return;
      const el = document.getElementById(id); if(!el) return;
      el.value = v; if(t) el.dataset.touched = t;
    });
    return;
  }
  closeModal(); if(saved) render();
}

function currentFY(){
  const [y,m] = TODAY.split("-").map(Number);
  const startY = m>=4 ? y : y-1;                  // Indian FY starts 1 April
  return startY+"-"+String((startY+1)%100).padStart(2,"0");
}

function suggestCode(){
  const cl = CLIENTS.find(c=>c.id===$("#njClient").value);
  const sv = $("#njService").value;
  const pd = $("#njPeriod").value || currentFY();
  const code = (cl?cl.code:"CLIENT")+"/"+sv+"/"+pd;
  $("#njCode").value = code;
  if(!$("#njTitle").dataset.touched) $("#njTitle").value = (sv ? serviceName(sv) : "")+" "+pd;
}

/* New job code, or — with a job id — the same form pre-filled to edit that
   job's stored details. Editing never touches status, tasks, time, costs or
   approvals, and the job code is not re-suggested from client/service/period. */
function newJob(jid){

  const clientList = CLIENTS.filter(c=>c.active);
  if(j && !clientList.some(c=>c.id===j.client) && clientOf(j.client).name) clientList.unshift(clientOf(j.client));
  // editing keeps the job's current service listed even if it is deactivated or no longer in the list
  const services = SERVICES.filter(s=>s.active || (j && s.code===j.service));
  if(j && j.service && !services.some(s=>s.code===j.service)) services.unshift({ code:j.service, name:j.service });
  svcPick = { list:services, hits:[], at:0, suggest:!j };
  const svcCode = j ? (j.service||"") : (services[0] ? services[0].code : "");
  const suggest = j ? '' : ' onchange="njClientChanged()"';
  // Responsible Partner (042): chosen on a new job; on an existing job it is

  const partnerField = j
    ? '<div class="field"><span>Responsible Partner</span>'+
        '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">'+

          (CAN.setJobPartner(j.companyId)
            ? '<button type="button" class="btn ghost sm" onclick="changeJobPartner(\''+j.id+'\',true)">Change Responsible Partner</button>'
            : '<span class="tiny muted">Only a Partner, or a Manager for their own company, can change it.</span>')+

    '<div class="svc-pick">'+
      '<label class="field" style="margin-bottom:0"><span>Service</span>'+
        '<input type="text" id="njServiceSearch" autocomplete="off" role="combobox" aria-controls="njServiceList"'+
        ' placeholder="'+(SERVICES_ERROR ? 'Services could not be loaded' : 'Type to search services')+'"'+
        ' value="'+esc(svcCode ? (services.find(s=>s.code===svcCode)||{name:svcCode}).name : '')+'"'+
        ' onfocus="this.select();svcShowList(\'\')" oninput="svcShowList(this.value)" onkeydown="svcKey(event)" onblur="svcClose()"></label>'+
      '<input type="hidden" id="njService" value="'+esc(svcCode)+'">'+
      '<div class="svc-list" id="njServiceList" role="listbox" hidden></div>'+
      (SERVICES_ERROR ? '<p class="tiny" style="color:var(--red);margin-top:4px">Services could not be loaded — '+esc(SERVICES_ERROR)+'</p>' : '')+
      (CAN.createJob() && !SERVICES_ERROR ?
        '<button type="button" class="svc-add" id="njServiceAddLink" onclick="svcOpenAdd()">+ Add Service</button>'+
        '<div class="svc-new" id="njServiceAdd" hidden>'+
          '<label class="field"><span>Service name *</span><input type="text" id="nsName" maxlength="80" placeholder="e.g. Stock Audit" oninput="svcNameInput()"></label>'+
          '<label class="field"><span>Short code *</span><input type="text" id="nsCode" maxlength="10" placeholder="e.g. STKAUD" oninput="svcCodeInput(this)"></label>'+
          '<p class="tiny muted" style="margin:-6px 0 8px">Used in job codes. 2–10 letters or digits.</p>'+

  if(!j) suggestCode();
}

async function saveJob(editId){
  if(editId){ if(!CAN.editJob()) return toast("Assistant Manager and above can edit a job code"); }
  else if(!CAN.createJob()) return toast("Assistant Manager and above can raise a job code");
  const code=$("#njCode").value.trim(), title=$("#njTitle").value.trim();
  const budgetRaw=$("#njBudget").value.trim(), budget=+budgetRaw;
  const due=$("#njDue").value||TODAY, statDue=$("#njDueStat").value||null;
  const clientId=$("#njClient").value;
  const service=$("#njService").value, period=$("#njPeriod").value.trim()||null;
  if(!service) return toast("Choose a service");
  if(!code) return toast("A job code is required");
  if(ALL_JOBS.some(j=>j.id!==editId && j.code.toUpperCase()===code.toUpperCase())) return toast("That job code already exists");
  if(!title) return toast("Give the job a title");
  if(!budgetRaw) return toast("Enter the budgeted hours");
  if(!(budget>0)) return toast("Budgeted hours must be more than 0");
  // Responsible Partner (new jobs only; 042). The database re-checks all of this.
  const partnerSel = editId ? null : $("#njPartner");
  const partnerId = partnerSel ? partnerSel.value : "";
  if(!editId){
    if(!partnerId) return toast("Choose the responsible partner for this job");
    if(!isActiveJobPartner(partnerId)) return toast("The responsible partner must be an active Partner");
    const def = defaultJobPartner(clientId);
    if(def && partnerId!==def && !CAN.setJobPartner(clientOf(clientId).companyId||HOME_COMPANY_ID))
      return toast("Only a Partner, or a Manager for their own company, can choose a different responsible partner");
  }
  // One save at a time: a second click while the first is in flight is ignored.
  const btn=$("#njSave"); if(btn.disabled) return; btn.disabled=true;
  if(editId){ await updateJob(editId, { code, title, budget, due, statDue, clientId, service, period }); btn.disabled=false; return; }

  const { data, error } = await supabase.from("jobs").insert({
    organization_id:ORG_ID, client_id:clientId, job_code:code, title, status:"open",
    service_category:service, period_fy:period,
    budget_hours:budget, internal_due_date:due, statutory_due_date:statDue,
    // A job belongs to its client's company (the DB trigger, 028, derives the
    // same when company_id is omitted).
    is_overhead:false, opened_by:me, opened_on:TODAY, company_id:clientOf(clientId).companyId||HOME_COMPANY_ID,
    responsible_partner_id:partnerId
  }).select().single();
  btn.disabled=false;
  if(error) return toast("Could not raise the job code — "+error.message);
  JOBS.push({ id:data.id, code, title, client:clientId, status:"open",
    budget, due, statDue, overhead:false, openedBy:me, openedOn:TODAY, companyId:data.company_id,
    service, period:period||"", partner:data.responsible_partner_id||null });
  closeModal(); toast("Raised "+code); go("jobs");
}

/* Edit: UPDATE the existing jobs row — only the form's own fields. Status,
   closing details, opener, tasks, time, costs and approvals are untouched,
   so a closed job stays closed. */
async function updateJob(jid, f){
  const j = job(jid);
  const payload = {
    job_code:f.code, title:f.title, client_id:f.clientId, service_category:f.service, period_fy:f.period,
    budget_hours:f.budget, internal_due_date:f.due, statutory_due_date:f.statDue
  };
  // Company: partners only (the database enforces the same, 028); sent only when changed.
  const companyId = $("#njCompany") ? $("#njCompany").value : j.companyId;
  if(companyId && companyId!==j.companyId) payload.company_id = companyId;
  const { data, error } = await supabase.from("jobs").update(payload).eq("id", jid).select().maybeSingle();
  if(error) return toast(error.code==="23505" ? "That job code already exists" : "Could not save the job code — "+error.message);
  if(!data) return toast("Could not save the job code — you do not have permission to edit it");
  Object.assign(j, { code:data.job_code, title:data.title, client:data.client_id, service:data.service_category||"",
    period:data.period_fy||"", budget:+data.budget_hours||0, due:data.internal_due_date,
    statDue:data.statutory_due_date, companyId:data.company_id });
  closeModal(); toast("Saved changes to "+j.code); render();
}

async function saveTask(jid){
  if(!CAN.createJob()) return toast("Assistant Manager and above can assign tasks");
  if(jobClosed(jid)) return toast(job(jid).code+" is closed — reopen it before assigning tasks");
  const t=$("#ntTitle").value.trim();
  if(!t) return toast("Say what needs doing");
  const who=$("#ntWho").value, due=$("#ntDue").value||TODAY, est=+$("#ntEst").value||1;
  const isPartner = person(me).role === "partner";
  const cost = isPartner && $("#ntCost") ? Math.max(0, +$("#ntCost").value||0) : 0;
  const effMonth = isPartner && $("#ntEffMonth") && $("#ntEffMonth").value ? $("#ntEffMonth").value : TODAY.slice(0,7);

  const initialRespHistory = [{
    id: "rh_"+Date.now()+"_"+Math.random().toString(36).slice(2,7),
    assignedTo: who,
    assignedBy: me,
    fromDate: TODAY,
    toDate: null,
    createdAt: new Date().toISOString()
  }];

  const initialCostHistory = cost > 0 ? [{
    effectiveMonth: effMonth,
    monthlyCost: cost,
    updatedBy: me,
    updatedAt: new Date().toISOString()
  }] : [];

  const insertPayload = {
    organization_id: ORG_ID,
    job_id: jid,
    title: t,
    assigned_to: who,
    assigned_by: me,
    status: "todo",
    due_date: due,
    estimated_hours: est,
    monthly_cost: cost,
    cost_history: initialCostHistory,
    responsibility_history: initialRespHistory
  };

  // One save at a time: a second click while the first is in flight is ignored.
  const btn=$("#ntSave"); if(btn.disabled) return; btn.disabled=true;
  let { data, error } = await supabase.from("tasks").insert(insertPayload).select().single();
  if(error && (error.message.includes("monthly_cost") || error.message.includes("cost_history") || error.message.includes("responsibility_history") || error.message.includes("assigned_by"))){
    delete insertPayload.monthly_cost;
    delete insertPayload.cost_history;
    delete insertPayload.responsibility_history;
    delete insertPayload.assigned_by;
    const retry = await supabase.from("tasks").insert(insertPayload).select().single();
    data = retry.data;
    error = retry.error;
  }
  btn.disabled=false;
  if(error) return toast("Could not add the task — "+error.message);

  TASKS.push({
    id: data.id,
    job: jid,
    title: t,
    who,
    assignedBy: me,
    status: "todo",
    due,
    est,
    monthlyCost: cost,
    costHistory: initialCostHistory,
    responsibilityHistory: initialRespHistory,
    createdAt: data.created_at || new Date().toISOString()
  });
  closeModal(); toast("Task added"); render();
}

let calMonth = TODAY.slice(0,7);
let calSel = null;

function monthShift(n){
  const [y,m]=calMonth.split("-").map(Number);
  const d=new Date(Date.UTC(y,m-1+n,1));
  calMonth=d.toISOString().slice(0,7); calSel=null; render();
}

function tasksOn(who,date){ return TASKS.filter(t=>t.who===who && t.due===date); }
function jobsDueOn(who,date){
  const mine=new Set(ENTRIES.filter(x=>x.who===who).map(x=>x.job));
  return JOBS.filter(j=>!j.overhead && !jobFinished(j) && j.due===date && mine.has(j.id));
}

/* ---- Personal events (033_personal_events.sql) ----------------------------
   Private to the signed-in login. Supabase RLS (user_id = auth.uid()) is what
   keeps them private — the user_id filter below only states the intent, and
   the app never sends user_id (the column defaults to auth.uid()). They live
   in their own list, never merged into tasks, reports or any shared screen.
   Loaded separately from the work data, so a failure here only affects this
   calendar. */
let PERSONAL_EVENTS = [];
let PERSONAL_EVENTS_ERROR = "";
const PE_COLS = "id,title,description,event_date,start_time,end_time,is_all_day";
const mapPersonalEvent = e => ({
  id:e.id, title:e.title, notes:e.description||"", date:e.event_date,
  start:e.start_time ? e.start_time.slice(0,5) : "", end:e.end_time ? e.end_time.slice(0,5) : "", allDay:!!e.is_all_day
});
async function loadPersonalEvents(){
  const uid = AUTH_UID;
  PERSONAL_EVENTS = []; PERSONAL_EVENTS_ERROR = "";
  if(!uid) return;
  const { data, error } = await supabase.from("personal_events").select(PE_COLS)
    .eq("user_id", uid).order("event_date");
  if(uid !== AUTH_UID) return;   // signed out / switched account meanwhile
  if(error){ console.error("[CAL] Personal events load failed", error); PERSONAL_EVENTS_ERROR = error.message || "unknown error"; return; }
  PERSONAL_EVENTS = data.map(mapPersonalEvent);
}
async function retryPersonalEvents(){ await loadPersonalEvents(); render(); }
// All-day first, then by start time; untimed after timed.
function personalEventsOn(date){
  return PERSONAL_EVENTS.filter(e=>e.date===date)
    .sort((a,b)=>(b.allDay-a.allDay) || (a.start||"99").localeCompare(b.start||"99") || a.title.localeCompare(b.title));
}
function peTimeLabel(e){
  if(e.allDay) return "All day";
  return e.start ? e.start+(e.end ? "–"+e.end : "") : "";
}
function peErrorText(error, action){
  const msg = (error && error.message) || "";
  if(/jwt|expired|not authenticated|invalid claim/i.test(msg) || (error && (error.status===401 || error.code==="PGRST301")))
    return "Your session has expired — sign in again.";
  return "Could not "+action+" — "+msg;
}

function personalEventForm(id, date){
  const e = id ? PERSONAL_EVENTS.find(x=>x.id===id) : null;
  if(id && !e) return toast("That event no longer exists");
  const v = e || { title:"", date:date||calSel||TODAY, notes:"" };
  modal('<h3>'+(e?'Edit personal event':'Add personal event')+'</h3>'+
    '<p class="tiny muted" style="margin:-4px 0 12px">Private — only you can see this event.</p>'+
    '<label class="field"><span>Event title *</span><input type="text" id="peTitle" maxlength="200" value="'+esc(v.title)+'"></label>'+
    '<label class="field"><span>Date *</span><input type="date" id="peDate" value="'+esc(v.date)+'"></label>'+
    '<label class="field"><span>Description / notes</span><textarea id="peNotes" rows="3" maxlength="2000">'+esc(v.notes)+'</textarea></label>'+
    '<div class="auth-alert bad" id="peError" hidden></div>'+
    '<div class="row"><button class="btn ghost" onclick="closeModal()">Cancel</button>'+
    '<button class="btn" id="peSave" onclick="savePersonalEvent(\''+(e?e.id:'')+'\')">Save</button></div>');
}
async function savePersonalEvent(id){
  const err = m => { const el=$("#peError"); el.textContent=m; el.hidden=false; };
  const title=$("#peTitle").value.trim(), date=$("#peDate").value, notes=$("#peNotes").value.trim();
  if(!title) return err("Enter an event title.");
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)) return err("Choose a date.");
  // No user_id: ownership comes from the session (column default + RLS).
  // Events are date-only: the time / all-day columns are left at their defaults.
  const payload = { title, description:notes||null, event_date:date };
  const btn=$("#peSave"); btn.disabled=true;
  const { data, error } = id
    ? await supabase.from("personal_events").update(payload).eq("id", id).select(PE_COLS).maybeSingle()
    : await supabase.from("personal_events").insert(payload).select(PE_COLS).single();
  btn.disabled=false;
  if(error) return err(peErrorText(error, "save the event"));
  if(!data) return err("This event no longer exists.");
  const row = mapPersonalEvent(data);
  const i = PERSONAL_EVENTS.findIndex(x=>x.id===row.id);
  if(i>=0) PERSONAL_EVENTS[i]=row; else PERSONAL_EVENTS.push(row);
  calMonth = row.date.slice(0,7); calSel = row.date;
  closeModal(); toast(id ? "Event updated" : "Personal event added"); render();
}
function openPersonalEvent(id){
  const e = PERSONAL_EVENTS.find(x=>x.id===id);
  if(!e) return toast("That event no longer exists");
  const time = peTimeLabel(e);
  modal('<h3>'+esc(e.title)+'</h3>'+
    '<p class="tiny muted" style="margin:-4px 0 12px"><span class="tag">Private</span> Only you can see this event.</p>'+
    '<p style="margin-bottom:6px"><strong>'+fmtDate(e.date)+'</strong>'+(time?' · '+esc(time):'')+'</p>'+
    (e.notes ? '<p class="tiny" style="white-space:pre-wrap;overflow-wrap:break-word;margin-bottom:12px">'+esc(e.notes)+'</p>'
             : '<p class="tiny muted" style="margin-bottom:12px">No notes.</p>')+
    '<div class="row"><button class="btn ghost" onclick="closeModal()">Close</button>'+
    '<button class="btn ghost" onclick="confirmDeletePersonalEvent(\''+e.id+'\')">Delete</button>'+
    '<button class="btn" onclick="personalEventForm(\''+e.id+'\')">Edit</button></div>');
}
function confirmDeletePersonalEvent(id){
  const e = PERSONAL_EVENTS.find(x=>x.id===id); if(!e) return closeModal();
  modal('<h3>Delete this event?</h3>'+
    '<p class="tiny muted" style="margin-bottom:14px">“'+esc(e.title)+'” on '+fmtDate(e.date)+' will be deleted. This cannot be undone.</p>'+
    '<div class="row"><button class="btn ghost" onclick="openPersonalEvent(\''+e.id+'\')">Cancel</button>'+
    '<button class="btn danger" id="peDelete" onclick="deletePersonalEvent(\''+e.id+'\')">Delete</button></div>');
}
async function deletePersonalEvent(id){
  const btn=$("#peDelete"); if(btn) btn.disabled=true;
  const { error } = await supabase.from("personal_events").delete().eq("id", id);
  if(btn) btn.disabled=false;
  if(error) return toast(peErrorText(error, "delete the event"));
  PERSONAL_EVENTS = PERSONAL_EVENTS.filter(x=>x.id!==id);
  closeModal(); toast("Event deleted"); render();
}

/* The client's Relationship Partner by name (client ownership — 042 keeps it
   apart from the job's Responsible Partner). */
const clientRelPartnerName = clientId => {
  const rp = clientOf(clientId).partner;
  return rp ? (person(rp).name!=="—" ? person(rp).name : partnerName(rp)) : "";
};
function sheetAssignment(){
  const rows=[["Job code","Client","Responsible partner","Client relationship partner","Title","Status","Budgeted hrs","Additional approved hrs","Total available hrs",
    "Actual hrs","Variance hrs","Consumed %",
    ...GRADES().map(g=>g+" hrs"),"Chargeable","Internal due"]];
  JOBS.filter(j=>!j.overhead).forEach(j=>{
    const rs=repRows().filter(x=>x.job===j.id);
    const tot=sum(rs.map(x=>+x.hours||0));
    const by=g=>sum(rs.filter(x=>person(x.who).label===g).map(x=>+x.hours||0));
    const extra=jobExtraHours(j.id), avail=jobBudgetTotal(j.id);
    rows.push([j.code, clientOf(j.client).name, partnerName(j.partner), clientRelPartnerName(j.client), j.title, STATUS_LABEL[j.status]||j.status,
      j.budget||0, extra, avail, +tot.toFixed(2), +(avail-tot).toFixed(2),
      avail?+(tot/avail).toFixed(4):0,
      ...GRADES().map(by), "Yes", j.due||""]);
  });
  JOBS.filter(j=>j.overhead).forEach(j=>{
    const tot=sum(repRows().filter(x=>x.job===j.id).map(x=>+x.hours||0));
    // Same columns as the header: hours under "Actual hrs", one blank per designation.
    rows.push([j.code,"—",partnerName(j.partner),"—",j.title,"Open","","","",+tot.toFixed(2),"","",
      ...GRADES().map(()=>""),"No",""]);
  });
  return rows;
}

function sheetEmployee(){
  const rows=[["Person","Grade","Reports to","Total hrs","Chargeable hrs","Non-chargeable hrs",
    "Chargeable %","Days worked","Weeks on record","Tasks open","Tasks done"]];
  const list = repWho==="all" ? PEOPLE : PEOPLE.filter(p=>p.id===repWho);
  list.forEach(p=>{
    const rs=repRows().filter(x=>x.who===p.id);
    const tot=sum(rs.map(x=>+x.hours||0));
    const ch=sum(rs.filter(x=>!job(x.job).overhead).map(x=>+x.hours||0));
    rows.push([p.name, p.label, p.reportsTo?person(p.reportsTo).name:"—",
      +tot.toFixed(2), +ch.toFixed(2), +(tot-ch).toFixed(2),
      tot?+(ch/tot).toFixed(4):0,
      new Set(rs.map(dateOf)).size, new Set(rs.map(x=>x.week)).size,
      TASKS.filter(t=>t.who===p.id&&t.status!=="completed").length,
      TASKS.filter(t=>t.who===p.id&&t.status==="completed").length]);
  });
  return rows;
}

function sheetDaywise(){
  const rows=[["Date","Day","Person","Grade","Job code","Client","Chargeable","Hours","Narration","Status"]];
  repRows().slice().sort((a,b)=>dateOf(a)<dateOf(b)?-1:dateOf(a)>dateOf(b)?1:0).forEach(x=>{
    const j=job(x.job);
    rows.push([dateOf(x), weekdayDate(dateOf(x)), person(x.who).name, person(x.who).label,
      j.code, j.overhead?"—":clientOf(j.client).name, j.overhead?"No":"Yes",
      +(+x.hours).toFixed(2), x.note, x.status]);
  });
  return rows;
}

function sheetTasks(){
  const rows=[["Job code","Client","Responsible partner","Task","Assigned to","Grade","Status","Due date","Days to due","Est. hours"]];
  const list = repWho==="all" ? TASKS : TASKS.filter(t=>t.who===repWho);
  list.forEach(t=>{
    const j=job(t.job);
    rows.push([j.code, clientOf(j.client).name, partnerName(j.partner), t.title, person(t.who).name, person(t.who).label,
      STATUS_LABEL[t.status], t.due, daysTo(t.due), t.est||0]);

  return rows;
}

function repFileSuffix(){
  const whoSlug = repWho==="all" ? "all-staff" : person(repWho).name.replace(/[^a-zA-Z0-9]/g,"-");
  return whoSlug+"-"+repFrom+"-to-"+repTo;

async function exportReportAttendance(){
  const btn = $("#repAttBtn");
  if(btn){ btn.disabled=true; btn.textContent="Building…"; }
  try{
    let query = supabase.from("attendance_punches").select("*")
      .eq("organization_id", ORG_ID)
      .gte("punch_date", repFrom).lte("punch_date", repTo)
      .order("punch_timestamp", {ascending:true});
    if(repWho!=="all") query = query.eq("profile_id", repWho);
    const { data, error } = await query;
    if(error){
      if(btn){ btn.disabled=false; btn.textContent="Download Report"; }
      return toast("Could not build the report — "+error.message);
    }
    const rows = data.map(mapPunch);
    const cap = repTo < TODAY ? repTo : TODAY;
    const days = cap < repFrom ? [] : datesBetween(repFrom, cap);
    const targetPeople = repWho==="all" ? PEOPLE.filter(p=>p.active || rows.some(r=>r.who===p.id)) : PEOPLE.filter(p=>p.id===repWho);

    const summary = [["Date","Person","Grade","Punch in","Punch out","Status"]];
    days.forEach(d=>{
      targetPeople.forEach(p=>{
        const dayRows = rows.filter(x=>x.who===p.id && x.date===d);
        const inP = dayRows.find(x=>x.type==="in");
        const outP = dayRows.slice().reverse().find(x=>x.type==="out");
        const st = attendanceDayStatus(p.id, d, inP, outP);
        summary.push([d, p.name, p.label, inP?inP.time:"", outP?outP.time:"", st.label]);
      });
    });

    const raw = [RAW_PUNCH_HEADER];
    rows.slice().sort((a,b)=>a.ts<b.ts?-1:a.ts>b.ts?1:0).forEach(x=>raw.push(rawPunchRow(x)));

    XLSX.download(FIRM.name.replace(/\s+/g,"-")+"-attendance-report-"+repFileSuffix()+".xlsx", [
      {name:"Daily summary", rows:summary},
      {name:"Raw punches",   rows:raw}
    ]);
    toast("Attendance report downloaded");
  }catch(err){
    toast("Error downloading attendance report: "+err.message);
  }finally{
    if(btn){ btn.disabled=false; btn.textContent="Download Report"; }
  }
}

async function exportAttendanceMonth(){
  const btn = $("#attRepBtn");
  if(btn){ btn.disabled=true; btn.textContent="Building…"; }
  const ym = attRepMonth;
  const [from,to] = monthRange(ym);
  const { data, error } = await supabase.from("attendance_punches").select("*")
    .eq("organization_id", ORG_ID)
    .gte("punch_date", from).lte("punch_date", to)
    .order("punch_timestamp", {ascending:true});
  if(error){
    if(btn){ btn.disabled=false; btn.textContent="Download Report"; }
    return toast("Could not build the report — "+error.message);
  }
  const rows = data.map(mapPunch);
  const cap = to<TODAY ? to : TODAY;
  const days = cap<from ? [] : datesBetween(from, cap);

  const summary=[["Date","Person","Grade","Punch in","Punch out","Status"]];
  days.forEach(d=>{
    PEOPLE.forEach(p=>{
      const dayRows = rows.filter(x=>x.who===p.id && x.date===d);
      const inP = dayRows.find(x=>x.type==="in");
      const outP = dayRows.slice().reverse().find(x=>x.type==="out");
      const st = attendanceDayStatus(p.id, d, inP, outP);
      summary.push([d, p.name, p.label, inP?inP.time:"", outP?outP.time:"", st.label]);
    });
  });

  const raw=[RAW_PUNCH_HEADER];
  rows.slice().sort((a,b)=>a.ts<b.ts?-1:a.ts>b.ts?1:0).forEach(x=>raw.push(rawPunchRow(x)));

  XLSX.download(FIRM.name.replace(/\s+/g,"-")+"-attendance-"+ym+".xlsx", [
    {name:"Daily summary", rows:summary},
    {name:"Raw punches",   rows:raw}

/* Nobody is ever deleted once they have booked time — the timesheets,
   approvals and job costs would lose their author. They are deactivated:
   they can no longer sign in, but history stays intact and reportable. */

/* Highest first, as the Designation dropdown lists them. */

/* Every profile_id/requested_by FK we know about client-side. attendance_punches
   only has TODAY loaded (by design, to keep the query light), so a person whose
   only history is older punches can still hit the ON DELETE RESTRICT at save
   time — doOffboard() surfaces that as a toast rather than corrupting state. */

                         TASKS.some(t=>t.who===id) ||
                         CLAIMS.some(c=>c.who===id) ||
                         BUDGET_REQUESTS.some(b=>b.by===id) ||
                         LEAVE.some(l=>l.who===id) ||
                         NIL_FILED.some(n=>n.who===id) ||
                         ALL_PUNCHES_TODAY.some(p=>p.who===id);
const directReports = id => staff().filter(p=>p.reportsTo===id);
const activePartners = () => ALL_PEOPLE.filter(p=>p.active && p.role==="partner").length;

function wouldCycle(id, boss){
  let cur=boss, n=0;
  while(cur && n++<60){ if(cur===id) return true; cur=person(cur).reportsTo; }
  return false;
}

function suggestCompanyCode(name){
  const base = (name.split(/\s+/).map(w=>w.replace(/[^A-Za-z0-9]/g,"")).filter(Boolean)
    .map(w=>w.length<=4 && w===w.toUpperCase() ? w : w[0]).join("").toUpperCase() || "CO").slice(0,8);
  let code=base, n=2;
  while(COMPANIES.some(c=>c.code.toUpperCase()===code)) code=(base.slice(0,6)+n++);
  return code;
}

/* Suggest a code from the name until the partner types their own. */
function syncCompanyCode(name){
  const k=$("#coCode");
  if(k && !k.dataset.touched) k.value = name.trim() ? suggestCompanyCode(name) : "";
}

/* Pending logo change in the company modal: undefined = unchanged,
   null = remove, string = new data URL. */
let COMPANY_LOGO_PENDING;
function showCompanyLogo(src){
  const img=$("#coLogoPreview"), rm=$("#coLogoRemove");
  if(!img) return;
  img.style.display = src ? "" : "none"; if(src) img.src = src;
  if(rm) rm.style.display = src ? "" : "none";
}
function clearCompanyLogo(){ COMPANY_LOGO_PENDING = null; const f=$("#coLogo"); if(f) f.value=""; showCompanyLogo(null); }
/* Scales the chosen image down to at most 480×160 so it stays small. */
function pickCompanyLogo(input){
  const file = input.files && input.files[0];
  if(!file) return;
  if(!/^image\/(png|jpeg)$/.test(file.type)){ input.value=""; return toast("Choose a PNG or JPEG image"); }
  if(file.size > 5*1024*1024){ input.value=""; return toast("That image is larger than 5 MB"); }
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, 480/img.naturalWidth, 160/img.naturalHeight);
      const c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(img.naturalWidth*s)); c.height = Math.max(1, Math.round(img.naturalHeight*s));
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      let url = c.toDataURL("image/png");
      if(url.length > 380000){
        const j = document.createElement("canvas"); j.width=c.width; j.height=c.height;
        const g = j.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,j.width,j.height); g.drawImage(c,0,0);
        url = j.toDataURL("image/jpeg", 0.85);
      }
      if(url.length > 380000){ input.value=""; return toast("That logo is too detailed — use a simpler or smaller image"); }
      COMPANY_LOGO_PENDING = url; showCompanyLogo(url);
    };
    img.onerror = () => { input.value=""; toast("That file could not be read as an image"); };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

  if(!CAN.manageCompanies()) return toast("Only a partner can manage companies");
  const err = msg => { const el=$("#coError"); if(el){ el.textContent=msg; el.hidden=false; } return false; };
  const name=$("#coName").value.trim().replace(/\s+/g," ");
  const code=$("#coCode").value.trim().toUpperCase();
  if(!name) return err("Enter the company name");
  if(!code) return err("Enter a short code");
  if(!/^[A-Z0-9][A-Z0-9&.\-]{0,19}$/.test(code)) return err("Short code: letters, digits, & . - only, no spaces");
  if(COMPANIES.some(c=>c.id!==id && c.name.toLowerCase()===name.toLowerCase())) return err("A company with this name already exists");
  if(COMPANIES.some(c=>c.id!==id && c.code.toUpperCase()===code)) return err("That code is already used");
  const btn=$("#coSave"); if(btn) btn.disabled=true;
  const fields = { name, code };
  if(COMPANY_LOGO_PENDING !== undefined) fields.logo_data_url = COMPANY_LOGO_PENDING;
  const q = id
    ? supabase.from("companies").update(fields).eq("id", id).select("id,code,name,is_active,created_at").single()
    : supabase.from("companies").insert({ organization_id:ORG_ID, ...fields }).select("id,code,name,is_active,created_at").single();
  const { data, error } = await q;
  if(btn) btn.disabled=false;
  if(error) return err(/duplicate|unique/i.test(error.message||"") ? "A company with this name or code already exists" : "Could not save — "+error.message);
  const row = { id:data.id, code:data.code, name:data.name, active:data.is_active, createdAt:data.created_at };
  if(COMPANY_LOGO_PENDING !== undefined) COMPANY_LOGO_CACHE[data.id] = COMPANY_LOGO_PENDING;
  if(id){
    Object.assign(COMPANIES.find(c=>c.id===id), row);
    // keep the text code on this company's people in step (profiles.company, 008)
    ALL_PEOPLE.filter(p=>p.companyId===id).forEach(p=>{ p.company=row.code; });
    const { error:codeErr } = await supabase.from("profiles").update({ company:row.code })
      .eq("organization_id", ORG_ID).eq("company_id", id);
    if(codeErr) console.warn("[companies] profiles.company not refreshed", codeErr);
  } else COMPANIES.push(row);
  if(id===HOME_COMPANY_ID) saveIdentityCache();
  closeModal(); toast(id ? "Saved" : name+" added"); render();
}

async function setCompanyActive(id, active){
  if(!CAN.manageCompanies()) return toast("Only a partner can manage companies");
  const c = COMPANIES.find(x=>x.id===id); if(!c) return;
  if(!active && ALL_PEOPLE.some(p=>p.active && p.companyId===id))
    return toast(c.name+" still has active employees — move or deactivate them first");
  if(!active && activeCompanies().length<=1) return toast("At least one company must stay active");
  const { error } = await supabase.from("companies").update({ is_active:active }).eq("id", id);
  if(error) return toast("Could not update — "+error.message);
  c.active = active;
  toast(c.name+(active?" activated":" deactivated"));
  render();
}

async function savePerson(id){
  if(!CAN.manageTeam()) return toast("Only a partner can change the team");
  const name=$("#pfName").value.trim();
  // Designation (044): the chosen title and the access level it carries.
  const desig=parseDesignationChoice($("#pfRole").value);
  if(!desig) return toast("Choose a designation");
  const role=desig.role, designationId=desig.designationId;
  const boss=$("#pfBoss").value||null;
  const code=$("#pfCode").value.trim();
  const companyId=$("#pfCompany") ? $("#pfCompany").value : "";
  const selectedCompany=COMPANIES.find(c=>c.id===companyId);
  const ctc=Math.max(0,+$("#pfCTC").value||0);
  const email=$("#pfEmail").value.trim(), joined=$("#pfJoined").value;
  const cost=Math.max(0,+$("#pfCost").value||0), bill=Math.max(0,+$("#pfBill").value||0);
  if(!name) return toast("Enter a name");
  if(!code) return toast("An employee code is required");
  if(ALL_PEOPLE.some(p=>p.id!==id && !p.deleted && p.code===code)) return toast("That employee code is already used");
  if(id && wouldCycle(id, boss)) return toast("That makes a loop in the reporting line");
  if(id && boss===id) return toast("Nobody reports to themselves");
  if(!selectedCompany) return pfShowError("Select a company");

  if(id){
    const p=person(id);
    const companyChanged = companyId!==p.companyId;
    if(companyChanged && !selectedCompany.active) return pfShowError("That company is inactive — choose an active company");
    const effective=($("#pfEffective") && $("#pfEffective").value) || TODAY;
    if(!validISODate(effective)) return pfShowError("Choose a valid effective date");
    const company=selectedCompany.code;
    if(p.id===me && (role!==p.role || (designationId && designationId!==p.designationId)))
      return toast("You cannot change your own designation — ask another partner");
    if(p.role==="partner" && role!=="partner" && activePartners()<=1)
      return toast("The firm would be left without a partner to approve anything");
    const updatePayload = {
      full_name:name, employee_code:code, contact_email:email, role,
      reports_to:boss, joining_date:joined, cost_per_hour:cost, bill_rate_per_hour:bill,
      company, company_id:companyId
    };
    // The database derives role from the designation (trg_profiles_designation_sync).
    if(designationId) updatePayload.designation_id = designationId;
    const { error } = await supabase.from("profiles").update(updatePayload).eq("id", id);
    if(error) return toast("Could not save — "+error.message);
    // A new company and/or CTC starts a new salary record from the effective
    // date. Earlier rows keep their CTC and their company. Same-date edits
    // correct that date's record instead of adding a duplicate.
    const oldCtc=salaryAt(id, effective);
    if(companyChanged || oldCtc!==ctc){
      const {data:salaryRow,error:salaryError}=await supabase.from("employee_salary_history").upsert({
        organization_id:ORG_ID,profile_id:id,company_id:companyId,monthly_ctc:ctc,effective_from:effective,created_by:me
      },{onConflict:"profile_id,effective_from"}).select("id,profile_id,monthly_ctc,effective_from,company_id").single();
      if(salaryError) return toast("Profile saved, but salary history could not be saved — "+salaryError.message);
      SALARY_HISTORY=SALARY_HISTORY.filter(s=>!(s.who===id&&s.effective===salaryRow.effective_from));
      SALARY_HISTORY.push({id:salaryRow.id,who:id,ctc:+salaryRow.monthly_ctc,effective:salaryRow.effective_from,companyId:salaryRow.company_id});
    }
    closeModal(); toast("Saved");
    // A company move changes which company's lists this person belongs to
    // (and, for yourself, your punch sites) — reload rather than patch.
    if(companyChanged){ await reloadAppData(); return; }
    Object.assign(p,{ name, code, email, role, label:ROLE_LABEL[role], reportsTo:boss,
      joined, cost, bill, company, companyId, ctc:salaryAt(id,TODAY) });
    if(designationsReady()){
      const d = designationId ? DESIG_LIST.find(x=>x.id===designationId) : builtinDesignation(role);
      p.designationId = d ? d.id : null; p.designation = d ? d.name : "";
    }
    if(p.id===me) saveIdentityCache();
    return render();
  }

  // New employee: their Supabase Auth account + linked profile are created
  // together by the create-employee Edge Function (service-role key, never
  // exposed here), not by inserting into `profiles` directly — see
  // migrations/003_auth_integration.sql for why the client can't do that insert.
  if(!selectedCompany.active) return pfShowError("That company is inactive — choose an active company");
  if(!email) return pfShowError("Enter an email address");
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return pfShowError("Enter a valid email address");
  const pw1=$("#pfPassword").value, pw2=$("#pfPassword2").value;
  if(pw1.length<8) return pfShowError("Password must be at least 8 characters");
  if(pw1!==pw2) return pfShowError("Passwords do not match");

  const btn=$("#pfSaveBtn");
  if(btn){ btn.disabled=true; btn.textContent="Creating employee..."; }
  const result = await createEmployeeAccount({
    fullName:name, email, password:pw1, employeeCode:code, role, companyId,
    reportsTo:boss, joiningDate:joined, costPerHour:cost, billRatePerHour:bill, monthlyCtc:ctc
  });
  if(btn){ btn.disabled=false; btn.textContent="Add employee"; }

  if(!result.ok) return pfShowError(result.message);

  const prof = result.profile;
  const assignedCompany=COMPANIES.find(c=>c.id===prof.company_id);
  // The salary record is saved by create-employee together with the profile
  // (rolled back with it on failure). Only an older deployed function that
  // ignores monthlyCtc leaves it to the browser, as before.
  let salaryRow=result.salary;
  if(!result.hasSalary){
    const ins=await supabase.from("employee_salary_history").insert({
      organization_id:ORG_ID,profile_id:prof.id,company_id:prof.company_id,monthly_ctc:ctc,effective_from:joined||TODAY,created_by:me
    }).select("id,profile_id,monthly_ctc,effective_from,company_id").single();
    if(ins.error) return pfShowError("Employee created, but salary history could not be saved — "+ins.error.message);
    salaryRow=ins.data;
  }
  SALARY_HISTORY.push({id:salaryRow.id,who:prof.id,ctc:+salaryRow.monthly_ctc,effective:salaryRow.effective_from,companyId:salaryRow.company_id});

  // create-employee only knows the access level, so the profile starts on that
  // level's standard designation; a custom one is set right after (044).
  let desigNote="";
  let finalDesig = designationsReady() ? builtinDesignation(role) : null;
  if(designationId && (!finalDesig || finalDesig.id!==designationId)){
    const set = await setProfileDesignation(prof.id, designationId);
    if(set.ok) finalDesig = DESIG_LIST.find(x=>x.id===designationId) || finalDesig;
    else desigNote=" Their designation could not be set to "+desig.name+" ("+set.message+") — edit them to set it.";
  }
  PEOPLE.push({ id:prof.id, code, name, email, role, label:ROLE_LABEL[role], reportsTo:boss,
    joined, cost, bill, company:prof.company||assignedCompany?.code||"", companyId:prof.company_id, ctc, active:true, authUserId:prof.auth_user_id,
    designationId:finalDesig?finalDesig.id:null, designation:finalDesig?finalDesig.name:"" });
  closeModal();
  toast(name+" added to "+companyFullName(prof.company_id)+" — they can sign in with the email and password you set."+desigNote);
  render();
}

function pfShowError(msg){
  const el=$("#pfError");
  if(el){ el.textContent=msg; el.hidden=false; } else toast(msg);
  return false;
}

async function createEmployeeAccount(payload){
  try{
    const { data:{ session } } = await supabase.auth.getSession();
    if(!session) return { ok:false, status:401, message:"Your session has expired — sign in again." };
    if(!window.EDGE_FN_URL) return { ok:false, message:"Server is not configured — missing Supabase URL." };
    const res = await fetch(window.EDGE_FN_URL, {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization":"Bearer "+session.access_token,
        "apikey": window.SUPABASE_ANON_KEY || ""
      },
      body: JSON.stringify(payload)
    });
    let body=null;
    try{ body = await res.json(); }catch(_e){}
    if(!res.ok){
      // The function's own { error, detail } is shown as-is (detail is the
      // backend cause — omitted server-side when HIDE_ERROR_DETAILS is set).
      // Fallbacks only apply when the platform gateway, not our code, answered.
      if(body && body.error){
        console.error("[create-employee]", res.status, body);
        return { ok:false, status:res.status, reason:body.reason||"", message: body.error + (body.detail ? " ("+body.detail+")" : "") };
      }
      if(res.status===401) return { ok:false, status:401, message:"Your session has expired. Please sign in again." };
      if(res.status===403) return { ok:false, status:403, message:"You do not have permission to add employees." };
      return { ok:false, status:res.status, message:"Employee could not be created (HTTP "+res.status+"). Please try again." };
    }
    // salary: present when the function saved the first salary record itself
    // (payload.monthlyCtc). password: only for generatePassword (bulk import).
    return { ok:true, profile: body && body.profile, hasSalary: !!(body && body.salary),
             salary: body && body.salary, password: body && body.password };
  }catch(err){
    return { ok:false, network:true, message:"Network error — could not reach the server. Try again." };
  }
}

function offboard(id){
  if(!CAN.manageTeam()) return toast("Only a partner can remove someone");
  const p=person(id);
  if(id===me) return toast("You cannot remove yourself");
  if(p.active && p.role==="partner" && activePartners()<=1)
    return toast("The firm would be left without a partner");

  const reps=directReports(id);
  const openTasks=TASKS.filter(t=>t.who===id && t.status!=="completed");
  const pendSheet=sheetStatus(id)==="submitted";

  let blockers="";
  if(reps.length) blockers+='<li>'+reps.length+' person'+(reps.length>1?"s":"")+' report'+
    (reps.length>1?"":"s")+' to them — reassign first: '+reps.map(r=>esc(r.name)).join(", ")+'</li>';
  if(openTasks.length) blockers+='<li>'+openTasks.length+' open task'+(openTasks.length>1?"s":"")+
    ' still assigned to them</li>';
  if(pendSheet) blockers+='<li>a submitted timesheet is still waiting for approval</li>';

  const deleteBtn='<button class="btn danger" onclick="doOffboard(\''+id+'\',true)">Delete permanently</button>';
  modal('<h3>'+(p.active?'Remove ':'Delete ')+esc(p.name)+'</h3>'+
    (blockers
      ? '<p class="tiny muted" style="margin-bottom:8px">Sort these out first:</p>'+
        '<ul class="tiny" style="margin:0 0 14px 18px;line-height:1.7">'+blockers+'</ul>'+
        '<div class="row"><button class="btn ghost" onclick="closeModal()">Close</button></div>'
      : '<p class="tiny muted" style="margin-bottom:8px">'+(p.active
          ? '<b>Deactivate</b>: they can no longer sign in, and you can reactivate them later.<br>'
          : '')+
        '<b>Delete permanently</b>: they can no longer sign in, they cannot be reactivated, their sign-in account is '+
        'removed, and their employee code ('+esc(p.code||"—")+') and email can be used for a new employee.</p>'+

async function doOffboard(id, hard){
  const p=person(id);
  if(hard){
    const { error } = await supabase.rpc("delete_employee", { p_profile:id });
    if(error) return toast("Could not delete — "+error.message);
    // Kept in PEOPLE (marked deleted) so historical records still show the name.
    p.active=false; p.deleted=true; p.left=p.left||TODAY; p.authUserId=null;
    toast(p.name+" deleted — their code and email can now be reused; history kept");
  } else {
    const { error } = await supabase.from("profiles")
      .update({ is_active:false, exit_date:TODAY }).eq("id", id);
    if(error) return toast("Could not deactivate — "+error.message);
    p.active=false; p.left=TODAY; toast(p.name+" deactivated — history kept");
  }
  closeModal(); render();
}
async function reactivate(id){
  if(person(id).deleted) return toast("A deleted employee cannot be reactivated");
  const { error } = await supabase.from("profiles")
    .update({ is_active:true, exit_date:null }).eq("id", id);
  if(error) return toast("Could not reactivate — "+error.message);
  person(id).active=true; delete person(id).left;
  toast(person(id).name+" reactivated"); render();
}

async function saveClient(id){
  if(!CAN.manageClients()) return toast("Assistant Manager and above can change clients");
  const code=$("#cfCode").value.trim().toUpperCase();
  const name=$("#cfName").value.trim();
  const pan=$("#cfPan").value.trim().toUpperCase();
  const gstin=$("#cfGst").value.trim().toUpperCase();
  if(!code) return toast("A short code is required");
  if(!/^[A-Z0-9]{2,8}$/.test(code)) return toast("Short code: 2–8 letters or digits, no spaces");
  if(ALL_CLIENTS.some(c=>c.id!==id && c.code===code)) return toast("That code is already used");
  if(!name) return toast("Enter the client name");
  if(pan && !/^[A-Z]{5}[0-9]{4}[A-Z]$/.test(pan)) return toast("PAN should look like AABCS1234K");
  if(gstin && gstin.length!==15) return toast("A GSTIN is 15 characters");

  const type=$("#cfType").value.trim();
  if(!type) return toast("Enter the client type (e.g. Private Ltd, OPC, AOP)");
  if(type.length>CLIENT_TYPE_MAX) return toast("The client type can be at most "+CLIENT_TYPE_MAX+" characters");
  const email=$("#cfEmail").value.trim(),
        phone=$("#cfPhone").value.trim(), partner=$("#cfPartner").value;

  if(id){
    const { error } = await supabase.from("clients").update({
      client_code:code, name, entity_type:type, pan, gstin, email, phone, relationship_partner_id:partner
    }).eq("id", id);
    if(error) return toast("Could not save — "+error.message);
    Object.assign(clientOf(id), { code, name, type, pan, gstin, email, phone, partner });
    closeModal(); toast("Saved"); return render();
  }
  const { data, error } = await supabase.from("clients").insert({
    organization_id:ORG_ID, client_code:code, name, entity_type:type, pan, gstin, email, phone,
    relationship_partner_id:partner, onboarded_date:TODAY, is_active:true, company_id:HOME_COMPANY_ID
  }).select().single();
  if(error) return toast("Could not add the client — "+error.message);
  FIRM.setupComplete = true;   // first client completes setup (DB trigger, 031)
  CLIENTS.push({ id:data.id, code, name, type, pan, gstin, email, phone, partner, onboarded:TODAY, active:true, companyId:data.company_id });
  closeModal(); toast(name+" added — you can raise a job code for them now"); render();
}

async function archiveClient(id){
  const open=JOBS.filter(j=>j.client===id && j.status!=="closed");
  if(open.length) return toast(open.length+" job code"+(open.length>1?"s are":" is")+
    " still open for this client");
  const { error } = await supabase.from("clients").update({ is_active:false }).eq("id", id);
  if(error) return toast("Could not archive — "+error.message);
  const siteIds = LOCATIONS.filter(l=>l.client===id).map(l=>l.id);
  if(siteIds.length){
    const { error: siteErr } = await supabase.from("locations").update({ is_active:false }).in("id", siteIds);
    if(siteErr) toast("Client archived, but its sites could not be turned off — "+siteErr.message);
  }
  clientOf(id).active=false;
  LOCATIONS.filter(l=>l.client===id).forEach(l=>l.active=false);
  toast("Archived — history and closed jobs are kept"); render();
}
async function unarchiveClient(id){
  const { error } = await supabase.from("clients").update({ is_active:true }).eq("id", id);

  clientOf(id).active=true; toast("Restored"); render();
