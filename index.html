<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Employee Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>

:root{
  --paper:#B1CB98;
  --card:#FFFFFF;
  --ink:#3a4555;          /* body ink */
  --ink-2:#234163;        /* secondary */
  --ink-3:#56606b;        /* tertiary */
  --rule:#DCE0D9;         /* hairline, ledger rule */
  --rule-2:#EDEFEA;
  --red:#A4243B;          /* adverse / overdue — used sparingly */
  --red-wash:#FBF0F2;
  --ochre:#c57021;        /* caution */
  --ochre-wash:#FBF4E6;
  --green:#2E6B4F;        /* settled / approved */
  --green-wash:#EDF4F0;
  --blue-wash:#EEF2F7;

  --r:12px;
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --serif:"Newsreader",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans);
  background:var(--paper);
  color:var(--ink);
  font-size:14px;
  line-height:1.5;
  display:flex;
  min-height:100vh;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* ---------- ledger numerals ---------- */
.num,.code,td.num,th.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* ==========================  SIDEBAR  ============================= */
#sidebar{
  width:212px;flex:0 0 212px;
  background:var(--card);
  border-right:1px solid var(--rule);
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;
}
#sidebar[hidden]{display:none}
.brand{padding:18px 18px 14px;border-bottom:1px solid var(--rule)}
.brand-mark{
  font-family:var(--serif);font-size:19px;font-weight:600;
  letter-spacing:-.015em;line-height:1.15;
}
.brand-sub{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-3);margin-top:5px;
}
.nav{padding:12px 10px;flex:1;overflow-y:auto}
.nav-label{
  font-family:var(--mono);font-size:9px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3);
  padding:12px 8px 6px;
}
.nav-item{
  display:flex;align-items:center;gap:9px;width:100%;
  padding:7px 8px;border-radius:var(--r);text-align:left;
  color:var(--ink-2);font-size:13.5px;
}
.nav-item:hover{background:var(--paper);color:var(--ink)}
.nav-item[aria-current="page"]{background:var(--blue-wash);color:var(--ink);font-weight:500}
.nav-item .dot{
  width:5px;height:5px;border-radius:50%;background:var(--ink-3);flex:0 0 5px;
}
.nav-item[aria-current="page"] .dot{background:var(--ink)}
.nav-item .badge{
  margin-left:auto;font-family:var(--mono);font-size:10px;
  background:var(--red);color:#fff;padding:1px 5px;border-radius:8px;
}
.whoami{border-top:1px solid var(--rule);padding:12px}
.whoami label{
  display:block;font-family:var(--mono);font-size:9px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:5px;
}
.whoami select{
  width:100%;padding:6px 7px;border:1px solid var(--rule);
  border-radius:var(--r);background:var(--paper);font-size:12.5px;
}
.whoami .hint{font-size:11px;color:var(--ink-3);margin-top:6px;line-height:1.35}
.whoami-name{font-size:13px;font-weight:500;color:var(--ink)}

/* ==========================  AUTH / LOGIN  ============================= */
.auth-screen{
  width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:24px;background:var(--paper);
  background-image:repeating-linear-gradient(to bottom,transparent 0 27px,var(--rule-2) 27px 28px);
}
.auth-screen[hidden]{display:none}
.auth-card{
  width:min(380px,100%);background:var(--card);border:1px solid var(--rule);
  border-radius:var(--r);padding:28px 26px;box-shadow:0 18px 50px rgba(27,42,65,.12);
}
.auth-brand{text-align:center;margin-bottom:22px}
.auth-mark{font-family:var(--serif);font-size:23px;font-weight:600;letter-spacing:-.015em}
.auth-sub{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-3);margin-top:5px;
}
.auth-title{font-family:var(--serif);font-size:18px;font-weight:600;margin-bottom:14px}
.auth-alert{
  font-size:12.5px;padding:8px 10px;border-radius:var(--r);margin-bottom:14px;line-height:1.4;
}
.auth-alert.bad{background:var(--red-wash);color:var(--red);border:1px solid #E3C2C9}
.auth-alert.ok{background:var(--green-wash);color:var(--green);border:1px solid #BFD6C9}
.auth-submit{width:100%;padding:8px 13px;margin-top:4px}
.auth-link{
  display:block;width:100%;text-align:center;margin-top:14px;font-size:12.5px;
  color:var(--ink-2);text-decoration:underline;text-underline-offset:2px;
}
.auth-link:hover{color:var(--ink)}
.pw-wrap{position:relative}
.pw-wrap input{padding-right:56px}
.pw-toggle{
  position:absolute;right:5px;top:50%;transform:translateY(-50%);
  font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-2);padding:4px 7px;border-radius:3px;
}
.pw-toggle:hover{background:var(--paper)}
@media (max-width:860px){.auth-card{padding:22px 18px}}

/* ==========================  MAIN  ============================= */
main{
  flex:1;min-width:0;
  /* the ledger rule — faint horizontal ruling behind everything */
  background-image:repeating-linear-gradient(
    to bottom,transparent 0 27px,var(--rule-2) 27px 28px);
}
main[hidden]{display:none}
.topbar{
  display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
  padding:22px 28px 16px;border-bottom:1px solid var(--rule);
  background:var(--paper);
}
h1{font-family:var(--serif);font-size:25px;font-weight:500;letter-spacing:-.02em}
.topbar .sub{color:var(--ink-2);font-size:13px}
.topbar .spacer{flex:1}
.mobile-menu-toggle,.mobile-nav-close,.mobile-nav-backdrop{display:none}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.company-ctx{min-width:0;max-width:100%}
.company-ctx .company-name{font-size:13px;font-weight:600;color:var(--ink-2)}
.company-switch select{width:auto;max-width:260px;min-width:0;padding:5px 28px 5px 9px;font-size:13px;font-weight:600}
.view{padding:22px 28px 60px;max-width:1180px}
.view[hidden]{display:none}

/* ==========================  PRIMITIVES  ============================= */
.card{
  background:var(--card);border:1px solid var(--rule);
  border-radius:var(--r);padding:16px 18px;
}
.card + .card{margin-top:14px}
.payslip .ps-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:10px}
.payslip .ps-co{font-family:var(--serif);font-size:19px;font-weight:600}
.payslip .ps-title{text-align:right}
.payslip .ps-month{font-size:15px;font-weight:600}
.payslip .ps-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 18px;margin:14px 0}
.payslip .ps-kv{display:flex;justify-content:space-between;gap:10px;font-size:13px;border-bottom:1px dotted var(--rule);padding:4px 0;min-width:0}
.payslip .ps-kv span{color:var(--ink-3)}
.payslip .ps-kv strong{text-align:right;overflow-wrap:anywhere}
.payslip .ps-cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.payslip .ps-total td{font-weight:700;border-top:1px solid var(--ink)}
.payslip .ps-net{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px;padding:12px 14px;border-radius:var(--r);background:var(--blue-wash,#eef2fa)}
.payslip .ps-net-amt{font-size:22px;font-weight:700;font-family:var(--mono)}
.payslip .ps-att{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;font-size:12.5px}
@media (max-width:860px){ .payslip .ps-grid,.payslip .ps-cols{grid-template-columns:1fr} .payslip .ps-title{text-align:left} }
/* Today summary cards sit in a grid, so the stacked-card margin above must
   not apply there — it pushed "Your week" 14px below "Attendance". */
.today-cards > .card{margin-top:0}
.card-link{cursor:pointer;transition:border-color .15s,box-shadow .15s}
.card-link:hover{border-color:var(--ink-3);box-shadow:0 2px 10px rgba(27,42,65,.08)}
.card-link:focus-visible{outline:2px solid var(--blue,#2457c5);outline-offset:2px}
.card-link .link-text{text-decoration:underline;text-underline-offset:2px}
.card-head{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.card-head h2{
  font-family:var(--serif);font-size:16.5px;font-weight:600;letter-spacing:-.01em;
}
.card-head .spacer{flex:1}
.eyebrow{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3);
}
.grid{display:grid;gap:14px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.muted{color:var(--ink-2)}
.tiny{font-size:12px}

.btn{
  border:1px solid var(--ink);background:var(--ink);color:#fff;
  padding:6px 13px;border-radius:var(--r);font-size:13px;font-weight:500;
}
.btn:hover{opacity:.88}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn.ghost:hover{background:var(--paper);opacity:1;border-color:var(--ink-3)}
.btn.danger{background:var(--red);border-color:var(--red)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.text-link{color:var(--ink);text-decoration:underline;text-underline-offset:2px;font-weight:500}
.text-link:hover{color:var(--green)}

.tag{
  display:inline-flex;align-items:center;gap:5px;
  font-family:var(--mono);font-size:10px;letter-spacing:.06em;
  text-transform:uppercase;padding:2px 7px;border-radius:2px;
  border:1px solid var(--rule);color:var(--ink-2);background:var(--card);
  white-space:nowrap;
}
.tag.ok{color:var(--green);border-color:#BFD6C9;background:var(--green-wash)}
.tag.warn{color:var(--ochre);border-color:#E4D2A8;background:var(--ochre-wash)}
.tag.bad{color:var(--red);border-color:#E3C2C9;background:var(--red-wash)}
.tag.info{color:#3A5578;border-color:#C6D3E3;background:var(--blue-wash)}

.tabbar{display:flex;gap:20px;margin-bottom:16px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.tab{
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  padding:0 0 9px;color:var(--ink-3);border:none;background:transparent;
  border-bottom:2px solid transparent;cursor:pointer;
}
.tab:hover{color:var(--ink)}
.tab[aria-current="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.tab .count{color:var(--ink-3)}

table{width:100%;border-collapse:collapse}
.table-wrap{max-width:100%}              /* scrolls sideways on mobile only — see the 860px block */
th{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-3);text-align:left;
  padding:0 10px 7px 0;font-weight:500;border-bottom:1px solid var(--rule);
}
td{padding:9px 10px 9px 0;border-bottom:1px solid var(--rule-2);vertical-align:middle}
tr:last-child td{border-bottom:none}
th.r,td.r{text-align:right}
th:last-child,td:last-child{padding-right:0}   /* keep a gap after right-aligned columns, none at the table edge */
.code{font-size:12px;color:var(--ink-2)}
.strong{font-weight:500}

input[type=text],input[type=number],input[type=date],input[type=email],input[type=password],select,textarea{
  border:1px solid var(--rule);border-radius:var(--r);
  padding:5px 8px;background:var(--card);width:100%;font-size:13px;
}
input:disabled,select:disabled{background:var(--rule-2);color:var(--ink-3)}
label.field{display:block;margin-bottom:11px}
label.field > span{
  display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:4px;
}

/* ======================================================================
   SIGNATURE ELEMENT — the budget scale.
   A ruled scale, not a progress bar. The track runs to 125% of budget so
   an overrun is *visible* rather than clipped at a full bar. The 100 line
   is a hard rule; anything past it is hatched in ledger red.
   ====================================================================== */
.scale{position:relative;height:26px;margin:4px 0 2px}
.scale-track{
  position:absolute;inset:6px 0 8px;background:var(--rule-2);
  border:1px solid var(--rule);border-radius:1px;overflow:hidden;
}
.scale-fill{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}
.scale-fill.warn{background:var(--ochre)}
.scale-fill.over{background:var(--red)}
.scale-over{
  position:absolute;top:0;bottom:0;
  background:repeating-linear-gradient(45deg,
    var(--red) 0 3px,transparent 3px 6px);
  opacity:.85;
}
.scale-tick{
  position:absolute;top:2px;bottom:4px;width:1px;background:var(--ink-3);opacity:.5;
}
.scale-tick.hard{background:var(--ink);opacity:1;top:0;bottom:2px;width:1.5px}
.scale-legend{
  position:relative;height:12px;font-family:var(--mono);
  font-size:9px;color:var(--ink-3);
}
.scale-legend span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.scale-legend span.hard{color:var(--ink);font-weight:500}

/* ---------- attendance stamp ---------- */
.stamp{
  border:1.5px solid var(--green);color:var(--green);
  border-radius:var(--r);padding:10px 14px;display:inline-block;
  transform:rotate(-1.1deg);background:var(--green-wash);
}
.stamp.out{border-color:var(--red);color:var(--red);background:var(--red-wash)}
.stamp .t{font-family:var(--mono);font-size:22px;font-weight:500;letter-spacing:-.02em}
.stamp .l{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase}

.kpi{font-family:var(--mono);font-size:27px;font-weight:500;letter-spacing:-.03em;line-height:1.1}
.kpi.bad{color:var(--red)}
.kpi.warn{color:var(--ochre)}
.kpi-label{font-size:12px;color:var(--ink-2);margin-top:3px}

.empty{
  padding:26px;text-align:center;color:var(--ink-2);font-size:13px;
  border:1px dashed var(--rule);border-radius:var(--r);
}

/* ---------- modal ---------- */
.veil{
  position:fixed;inset:0;background:rgba(27,42,65,.34);
  display:flex;align-items:center;justify-content:center;padding:20px;z-index:60;
}
.veil[hidden]{display:none}
.modal{
  background:var(--card);border-radius:var(--r);width:min(460px,100%);
  padding:20px 22px;border:1px solid var(--rule);
  box-shadow:0 18px 50px rgba(27,42,65,.2);
}
.modal h3{font-family:var(--serif);font-size:18px;font-weight:600;margin-bottom:4px}
.modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}

/* ---------- feedback drawer ---------- */
#fbToggle{
  position:fixed;right:0;bottom:26px;z-index:50;
  background:var(--ink);color:#fff;padding:8px 13px;
  border-radius:var(--r) 0 0 var(--r);font-size:12.5px;font-weight:500;
  box-shadow:0 3px 14px rgba(27,42,65,.18);
}
#fbDrawer{
  position:fixed;right:0;top:0;bottom:0;width:min(360px,100%);z-index:70;
  background:var(--card);border-left:1px solid var(--rule);
  display:flex;flex-direction:column;box-shadow:-8px 0 32px rgba(27,42,65,.13);
}
#fbDrawer[hidden]{display:none}
.fb-head{padding:16px 18px;border-bottom:1px solid var(--rule)}
.fb-list{flex:1;overflow-y:auto;padding:12px 18px}
.fb-note{border-bottom:1px solid var(--rule-2);padding:9px 0;font-size:13px}
.fb-note .where{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.fb-foot{padding:14px 18px;border-top:1px solid var(--rule)}
.fb-foot textarea{min-height:74px;resize:vertical;margin-bottom:8px}

/* ---------- toast ---------- */
#toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:9px 16px;border-radius:var(--r);
  font-size:13px;z-index:90;box-shadow:0 6px 20px rgba(27,42,65,.25);
}
#toast[hidden]{display:none}

@media (max-width:860px){
  body{flex-direction:column;overflow-x:hidden}
  #sidebar{
    position:fixed;z-index:101;left:0;top:0;bottom:0;
    width:min(304px,86vw);height:100vh;height:100dvh;flex:0 0 auto;
    transform:translateX(-105%);visibility:hidden;
    transition:transform .2s ease,visibility .2s ease;
    border-right:1px solid var(--rule);box-shadow:8px 0 28px rgba(27,42,65,.14);
  }
  #sidebar.mobile-open{transform:translateX(0);visibility:visible}
  #sidebar .brand{display:grid;grid-template-columns:minmax(0,1fr) 40px;align-items:center}
  #sidebar .brand-mark,#sidebar .brand-sub{grid-column:1}
  #sidebar .brand-mark{grid-row:1}
  #sidebar .brand-sub{grid-row:2}
  .mobile-nav-close{
    display:flex;grid-column:2;grid-row:1/3;align-items:center;justify-content:center;
    width:40px;height:40px;border:1px solid var(--rule);border-radius:var(--r);
    background:var(--card);font-size:25px;line-height:1;color:var(--ink-2);
  }
  .mobile-nav-close:hover{background:var(--paper);color:var(--ink)}
  .mobile-nav-backdrop{
    display:block;position:fixed;inset:0;z-index:100;
    background:rgba(27,42,65,.38);border:0;
  }
  .mobile-nav-backdrop[hidden]{display:none!important}
  .nav{display:block;overflow-y:auto;overscroll-behavior:contain}
  .nav-label{display:block}
  .nav-item{width:100%;min-height:42px}
  .mobile-menu-toggle{
    display:flex;grid-column:1;grid-row:1/4;align-items:center;justify-content:center;
    width:40px;height:40px;border:1px solid var(--rule);border-radius:var(--r);
    background:var(--card);color:var(--ink);
  }
  .mobile-menu-toggle:hover{background:var(--blue-wash)}
  .hamburger-icon{display:flex;flex-direction:column;gap:4px;width:18px}
  .hamburger-icon i{display:block;height:2px;width:100%;border-radius:1px;background:currentColor}
  .topbar{
    display:grid;grid-template-columns:40px minmax(0,1fr);align-items:center;
    gap:3px 10px;padding:12px 16px;
  }
  .topbar h1{grid-column:2;grid-row:1;font-size:22px;min-width:0;overflow-wrap:anywhere}
  .topbar .sub{grid-column:2;grid-row:2;min-width:0;overflow-wrap:anywhere}
  .topbar .spacer{display:none}
  .topbar .company-ctx{grid-column:2;grid-row:3;justify-self:start;min-width:0;max-width:100%}
  .company-switch select{max-width:100%}
  .topbar #todayStamp{grid-column:2;grid-row:4;justify-self:start}
  .view{width:100%;max-width:none;min-width:0;padding:16px 14px 48px}
  #views,.card,.grid,.row{min-width:0}
  .grid.g2,.grid.g3{grid-template-columns:1fr}
  /* Tables: every <table> sits in a .table-wrap (added by wrapTables()).
     The wrapper scrolls sideways; the table keeps its natural column widths
     (at least the full width) so headers and values stay aligned and never
     break character-by-character. Only long free-text cells (td.wrap) wrap,
     at word boundaries, and never narrower than 200px. */
  .table-wrap{overflow-x:auto;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;
    max-width:100%;margin-bottom:2px;scrollbar-width:thin}
  .table-wrap>table{width:auto;min-width:100%;font-size:13px}
  .table-wrap th,.table-wrap td{white-space:nowrap;overflow-wrap:normal;word-break:normal}
  .table-wrap th{padding-right:14px}
  .table-wrap td{padding-right:14px}
  .table-wrap th.r,.table-wrap td.r{padding-left:10px}
  .table-wrap th:last-child,.table-wrap td:last-child{padding-right:0}
  .table-wrap td.wrap{white-space:normal;min-width:200px}
  .table-wrap .btn{white-space:nowrap;max-width:none;min-height:30px}
  .table-wrap td select,.table-wrap td input{width:auto;min-width:150px}
  .cal{grid-template-columns:repeat(7,minmax(0,1fr))}
  .cal .cell{min-width:0}
  .line-day{flex-wrap:wrap;min-width:0;overflow-wrap:anywhere}
  .line-day>span:last-of-type{min-width:0;flex:1 1 120px}
  .modal{max-height:calc(100dvh - 32px);overflow-y:auto;padding:16px}
  .modal .row{flex-wrap:wrap}

<script>
/* ======================================================================
   Practice Manager — data is loaded from and saved to Supabase (see
   loadAppData() and boot() near the end of this script).
   ====================================================================== */

/* ---- dates are derived from the system clock, not hardcoded ---- */
function pad2(n){ return String(n).padStart(2,"0"); }
function toISODate(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function mondayOf(d){
  const x = new Date(d);
  const dow = (x.getDay()+6)%7;                // Mon=0 .. Sun=6
  x.setDate(x.getDate()-dow);
  return toISODate(x);
}

const TODAY = toISODate(new Date());
const WEEK  = mondayOf(new Date());             // Monday of the current app week
let TIMESHEET_DATE = TODAY;
let TIMESHEET_WEEK = WEEK;

/* There is deliberately no weekly expected-hours target: nobody is given
   hours automatically (no schedule, no minimum, no FIRM/IDLE padding).
   Hours are booked only against jobs with budgeted/approved hours — see
   jobRemainingHours(). */
const DAY_NAMES = ["Mon","Tue","Wed","Thu","Fri","Sat"];

/* Populated from Supabase by loadAppData(). Nothing below is seed/demo data. */
const FIRM = { name:"", office:null };
let COMPANIES = [];          // every company of the organization this user may see (RLS), active or not
const activeCompanies = () => COMPANIES.filter(c=>c.active);
const companyFullName = companyIdOrCode => {
  const found = COMPANIES.find(c => c.id === companyIdOrCode || c.code === companyIdOrCode);
  return found ? found.name : (companyIdOrCode || FIRM.name || "Company");
};

/* Company context (028_multi_company.sql). An organization owns several
   companies; every employee belongs to one. A partner works across every
   company of the organization and picks which one the app shows with the
   header switcher; everyone else is fixed to their own company. What a user
   may see at all is enforced by Supabase RLS — the switcher only chooses
   which of a partner's authorized companies is on screen.
   ALL_PEOPLE / ALL_JOBS / ALL_CLIENTS hold everything RLS returned (used for
   name lookups); PEOPLE / JOBS / CLIENTS and the other lists hold the active
   company's slice (used by every screen). For a single-company user both are
   the same arrays. */
let ACTIVE_COMPANY_ID = null;
let ALL_PEOPLE = [], ALL_JOBS = [], ALL_CLIENTS = [];

let PEOPLE = [];
/* profiles.role is the employee's designation (030_employee_designations.sql).
   DESIGNATIONS is the list every dropdown, filter and report uses, lowest to
   highest; "accounts" and "admin" are legacy values the app no longer offers. */
const DESIGNATIONS = ["trainee","associate","senior_associate","senior_executive","assistant_manager","manager","partner"];
const ROLE_LABEL = { trainee:"Trainee", associate:"Associate", senior_associate:"Senior Associate",
                     senior_executive:"Senior Executive", assistant_manager:"Assistant Manager",
                     manager:"Manager", partner:"Partner", accounts:"Accounts", admin:"Admin" };
const staff = () => PEOPLE.filter(p=>p.active);

/* Mirrors auth_rank()/profile_rank() in Supabase (030) — keep both in sync. */
const RANK = { partner:90, manager:70, assistant_manager:60, senior_executive:50, accounts:40,
               senior_associate:30, associate:20, trainee:10 };
/* Job code creation and assigning work: Assistant Manager and above. */
const ASSIGN_RANK = RANK.assistant_manager;
/* Designation labels, highest first — the column order of the hours-by-grade reports. */
const GRADES = () => ASSIGNABLE_ROLES.map(r=>ROLE_LABEL[r]);
const CLIENT_TYPES = ["Individual","Proprietor","Partnership","LLP","Private Ltd","Public Ltd","Trust","HUF","Society"];
let CLIENTS = [];

/* Every place someone can legitimately punch in from. client:null = own office. */
let LOCATIONS = [];
let PUNCH_SITES = [];
let selectedPunchSiteId = "";

let JOBS = [];
let PARTNER_TASK_ASSIGNMENTS = [];
let HOLIDAYS = [];
let HOLIDAY_WORKED = [];
let LEAVE = [];
let LEAVE_TYPES = [];
let LEAVE_BALANCES = [];
let SALARY_HISTORY = [];
let MY_SALARY_HISTORY = [];   // the signed-in user's own salary rows (every role; RLS: own rows only)
let salaryMonth = TODAY.slice(0,7);
let salaryEmployee = "all";
let salaryPunches = [];
let salaryDetailId = null;
let salaryLoading = false;

/* One flat list of time entries. day 0 = Monday. */
let ENTRIES = [];

let TASKS = [];
let BUDGET_REQUESTS = [];
let JOB_EXTRA_HOURS = {};   // job id -> approved additional hours (job_approved_extra_hours())
let CLAIMS = [];
let COMPLIANCE = [];
let ALL_PUNCHES_TODAY = [];

let ORG_ID = null;
let LOAD_ERROR = null;
let DATA_READY = false;

/* Shared attendance_punches row -> app shape, so the initial "today only"
   load and the on-demand monthly loaders (own history, partner export)
   stay in exact agreement about field names. */
function mapPunch(pu){
  return {
    id:pu.id, who:pu.profile_id, type:pu.punch_type, date:pu.punch_date,
    time:new Date(pu.punch_timestamp).toTimeString().slice(0,5),
    ts:pu.punch_timestamp, place:pu.place_label, dist:pu.distance_meters==null?null:+pu.distance_meters,
    ok:pu.is_within_geofence, flagged:pu.needs_review, locationId:pu.location_id,
    accuracy:pu.accuracy_meters==null?null:+pu.accuracy_meters
  };
}

/* ===================  SUPABASE DATA LOADING  ===================== */
/* Everything the app shows comes from these tables. There is no
   mock/demo/fallback data — if a table is empty or a query fails, the UI
   shows that state rather than inventing something to fill it in. */
async function loadAppData(orgId, currentProfileId){
  if(!supabase){
    LOAD_ERROR = "Supabase is not configured — check VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY.";
    return;
  }

  // orgId comes from the caller's own linked profile (see startApp()), not a
  // "grab whichever org sorts first" guess — RLS only lets this session see
  // its own organization anyway, but being explicit here avoids relying on
  // that as the sole source of truth.
  const { data: orgs, error: orgErr } = await supabase
    .from("organizations").select("*").eq("id", orgId).limit(1);
  if(orgErr){ console.error("[DATA] Company lookup failed",orgErr); LOAD_ERROR = "Could not load the organization: "+orgErr.message; return; }
  if(!orgs || !orgs.length){
    console.error("[DATA] Company lookup returned no organization",{organizationId:orgId});
    LOAD_ERROR = "Your profile points to an organization that no longer exists. Contact your administrator.";
    return;
  }
  const org = orgs[0];
  ORG_ID = org.id;
  FIRM.name = org.name;

  const [profilesR, companiesR, clientsR, locationsR, jobsR, tasksR, partnerTaskAssignmentsR, entriesR, holidaysR, holidayWorkedR, leavesR,
         budgetR, claimsR, claimLinesR, complianceR, nilR, punchesR] = await Promise.all([
    supabase.from("profiles").select("id,employee_code,full_name,contact_email,role,reports_to,company,company_id,joining_date,exit_date,cost_per_hour,bill_rate_per_hour,is_active,auth_user_id,created_at").eq("organization_id", ORG_ID).order("created_at",{ascending:true}),
    supabase.from("companies").select("id,code,name,is_active,created_at").eq("organization_id", ORG_ID).order("name"),
    supabase.from("clients").select("*").eq("organization_id", ORG_ID).order("created_at",{ascending:true}),
    supabase.from("locations").select("*").eq("organization_id", ORG_ID).order("created_at",{ascending:true}),
    supabase.from("jobs").select("*").eq("organization_id", ORG_ID).order("created_at",{ascending:true}),
    supabase.from("tasks").select("*").eq("organization_id", ORG_ID).order("created_at",{ascending:true}),
    supabase.rpc("partner_task_assignments"),
    supabase.from("timesheet_entries").select("*").eq("organization_id", ORG_ID),
    supabase.from("holidays").select("*").eq("organization_id", ORG_ID),
    supabase.rpc("holiday_worked_days"),
    supabase.from("leaves").select("*").eq("organization_id", ORG_ID),
    supabase.from("budget_requests").select("*").eq("organization_id", ORG_ID),
    supabase.from("expense_claims").select("*").eq("organization_id", ORG_ID),
    supabase.from("expense_claim_lines").select("*"),
    supabase.from("statutory_compliances").select("*").eq("organization_id", ORG_ID),
    supabase.from("nil_timesheets").select("*").eq("organization_id", ORG_ID),
    supabase.from("attendance_punches").select("*").eq("organization_id", ORG_ID).eq("punch_date", TODAY)
  ]);

  const results = [profilesR,companiesR,clientsR,locationsR,jobsR,tasksR,partnerTaskAssignmentsR,entriesR,holidaysR,holidayWorkedR,leavesR,
    budgetR,claimsR,claimLinesR,complianceR,nilR,punchesR];
  const firstErr = results.find(r=>r.error);
  if(firstErr){ console.error("[DATA] Employee/profile/company data query failed",firstErr.error); LOAD_ERROR = "Could not load data from Supabase: "+firstErr.error.message; return; }

  COMPANIES = companiesR.data.map(c=>({id:c.id,code:c.code,name:c.name,active:c.is_active,createdAt:c.created_at}));
  PEOPLE = profilesR.data.map(p=>({
    id:p.id, code:p.employee_code, name:p.full_name, email:p.contact_email||"",
    role:p.role, label:ROLE_LABEL[p.role]||p.role, reportsTo:p.reports_to,
    companyId:p.company_id,
    company: (COMPANIES.find(c=>c.id===p.company_id)||{}).code || p.company || p.company_code || "",
    ctc: 0,
    joined:p.joining_date, left:p.exit_date, cost:+p.cost_per_hour||0, bill:+p.bill_rate_per_hour||0,
    active:p.is_active, authUserId:p.auth_user_id
  }));

  CLIENTS = clientsR.data.map(c=>({
    id:c.id, code:c.client_code, name:c.name, type:c.entity_type, pan:c.pan||"", gstin:c.gstin||"",
    partner:c.relationship_partner_id, email:c.email||"", phone:c.phone||"",
    onboarded:c.onboarded_date, active:c.is_active, companyId:c.company_id
  }));

  LOCATIONS = locationsR.data.map(l=>({
    id:l.id, companyId:l.company_id, client:l.client_id, label:l.label, lat:+l.latitude, lng:+l.longitude,
    radius:l.radius_meters, active:l.is_active
  }));
  // During first login `me` is assigned only after this loader returns. Use the
  // already-verified profile ID from startApp() so a valid new user's company
  // association is not mistaken for missing data during initial loading.
  const currentProfile=PEOPLE.find(p=>p.id===(currentProfileId||me));
  if(!currentProfile || !currentProfile.companyId){ LOAD_ERROR="Your profile is not associated with a company. Contact an administrator."; return; }
  const {data:punchSitesR,error:punchSitesError}=await supabase.from("locations").select("*")
    .eq("organization_id",ORG_ID).eq("company_id",currentProfile.companyId).eq("is_active",true).order("label");
  if(punchSitesError){ LOAD_ERROR="Could not load office sites: "+punchSitesError.message; return; }
  PUNCH_SITES=punchSitesR.map(l=>({
    id:l.id, companyId:l.company_id, client:l.client_id, label:l.label, lat:+l.latitude, lng:+l.longitude,
    radius:l.radius_meters, active:l.is_active
  }));
  FIRM.office = LOCATIONS.find(l=>!l.client) || null;

  JOBS = jobsR.data.map(j=>({
    id:j.id, code:j.job_code, client:j.client_id, title:j.title, status:j.status,
    budget:+j.budget_hours||0, due:j.internal_due_date, statDue:j.statutory_due_date,
    overhead:j.is_overhead, openedBy:j.opened_by, openedOn:j.opened_on,
    closedAt:j.closed_at||null, closingNote:j.closing_note||"", companyId:j.company_id
  }));

  PARTNER_TASK_ASSIGNMENTS = partnerTaskAssignmentsR.data.map(a=>({
    taskId:a.task_id, partnerId:a.partner_id
  }));

  TASKS = tasksR.data.map(t=>{
    let costHistory = [];
    try {
      costHistory = Array.isArray(t.cost_history) ? t.cost_history : (typeof t.cost_history==="string" ? JSON.parse(t.cost_history) : []);
    }catch(_e){}
    let respHistory = [];
    try {
      respHistory = Array.isArray(t.responsibility_history) ? t.responsibility_history : (typeof t.responsibility_history==="string" ? JSON.parse(t.responsibility_history) : []);
    }catch(_e){}

    if(!respHistory.length && t.assigned_to){
      respHistory = [{
        id: "rh_"+t.id,
        assignedTo: t.assigned_to,
        assignedBy: t.assigned_by || null,
        fromDate: (t.created_at ? t.created_at.slice(0,10) : TODAY),
        toDate: null,
        createdAt: t.created_at || new Date().toISOString()
      }];
    }

    const mCost = +t.monthly_cost || 0;
    if(!costHistory.length && mCost > 0){
      costHistory = [{
        effectiveMonth: (t.created_at ? t.created_at.slice(0,7) : TODAY.slice(0,7)),
        monthlyCost: mCost,
        updatedBy: t.assigned_by || null,
        updatedAt: t.created_at || new Date().toISOString()
      }];
    }

    return {
      id: t.id,
      job: t.job_id,
      title: t.title,
      who: t.assigned_to,
      assignedBy: t.assigned_by || (respHistory[0] ? respHistory[0].assignedBy : null),
      status: t.status,
      due: t.due_date,
      est: +t.estimated_hours || 0,
      monthlyCost: mCost,
      costHistory,
      responsibilityHistory: respHistory,
      createdAt: t.created_at || null
    };
  });

    JOB_EXTRA_HOURS = {};

  }

  /* leave_types / employee_leave_balances (007_leave_management.sql) are
     fetched separately from the batch above and never treated as fatal: if
     that migration has not been applied yet to this database, the rest of
     the app must keep working — only the Leave screen degrades (it shows a

  try{

  }catch(err){

    LEAVE_TYPES = [
      { id: "cl-def", code: "CL", label: "Casual/Sick Leave", annualDays: 12, paid: true, active: true },
      { id: "el-def", code: "EL", label: "Earned Leave", annualDays: 0, paid: true, active: true },

  }
  normalizeLeaveTypes();

  applyCompanyScope(currentProfileId||me);

}

const ACTIVE_COMPANY_KEY = "pm_active_company_v1";
const canSwitchCompany = (id=me) => person(id).role==="partner";
/* Companies this user may put on screen: a partner any active company of the
   organization, everyone else only their own. */
function switchableCompanies(id=me){
  if(canSwitchCompany(id)) return activeCompanies();
  const own = person(id).companyId;
  return COMPANIES.filter(c=>c.id===own);
}
/* Company choices for a form: what the user may assign, plus the record's
   current company so editing an existing record never silently changes it. */
function companyOptions(current){
  const list = switchableCompanies().slice();
  const cur = COMPANIES.find(c=>c.id===current);
  if(cur && !list.some(c=>c.id===cur.id)) list.unshift(cur);
  return list;
}
const siteCompanyOptions = current => companyOptions(current);
function loadActiveCompanyPref(){
  try{ return localStorage.getItem(ACTIVE_COMPANY_KEY+":"+AUTH_UID) || ""; }catch(e){ return ""; }
}
function saveActiveCompanyPref(cid){
  try{ localStorage.setItem(ACTIVE_COMPANY_KEY+":"+AUTH_UID, cid); }catch(e){ /* optional convenience only */ }
}

/* Runs at the end of every loadAppData(): picks the active company and, for a
   partner, narrows every company-specific list to it. Rules:
   people / leave / attendance / claims / nil weeks  -> the employee's company
   jobs / clients / sites                             -> their company_id
   tasks / time / budget requests                     -> their job's company
   compliances                                        -> their client's company
   salary                                             -> the salary row's company_id
   The partner's own time and leave always stay visible to them, so "My time"
   and the fill-days-in-order rule keep working in any company. */
function applyCompanyScope(viewerId){
  ALL_PEOPLE = PEOPLE; ALL_JOBS = JOBS; ALL_CLIENTS = CLIENTS;
  const viewer = ALL_PEOPLE.find(p=>p.id===viewerId);
  if(!viewer) return;
  const allowed = switchableCompanies(viewerId);
  const pref = loadActiveCompanyPref();
  ACTIVE_COMPANY_ID =
    (allowed.find(c=>c.id===pref) || allowed.find(c=>c.id===viewer.companyId) || allowed[0] || {}).id
    || viewer.companyId;
  if(!canSwitchCompany(viewerId)) return;   // RLS already limits what a non-partner received

  const cid = ACTIVE_COMPANY_ID;
  const own = who => who===viewerId;
  PEOPLE = ALL_PEOPLE.filter(p=>p.companyId===cid);
  const people = new Set(PEOPLE.map(p=>p.id));
  const inCo = who => people.has(who) || own(who);
  JOBS = ALL_JOBS.filter(j=>j.companyId===cid);
  const jobs = new Set(JOBS.map(j=>j.id));
  CLIENTS = ALL_CLIENTS.filter(c=>c.companyId===cid);
  const clients = new Set(CLIENTS.map(c=>c.id));
  LOCATIONS = LOCATIONS.filter(l=>l.companyId===cid);
  TASKS = TASKS.filter(t=>jobs.has(t.job));
  const tasks = new Set(TASKS.map(t=>t.id));
  PARTNER_TASK_ASSIGNMENTS = PARTNER_TASK_ASSIGNMENTS.filter(a=>tasks.has(a.taskId));
  ENTRIES = ENTRIES.filter(x=>jobs.has(x.job) || own(x.who));
  BUDGET_REQUESTS = BUDGET_REQUESTS.filter(b=>jobs.has(b.job));
  COMPLIANCE = COMPLIANCE.filter(c=>clients.has(c.client));
  LEAVE = LEAVE.filter(l=>inCo(l.who));
  LEAVE_BALANCES = LEAVE_BALANCES.filter(b=>inCo(b.who));
  CLAIMS = CLAIMS.filter(c=>inCo(c.who));
  NIL_FILED = NIL_FILED.filter(n=>inCo(n.who));
  HOLIDAY_WORKED = HOLIDAY_WORKED.filter(h=>inCo(h.who));
  ALL_PUNCHES_TODAY = ALL_PUNCHES_TODAY.filter(p=>inCo(p.who));
  // Salary history is kept whole: a person's pay in a month is decided by the
  // record in force that month, whose company_id says which company paid it.
  // salaryStaffFor() then lists, per month, the people THIS company paid.
  ALL_PEOPLE.forEach(p=>{ p.ctc = salaryAt(p.id,TODAY); });
}

/* Adds a new record to the full list and, when it belongs to the company on

/* Minimal multi-sheet XLSX writer. Builds a real .xlsx (stored ZIP, no
   compression) so Excel opens it without a format warning and without
   pulling in any library. */
const XLSX = (() => {
  const enc = new TextEncoder();

  let TBL = null;
  function crc32(buf){
    if(!TBL){
      TBL = new Uint32Array(256);
      for(let n=0;n<256;n++){
        let c=n;
        for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320 ^ (c>>>1) : c>>>1;
        TBL[n]=c>>>0;
      }
    }
    let c = 0xFFFFFFFF;
    for(let i=0;i<buf.length;i++) c = TBL[(c ^ buf[i]) & 0xFF] ^ (c>>>8);
    return (c ^ 0xFFFFFFFF)>>>0;
  }

  const xesc = s => String(s==null?"":s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&apos;")
    .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,"");

  function colName(n){                       // 1 -> A
    let s="";
    while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=(n-m-1)/26; }
    return s;
  }

  /* rows: array of arrays. A cell is a number, or anything else -> text.
     The first row is written bold via style 1. */
  function sheetXML(rows){
    let x = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'+
      '<sheetData>';
    rows.forEach((row,ri)=>{
      x += '<row r="'+(ri+1)+'">';
      row.forEach((cell,ci)=>{
        const ref = colName(ci+1)+(ri+1);
        const st  = ri===0 ? ' s="1"' : '';
        if(typeof cell === "number" && isFinite(cell))
          x += '<c r="'+ref+'"'+st+'><v>'+cell+'</v></c>';
        else if(cell===null || cell===undefined || cell==="")
          x += '<c r="'+ref+'"'+st+'/>';
        else
          x += '<c r="'+ref+'"'+st+' t="inlineStr"><is><t xml:space="preserve">'+xesc(cell)+'</t></is></c>';
      });
      x += '</row>';
    });
    return x + '</sheetData></worksheet>';
  }

  function build(sheets){                    // [{name, rows}]
    const files = [];
    const add = (name, str) => files.push({ name, data: enc.encode(str) });

    add("[Content_Types].xml",
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'+
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'+
      '<Default Extension="xml" ContentType="application/xml"/>'+
      '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+
      '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'+
      sheets.map((_,i)=>'<Override PartName="/xl/worksheets/sheet'+(i+1)+
        '.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join("")+
      '</Types>');

    add("_rels/.rels",
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>'+
      '</Relationships>');

    add("xl/workbook.xml",
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" '+
      'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'+
      sheets.map((s,i)=>'<sheet name="'+xesc(s.name.slice(0,31))+'" sheetId="'+(i+1)+
        '" r:id="rId'+(i+1)+'"/>').join("")+
      '</sheets></workbook>');

    add("xl/_rels/workbook.xml.rels",
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
      sheets.map((_,i)=>'<Relationship Id="rId'+(i+1)+
        '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+
        (i+1)+'.xml"/>').join("")+
      '<Relationship Id="rId'+(sheets.length+1)+
      '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>'+
      '</Relationships>');

    add("xl/styles.xml",
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'+
      '<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font>'+
      '<font><b/><sz val="11"/><name val="Calibri"/></font></fonts>'+
      '<fills count="1"><fill><patternFill patternType="none"/></fill></fills>'+
      '<borders count="1"><border/></borders>'+
      '<cellStyleXfs count="1"><xf/></cellStyleXfs>'+
      '<cellXfs count="2"><xf xfId="0"/><xf xfId="0" fontId="1" applyFont="1"/></cellXfs>'+
      '</styleSheet>');

    sheets.forEach((s,i)=> add("xl/worksheets/sheet"+(i+1)+".xml", sheetXML(s.rows)));

    /* ---- stored (uncompressed) ZIP ---- */
    const parts = [], central = [];
    let offset = 0;

    const u16 = n => [n&0xFF,(n>>8)&0xFF];
    const u32 = n => [n&0xFF,(n>>8)&0xFF,(n>>16)&0xFF,(n>>>24)&0xFF];

    files.forEach(f=>{
      const nameBytes = enc.encode(f.name);
      const crc = crc32(f.data);
      const local = [].concat(
        u32(0x04034b50), u16(20), u16(0), u16(0), u16(0), u16(0),
        u32(crc), u32(f.data.length), u32(f.data.length),
        u16(nameBytes.length), u16(0));
      parts.push(new Uint8Array(local), nameBytes, f.data);
      central.push([[].concat(
        u32(0x02014b50), u16(20), u16(20), u16(0), u16(0), u16(0), u16(0),
        u32(crc), u32(f.data.length), u32(f.data.length),
        u16(nameBytes.length), u16(0), u16(0), u16(0), u16(0), u32(0),
        u32(offset)), nameBytes]);
      offset += local.length + nameBytes.length + f.data.length;
    });

    const cd = [];
    central.forEach(([arr,nameBytes])=>{ cd.push(new Uint8Array(arr), nameBytes); });
    const cdSize = cd.reduce((s,a)=>s+a.length,0);

    const end = new Uint8Array([].concat(
      u32(0x06054b50), u16(0), u16(0),
      u16(files.length), u16(files.length),
      u32(cdSize), u32(offset), u16(0)));

    const all = parts.concat(cd, [end]);
    const total = all.reduce((s,a)=>s+a.length,0);
    const out = new Uint8Array(total);
    let p=0; all.forEach(a=>{ out.set(a,p); p+=a.length; });
    return out;
  }

  function download(filename, sheets){
    const bytes = build(sheets);
    const blob = new Blob([bytes], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 0);
  }

  return { build, download };
})();

const $ = (s,r=document)=>r.querySelector(s);

/* Every table is placed in a .table-wrap so that on mobile it scrolls
   sideways at its natural width instead of being squeezed (CSS: 860px
   block). Views and modals build tables as HTML strings in many places, so
   this wraps them wherever they appear rather than each call site. The
   wrapper has no styling on desktop, so desktop layout is unchanged. */
function wrapTables(root){
  if(!root || !root.querySelectorAll) return;
  const tables = root.tagName==="TABLE" ? [root] : root.querySelectorAll("table");
  tables.forEach(t=>{
    const parent=t.parentElement;
    if(!parent || parent.classList.contains("table-wrap")) return;
    const wrap=document.createElement("div");
    wrap.className="table-wrap";
    parent.insertBefore(wrap,t);
    wrap.appendChild(t);
  });
}
(function watchTables(){
  const start=()=>{
    wrapTables(document.body);
    new MutationObserver(muts=>muts.forEach(m=>m.addedNodes.forEach(n=>{ if(n.nodeType===1) wrapTables(n); })))
      .observe(document.body,{childList:true,subtree:true});
  };
  if(document.body) start(); else document.addEventListener("DOMContentLoaded",start);
})();

function addDays(d,n){
  const [y,m,day]=d.split("-").map(Number);
  return new Date(Date.UTC(y,m-1,day+n)).toISOString().slice(0,10);
}
function weekdayIndex(date){ return (new Date(date+"T00:00:00Z").getUTCDay()+6)%7; }
function mondayOfISO(date){ return addDays(date,-weekdayIndex(date)); }
function validISODate(date){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)) return false;
  const parsed=new Date(date+"T00:00:00Z");
  return !Number.isNaN(parsed.getTime()) && parsed.toISOString().slice(0,10)===date;
}
function weekdayDate(date){
  const day=new Date(date+"T00:00:00Z").getUTCDay();
  return ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][day]+" "+date.slice(8,10);
}
/* First/last calendar date of a "YYYY-MM" month, as date strings. Anchored
  in Date.UTC (day 0 of the next month = the last day of this one) so month
  boundaries do not depend on the browser's local timezone. */
function monthRange(ym){
  const [y,m] = ym.split("-").map(Number);
  const first = ym+"-01";
  const last = new Date(Date.UTC(y, m, 0)).toISOString().slice(0,10);
  return [first, last];
}
function fmtDate(d){ const [y,m,dd]=d.split("-");
  return dd+" "+["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+m-1]+" "+y; }
function fmtShort(d){ const [,m,dd]=d.split("-");
  return dd+" "+["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+m-1]; }
/* Decision timestamps (decided_at/approved_at/paid_at) are full timestamptz
   values, unlike the plain date strings fmtDate/fmtShort expect — rendered
   in the viewer's local time, matching how punch times already are. */
function fmtDateTime(iso){
  if(!iso) return "—";
  const d = new Date(iso);
  const mon = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getMonth()];
  return String(d.getDate()).padStart(2,"0")+" "+mon+" "+d.getFullYear()+", "+d.toTimeString().slice(0,5);
}
function monthLabel(ym){ const [y,m]=ym.split("-");
  return ["January","February","March","April","May","June","July","August","September","October","November","December"][+m-1]+" "+y; }
function daysTo(d){ return Math.round((new Date(d+"T00:00:00")-new Date(TODAY+"T00:00:00"))/864e5); }

function dueTag(d){
  const n=daysTo(d);
  if(n<0)   return '<span class="tag bad">'+Math.abs(n)+'d overdue</span>';
  if(n===0) return '<span class="tag bad">due today</span>';
  if(n<=3)  return '<span class="tag warn">in '+n+'d</span>';
  return '<span class="tag">in '+n+'d</span>';
}

function isSaturdayHoliday(date){
  const day = new Date(date+"T00:00:00Z").getUTCDay();
  const ordinal = Math.ceil(Number(date.slice(8,10))/7);
  return day===6 && (ordinal===2 || ordinal===4);
}
/* Calendar/attendance day numbering is JavaScript's own: Sunday = 0 …
   Saturday = 6, and weeks are drawn Sunday-first. (Timesheet weeks are a
   separate Mon–Sat work week — see mondayOf()/weekdayIndex() — unchanged.)
   Sunday is the weekly off: always a holiday for attendance, never absent.
   It is deliberately NOT returned by holidayOn(), because holidayOn() also
   feeds holiday-worked / earned-leave, which Sundays never earn. */
const WEEKDAY_NAMES = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function dayOfWeek(date){ return new Date(date+"T00:00:00Z").getUTCDay(); }
function isSunday(date){ return dayOfWeek(date)===0; }

const ATTENDANCE_DATE_DEBUG = true;        // temporary — set false once verified
const _attDebugSeen = new Set();

  if(!ATTENDANCE_DATE_DEBUG) return;
  const key=date+"|"+status;
  if(_attDebugSeen.has(key)) return;
  _attDebugSeen.add(key);

  });
}

function holidayOn(date){
  const publicHoliday=HOLIDAYS.find(h=>h.date===date);
  if(publicHoliday) return publicHoliday;
  if(isSaturdayHoliday(date)) return {date,name:"Saturday Holiday"};
  return null;
}
function holidayWorkedOn(who,date){ return HOLIDAY_WORKED.some(h=>h.who===who && h.date===date); }
function leaveOn(who,date){ return LEAVE.find(l=>l.who===who && l.date===date && l.status==="approved"); }

/* The salary record in force on `date` (latest effective_from <= date).
   `history` defaults to the partner's SALARY_HISTORY; an employee's own
   payslip passes MY_SALARY_HISTORY (their own rows only — RLS, 029). */
function salaryRecordAt(who, date, history=SALARY_HISTORY){
  return history.filter(s=>s.who===who && s.effective<=date)
    .sort((a,b)=>b.effective.localeCompare(a.effective))[0] || null;
}
function salaryAt(who, date, history=SALARY_HISTORY){
  return salaryRecordAt(who, date, history)?.ctc || 0;
}
/* Which company paid `p` on `date`: the salary record in force then, or the
   person's current company when no record exists yet. */
function salaryCompanyAt(p, date){ return (salaryRecordAt(p.id, date)||{}).companyId || p.companyId; }
/* People on the payroll for `ym`. With several companies (partner), that is
   everyone the company on screen paid that month — including someone who has
   since moved to another company — and not someone it did not pay. */
function salaryStaffFor(ym){
  const [first,last]=monthRange(ym);
  const multi = canSwitchCompany() && ALL_PEOPLE!==PEOPLE;
  return (multi ? ALL_PEOPLE : PEOPLE).filter(p=>p.joined<=last&&(!p.left||p.left>=first)&&
    (p.active||p.left||SALARY_HISTORY.some(s=>s.who===p.id&&s.effective<=last)||salaryPunches.some(x=>x.who===p.id&&x.date>=first&&x.date<=last))&&
    (!multi || salaryCompanyAt(p, last)===ACTIVE_COMPANY_ID));
}
function salaryCalculation(profile, ym, punchRows, history=SALARY_HISTORY){
  const [first,last]=monthRange(ym), record=salaryRecordAt(profile.id,last,history), ctc=record?.ctc||0, daily=ctc/30;
  const dates=datesBetween(first,last), holidays=HOLIDAYS.filter(h=>h.date>=first&&h.date<=last);
  const holidaySet=new Set(holidays.map(h=>h.date).concat(dates.filter(isSaturdayHoliday)));
  const punches=punchRows.filter(p=>p.who===profile.id && p.date>=first && p.date<=last);
  const byDate=new Map(); punches.forEach(p=>{const a=byDate.get(p.date)||[];a.push(p);byDate.set(p.date,a);});
  let present=0, absent=0, half=0, holidayWorked=0;
  for(const date of dates){
    if(profile.joined && date<profile.joined) continue;
    if(profile.left && date>profile.left) continue;
    if(date>TODAY) continue;
    if(isSunday(date)) continue; // Sunday is the weekly off — never present/absent/deducted.
    const dayPunches=byDate.get(date)||[], worked=dayPunches.length>0;
    const lv=LEAVE.find(l=>l.who===profile.id&&l.date===date&&l.status==="approved");
    if(holidaySet.has(date)){ if(worked || holidayWorkedOn(profile.id,date)) holidayWorked++; continue; }
    if(lv){
      const type=LEAVE_TYPES.find(t=>t.code===lv.type);
      const units=lv.part==="half"?.5:1;
      if(type && !type.paid){ if(units===.5) half++; else absent++; }
      if(worked) present+=units;
      continue;
    }
    if(worked) present++;
    else absent++;
  }
  const earned=HOLIDAY_WORKED.filter(h=>h.who===profile.id && h.date>=first && h.date<=last).length;
  const absenceDeduction=absent*daily, halfDeduction=half*daily*.5, holidayEarning=holidayWorked*daily;
  const earnedLeaveBalance=leaveBalanceFor(profile.id,+ym.slice(0,4),last).find(b=>b.code==="EL")?.remaining||0;
  return {who:profile.id,profile,month:ym,ctc,daily,record,hasCtc:!!record,present,absent,half,earned,earnedLeaveBalance,publicHolidays:holidaySet.size,holidayWorked,
    absenceDeduction,halfDeduction,holidayEarning,final:ctc-absenceDeduction-halfDeduction+holidayEarning};
}
async function loadSalaryMonth(){
  if(!CAN.viewSalary()) return;
  salaryLoading=true; render();
  const [first,last]=monthRange(salaryMonth);
  let data=[],from=0;
  while(true){
    const {data:page,error}=await supabase.from("attendance_punches").select("profile_id,punch_date,punch_type")
      .eq("organization_id",ORG_ID).gte("punch_date",first).lte("punch_date",last)
      .order("punch_date").order("id").range(from,from+999);

    data=data.concat(page); if(page.length<1000)break; from+=1000;

  // decides which people belong to the company on screen for that month.

}

function setSalaryEmployee(value){salaryEmployee=value;salaryDetailId=null;render();}

/* A holiday or full-day leave is "off" — it never needs an entry, so it
   doesn't hold up sequential day entry. */
function dayInfo(who, i, week=WEEK){
  const date = addDays(week,i);
  const hol = holidayOn(date), lv = leaveOn(who,date);
  return { date, hol, lv, off: !!hol || (lv && lv.part==="full") };
}
/* Every working day of the week (Mon–Sat) is covered by a holiday or leave. */
function weekFullyOff(who, week=WEEK){ return [0,1,2,3,4,5].every(i=>dayInfo(who,i,week).off); }

const entriesForWeek = (who,wk) => ENTRIES.filter(x=>x.who===who && x.week===wk);
/* Sequential entry: a day counts as accounted for once something is logged
   against it — draft, pending or approved all count the same, so an
   already-approved day stays "done" rather than re-blocking the days after
   it — or it is excused by a holiday or approved leave (full or half),
   same signal dayInfo() already uses for "off". */
function dayFilled(who, i, week=WEEK){
  const d = dayInfo(who, i, week);
  if(d.off || d.lv) return true;
  return entriesForWeek(who, week).some(x=>x.day===i);
}
/* Earliest required day in the week still needing an entry, or null once
   every day is either logged or excused. */
function firstOpenDay(who, week=WEEK){
  for(let i=0;i<=5;i++){ if(!dayFilled(who,i,week)) return i; }
  return null;
}
const entriesFor = (who, week=WEEK) => entriesForWeek(who, week);
const bookedFor  = (who, week=WEEK) => sum(entriesFor(who,week).map(x=>+x.hours||0));
const dateOf = en => en.date || addDays(en.week, en.day);
const entriesOnDate = (who,date) => ENTRIES.filter(x=>x.who===who && dateOf(x)===date);
function weeksFor(who){
  return [...new Set(ENTRIES.filter(x=>x.who===who).map(x=>x.week))].sort().reverse();
}

/* Hours actually on a job = every entry loaded for it, across every week,
   whatever the grade. All history comes from Supabase, so there is no
   separate "prior" bucket to add on top of. */
/* Budgeted Hours (jobs.budget_hours → j.budget) is the figure set when the
   job was raised and is never changed automatically — not by timesheets,
   tasks or approvals. Additional hours are separate: each approved
   budget_requests row adds (to − from), and the hours available are
   budgeted + approved additional. */
function jobExtraHours(jid){ return JOB_EXTRA_HOURS[jid] || 0; }
function jobBudgetTotal(jid){ const j=job(jid); return (j && j.budget || 0) + jobExtraHours(jid); }
/* The one "over budget" rule — used by the Today dashboard count and by the
   Job codes "over budget" filter, so the two always agree: a live (not
   closed, not overhead) job whose booked hours exceed its budgeted hours plus
   approved additional hours. */
function isJobOverBudget(j){
  return !!j && !j.overhead && j.status!=="closed" && jobHours(j.id) > jobBudgetTotal(j.id);
}
/* Hard limit: hours booked on a job (every entry, any status) may not
   exceed budgeted + approved additional. Overhead codes have no budget.
   Mirrors trg_timesheet_job_budget_limit (023_job_budget_hard_limit.sql). */
function jobRemainingHours(jid){
  const j=job(jid);
  if(!j || j.overhead) return Infinity;
  return Math.max(0, +(jobBudgetTotal(jid) - jobHours(jid)).toFixed(2));
}
function budgetBlocked(jid, requested, serverMsg){
  const j=job(jid), left=jobRemainingHours(jid);
  const pending=BUDGET_REQUESTS.some(b=>b.job===jid && b.status==="pending");
  modal('<h3>Not enough hours left on '+esc(j.code)+'</h3>'+
    '<p style="margin-bottom:10px">'+(left>0
      ? 'Only '+hrs(left)+'h remain'+' for this job. Please request additional hours before recording more time.'
      : 'No hours remain for this job. Please request additional hours before recording more time.')+'</p>'+
    '<p class="tiny muted" style="margin-bottom:14px">'+esc(budgetBreakdown(jid))+' · '+hrs(jobHours(jid))+'h already booked · '+
      hrs(requested)+'h in this entry.'+(serverMsg?'<br>'+esc(serverMsg):'')+'</p>'+
    (pending?'<p class="tiny" style="margin-bottom:12px">A request for more hours on this job is already waiting for approval. '+
      'Hours become available once it is approved.</p>':'')+
    '<div class="row"><button class="btn ghost" onclick="closeModal()">Close</button>'+
    (pending?'':'<button class="btn" onclick="askBudget(\''+jid+'\')">Request more hours</button>')+'</div>');
}
function budgetBreakdown(jid){
  const j=job(jid), extra=jobExtraHours(jid);
  return hrs(j.budget)+"h budgeted"+(extra ? " + "+hrs(extra)+"h additional = "+hrs(j.budget+extra)+"h" : "");
}

function jobHours(jid){
  return sum(ENTRIES.filter(x=>x.job===jid).map(x=>+x.hours||0));
}
function jobHoursApproved(jid){
  return sum(ENTRIES.filter(x=>x.job===jid && x.status==="approved").map(x=>+x.hours||0));
}
function jobHoursByGrade(jid, weekOnly){
  const out={};
  ENTRIES.filter(x=>x.job===jid && (!weekOnly || x.week===WEEK)).forEach(x=>{
    const r=person(x.who).label; out[r]=(out[r]||0)+(+x.hours||0);
  });
  return out;
}

/* Group a person's week by job code — this is the unit of approval.
   You can pass one job code and query another. */
function groupsFor(who, week=WEEK){
  const g={};
  entriesFor(who,week).forEach(x=>{ (g[x.job]=g[x.job]||[]).push(x); });
  return Object.keys(g).map(jid=>{
    const rows=g[jid], sts=[...new Set(rows.map(r=>r.status))];
    return { job:jid, rows, hours:sum(rows.map(r=>+r.hours||0)),
             status: sts.length===1 ? sts[0] : "mixed",
             query: (rows.find(r=>r.query)||{}).query || "" };
  }).sort((a,b)=>{
    const ao=job(a.job).overhead?1:0, bo=job(b.job).overhead?1:0;
    return ao-bo || (job(a.job).code<job(b.job).code?-1:1);
  });
}

let NIL_FILED = [];   // {who, week} — a week with nothing booked still goes on record
const sheetStatus = (who, week=WEEK) => sheetStatusFor(who, week);
function sheetStatusFor(who, wk){
  const rows=entriesForWeek(who, wk);
  if(!rows.length){
    if(NIL_FILED.some(n=>n.who===who && n.week===wk)) return "nil filed";
    return weekFullyOff(who,wk) ? "nil week" : "not started";
  }
  const s=new Set(rows.map(r=>r.status));
  if(s.has("draft")) return "draft";
  if(s.has("pending")) return "submitted";
  if(s.has("approved") && s.has("queried")) return "partly approved";
  if(s.has("queried")) return "sent back";
  return "approved";
}

/* One place, so the role audit is checkable rather than scattered. */

  logTime:        ()      => true,
  selfCertify:    (id=me) => person(id).role==="partner",
  approveSheet:   (owner) => owner!==me &&
                             (person(owner).reportsTo===me || (rank()>=90 && rank(owner)<90)),
  requestBudget:  ()      => person(me).role!=="partner",
  /* Partners may book beyond a job's budget; everyone else is held to it.
     Same rule as enforce_job_budget_limit() (024). */
  exceedJobBudget:()      => person(me).role==="partner",
  approveBudget:  (req)   => rank()>=70 && (req.by!==me || rank()>=90),
  closeJob:       ()      => rank()>=70,
  reopenJob:      ()      => rank()>=70,
  /* Assistant Manager and above — same rule as jobs_insert and
     trg_tasks_assignment_rank (030). */
  createJob:      ()      => rank()>=ASSIGN_RANK,
  reassignTask:   ()      => rank()>=ASSIGN_RANK,
  editTaskStatus: (t)     => t.who===me || rank()>=50,
  seeTeamAtt:     ()      => rank()>=50,
  approveClaim:   (c)     => c.who!==me && rank()>=70,
  /* Claim payment: Manager and above (never their own claim), or a legacy
     "accounts" profile. Same boundary as expense_claims_update. */
  payClaim:       (c)     => person(me).role==="accounts" || (rank()>=70 && (!c || c.who!==me)),
  seeFirmTime:    ()      => rank()>=50,
  /* Attendance export is a payroll-adjacent document (everyone's punch
     times and locations in one file) — narrower than seeFirmTime()'s
     manager-and-up cost visibility, so it gets its own, partner-only rule. */
  exportAttendance: ()    => person(me).role==="partner",
  seeReports:       ()    => person(me).role==="partner",
  viewMasters:    ()      => rank()>=70,
  manageTeam:     ()      => rank()>=90,
  /* Companies of the organization: create, rename, (de)activate. Partner
     only — same boundary as companies_insert/companies_update (028). */
  manageCompanies:()      => person(me).role==="partner",
  manageClients:  ()      => rank()>=70,
  removeClient:   ()      => rank()>=90,
  /* Same rule as approveSheet() — leave is approved by the same person who
     approves a timesheet: your direct manager, or any partner if you are
     not one yourself. A partner's own leave is self-certified (see
     applyLeave()), same as their timesheet. */
  approveLeave:   (owner, r) => canApproveLeaveRequest(me, owner, r),
  manageLeavePolicy: ()   => rank()>=90,
  viewSalary:     ()      => person(me).role==="partner"
};
const anyApprovals = () => rank()>=50 || person(me).role==="accounts";

/* Reporting line traversal: direct supervisor or higher in tree */
function isAssignedUnder(who, bossId){
  if(!bossId || !who) return false;
  if(who === bossId) return false;
  let p = person(who);
  let cur = p.reportsTo, depth = 0;
  while(cur && depth++ < 15){
    if(cur === bossId) return true;
    cur = person(cur).reportsTo;
  }
  return false;
}

function canApproveLeaveRequest(viewerId, who, r){
  if(!viewerId || !who) return false;
  if(who === viewerId) return false;
  const vRole = person(viewerId).role;
  if(vRole === "partner" && person(who).role !== "partner") return true;
  const isSupervisor = (person(who).reportsTo === viewerId) || isAssignedUnder(who, viewerId);
  if(isSupervisor && rank(viewerId) >= 50){
    return true;
  }
  return false;
}

/* Period-specific responsibility check:
   If an employee was under Manager A during one period and moved to Manager B,
   Manager A only sees leaves relevant to their period (decided by Manager A),
   while Manager B sees pending leaves and leaves relevant to their period. */
function canSeeLeaveRequest(viewerId, r){
  if(!viewerId || !r) return false;
  if(r.who === viewerId) return true;

  const vRole = person(viewerId).role;
  if(vRole === "partner") return true;

  // If viewer was the designated approver/decision-maker during their period of responsibility
  if(r.approvedBy && r.approvedBy === viewerId) return true;

  const currentlyAssigned = (person(r.who).reportsTo === viewerId) || isAssignedUnder(r.who, viewerId);

  if(currentlyAssigned && rank(viewerId) >= 50){
    if(r.status === "pending") return true;
    // If decided by a different supervisor (below partner) in an earlier period, hide from current one
    if(r.approvedBy && r.approvedBy !== viewerId){
      if(rank(r.approvedBy) >= 50 && rank(r.approvedBy) < 90){
        return false;
      }
    }
    return true;
  }

  return false;
}

function pendingSheets(){
  return staff().filter(p=>CAN.approveSheet(p.id) && sheetStatus(p.id)==="submitted");
}
function pendingBudgets(){ return BUDGET_REQUESTS.filter(b=>b.status==="pending" && CAN.approveBudget(b)); }
function pendingClaims(){
  return CLAIMS.filter(c=>c.status==="submitted" && CAN.approveClaim(c))
    .concat(CLAIMS.filter(c=>c.status==="approved" && CAN.payClaim(c)));
}

/* ------------------  APPROVAL HISTORY (accepted / rejected)  ------------------
   Same authorization funcs as the pending lists above — a decided request is
   visible to whoever was allowed to decide it, never to everyone. "queried"
   is this app's reject-equivalent for a timesheet line (sent back with a
   reason, same as budget/claim rejection); there is no separate terminal
   "rejected" timesheet status, so history groups it under Rejected. */
function decidedGroupsFor(status){                 // status: "approved" | "queried"
  const out=[];
  staff().forEach(p=>{
    if(!CAN.approveSheet(p.id)) return;
    const byWeek={};
    ENTRIES.filter(x=>x.who===p.id).forEach(x=>{ (byWeek[x.week]=byWeek[x.week]||[]).push(x); });
    Object.keys(byWeek).forEach(wk=>{
      const g={};
      byWeek[wk].forEach(x=>{ (g[x.job]=g[x.job]||[]).push(x); });
      Object.keys(g).forEach(jid=>{
        const rows=g[jid], sts=[...new Set(rows.map(r=>r.status))];
        if(sts.length===1 && sts[0]===status){
          out.push({ person:p, job:jid, week:wk, rows,
            hours:sum(rows.map(r=>+r.hours||0)),
            query:(rows.find(r=>r.query)||{}).query||"",
            decidedBy:rows[0].decidedBy, decidedAt:rows[0].decidedAt });
        }
      });
    });
  });
  return out.sort((a,b)=> (b.decidedAt||b.week) < (a.decidedAt||a.week) ? -1 : 1);
}
/* Budget/claim history is only shown to the ranks authorized to decide them
   (CAN.approveBudget / CAN.approveClaim / CAN.payClaim) — same gate as the
   pending lists, just without the "not your own" nuance, which only matters
   for who may *decide*, not who may see what was already decided. */
function decidedBudgets(status){ return BUDGET_REQUESTS.filter(b=>b.status===status && rank()>=70); }
function acceptedClaims(){ return CLAIMS.filter(c=>(c.status==="approved"||c.status==="paid") && (rank()>=70 || CAN.payClaim())); }
function rejectedClaims(){ return CLAIMS.filter(c=>c.status==="rejected" && rank()>=70); }

function approvalCounts(){
  return {
    pending:  approvalCount(),
    accepted: decidedGroupsFor("approved").length + decidedBudgets("approved").length + acceptedClaims().length + decidedLeaveRequests("approved").length,
    rejected: decidedGroupsFor("queried").length  + decidedBudgets("rejected").length + rejectedClaims().length + decidedLeaveRequests("rejected").length
  };
}
const approvalCount = () => pendingSheets().length + pendingBudgets().length + pendingClaims().length + pendingLeaveRequests().length;

/* ------------------  LEAVE  ------------------
   `leaves` is one row per calendar day (007_leave_management.sql); a
   "request" is every row sharing a request_id. Grouped here exactly the way
   groupsFor()/decidedGroupsFor() already group timesheet_entries rows by
   job code — same idiom, same reason: one decision covers several rows. */
function leaveGroup(rows){
  const first=rows[0], dates=rows.map(r=>r.date).sort();
  return {
    requestId:first.requestId, who:first.who, type:first.type, status:first.status,
    reason:first.reason, rejectionReason:first.rejectionReason,
    approvedBy:first.approvedBy, approvedAt:first.approvedAt, createdAt:first.createdAt,
    start:dates[0], end:dates[dates.length-1],
    days:sum(rows.map(r=>r.part==="half"?0.5:1)), rows
  };
}
function leaveRequestsFor(who){
  const g={};
  LEAVE.filter(l=>l.who===who).forEach(l=>{ (g[l.requestId]=g[l.requestId]||[]).push(l); });
  return Object.values(g).map(leaveGroup).sort((a,b)=> a.start<b.start?1:-1);
}

function pendingLeaveRequests(){
  const out=[];
  staff().forEach(p=>{
    if(p.id === me) return;
    leaveRequestsFor(p.id).filter(r=>r.status==="pending").forEach(r=>{
      if(canApproveLeaveRequest(me, p.id, r)){
        out.push(Object.assign({person:p},r));
      }
    });
  });
  return out.sort((a,b)=> a.createdAt<b.createdAt?1:-1);
}

function decidedLeaveRequests(status){                // status: "approved" | "rejected"
  const out=[];
  staff().forEach(p=>{
    if(p.id === me) return;
    leaveRequestsFor(p.id).filter(r=>r.status===status).forEach(r=>{
      if(canSeeLeaveRequest(me, r)){
        out.push(Object.assign({person:p},r));
      }
    });
  });
  return out.sort((a,b)=> (b.approvedAt||b.start) < (a.approvedAt||a.start) ? -1 : 1);
}

function teamLeaveRecords(viewerId){
  const out=[];
  staff().forEach(p=>{
    if(p.id === viewerId) return;
    leaveRequestsFor(p.id).forEach(r=>{
      if(canSeeLeaveRequest(viewerId, r)){
        out.push(Object.assign({person:p}, r));
      }
    });
  });
  return out.sort((a,b)=> (b.start < a.start ? -1 : 1));
}

function currentLeaveYear(){ return +TODAY.slice(0,4); }

const STATUS_TAG_LEAVE = { pending:"warn", approved:"ok", rejected:"bad", cancelled:"" };

/* Casual and Sick Leave are one combined type, CSL "Casual/Sick Leave"
   (019_combined_casual_sick_leave.sql). Leave days recorded before that
   under CL or SL keep their original code in the database (origType here);
   while the organization has an active CSL type they are read as CSL, so
   they show as Casual/Sick Leave and count toward the one CSL balance.
   An organization without CSL is unaffected. */
const COMBINED_LEAVE_CODE = "CSL";
const COMBINED_LEGACY_CODES = ["CL","SL"];
function canonicalLeaveCode(code){
  return COMBINED_LEGACY_CODES.includes(code) &&
    LEAVE_TYPES.some(t=>t.code===COMBINED_LEAVE_CODE && t.active) ? COMBINED_LEAVE_CODE : code;
}
function normalizeLeaveTypes(){
  LEAVE.forEach(l=>{ l.origType = l.origType || l.type; l.type = canonicalLeaveCode(l.origType); });
}
/* Legacy codes folded into CSL are not separate types any more. */
function isFoldedLeaveType(t){ return canonicalLeaveCode(t.code)!==t.code; }

function leaveTypeLabel(code){
  const c = canonicalLeaveCode(code);
  const t = LEAVE_TYPES.find(x=>x.code===c);
  return t ? t.label : code;
}

function fmtDays(n){ n=+n||0; return (Number.isInteger(n)?n:n.toFixed(1))+(n===1?" day":" days"); }

/* Allocated comes from leave_types (or a per-employee override); used and
   pending are summed live from `leaves`. l.type is already canonical, so
   old CL/SL days count toward the one Casual/Sick Leave balance. */
function leaveBalanceFor(who, year, asOf){
  year = year || currentLeaveYear();
  asOf = asOf || TODAY;
  const types = LEAVE_TYPES.filter(t => t.active && !isFoldedLeaveType(t));
  return types.map(t=>{
    const override = LEAVE_BALANCES.find(b=>b.who===who && b.code===t.code && b.year===year);
    const allocated = override ? override.allocated : t.annualDays;
    const rowsThisYear = LEAVE.filter(l=>l.who===who && l.type===t.code &&
      l.date.slice(0,4)===String(year) && l.date<=asOf && !isSaturdayHoliday(l.date));
    const used    = sum(rowsThisYear.filter(l=>l.status==="approved").map(l=>l.part==="half"?0.5:1));
    const pending = sum(rowsThisYear.filter(l=>l.status==="pending").map(l=>l.part==="half"?0.5:1));
    const earned = t.code==="EL" ? HOLIDAY_WORKED.filter(h=>h.who===who && h.date.slice(0,4)===String(year) && h.date<=asOf).length : 0;
    return {
      code:t.code,
      label:t.label,
      paid:t.paid,
      allocated,
      used,
      pending,
      earned,
      remaining:allocated+earned-used
    };
  });
}
function upcomingApprovedLeave(who){
  return LEAVE.filter(l=>l.who===who && l.status==="approved" && l.date>=TODAY).sort((a,b)=>a.date<b.date?-1:1);
}

/* ============  SIGNATURE: the ruled budget scale  ================ */
function scale(budget, logged){
  const MAX=125, pos=v=>Math.min(v,MAX)/MAX*100;
  const pct = budget ? logged/budget*100 : 0;
  const cls = pct>100?"over":pct>=90?"warn":"";
  const over = pct>100
    ? '<div class="scale-over" style="left:'+pos(100)+'%;width:'+(pos(pct)-pos(100))+'%"></div>' : "";
  return '<div class="scale"><div class="scale-track">'+
    '<div class="scale-fill '+cls+'" style="width:'+pos(Math.min(pct,100))+'%"></div>'+over+
    '<div class="scale-tick" style="left:'+pos(75)+'%"></div>'+
    '<div class="scale-tick" style="left:'+pos(90)+'%"></div>'+
    '<div class="scale-tick hard" style="left:'+pos(100)+'%"></div>'+
    '</div></div><div class="scale-legend">'+
    '<span style="left:'+pos(75)+'%">75</span>'+
    '<span style="left:'+pos(90)+'%">90</span>'+
    '<span class="hard" style="left:'+pos(100)+'%">'+hrs(budget)+'h budget</span></div>';
}

function datesBetween(start,end){
  const out=[];
  const [sy,sm,sd]=start.split("-").map(Number);
  const [ey,em,ed]=end.split("-").map(Number);
  let cur=Date.UTC(sy,sm-1,sd);
  const stop=Date.UTC(ey,em-1,ed);
  while(cur<=stop){ out.push(new Date(cur).toISOString().slice(0,10)); cur+=86400000; }
  return out;
}

    return h;
  }
};

/* ===================  MY SALARY & PAYSLIPS  ======================
   Every employee sees their own CTC, salary history and monthly payslip; a
   partner additionally downloads anyone's payslip from Salary. Nothing is
   recalculated here: a payslip is salaryCalculation() — the same numbers as
   the partner's Salary screen — laid out as a document.
   Access is enforced by Supabase RLS, not by hiding: an employee's session can
   only read their own employee_salary_history rows (029), their own punches
   and their own leave, so it cannot build anyone else's payslip. */
let mySalaryMonth = TODAY.slice(0,7);
let MY_PAYSLIP = { month:null, punches:[], loading:false, error:"" };

const moneyFull = n => (+n||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});

function payslipMonthRange(profile){
  const min = (profile.joined || TODAY).slice(0,7);
  let max = TODAY.slice(0,7);
  if(profile.left && profile.left.slice(0,7) < max) max = profile.left.slice(0,7);
  return [min, max];
}

/* Indian-system amount in words: 123456.5 -> "One Lakh Twenty Three Thousand
   Four Hundred Fifty Six Rupees and Fifty Paise Only". */
function amountInWords(amount){
  const ones=["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen",
    "Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"];
  const tens=["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
  const two=n=> n<20 ? ones[n] : tens[Math.floor(n/10)]+(n%10?" "+ones[n%10]:"");
  const three=n=> (n>=100 ? ones[Math.floor(n/100)]+" Hundred"+(n%100?" ":"") : "")+(n%100?two(n%100):"");
  const words=n=>{
    if(!n) return "Zero";
    const parts=[], crore=Math.floor(n/1e7), lakh=Math.floor(n/1e5)%100, thousand=Math.floor(n/1e3)%100, rest=n%1000;
    if(crore) parts.push(words(crore)+" Crore");
    if(lakh) parts.push(two(lakh)+" Lakh");
    if(thousand) parts.push(two(thousand)+" Thousand");
    if(rest) parts.push(three(rest));
    return parts.join(" ");
  };
  const total=Math.round((+amount||0)*100), rupees=Math.floor(total/100), paise=total%100;
  return words(rupees)+" Rupees"+(paise?" and "+two(paise)+" Paise":"")+" Only";
}

/* Everything a payslip shows, from one salaryCalculation() result. The
   company is the one on the salary record in force that month (so a past
   month keeps the company that paid it), falling back to the employee's
   current company. */
function payslipData(calc){
  const p = calc.profile;
  const companyId = (calc.record && calc.record.companyId) || p.companyId;
  const earnings = [["Basic monthly salary (CTC)", calc.ctc]];
  if(calc.holidayWorked) earnings.push(["Holidays worked ("+calc.holidayWorked+" day"+(calc.holidayWorked===1?"":"s")+")", calc.holidayEarning]);
  const deductions = [];
  if(calc.absent) deductions.push(["Loss of pay — absent ("+calc.absent+" day"+(calc.absent===1?"":"s")+")", calc.absenceDeduction]);
  if(calc.half) deductions.push(["Loss of pay — half days ("+calc.half+")", calc.halfDeduction]);
  const gross = earnings.reduce((a,[,v])=>a+v,0), totalDeductions = deductions.reduce((a,[,v])=>a+v,0);
  const [first,last] = monthRange(calc.month);
  return {
    companyId, companyName: companyFullName(companyId) || FIRM.name, organizationName: FIRM.name,
    employeeName: p.name, employeeId: p.code || "", designation: ROLE_LABEL[p.role] || p.role || "",
    department: p.department || "",          // no department field exists yet — printed only when present
    month: calc.month, period: monthLabel(calc.month), periodFrom: first, periodTo: last,
    joined: p.joined || "", monthlyCtc: calc.ctc, annualCtc: calc.ctc*12, dailyRate: calc.daily,
    ctcEffectiveFrom: calc.record ? calc.record.effective : "",
    attendance: [["Days in month", datesBetween(first,last).length], ["Days present", calc.present],
      ["Absent (loss of pay)", calc.absent], ["Half days (loss of pay)", calc.half],
      ["Holidays in month", calc.publicHolidays], ["Holidays worked", calc.holidayWorked],
      ["Earned leave balance", fmtDays(calc.earnedLeaveBalance)]],
    earnings, deductions, gross, totalDeductions, net: calc.final,
    provisional: calc.month === TODAY.slice(0,7),
  };
}
