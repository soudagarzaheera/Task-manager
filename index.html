}
function setSalaryMonth(value){ if(!/^\d{4}-\d{2}$/.test(value))return; salaryMonth=value;salaryDetailId=null;loadSalaryMonth(); }
function setSalaryEmployee(value){salaryEmployee=value;salaryDetailId=null;render();}
function setSalaryCompany(value){salaryCompany=value;salaryEmployee="all";salaryDetailId=null;render();}

/* A holiday or full-day leave is "off" — it never needs an entry, so it
   doesn't hold up sequential day entry. */
function dayInfo(who, i, week=WEEK){
  const date = addDays(week,i);
  const hol = holidayOn(date), lv = leaveOn(who,date), optional = isOptionalWorkDay(date);
  return { date, hol, lv, optional, off: !!hol || optional || (lv && lv.part==="full") };
}
/* Every working day of the week (Mon–Sat) is covered by a holiday or leave. */
function weekFullyOff(who, week=WEEK){ return [0,1,2,3,4,5].every(i=>dayInfo(who,i,week).off); }

const entriesForWeek = (who,wk) => ENTRIES.filter(x=>x.who===who && x.week===wk);
/* Sequential entry: a day counts as accounted for once something is logged
   against it — draft, pending or approved all count the same, so an
   already-approved day stays "done" rather than re-blocking the days after
   it — or it is excused by a holiday or approved leave (full or half),
   same signal dayInfo() already uses for "off". */
function dayFilled(who, i, week=WEEK){
  const d = dayInfo(who, i, week);
  if(d.off || d.lv) return true;
  return entriesForWeek(who, week).some(x=>x.day===i);
}
/* Earliest required day in the week still needing an entry, or null once
   every day is either logged or excused. */
function firstOpenDay(who, week=WEEK){
  for(let i=0;i<=5;i++){ if(!dayFilled(who,i,week)) return i; }
  return null;
}
const entriesFor = (who, week=WEEK) => entriesForWeek(who, week);
const bookedFor  = (who, week=WEEK) => sum(entriesFor(who,week).map(x=>+x.hours||0));
const dateOf = en => en.date || addDays(en.week, en.day);
const entriesOnDate = (who,date) => ENTRIES.filter(x=>x.who===who && dateOf(x)===date);
function weeksFor(who){
  return [...new Set(ENTRIES.filter(x=>x.who===who).map(x=>x.week))].sort().reverse();
}

/* Hours actually on a job = every entry loaded for it, across every week,
   whatever the grade. All history comes from Supabase, so there is no
   separate "prior" bucket to add on top of. */
/* Budgeted Hours (jobs.budget_hours → j.budget) is the figure set when the
   job was raised and is never changed automatically — not by timesheets,
   tasks or approvals. Additional hours are separate: each approved
   budget_requests row adds (to − from), and the hours available are
   budgeted + approved additional. */
function jobExtraHours(jid){ return JOB_EXTRA_HOURS[jid] || 0; }
function jobBudgetTotal(jid){ const j=job(jid); return (j && j.budget || 0) + jobExtraHours(jid); }
/* The one "over budget" rule — used by the Today dashboard count and by the
   Job codes "over budget" filter, so the two always agree: a live (not
   closed, not overhead) job whose booked hours exceed its budgeted hours plus
   approved additional hours. */
function isJobOverBudget(j){
  return !!j && !j.overhead && j.status!=="closed" && jobHours(j.id) > jobBudgetTotal(j.id);
}
/* Hard limit: hours booked on a job (every entry, any status) may not
   exceed budgeted + approved additional. Overhead codes have no budget.
   Mirrors trg_timesheet_job_budget_limit (023_job_budget_hard_limit.sql). */
function jobRemainingHours(jid){
  const j=job(jid);
  if(!j || j.overhead) return Infinity;
  return Math.max(0, +(jobBudgetTotal(jid) - jobHours(jid)).toFixed(2));
}
function budgetBlocked(jid, requested, serverMsg){
  const j=job(jid), left=jobRemainingHours(jid);
  const pending=BUDGET_REQUESTS.some(b=>b.job===jid && b.status==="pending");
  modal('<h3>Not enough hours left on '+esc(j.code)+'</h3>'+
    '<p style="margin-bottom:10px">'+(left>0
      ? 'Only '+hrs(left)+'h remain'+' for this job. Please request additional hours before recording more time.'
      : 'No hours remain for this job. Please request additional hours before recording more time.')+'</p>'+
    '<p class="tiny muted" style="margin-bottom:14px">'+esc(budgetBreakdown(jid))+' · '+hrs(jobHours(jid))+'h already booked · '+
      hrs(requested)+'h in this entry.'+(serverMsg?'<br>'+esc(serverMsg):'')+'</p>'+
    (pending?'<p class="tiny" style="margin-bottom:12px">A request for more hours on this job is already waiting for approval. '+
      'Hours become available once it is approved.</p>':'')+
    '<div class="row"><button class="btn ghost" onclick="closeModal()">Close</button>'+
    (pending?'':'<button class="btn" onclick="askBudget(\''+jid+'\')">Request more hours</button>')+'</div>');
}
function budgetBreakdown(jid){
  const j=job(jid), extra=jobExtraHours(jid);
  return hrs(j.budget)+"h budgeted"+(extra ? " + "+hrs(extra)+"h additional = "+hrs(j.budget+extra)+"h" : "");
}

function jobHours(jid){
  return sum(ENTRIES.filter(x=>x.job===jid).map(x=>+x.hours||0));
}
function jobHoursApproved(jid){
  return sum(ENTRIES.filter(x=>x.job===jid && x.status==="approved").map(x=>+x.hours||0));
}
function jobHoursByGrade(jid, weekOnly){
  const out={};
  ENTRIES.filter(x=>x.job===jid && (!weekOnly || x.week===WEEK)).forEach(x=>{
    const r=person(x.who).label; out[r]=(out[r]||0)+(+x.hours||0);
  });
  return out;
}

/* Group a person's week by job code — this is the unit of approval.
   You can pass one job code and query another. */
function groupsFor(who, week=WEEK){
  const g={};
  entriesFor(who,week).forEach(x=>{ (g[x.job]=g[x.job]||[]).push(x); });
  return Object.keys(g).map(jid=>{
    const rows=g[jid], sts=[...new Set(rows.map(r=>r.status))];
    return { job:jid, rows, hours:sum(rows.map(r=>+r.hours||0)),
             status: sts.length===1 ? sts[0] : "mixed",
             query: (rows.find(r=>r.query)||{}).query || "" };
  }).sort((a,b)=>{
    const ao=job(a.job).overhead?1:0, bo=job(b.job).overhead?1:0;
    return ao-bo || (job(a.job).code<job(b.job).code?-1:1);
  });
}

let NIL_FILED = [];   // {who, week} — a week with nothing booked still goes on record
let HALF_DAYS = [];   // {who, date} — timesheet_half_days (045): minimum 4h instead of 8h

/* Minimum hours per submitted day (from OPTIONAL_DAYS_FROM): 8, or 4 on a
   day marked as a half day or with an approved half-day leave. Mirrors
   trg_timesheet_day_minimum, which re-checks on submission. Applies to any
   day with time on it — Saturdays, Sundays, holidays and leave days need
   nothing unless time is submitted for them. */
const isHalfDayMarked = (who,date) => HALF_DAYS.some(h=>h.who===who && h.date===date);
function halfDayLeaveOn(who,date){ const lv=leaveOn(who,date); return !!lv && lv.part==="half"; }
function dayMinimumHours(who,date){
  return (isHalfDayMarked(who,date) || halfDayLeaveOn(who,date)) ? MIN_HALF_DAY_HOURS : MIN_FULL_DAY_HOURS;
}
const dayTotalHours = (who,date) => sum(entriesOnDate(who,date).map(x=>+x.hours||0));
/* Days among `rows` that are below their minimum. */
function daysBelowMinimum(who, rows){
  return [...new Set(rows.map(dateOf))].filter(d=>d>=OPTIONAL_DAYS_FROM).sort()
    .map(d=>({ date:d, total:dayTotalHours(who,d), min:dayMinimumHours(who,d) }))
    .filter(x=>x.total < x.min);
}
async function setHalfDay(date, on){
  if(!validISODate(date)) return;
  if(entriesOnDate(me,date).some(x=>x.status==="pending"||x.status==="approved"))
    return toast("Time for "+fmtShort(date)+" is already submitted — its half-day setting can no longer change");
  const q = on
    ? supabase.from("timesheet_half_days").insert({ organization_id:ORG_ID, profile_id:me, work_date:date })
    : supabase.from("timesheet_half_days").delete().eq("organization_id",ORG_ID).eq("profile_id",me).eq("work_date",date);
  const { error } = await q;
  if(error && !(on && /duplicate key/i.test(error.message||""))){
    render();
    return toast(/timesheet_half_days/.test(error.message||"")
      ? "Half days need the latest database update — ask an administrator"
      : "Could not save — "+error.message);
  }
  HALF_DAYS = HALF_DAYS.filter(h=>!(h.who===me && h.date===date));
  if(on) HALF_DAYS.push({ who:me, date });
  toast(fmtShort(date)+(on?" marked as a half day (minimum 4h)":" is a full day again (minimum 8h)"));
  render();
}
/* Per-day hours against the minimum, with the Half day switch. */
function dayHoursHTML(week){
  const dates=[...new Set(entriesFor(me,week).map(dateOf))].sort();
  if(!dates.length) return "";
  return '<div class="card" style="margin-bottom:14px"><div class="card-head"><h2>Hours per day</h2></div>'+
    '<table><thead><tr><th>Day</th><th class="r">Booked</th><th class="r">Minimum</th><th>Half day</th><th class="r"></th></tr></thead><tbody>'+
    dates.map(d=>{
      const total=dayTotalHours(me,d), ruled=d>=OPTIONAL_DAYS_FROM, min=dayMinimumHours(me,d);
      const submitted=entriesOnDate(me,d).some(x=>x.status==="pending"||x.status==="approved");
      const leaveHalf=halfDayLeaveOn(me,d), marked=isHalfDayMarked(me,d);
      const sw = !ruled ? '<span class="muted tiny">—</span>'
        : leaveHalf ? '<span class="tag info">half-day leave</span>'
        : '<label style="display:inline-flex;gap:6px;align-items:center;margin:0"><input type="checkbox" style="width:auto"'+
            (marked?' checked':'')+(submitted?' disabled':'')+
            ' onchange="setHalfDay(\''+d+'\',this.checked)"> Half day</label>';
      const st = !ruled ? '<span class="muted tiny">no minimum</span>'
        : total>=min ? '<span class="tag ok">ok</span>'
        : '<span class="tag bad">'+hrs(min-total)+'h short</span>';
      return '<tr><td class="num">'+weekdayDate(d)+'</td><td class="r num">'+hrs(total)+'h</td>'+
        '<td class="r num">'+(ruled?min+'h':'—')+'</td><td>'+sw+'</td><td class="r">'+st+'</td></tr>';
    }).join("")+'</tbody></table>'+
    '<p class="tiny muted" style="margin-top:9px">A submitted day needs at least '+MIN_FULL_DAY_HOURS+' hours. '+
      'Worked half a day? Tick Half day — then at least '+MIN_HALF_DAY_HOURS+' hours. '+
      'Saturdays, Sundays, holidays and leave days need no time unless you book some.</p></div>';
}
const sheetStatus = (who, week=WEEK) => sheetStatusFor(who, week);
function sheetStatusFor(who, wk){
  const rows=entriesForWeek(who, wk);
  if(!rows.length){
    if(NIL_FILED.some(n=>n.who===who && n.week===wk)) return "nil filed";
    return weekFullyOff(who,wk) ? "nil week" : "not started";
  }
  const s=new Set(rows.map(r=>r.status));
  if(s.has("draft")) return "draft";
  if(s.has("pending")) return "submitted";
  if(s.has("approved") && s.has("queried")) return "partly approved";
  if(s.has("queried")) return "sent back";
  return "approved";
}
const STATUS_TAG = {
  "approved":"ok", "partly approved":"warn", "submitted":"warn",
  "sent back":"bad", "draft":"", "not started":"bad",
  "nil week":"info", "nil filed":"ok"
};

/* ======================  PERMISSIONS  ========================== */
/* One place, so the role audit is checkable rather than scattered. */
const CAN = {
  logTime:        ()      => true,
  selfCertify:    (id=me) => person(id).role==="partner",
  approveSheet:   (owner) => owner!==me &&
                             (person(owner).reportsTo===me || (rank()>=90 && rank(owner)<90)),
  requestBudget:  ()      => person(me).role!=="partner",
  /* Partners may book beyond a job's budget; everyone else is held to it.
     Same rule as enforce_job_budget_limit() (024). */
  exceedJobBudget:()      => person(me).role==="partner",
  approveBudget:  (req)   => rank()>=MANAGER_RANK && (req.by!==me || rank()>=90),
  closeJob:       ()      => rank()>=MANAGER_RANK,
  reopenJob:      ()      => rank()>=MANAGER_RANK,
  /* Assistant Manager and above — same rule as jobs_insert and
     trg_tasks_assignment_rank (030). */
  createJob:      ()      => rank()>=ASSIGN_RANK,
  /* Partner, Manager, Assistant Manager — same bar as the statutory_dates /
     statutory_categories write policies (034). */
  manageStatutory:()      => rank()>=ASSIGN_RANK,
  /* Editing a job code's details: same people who can raise one (jobs_update, 032). */
  editJob:        ()      => rank()>=ASSIGN_RANK,
  /* A job's Responsible Partner — choosing one other than the default, or
     changing it later: a Partner on any job, a Manager only on their own
     company's jobs. Deliberately narrower than editJob (Assistant Managers
     keep the default). Same rule as auth_can_set_job_partner() (042). */
  setJobPartner:  (companyId) => rank()>=RANK.partner ||
                             (rank()>=RANK.manager && !!companyId && companyId===person(me).companyId),
  reassignTask:   ()      => rank()>=ASSIGN_RANK,
  editTaskStatus: (t)     => t.who===me || rank()>=50,
  seeTeamAtt:     ()      => rank()>=50,
  approveClaim:   (c)     => c.who!==me && rank()>=MANAGER_RANK,
  /* Claim payment: Assistant Manager and above (never their own claim), or a
     legacy "accounts" profile. Same boundary as expense_claims_update and
     guard_expense_claim() (036). */
  payClaim:       (c)     => person(me).role==="accounts" || (rank()>=MANAGER_RANK && (!c || c.who!==me)),
  seeFirmTime:    ()      => rank()>=50,
  /* Attendance export is a payroll-adjacent document (everyone's punch
     times and locations in one file) — narrower than seeFirmTime()'s
     manager-and-up cost visibility, so it gets its own, partner-only rule. */
  exportAttendance: ()    => person(me).role==="partner",
  seeReports:       ()    => person(me).role==="partner",
  viewMasters:    ()      => rank()>=MANAGER_RANK,
  manageTeam:     ()      => rank()>=90,
  /* Companies of the organization: create, rename, (de)activate. Partner
     only — same boundary as companies_insert/companies_update (028). */
  manageCompanies:()      => person(me).role==="partner",
  manageClients:  ()      => rank()>=MANAGER_RANK,
  removeClient:   ()      => rank()>=90,
  /* Same rule as approveSheet() — leave is approved by the same person who
     approves a timesheet: your direct manager, or any partner if you are
     not one yourself. A partner's own leave is self-certified (see
     applyLeave()), same as their timesheet. */
  approveLeave:   (owner, r) => canApproveLeaveRequest(me, owner, r),
  manageLeavePolicy: ()   => rank()>=90,
  /* Organization-wide holidays: Partner, Manager, Assistant Manager — same as
     holidays_write (046). Dates up to today are locked (trg_guard_holiday_change, 043). */
  manageHolidays: ()      => rank()>=ASSIGN_RANK,
  /* Designation list: Partner, Manager, Assistant Manager (designations_* RLS, 044). */
  manageDesignations: ()  => rank()>=ASSIGN_RANK,
  /* One designation: never a built-in; a non-partner only below their own level
     (auth_can_manage_designation, 044). */
  editDesignation: (d)    => !!d && !d.builtin && (rank()>=RANK.partner || (rank()>=ASSIGN_RANK && (RANK[d.accessRole]||0) < rank())),
  viewSalary:     ()      => person(me).role==="partner"
};
/* The Approvals page: Senior Executive and above, a legacy "accounts" profile,
   or anyone with a direct report — so a supervisor of any designation can
   reach the timesheets CAN.approveSheet() lets them decide. */
const anyApprovals = () => rank()>=50 || person(me).role==="accounts" ||
  PEOPLE.some(p=>p.active && p.reportsTo===me);

/* Reporting line traversal: direct supervisor or higher in tree */
function isAssignedUnder(who, bossId){
  if(!bossId || !who) return false;
  if(who === bossId) return false;
  let p = person(who);
  let cur = p.reportsTo, depth = 0;
  while(cur && depth++ < 15){
    if(cur === bossId) return true;
    cur = person(cur).reportsTo;
  }
  return false;
}

function canApproveLeaveRequest(viewerId, who, r){
  if(!viewerId || !who) return false;
  if(who === viewerId) return false;
  const vRole = person(viewerId).role;
  if(vRole === "partner" && person(who).role !== "partner") return true;
  const isSupervisor = (person(who).reportsTo === viewerId) || isAssignedUnder(who, viewerId);
  if(isSupervisor && rank(viewerId) >= 50){
    return true;
  }
  return false;
}

/* Period-specific responsibility check:
   If an employee was under Manager A during one period and moved to Manager B,
   Manager A only sees leaves relevant to their period (decided by Manager A),
   while Manager B sees pending leaves and leaves relevant to their period. */
function canSeeLeaveRequest(viewerId, r){
  if(!viewerId || !r) return false;
  if(r.who === viewerId) return true;

  const vRole = person(viewerId).role;
  if(vRole === "partner") return true;

  // If viewer was the designated approver/decision-maker during their period of responsibility
  if(r.approvedBy && r.approvedBy === viewerId) return true;

  const currentlyAssigned = (person(r.who).reportsTo === viewerId) || isAssignedUnder(r.who, viewerId);

  if(currentlyAssigned && rank(viewerId) >= 50){
    if(r.status === "pending") return true;
    // If decided by a different supervisor (below partner) in an earlier period, hide from current one
    if(r.approvedBy && r.approvedBy !== viewerId){
      if(rank(r.approvedBy) >= 50 && rank(r.approvedBy) < 90){
        return false;
      }
    }
    return true;
  }

  return false;
}

function pendingSheets(){
  return staff().filter(p=>CAN.approveSheet(p.id) && sheetStatus(p.id)==="submitted");
}
function pendingBudgets(){ return BUDGET_REQUESTS.filter(b=>b.status==="pending" && CAN.approveBudget(b)); }
function pendingClaims(){
  return CLAIMS.filter(c=>c.status==="submitted" && CAN.approveClaim(c))
    .concat(CLAIMS.filter(c=>c.status==="approved" && CAN.payClaim(c)));
}

/* ------------------  APPROVAL HISTORY (accepted / rejected)  ------------------
   Same authorization funcs as the pending lists above — a decided request is
   visible to whoever was allowed to decide it, never to everyone. "queried"
   is this app's reject-equivalent for a timesheet line (sent back with a
   reason, same as budget/claim rejection); there is no separate terminal
   "rejected" timesheet status, so history groups it under Rejected. */
function decidedGroupsFor(status){                 // status: "approved" | "queried"
  const out=[];
  staff().forEach(p=>{
    if(!CAN.approveSheet(p.id)) return;
    const byWeek={};
    ENTRIES.filter(x=>x.who===p.id).forEach(x=>{ (byWeek[x.week]=byWeek[x.week]||[]).push(x); });
    Object.keys(byWeek).forEach(wk=>{
      const g={};
      byWeek[wk].forEach(x=>{ (g[x.job]=g[x.job]||[]).push(x); });
      Object.keys(g).forEach(jid=>{
        const rows=g[jid], sts=[...new Set(rows.map(r=>r.status))];
        if(sts.length===1 && sts[0]===status){
          out.push({ person:p, job:jid, week:wk, rows,
            hours:sum(rows.map(r=>+r.hours||0)),
            query:(rows.find(r=>r.query)||{}).query||"",
            decidedBy:rows[0].decidedBy, decidedAt:rows[0].decidedAt });
        }
      });
    });
  });
  return out.sort((a,b)=> (b.decidedAt||b.week) < (a.decidedAt||a.week) ? -1 : 1);
}
/* Budget/claim history is only shown to the ranks authorized to decide them
   (CAN.approveBudget / CAN.approveClaim / CAN.payClaim) — same gate as the
   pending lists, just without the "not your own" nuance, which only matters
   for who may *decide*, not who may see what was already decided. */
function decidedBudgets(status){ return BUDGET_REQUESTS.filter(b=>b.status===status && rank()>=MANAGER_RANK); }
function acceptedClaims(){ return CLAIMS.filter(c=>(c.status==="approved"||c.status==="paid") && (rank()>=MANAGER_RANK || CAN.payClaim())); }
function rejectedClaims(){ return CLAIMS.filter(c=>c.status==="rejected" && rank()>=MANAGER_RANK); }

function approvalCounts(){
  return {
    pending:  approvalCount(),
    accepted: decidedGroupsFor("approved").length + decidedBudgets("approved").length + acceptedClaims().length + decidedLeaveRequests("approved").length,
    rejected: decidedGroupsFor("queried").length  + decidedBudgets("rejected").length + rejectedClaims().length + decidedLeaveRequests("rejected").length
  };
}
const approvalCount = () => pendingSheets().length + pendingBudgets().length + pendingClaims().length + pendingLeaveRequests().length;

/* ------------------  LEAVE  ------------------
   `leaves` is one row per calendar day (007_leave_management.sql); a
   "request" is every row sharing a request_id. Grouped here exactly the way
   groupsFor()/decidedGroupsFor() already group timesheet_entries rows by
   job code — same idiom, same reason: one decision covers several rows. */
function leaveGroup(rows){
  const first=rows[0], dates=rows.map(r=>r.date).sort();
  return {
    requestId:first.requestId, who:first.who, type:first.type, status:first.status,
    reason:first.reason, rejectionReason:first.rejectionReason,
    approvedBy:first.approvedBy, approvedAt:first.approvedAt, createdAt:first.createdAt,
    start:dates[0], end:dates[dates.length-1],
    days:sum(rows.map(r=>r.part==="half"?0.5:1)), rows
  };
}
function leaveRequestsFor(who){
  const g={};
  LEAVE.filter(l=>l.who===who).forEach(l=>{ (g[l.requestId]=g[l.requestId]||[]).push(l); });
  return Object.values(g).map(leaveGroup).sort((a,b)=> a.start<b.start?1:-1);
}

function pendingLeaveRequests(){
  const out=[];
  staff().forEach(p=>{
    if(p.id === me) return;
    leaveRequestsFor(p.id).filter(r=>r.status==="pending").forEach(r=>{
      if(canApproveLeaveRequest(me, p.id, r)){
        out.push(Object.assign({person:p},r));
      }
    });
  });
  return out.sort((a,b)=> a.createdAt<b.createdAt?1:-1);
}

function decidedLeaveRequests(status){                // status: "approved" | "rejected"
  const out=[];
  staff().forEach(p=>{
    if(p.id === me) return;
    leaveRequestsFor(p.id).filter(r=>r.status===status).forEach(r=>{
      if(canSeeLeaveRequest(me, r)){
        out.push(Object.assign({person:p},r));
      }
    });
  });
  return out.sort((a,b)=> (b.approvedAt||b.start) < (a.approvedAt||a.start) ? -1 : 1);
}

function teamLeaveRecords(viewerId){
  const out=[];
  staff().forEach(p=>{
    if(p.id === viewerId) return;
    leaveRequestsFor(p.id).forEach(r=>{
      if(canSeeLeaveRequest(viewerId, r)){
        out.push(Object.assign({person:p}, r));
      }
    });
  });
  return out.sort((a,b)=> (b.start < a.start ? -1 : 1));
}

function currentLeaveYear(){ return +TODAY.slice(0,4); }

const STATUS_TAG_LEAVE = { pending:"warn", approved:"ok", rejected:"bad", cancelled:"" };

/* Casual and Sick Leave are one combined type, CSL "Casual/Sick Leave"
   (019_combined_casual_sick_leave.sql). Leave days recorded before that
   under CL or SL keep their original code in the database (origType here);
   while the organization has an active CSL type they are read as CSL, so
   they show as Casual/Sick Leave and count toward the one CSL balance.
   An organization without CSL is unaffected. */
const COMBINED_LEAVE_CODE = "CSL";
const COMBINED_LEGACY_CODES = ["CL","SL"];
function canonicalLeaveCode(code){
  return COMBINED_LEGACY_CODES.includes(code) &&
    LEAVE_TYPES.some(t=>t.code===COMBINED_LEAVE_CODE && t.active) ? COMBINED_LEAVE_CODE : code;
}
function normalizeLeaveTypes(){
  LEAVE.forEach(l=>{ l.origType = l.origType || l.type; l.type = canonicalLeaveCode(l.origType); });
}
/* Legacy codes folded into CSL are not separate types any more. */
function isFoldedLeaveType(t){ return canonicalLeaveCode(t.code)!==t.code; }

function leaveTypeLabel(code){
  const c = canonicalLeaveCode(code);
  const t = LEAVE_TYPES.find(x=>x.code===c);
  return t ? t.label : code;
}

function fmtDays(n){ n=+n||0; return (Number.isInteger(n)?n:n.toFixed(1))+(n===1?" day":" days"); }

/* Allocated comes from leave_types (or a per-employee override); used and
   pending are summed live from `leaves`. l.type is already canonical, so
   old CL/SL days count toward the one Casual/Sick Leave balance. */
function leaveBalanceFor(who, year, asOf){
  year = year || currentLeaveYear();
  asOf = asOf || TODAY;
  const types = LEAVE_TYPES.filter(t => t.active && !isFoldedLeaveType(t));
  return types.map(t=>{
    const override = LEAVE_BALANCES.find(b=>b.who===who && b.code===t.code && b.year===year);
    const allocated = override ? override.allocated : t.annualDays;
    const rowsThisYear = LEAVE.filter(l=>l.who===who && l.type===t.code &&
      l.date.slice(0,4)===String(year) && l.date<=asOf && !isSaturdayHoliday(l.date) && !isOptionalWorkDay(l.date));
    const used    = sum(rowsThisYear.filter(l=>l.status==="approved").map(l=>l.part==="half"?0.5:1));
    const pending = sum(rowsThisYear.filter(l=>l.status==="pending").map(l=>l.part==="half"?0.5:1));
    const earned = t.code==="EL" ? HOLIDAY_WORKED.filter(h=>h.who===who && h.date.slice(0,4)===String(year) && h.date<=asOf).length : 0;
    return {
      code:t.code,
      label:t.label,
      paid:t.paid,
      allocated,
      used,
      pending,
      earned,
      remaining:allocated+earned-used
    };
  });
}
function upcomingApprovedLeave(who){
  return LEAVE.filter(l=>l.who===who && l.status==="approved" && l.date>=TODAY).sort((a,b)=>a.date<b.date?-1:1);
}

/* ============  SIGNATURE: the ruled budget scale  ================ */
function scale(budget, logged){
  const MAX=125, pos=v=>Math.min(v,MAX)/MAX*100;
  const pct = budget ? logged/budget*100 : 0;
  const cls = pct>100?"over":pct>=90?"warn":"";
  const over = pct>100
    ? '<div class="scale-over" style="left:'+pos(100)+'%;width:'+(pos(pct)-pos(100))+'%"></div>' : "";
  return '<div class="scale"><div class="scale-track">'+
    '<div class="scale-fill '+cls+'" style="width:'+pos(Math.min(pct,100))+'%"></div>'+over+
    '<div class="scale-tick" style="left:'+pos(75)+'%"></div>'+
    '<div class="scale-tick" style="left:'+pos(90)+'%"></div>'+
    '<div class="scale-tick hard" style="left:'+pos(100)+'%"></div>'+
    '</div></div><div class="scale-legend">'+
    '<span style="left:'+pos(75)+'%">75</span>'+
    '<span style="left:'+pos(90)+'%">90</span>'+
    '<span class="hard" style="left:'+pos(100)+'%">'+hrs(budget)+'h budget</span></div>';
}

function datesBetween(start,end){
  const out=[];
  const [sy,sm,sd]=start.split("-").map(Number);
  const [ey,em,ed]=end.split("-").map(Number);
  let cur=Date.UTC(sy,sm-1,sd);
  const stop=Date.UTC(ey,em-1,ed);
  while(cur<=stop){ out.push(new Date(cur).toISOString().slice(0,10)); cur+=86400000; }
  return out;
}

    return h;
  }
};

/* ===================  MY SALARY & PAYSLIPS  ======================
   Every employee sees their own CTC, salary history and monthly payslip; a
   partner additionally downloads anyone's payslip from Salary. Nothing is
   recalculated here: a payslip is salaryCalculation() — the same numbers as
   the partner's Salary screen — laid out as a document.
   Access is enforced by Supabase RLS, not by hiding: an employee's session can
   only read their own employee_salary_history rows (029), their own punches
   and their own leave, so it cannot build anyone else's payslip. */
let mySalaryMonth = TODAY.slice(0,7);
let MY_PAYSLIP = { month:null, punches:[], loading:false, error:"" };

const moneyFull = n => (+n||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});

function payslipMonthRange(profile){
  const min = (profile.joined || TODAY).slice(0,7);
  let max = TODAY.slice(0,7);
  if(profile.left && profile.left.slice(0,7) < max) max = profile.left.slice(0,7);
  return [min, max];
}

/* Indian-system amount in words: 123456.5 -> "One Lakh Twenty Three Thousand
   Four Hundred Fifty Six Rupees and Fifty Paise Only". */
function amountInWords(amount){
  const ones=["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen",
    "Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"];
  const tens=["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
  const two=n=> n<20 ? ones[n] : tens[Math.floor(n/10)]+(n%10?" "+ones[n%10]:"");
  const three=n=> (n>=100 ? ones[Math.floor(n/100)]+" Hundred"+(n%100?" ":"") : "")+(n%100?two(n%100):"");
  const words=n=>{
    if(!n) return "Zero";
    const parts=[], crore=Math.floor(n/1e7), lakh=Math.floor(n/1e5)%100, thousand=Math.floor(n/1e3)%100, rest=n%1000;
    if(crore) parts.push(words(crore)+" Crore");
    if(lakh) parts.push(two(lakh)+" Lakh");
    if(thousand) parts.push(two(thousand)+" Thousand");
    if(rest) parts.push(three(rest));
    return parts.join(" ");
  };
  const total=Math.round((+amount||0)*100), rupees=Math.floor(total/100), paise=total%100;
  return words(rupees)+" Rupees"+(paise?" and "+two(paise)+" Paise":"")+" Only";
}

/* Everything a payslip shows, from one salaryCalculation() result. The
   company is the one on the salary record in force that month (so a past
   month keeps the company that paid it), falling back to the employee's
   current company. */
function payslipData(calc){
  const p = calc.profile;
  const companyId = (calc.record && calc.record.companyId) || p.companyId;
  const earnings = [["Basic monthly salary (CTC)", calc.ctc]];
  if(calc.holidayPaidDays) earnings.push(["Holidays worked ("+calc.holidayPaidDays+" day"+(calc.holidayPaidDays===1?"":"s")+")", calc.holidayEarning]);
  const deductions = [];
  if(calc.absent) deductions.push(["Loss of pay — absent ("+calc.absent+" day"+(calc.absent===1?"":"s")+")", calc.absenceDeduction]);
  if(calc.half) deductions.push(["Loss of pay — half days ("+calc.half+")", calc.halfDeduction]);
  const gross = earnings.reduce((a,[,v])=>a+v,0), totalDeductions = deductions.reduce((a,[,v])=>a+v,0);
  const [first,last] = monthRange(calc.month);
  return {
    companyId, companyName: companyFullName(companyId) || FIRM.name, organizationName: FIRM.name,
    employeeName: p.name, employeeId: p.code || "", designation: desigName(p) || ROLE_LABEL[p.role] || p.role || "",
    department: p.department || "",          // no department field exists yet — printed only when present
    month: calc.month, period: monthLabel(calc.month), periodFrom: first, periodTo: last,
    joined: p.joined || "", monthlyCtc: calc.ctc, annualCtc: calc.ctc*12, dailyRate: calc.daily,
    ctcEffectiveFrom: calc.record ? calc.record.effective : "",
    attendance: [["Days in month", datesBetween(first,last).length], ["Days present", calc.present],
      ["Absent (loss of pay)", calc.absent], ["Half days (loss of pay)", calc.half],
      ["Holidays in month", calc.publicHolidays], ["Saturdays / holidays worked", calc.holidayWorked],
      ["Earned leave balance", fmtDays(calc.earnedLeaveBalance)]],
    earnings, deductions, gross, totalDeductions, net: calc.final,
    provisional: calc.month === TODAY.slice(0,7),
  };
}

/* Company logo (029): fetched only when a payslip is produced, then cached. */
const COMPANY_LOGO_CACHE = {};
async function companyLogo(companyId){
  if(!companyId) return null;
  if(companyId in COMPANY_LOGO_CACHE) return COMPANY_LOGO_CACHE[companyId];
  const { data, error } = await supabase.from("companies").select("logo_data_url").eq("id", companyId).maybeSingle();
  COMPANY_LOGO_CACHE[companyId] = (!error && data && data.logo_data_url) || null;
  return COMPANY_LOGO_CACHE[companyId];
}
const imageSize = src => new Promise(res=>{ const i=new Image(); i.onload=()=>res({w:i.naturalWidth,h:i.naturalHeight}); i.onerror=()=>res(null); i.src=src; });

/* A4 payslip PDF — black and white, for official payroll records. Built-in
   PDF fonts have no ₹ glyph, so amounts print as "Rs.". Draws payslipData()
   as-is; nothing here calculates a figure. */
async function buildPayslipPdf(d){
  if(!window.loadJsPDF) throw new Error("PDF library is not available");
  const jsPDF = await window.loadJsPDF();
  const doc = new jsPDF({ unit:"mm", format:"a4" });
  const W = 210, H = 297, M = 18, R = W - M, CW = R - M, FOOT = H - 14;
  const black=[0,0,0], grey=[90,90,90], hair=[200,200,200], fill=[242,242,242];
  const rs = n => "Rs. " + moneyFull(n);
  const font = (size, style, color) => { doc.setFont("helvetica", style||"normal"); doc.setFontSize(size); doc.setTextColor(...(color||black)); };
  const line = (x1, y1, x2, color, w) => { doc.setDrawColor(...(color||hair)); doc.setLineWidth(w||0.2); doc.line(x1, y1, x2, y1); };
  const LH = 4.1;                                   // line height (mm) for 8.5-9pt text
  let y = 18;
  // keep a block on one page; a new page restarts below the top margin
  const room = h => { if(y + h > FOOT - 6){ doc.addPage(); y = 18; } };
  const section = title => {
    room(14);
    font(8, "bold"); doc.setCharSpace(0.6); doc.text(title.toUpperCase(), M, y); doc.setCharSpace(0);
    line(M, y + 1.8, R, black, 0.3);
    y += 6;
  };

  // ---- header: logo + company | PAYSLIP + period ----
  const logo = await companyLogo(d.companyId);
  let textX = M;
  if(logo){
    const sz = await imageSize(logo);
    if(sz && sz.w && sz.h){
      const h = 14, w = Math.min(36, h * sz.w / sz.h);
      doc.addImage(logo, logo.startsWith("data:image/png") ? "PNG" : "JPEG", M, y - 4, w, w * sz.h / sz.w);
      textX = M + w + 5;
    }
  }
  font(15, "bold");
  const coLines = doc.splitTextToSize(d.companyName, R - 58 - textX);
  doc.text(coLines, textX, y + 1);
  let hy = y + 1 + (coLines.length - 1) * 6;
  if(d.organizationName && d.organizationName !== d.companyName){
    font(9, "normal", grey); hy += 5; doc.text(d.organizationName, textX, hy);
  }
  // letter-spaced title, drawn letter by letter so its right edge sits exactly on the margin
  font(16, "bold");
  const tsp = 1.2, title = [..."PAYSLIP"];
  let tx = R - (title.reduce((a,c)=>a+doc.getTextWidth(c),0) + tsp * (title.length - 1));
  title.forEach(c=>{ doc.text(c, tx, y); tx += doc.getTextWidth(c) + tsp; });
  font(10, "bold"); doc.text(d.period, R, y + 6, { align:"right" });
  font(8, "normal", grey); doc.text(fmtDate(d.periodFrom)+" to "+fmtDate(d.periodTo), R, y + 10.5, { align:"right" });
  y = Math.max(hy, y + 10.5) + 4;
  line(M, y, R, black, 0.6);
  y += 6;

  if(d.provisional){
    doc.setDrawColor(...black); doc.setLineWidth(0.3); doc.rect(M, y - 4, CW, 7);
    font(8.5, "bold"); doc.text("PROVISIONAL", M + 3, y + 0.6);
    font(8.5, "normal"); doc.text("Month in progress — attendance counted up to "+fmtDate(TODAY)+".", M + 27, y + 0.6);
    y += 9;
  }

  // ---- employee details: two columns of label / value rows ----
  section("Employee details");
  const details = [["Employee name", d.employeeName], ["Employee ID", d.employeeId], ["Designation", d.designation],
    ["Department", d.department], ["Date of joining", d.joined ? fmtDate(d.joined) : ""],
    ["Pay period", fmtDate(d.periodFrom)+" to "+fmtDate(d.periodTo)],
    ["Monthly CTC", rs(d.monthlyCtc)], ["Annual CTC", rs(d.annualCtc)],
    ["CTC effective from", d.ctcEffectiveFrom ? fmtDate(d.ctcEffectiveFrom) : ""], ["Company", d.companyName]]
    .filter(([,v])=>v);
  const colGap = 10, colW = (CW - colGap) / 2, labW = 32;
  for(let i = 0; i < details.length; i += 2){
    font(9, "bold");
    const pair = details.slice(i, i + 2).map(([l,v]) => [l, doc.splitTextToSize(String(v), colW - labW - 1)]);
    const h = Math.max(...pair.map(([,v]) => v.length)) * LH + 3;
    room(h);
    pair.forEach(([l,v], j) => {
      const x = M + j * (colW + colGap);
      font(8.5, "normal", grey); doc.text(l, x, y + 4);
      font(9, "bold"); doc.text(v, x + labW, y + 4);
      line(x, y + h, x + colW);
    });
    y += h;
  }
  y += 8;

  // ---- earnings | deductions ----
  const tGap = 8, tW = (CW - tGap) / 2;
  room(40);
  const tableTop = y;
  const table = (x, title, list) => {
    let ty = tableTop;
    doc.setFillColor(...fill); doc.rect(x, ty, tW, 7.5, "F");
    line(x, ty, x + tW, black, 0.4);
    font(8.5, "bold"); doc.text(title.toUpperCase(), x + 2.5, ty + 5); doc.text("AMOUNT", x + tW - 2.5, ty + 5, { align:"right" });
    ty += 7.5;
    line(x, ty, x + tW, black, 0.2);
    list.forEach(([l,v])=>{
      font(9, "normal");
      const wrapped = doc.splitTextToSize(l, tW - 36);
      const h = wrapped.length * LH + 3;
      doc.text(wrapped, x + 2.5, ty + 4.8); doc.text(rs(v), x + tW - 2.5, ty + 4.8, { align:"right" });
      line(x, ty + h, x + tW);
      ty += h;
    });
    return ty;
  };
  const eEnd = table(M, "Earnings", d.earnings.length ? d.earnings : [["—", 0]]);
  const dEnd = table(M + tW + tGap, "Deductions", d.deductions.length ? d.deductions : [["No deductions", 0]]);
  const totY = Math.max(eEnd, dEnd);
  [[M, "Gross earnings", d.gross], [M + tW + tGap, "Total deductions", d.totalDeductions]].forEach(([x,l,v])=>{
    line(x, totY, x + tW, black, 0.4);
    font(9.5, "bold"); doc.text(l, x + 2.5, totY + 5.2); doc.text(rs(v), x + tW - 2.5, totY + 5.2, { align:"right" });
    line(x, totY + 7.5, x + tW, black, 0.4);
  });
  y = totY + 7.5 + 8;

  // ---- net pay: bold, grey panel with a black border ----
  font(8.5, "normal");
  const words = doc.splitTextToSize("Amount in words: "+amountInWords(d.net), CW - 8);
  const netH = 16 + words.length * LH + 1;
  room(netH);
  doc.setFillColor(...fill); doc.setDrawColor(...black); doc.setLineWidth(0.2);
  doc.rect(M, y, CW, netH, "FD");
  font(10, "bold"); doc.setCharSpace(0.8); doc.text("NET PAY", M + 4, y + 7); doc.setCharSpace(0);
  font(16, "bold"); doc.text(rs(d.net), R - 4, y + 9, { align:"right" });
  line(M + 4, y + 13.5, R - 4, hair, 0.2);
  font(8.5, "normal"); doc.text(words, M + 4, y + 18);
  y += netH + 9;

  // ---- attendance summary: 4-column grid ----
  section("Attendance summary");
  const per = 4, aW = CW / per, aH = 11.5, rows = Math.ceil(d.attendance.length / per);
  room(rows * aH);
  d.attendance.forEach(([l,v],i)=>{
    const x = M + (i % per) * aW, yy = y + Math.floor(i / per) * aH;
    doc.setDrawColor(...hair); doc.setLineWidth(0.2); doc.rect(x, yy, aW, aH);
    font(7.5, "normal", grey); doc.text(doc.splitTextToSize(l, aW - 5)[0], x + 2.5, yy + 4.3);
    font(10, "bold"); doc.text(String(v), x + 2.5, yy + 9.2);
  });
  y += rows * aH + 9;

  // ---- notes ----
  

  // ---- footer on every page ----
  const pages = doc.getNumberOfPages();
  for(let p = 1; p <= pages; p++){
    doc.setPage(p);
    line(M, FOOT - 4, R, hair, 0.2);
    font(7.5, "normal", grey);
    doc.text("This is a computer-generated payslip and does not require a signature.", M, FOOT);
    doc.text("Generated on "+fmtDate(TODAY)+(pages > 1 ? "  ·  Page "+p+" of "+pages : ""), R, FOOT, { align:"right" });
  }
  return doc;
}

async function savePayslipPdf(d, btn){
  const label = btn ? btn.textContent : "";
  if(btn){ btn.disabled = true; btn.textContent = "Preparing PDF…"; }
  try{
    const doc = await buildPayslipPdf(d);
    const safe = s => String(s||"").replace(/[^A-Za-z0-9_-]+/g,"_");
    const fileName = "Payslip_"+safe(d.employeeId||d.employeeName)+"_"+d.month+".pdf";
    // Mobile app: jsPDF's doc.save() does nothing in the Android WebView.
    if(window.nativeFiles && window.nativeFiles.isNativeApp())
      await window.nativeFiles.saveNativeFile(fileName, doc.output("arraybuffer"), "application/pdf");
    else
      doc.save(fileName);
  }catch(err){
    console.error("[payslip]", err);
    toast("Could not create the PDF — "+(err && err.message ? err.message : err));
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = label; }
  }
}

/* An employee may download a month's payslip only once that month is over in
   India time (Asia/Kolkata), whatever the PC's time zone; until then My salary
   shows it as provisional. Partners are not restricted. Checked here in
   downloadPayslip() as well as in the screen, but payslips are built in the
   browser from data the employee can already read — an in-app rule, not a
   tamper-proof one. */
function indiaMonth(){
  const p = {};
  new Intl.DateTimeFormat("en-US", { timeZone:"Asia/Kolkata", year:"numeric", month:"2-digit" })
    .formatToParts(new Date()).forEach(x => { p[x.type] = x.value; });
  return p.year+"-"+p.month;
}
const payslipLocked = ym => !CAN.viewSalary() && ym >= indiaMonth();
function payslipAvailableFrom(ym){
  const [y,m] = ym.split("-").map(Number);
  return "1 "+monthLabel(m===12 ? (y+1)+"-01" : y+"-"+pad2(m+1));
}

/* mode "self": the signed-in user's own payslip (My salary).
   mode "partner": any employee in the Salary screen (partner only). */
async function downloadPayslip(who, mode){
  const btn = (typeof event !== "undefined" && event && event.target && event.target.closest) ? event.target.closest("button") : null;
  if(mode === "partner"){
    if(!CAN.viewSalary()) return toast("Salary is available to Partners only");
    const calc = salaryCalculation(person(who), salaryMonth, salaryPunches);
    if(!calc.hasCtc) return toast("Monthly CTC is not set for "+person(who).name);
    return savePayslipPdf(payslipData(calc), btn);
  }
  if(who !== me) return toast("You can only download your own payslip");
  if(payslipLocked(mySalaryMonth))
    return toast("The payslip for "+monthLabel(mySalaryMonth)+" can be downloaded from "+payslipAvailableFrom(mySalaryMonth));
  const calc = myPayslipCalc();
  if(!calc) return toast("Payslip not available for this month");
  return savePayslipPdf(payslipData(calc), btn);
}

async function loadMyPayslipMonth(ym){
  MY_PAYSLIP = { month:ym, punches:[], loading:true, error:"" }; render();
  const [first,last] = monthRange(ym);
  const { data, error } = await supabase.from("attendance_punches").select("profile_id,punch_date,punch_type")
    .eq("organization_id", ORG_ID).eq("profile_id", me)
    .gte("punch_date", first).lte("punch_date", last).order("punch_date");
  if(MY_PAYSLIP.month !== ym) return;   // a newer month was picked meanwhile
  MY_PAYSLIP = error
    ? { month:ym, punches:[], loading:false, error:"Could not load your attendance — "+error.message }
    : { month:ym, punches:data.map(p=>({who:p.profile_id,date:p.punch_date,type:p.punch_type})), loading:false, error:"" };
  render();
}
function setMySalaryMonth(v){
  if(!/^\d{4}-\d{2}$/.test(v)) return;
  const [min,max] = payslipMonthRange(person(me));
  mySalaryMonth = v < min ? min : v > max ? max : v;
  loadMyPayslipMonth(mySalaryMonth);
}
function myPayslipCalc(){
  if(MY_PAYSLIP.month !== mySalaryMonth || MY_PAYSLIP.loading || MY_PAYSLIP.error) return null;
  const calc = salaryCalculation(person(me), mySalaryMonth, MY_PAYSLIP.punches, MY_SALARY_HISTORY);
  return calc.hasCtc ? calc : null;
}

function budgetHint(jid){
  const total=jobBudgetTotal(jid); if(!total) return "";
  const used=jobHours(jid), pct=used/total*100;
  if(pct<90) return "";
  return '<p class="tiny" style="margin-top:6px;color:'+(pct>100?"var(--red)":"var(--ochre)")+'">'+
    'This job is at '+Math.round(pct)+'% of its '+esc(budgetBreakdown(jid))+
    (jobExtraHours(jid)?'':' budget')+
    (pct>100?' — approving adds to an overrun.':'.')+'</p>';
}

function renderApprovalHistory(status){          // status: "approved" | "rejected"
  const accepted = status==="approved";
  const word = accepted ? "accepted" : "rejected";
  let h = "";

  /* timesheets */
  const groups = decidedGroupsFor(accepted ? "approved" : "queried");
  h += '<div class="card"><div class="card-head"><h2>Timesheets</h2><span class="spacer"></span>'+
    '<span class="eyebrow">'+word+'</span></div>';
  h += groups.length ? groups.map(g=>
      '<div class="line '+(accepted?"approved":"queried")+'" style="cursor:pointer" '+
      'onclick="showTimesheetDecisionDetail(\''+g.person.id+'\',\''+g.job+'\',\''+g.week+'\')">'+
      '<div class="line-top">'+
        '<span class="strong">'+esc(g.person.name)+'</span>'+
        '<span class="code strong">'+esc(job(g.job).code)+'</span>'+
        '<span class="tiny muted">wk of '+fmtDate(g.week)+'</span>'+
        '<span class="num strong" style="margin-left:auto">'+hrs(g.hours)+'h</span>'+
        '<span class="tag '+(accepted?"ok":"bad")+'">'+(accepted?"accepted":"rejected")+'</span>'+
      '</div>'+
      (g.decidedBy?'<p class="tiny muted" style="margin-top:6px">'+(accepted?"Approved":"Rejected")+' by '+
        esc(person(g.decidedBy).name)+(g.decidedAt?", "+fmtDateTime(g.decidedAt):"")+'</p>':"")+
      (!accepted && g.query?'<p class="tiny" style="margin-top:4px;color:var(--red)">"'+esc(g.query)+'"</p>':"")+
      '</div>'
    ).join("")
    : '<div class="empty">No '+word+' timesheets yet.</div>';
  h += '</div>';

  /* budget increases */
  const budgets = decidedBudgets(accepted ? "approved" : "rejected");
  h += '<div class="card"><div class="card-head"><h2>Budget increases</h2></div>';
  h += rank()<MANAGER_RANK ? '<div class="empty">Only assistant managers, managers and partners can view this history.</div>'
    : budgets.length ? budgets.map(b=>
      '<div class="line '+(accepted?"approved":"queried")+'" style="cursor:pointer" onclick="showBudgetDetail(\''+b.id+'\')">'+
      '<div class="line-top">'+

        '<span class="tiny muted">'+esc(person(b.by).name)+', requested '+fmtDate(b.on)+'</span>'+
        '<span class="spacer" style="flex:1"></span>'+
        '<span class="tag '+(accepted?"ok":"bad")+'">'+(accepted?"accepted":"rejected")+'</span>'+
      '</div>'+
      (b.decidedBy?'<p class="tiny muted" style="margin-top:6px">'+(accepted?"Approved":"Rejected")+' by '+
        esc(person(b.decidedBy).name)+(b.decidedAt?", "+fmtDateTime(b.decidedAt):"")+'</p>':"")+
      '</div>'
    ).join("") : '<div class="empty">No '+word+' budget requests yet.</div>';
  h += '</div>';

  /* expense claims */
  const claims = accepted ? acceptedClaims() : rejectedClaims();
  h += '<div class="card"><div class="card-head"><h2>Expense claims</h2></div>';
  h += (rank()<MANAGER_RANK && !(accepted && CAN.payClaim())) ? '<div class="empty">Only assistant managers, managers and partners can view this history.</div>'
    : claims.length ? claims.map(c=>{
      const tot=sum(c.lines.map(l=>l.amount));
      const label = c.status==="paid" ? "paid" : accepted ? "accepted" : "rejected";
      return '<div class="line '+(c.status==="rejected"?"queried":"approved")+'" style="cursor:pointer" onclick="showClaimDetail(\''+c.id+'\')">'+
        '<div class="line-top">'+
          '<span class="strong">'+esc(person(c.who).name)+'</span>'+
          '<span class="tiny muted">'+monthLabel(c.month)+'</span>'+
          '<span class="num strong" style="margin-left:auto">'+money(tot)+'</span>'+
          '<span class="tag '+(c.status==="rejected"?"bad":"ok")+'">'+label+'</span>'+
        '</div>'+
        (c.approvedBy?'<p class="tiny muted" style="margin-top:6px">'+(c.status==="rejected"?"Rejected":"Approved")+' by '+
          esc(person(c.approvedBy).name)+(c.approvedAt?", "+fmtDateTime(c.approvedAt):"")+'</p>':"")+
        (c.status==="paid" && c.paidBy?'<p class="tiny muted" style="margin-top:2px">Paid by '+
          esc(person(c.paidBy).name)+(c.paidAt?", "+fmtDateTime(c.paidAt):"")+'</p>':"")+
        '</div>';
    }).join("") : '<div class="empty">No '+word+' expense claims yet.</div>';
  h += '</div>';

  /* leave requests */
  const leaveReqs = decidedLeaveRequests(accepted ? "approved" : "rejected");
  h += '<div class="card"><div class="card-head"><h2>Leave requests</h2></div>';
  h += leaveReqs.length ? leaveReqs.map(r=>
      '<div class="line '+(accepted?"approved":"queried")+'" style="cursor:pointer" '+
      'onclick="showLeaveDetail(\''+r.requestId+'\',\''+r.who+'\')">'+
      '<div class="line-top">'+
        '<span class="strong">'+esc(r.person.name)+'</span>'+
        '<span class="code">'+esc(leaveTypeLabel(r.type))+'</span>'+
        '<span class="tiny muted">'+fmtDate(r.start)+(r.end!==r.start?' – '+fmtDate(r.end):'')+'</span>'+
        '<span class="num">'+fmtDays(r.days)+'</span>'+
        '<span class="spacer" style="flex:1"></span>'+
        '<span class="tag '+(accepted?"ok":"bad")+'">'+(accepted?"accepted":"rejected")+'</span>'+
      '</div>'+
      (r.approvedBy?'<p class="tiny muted" style="margin-top:6px">'+(accepted?"Approved":"Rejected")+' by '+
        esc(person(r.approvedBy).name)+(r.approvedAt?", "+fmtDateTime(r.approvedAt):"")+'</p>':"")+
      (!accepted && r.rejectionReason?'<p class="tiny" style="margin-top:4px;color:var(--red)">"'+esc(r.rejectionReason)+'"</p>':"")+
      '</div>'
    ).join("")
    : '<div class="empty">No '+word+' leave requests yet.</div>';
  h += '</div>';

  return h;
}

function myMonthTableHTML(){
  if(MY_MONTH.month!==attMyMonth) return '<div class="empty">Loading…</div>';
  const [first,last] = monthRange(attMyMonth);
  const cap = last<TODAY ? last : TODAY;
  const days = cap<first ? [] : datesBetween(first, cap);
  if(!days.length) return '<div class="empty">Nothing in this month yet.</div>';
  const rows = MY_MONTH.rows;
  return '<table><thead><tr><th>Date</th><th>Punch in</th><th>Punch out</th><th>Where</th><th class="r">Status</th></tr></thead><tbody>'+
    days.slice().reverse().map(d=>{
      const dayRows = rows.filter(x=>x.date===d);
      const inP = dayRows.find(x=>x.type==="in");
      const outP = dayRows.slice().reverse().find(x=>x.type==="out");
      const st = attendanceDayStatus(me, d, inP, outP);
      return '<tr><td>'+fmtShort(d)+'</td><td class="num">'+(inP?inP.time:"—")+'</td>'+
        '<td class="num">'+(outP?outP.time:"—")+'</td>'+
        '<td class="tiny">'+(inP?punchPlaceHTML(inP,true):"—")+
          (outP && inP && ((outP.locType||"site")!==(inP.locType||"site") || outP.place!==inP.place || (outP.note||"")!==(inP.note||""))
            ?'<div class="muted">Out: '+punchPlaceHTML(outP,true)+'</div>':'')+'</td>'+
        '<td class="r"><span class="tag '+st.tag+'">'+esc(st.label)+'</span></td></tr>';
    }).join("")+
    '</tbody></table>';

/* Shared by the monthly history table and the partner Excel report, so the
   two always agree on what counts as "present"/"absent" for a given day. */
function attendanceDayStatus(who, d, inP, outP){
  const st = attendanceDayStatusOf(who, d, inP, outP);
  logAttendanceDate(d, st.label);
  return st;
}
function attendanceDayStatusOf(who, d, inP, outP){
  const hol = holidayOn(d);
  const lv = leaveOn(who, d);
  if(isOptionalWorkDay(d)){
    const ph = publicHolidayOn(d);
    if(inP && outP){
      const outsideFence = p => p.ok===false && p.locType!=="other";
      const flagged = inP.flagged || outP.flagged || outsideFence(inP) || outsideFence(outP);
      return { label:(flagged?"Present — flagged":"Present")+" · "+(ph?"Holiday worked":"Saturday worked"), tag:flagged?"warn":"ok" };
    }
    if(inP) return d===TODAY ? { label:"Punched in — not out yet", tag:"warn" }
                             : { label:"Missing punch-out", tag:"bad" };
    if(lv) return { label:esc(leaveTypeLabel(lv.type))+(lv.part!=="full"?" (half day)":""), tag:"info" };
    return { label:ph ? "Holiday — "+ph.name : "Saturday — optional", tag:"info" };
  }
  if(hol){
    if(holidayWorkedOn(who,d)) return { label:"Holiday Worked", tag:"ok" };
    return { label:isSaturdayHoliday(d)?"Saturday Holiday":"Holiday — "+hol.name, tag:"info" };
  }
  if(isSunday(d)) return { label:"Holiday", tag:"info" };
  if(lv) return { label:esc(leaveTypeLabel(lv.type))+(lv.part!=="full"?" (half day)":""), tag:"info" };
  if(inP && outP){
    const outsideFence = p => p.ok===false && p.locType!=="other";
    const flagged = inP.flagged || outP.flagged || outsideFence(inP) || outsideFence(outP);
    return { label: flagged?"Present — flagged":"Present", tag: flagged?"warn":"ok" };
  }
  if(inP && !outP) return d===TODAY ? { label:"Punched in — not out yet", tag:"warn" }
                                     : { label:"Missing punch-out", tag:"bad" };
  if(d>TODAY) return { label:"—", tag:"" };
  if(d===TODAY) return { label:"Not marked yet", tag:"" };
  return { label:"Absent", tag:"bad" };
}
function teamTodayRows(){
  return staff().filter(p=>p.id!==me).map(p=>{
    const mine = ALL_PUNCHES_TODAY.filter(x=>x.who===p.id).slice().sort((a,b)=>a.ts<b.ts?-1:a.ts>b.ts?1:0);
    const inP = mine.find(x=>x.type==="in");
    const outP = mine.slice().reverse().find(x=>x.type==="out");
    return { p, inTime:inP?inP.time:null, outTime:outP?outP.time:null,

      lv: leaveOn(p.id, TODAY), flagged: mine.some(x=>x.flagged), any: mine.length>0 };
  });
}

let workFilterAssignedBy = "all";
let workFilterAssignedTo = "all";
/* Due date filter: all | today | tomorrow | week | overdue | custom.
   "custom" uses workFilterDueFrom..workFilterDueTo (either end may be blank). */
let workFilterDue = "all";
let workFilterDueFrom = "";
let workFilterDueTo = "";

function setWorkFilter(field, val){
  if(field==="by") workFilterAssignedBy = val;
  if(field==="to") workFilterAssignedTo = val;
  if(field==="due"){
    workFilterDue = val;
    if(val==="custom" && !workFilterDueFrom && !workFilterDueTo){ workFilterDueFrom = TODAY; workFilterDueTo = TODAY; }
  }
  if(field==="dueFrom") workFilterDueFrom = validISODate(val) ? val : "";
  if(field==="dueTo")   workFilterDueTo   = validISODate(val) ? val : "";
  render();
}
function resetWorkFilters(){
  workFilterAssignedBy = "all"; workFilterAssignedTo = "all";
  workFilterDue = "all"; workFilterDueFrom = ""; workFilterDueTo = "";
  render();
}

/* Does a task's due date match the Due date filter? Dates are the app's local
   calendar dates (TODAY), compared as YYYY-MM-DD strings. "This week" is
   Monday–Sunday of the current week, the same week the timesheet uses.
   "Overdue" means due before today and not yet done. */
function matchesDueFilter(t){
  const due = t.due;
  switch(workFilterDue){
    case "today":    return due === TODAY;
    case "tomorrow": return due === addDays(TODAY, 1);
    case "week":     { const mon = mondayOfISO(TODAY); return !!due && due >= mon && due <= addDays(mon, 6); }
    case "overdue":  return !!due && due < TODAY && t.status !== "completed";
    case "custom": {
      let from = workFilterDueFrom, to = workFilterDueTo;
      if(from && to && from > to) [from, to] = [to, from];
      return !!due && (!from || due >= from) && (!to || due <= to);
    }
    default: return true;
  }
}

function getTaskCostForMonth(task, ym){
  if(!task) return 0;
  const targetYm = ym || TODAY.slice(0,7);
  const history = task.costHistory || [];
  if(!history.length) return +task.monthlyCost || 0;
  const sorted = [...history].sort((a,b)=> (a.effectiveMonth||"").localeCompare(b.effectiveMonth||""));
  let cost = 0;
  for(const entry of sorted){
    if(entry.effectiveMonth <= targetYm){
      cost = +entry.monthlyCost || 0;
    }
  }
  return cost;
}

function getTaskCurrentResponsibility(task){
  if(!task || !task.responsibilityHistory || !task.responsibilityHistory.length) return null;
  return task.responsibilityHistory.find(r=>!r.toDate) || task.responsibilityHistory[task.responsibilityHistory.length-1];
}

          mine.lines.map(l=>'<tr><td class="num tiny">'+fmtShort(l.date)+'</td>'+
          '<td><span class="code">'+esc(job(l.job).code)+'</span></td><td class="wrap">'+esc(l.desc)+'</td>'+
          '<td><span class="tag">'+l.cat.replace("_"," ")+'</span></td>'+
          '<td class="r num">'+money(l.amount)+'</td>'+
          '<td class="r">'+(l.rec?'<span class="tag ok">client</span>':'<span class="tag">firm</span>')+
          '</td></tr>').join("")+'</tbody></table>'
        : '<div class="empty">Nothing claimed yet this month.</div>')+
      (editable
        ? '<div style="margin-top:14px"><button class="btn" '+(mine.lines.length?"":"disabled ")+
          'onclick="submitClaim(\''+mine.id+'\')">Submit claim</button> '+
          '<span class="tiny muted">'+(person(me).reportsTo?"Goes to "+esc(person(person(me).reportsTo).name)+" for approval.":"Submitted for approval.")+'</span></div>'
        : '<p class="tiny muted" style="margin-top:10px">This month\'s claim has already been '+mine.status+'.</p>')+
      '<p class="tiny muted" style="margin-top:10px">Recoverable expenses stay on the job code so they can go '+
      'onto the client\'s bill. Both kinds are reimbursed to whoever paid.</p></div>';

    if(past.length) h+='<div class="card"><div class="card-head"><h2>Earlier claims</h2></div><table><tbody>'+
      past.map(c=>'<tr><td>'+c.month+'</td><td class="r num">'+money(sum(c.lines.map(l=>l.amount)))+'</td>'+
      '<td class="r"><span class="tag '+(c.status==="paid"?"ok":c.status==="approved"?"ok":c.status==="rejected"?"bad":"warn")+'">'+
      c.status+'</span></td></tr>').join("")+'</tbody></table></div>';

    return h;
  }
};

/* -------------------------  CALENDAR  --------------------------- */
/* Statutory dates added by hand (034_statutory_dates.sql), listed beside the
   statutory_compliances rows in "Next 60 days". Each belongs to one company
   and optionally one of its clients, with a category from an
   organization-wide, customisable list. RLS decides who sees what (partners
   every company, everyone else their own) and who may write (Partner /
   Manager / Assistant Manager, within the companies they can access).
   Loaded on their own, so a failure here never blocks the rest of the app. */
let STATUTORY_DATES = [], STAT_CATEGORIES = [], STATUTORY_ERROR = "";
let statCatReturn = null;   // the add/edit form to return to after Manage categories
const SD_COLS = "id,company_id,client_id,category_id,title,due_date,description,created_by,completed_at,completed_by";
const mapStatDate = d => ({ id:d.id, companyId:d.company_id, clientId:d.client_id, categoryId:d.category_id, title:d.title,
  date:d.due_date, notes:d.description||"", createdBy:d.created_by, completedAt:d.completed_at||null, completedBy:d.completed_by||null });
const mapStatCategory = c => ({ id:c.id, name:c.name, active:c.is_active, sort:c.sort_order });
const sortStatCategories = () => STAT_CATEGORIES.sort((a,b)=>(a.sort-b.sort) || a.name.localeCompare(b.name));

async function loadStatutory(){
  const org = ORG_ID;
  STATUTORY_DATES = []; STAT_CATEGORIES = []; STATUTORY_ERROR = "";
  if(!org) return;
  const [catR, dateR] = await Promise.all([
    supabase.from("statutory_categories").select("id,name,is_active,sort_order").eq("organization_id", org),
    supabase.from("statutory_dates").select(SD_COLS).eq("organization_id", org).order("due_date")
  ]);
  if(org !== ORG_ID) return;   // signed out / switched account meanwhile
  const err = catR.error || dateR.error;
  if(err){ console.error("[STAT] Statutory dates load failed", err); STATUTORY_ERROR = err.message || "unknown error"; return; }
  STAT_CATEGORIES = catR.data.map(mapStatCategory); sortStatCategories();
  STATUTORY_DATES = dateR.data.map(mapStatDate);
}
async function retryStatutory(){ await loadStatutory(); render(); }

const statCategoryName = id => (STAT_CATEGORIES.find(c=>c.id===id)||{}).name || "Uncategorised";
/* Client column: the client, or the company for a company-wide date. */
const statAppliesTo = d => d.clientId
  ? esc(clientOf(d.clientId).name || "Client")
  : esc(companyFullName(d.companyId))+' <span class="tiny muted">company-wide</span>';
const statAppliesToText = d => d.clientId ? (clientOf(d.clientId).name || "Client") : companyFullName(d.companyId)+" (company-wide)";
function statDbError(error, action){
  const msg = (error && error.message) || "";
  if(/jwt|expired|not authenticated/i.test(msg) || (error && error.status===401)) return "Your session has expired — sign in again.";
  if(error && error.code==="42501") return "You don't have permission to "+action+".";
  if(error && error.code==="23505") return "A category with this name already exists.";
  if(error && error.code==="23503") return "This category is used by statutory dates — deactivate it instead.";
  return "Could not "+action+" — "+msg;
}
VIEWS.calendar = {
  title:"Statutory calendar", sub:()=>"Job codes by statutory due date, and dates added by hand",
  render(){
    const can = CAN.manageStatutory();
    const b = statutoryJobBuckets(), m = statutoryDateBuckets();
    const byDue = (x,y)=>x.due<y.due?-1:x.due>y.due?1:0;
    const jobRow = j => ({ due:j.statDue, html:sdJobRow(j) });
    // Overdue: job codes and dates added by hand. A date stays until marked done (041).
    const overdue = b.overdue.map(jobRow).concat(m.overdue.map(d=>({ due:d.date, html:sdDateRow(d, can
        ? '<button class="btn ghost sm" onclick="setStatDateDone(\''+d.id+'\',true)">Mark done</button>' : '') })))
      .sort(byDue);
    const dateRow = d => ({ due:d.date, html:sdDateRow(d) });
    const dueToday = b.today.map(jobRow).concat(m.today.map(dateRow));
    const dueNext7 = b.next7.map(jobRow).concat(m.next7.map(dateRow)).sort(byDue);
    // Next 60 Days: dates added by hand due in 8 to 60 days, and the compliance
    // rows. Job codes are listed by the 7-day rule, in the other cards.
    const next60 = COMPLIANCE.filter(c=>statInWindow(c.due)).map(c=>({ due:c.due, html:sdRow({
        name:esc(clientOf(c.client).name), nameTitle:clientOf(c.client).name, sub:c.name+" · "+c.code,
        state:c.created?"Job raised":"No job raised", date:c.due, tag:dueTag(c.due) }) }))
      .concat(m.upcoming.map(dateRow))
      .sort(byDue);
    return (STATUTORY_ERROR
        ? '<p class="tiny" style="color:var(--red);margin:0 0 10px">Statutory dates couldn\'t be loaded — '+esc(STATUTORY_ERROR)+
          ' <button class="text-link" onclick="retryStatutory()">Try again</button></p>' : '')+
      '<div class="sd-grid">'+
        sdCard("Overdue", "bad", overdue, "Nothing is overdue.")+
        sdCard("Due Today", "warn", dueToday, "Nothing is due today.")+
        sdCard("Next 7 Days", "info", dueNext7, "Nothing is due in the next 7 days.")+
        sdCard("Next 60 Days", "", next60, "No dates added by hand due after the next 7 days.",
          can?'<button class="btn sm" onclick="statDateForm()" title="Add a statutory date">+ Add Date</button>':'')+
      '</div>'+
      '<p class="sd-note">A job code appears once its statutory due date is within 7 days, and leaves when all its tasks are done or the job is closed. '+
      'Dates added by hand appear up to 60 days ahead and stay under Overdue until marked done.</p>'+
      (m.done.length
        ? '<details class="card sd-done"><summary><span class="sd-done-title">Dates marked done</span> <span class="sd-count">'+m.done.length+'</span></summary>'+
          '<div class="sd-list">'+m.done.map(d=>sdRow({ open:"openStatDate('"+d.id+"')", tone:"ok", name:statAppliesTo(d), nameTitle:statAppliesToText(d),
            sub:d.title+" · "+statCategoryName(d.categoryId)+" · Manual", date:d.date,
            tag:'<span class="tag ok">done '+fmtDate(d.completedAt.slice(0,10))+'</span>' })).join("")+'</div>'+
          '<p class="sd-empty" style="padding-bottom:0">Dates due in the last 90 days or later. Open one to undo.</p></details>'
        : '');
  }
};

const statInWindow = d => daysTo(d)>=0 && daysTo(d)<=60;
/* Dates added by hand, each in exactly one list: overdue (however old, until
   marked done), today, the next 7 days, or days 8 to 60. Done dates leave those
   lists; ones due within the last 90 days or later are listed so "done" can be
   undone. */
function statutoryDateBuckets(){
  const open = STATUTORY_DATES.filter(d=>!d.completedAt);
  return {
    overdue:  open.filter(d=>daysTo(d.date)<0).sort((a,b)=>a.date.localeCompare(b.date)),
    today:    open.filter(d=>daysTo(d.date)===0),
    next7:    open.filter(d=>daysTo(d.date)>=1 && daysTo(d.date)<=7),
    upcoming: open.filter(d=>daysTo(d.date)>=8 && daysTo(d.date)<=60),
    done:     STATUTORY_DATES.filter(d=>d.completedAt && daysTo(d.date)>=-90).sort((a,b)=>b.date.localeCompare(a.date))
  };
}
async function setStatDateDone(id, done){
  if(!CAN.manageStatutory()) return toast("Only Partners, Managers and Assistant Managers can manage statutory dates");
  const { data, error } = await supabase.from("statutory_dates")
    .update({ completed_at:done ? new Date().toISOString() : null, completed_by:done ? me : null })
    .eq("id", id).select(SD_COLS).maybeSingle();
  if(error) return toast(statDbError(error, "update this statutory date"));
  if(!data) return toast("This statutory date no longer exists, or you no longer have access to it");
  const i = STATUTORY_DATES.findIndex(x=>x.id===id);
  if(i>=0) STATUTORY_DATES[i] = mapStatDate(data);
  closeModal(); toast(done ? "Marked done" : "Marked not done"); render();
}

/* Job codes in the Statutory calendar: read straight from JOBS (what RLS let
   this user load), never copied, so an edited date, a closed job or a reopened
   job shows correctly on the next render. A closed job, or one with all its
   tasks done (jobFinished), is not listed. Overhead codes and jobs with no
   statutory date are left out. */
function statutoryJobBuckets(){
  const live = JOBS.filter(j=>!j.overhead && j.statDue && !jobFinished(j))
    .sort((a,b)=>a.statDue.localeCompare(b.statDue) || a.code.localeCompare(b.code));
  return {
    overdue: live.filter(j=>daysTo(j.statDue)<0),
    today:   live.filter(j=>daysTo(j.statDue)===0),
    next7:   live.filter(j=>daysTo(j.statDue)>=1 && daysTo(j.statDue)<=7)
  };
}
/* One compact card of the Statutory calendar. rows: [{ html }]. */
function sdCard(title, tone, rows, emptyText, headExtra){
  return '<section class="card sd-card"><div class="sd-head"><h2>'+title+'</h2>'+
    '<span class="sd-count'+(rows.length&&tone?' '+tone:'')+'">'+rows.length+'</span><span class="spacer"></span>'+(headExtra||'')+'</div>'+
    (rows.length ? '<div class="sd-list">'+rows.map(r=>r.html).join("")+'</div>' : '<p class="sd-empty">'+emptyText+'</p>')+'</section>';
}
const sdTone = d => { const n=daysTo(d); return n<0?"bad":n===0?"warn":n<=7?"info":"ok"; };
/* One compact row. o: name (HTML), nameTitle, sub (plain text), state, date, tag
   (HTML), and optionally open (click handler), tone, action (HTML). */
function sdRow(o){
  const inner = '<i class="sd-dot '+(o.tone||sdTone(o.date))+'"></i>'+
    '<span class="sd-who"><span class="sd-line"><span class="sd-name" title="'+esc(o.nameTitle||"")+'">'+(o.name||"—")+'</span>'+
      (o.state?'<span class="sd-state">'+esc(o.state)+'</span>':'')+'</span>'+
      '<span class="sd-sub" title="'+esc(o.sub)+'">'+esc(o.sub)+'</span></span>'+
    '<span class="sd-when"><span class="sd-date">'+fmtDate(o.date)+'</span>'+o.tag+'</span>';
  return '<div class="sd-row">'+
    (o.open ? '<button class="sd-main" onclick="'+o.open+'">'+inner+'</button>' : '<div class="sd-main">'+inner+'</div>')+
    (o.action||'')+'</div>';
}
function sdJobRow(j){
  const service = serviceName(j.service);
  return sdRow({ open:"openStatJob('"+j.id+"')", name:esc(clientOf(j.client).name), nameTitle:clientOf(j.client).name,
    sub:j.code+(service?" · "+service:""), state:STATUS_LABEL[j.status]||j.status, date:j.statDue, tag:dueTag(j.statDue) });
}
function sdDateRow(d, action){
  return sdRow({ open:"openStatDate('"+d.id+"')", name:statAppliesTo(d), nameTitle:statAppliesToText(d),
    sub:d.title+" · "+statCategoryName(d.categoryId)+" · Manual", date:d.date, tag:dueTag(d.date), action });

function statClientOptions(companyId, current){

async function saveStatDate(id){
  const err = m => { const el=$("#sdError"); el.textContent=m; el.hidden=false; };
  const title=$("#sdTitle").value.trim(), date=$("#sdDate").value, categoryId=$("#sdCategory").value;
  const companyId=$("#sdCompany").value, clientId=$("#sdClient").value, notes=$("#sdNotes").value.trim();
  const d = id ? STATUTORY_DATES.find(x=>x.id===id) : null;
  if(!title) return err("Enter the obligation.");
  if(!companyId || !companyOptions(d ? d.companyId : null).some(c=>c.id===companyId)) return err("Choose a company.");
  if(clientId && !statClientOptions(companyId, d && d.clientId).some(c=>c.id===clientId)) return err("Choose a client of the selected company.");
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)) return err("Choose the statutory due date.");
  if(!STAT_CATEGORIES.some(c=>c.id===categoryId)) return err("Choose a category.");
  // created_by defaults to the caller's profile; a client's date takes the
  // client's company (trigger) — both in the database (034).
  const payload = { organization_id:ORG_ID, company_id:companyId, client_id:clientId||null, category_id:categoryId,
    title, due_date:date, description:notes||null };
  const btn=$("#sdSave"); btn.disabled=true;
  const { data, error } = id
    ? await supabase.from("statutory_dates").update(payload).eq("id", id).select(SD_COLS).maybeSingle()
    : await supabase.from("statutory_dates").insert(payload).select(SD_COLS).single();
  btn.disabled=false;
  if(error) return err(statDbError(error, "save this statutory date"));
  if(!data) return err("This statutory date no longer exists, or you no longer have access to it.");
  const row = mapStatDate(data);
  const i = STATUTORY_DATES.findIndex(x=>x.id===row.id);
  if(i>=0) STATUTORY_DATES[i]=row; else STATUTORY_DATES.push(row);
  const n = daysTo(row.date);
  closeModal();
  toast((id ? "Statutory date updated" : "Statutory date added")+
    (n>60 ? " — it appears in Next 60 days from "+fmtDate(addDays(row.date,-60)) : n<0 && !row.completedAt ? " — it is past, so it is listed as overdue" : ""));
  render();
}

}
function confirmDeleteStatDate(id){
  const d = STATUTORY_DATES.find(x=>x.id===id); if(!d) return closeModal();
  modal('<h3>Delete this statutory date?</h3>'+
    '<p class="tiny muted" style="margin-bottom:14px">“'+esc(d.title)+'” ('+esc(statCategoryName(d.categoryId))+') on '+fmtDate(d.date)+

async function deleteStatDate(id){
  if(!CAN.manageStatutory()) return toast("Only Partners, Managers and Assistant Managers can manage statutory dates");
  const btn=$("#sdDelete"); if(btn) btn.disabled=true;

  const week=mondayOfISO(date), day=weekdayIndex(date);
  if(!h||h<=0) return toast("Enter the hours");

  const openDay = firstOpenDay(me,week);

    return toast("Log "+DAY_NAMES[openDay]+" first — working days must be filled in order");

  }).select().single();

async function submitSheet(){
  const rows=entriesFor(me,TIMESHEET_WEEK);
  // No weekly hours target: a week with nothing booked is recorded as a nil timesheet.
  if(!rows.length){
    if(!NIL_FILED.some(n=>n.who===me && n.week===TIMESHEET_WEEK)){
      const { error } = await supabase.from("nil_timesheets")
        .insert({ organization_id:ORG_ID, profile_id:me, week_start_date:TIMESHEET_WEEK });
      if(error) return toast("Could not record — "+error.message);
      NIL_FILED.push({who:me,week:TIMESHEET_WEEK});
    }
    toast("Nil timesheet recorded — nothing booked this week");
    return render();
  }
  const missing = rows.filter(r=>!r.note.trim());
  if(missing.length) return toast(missing.length+" entr"+(missing.length===1?"y needs":"ies need")+" a narration");

  const toSubmit = rows.filter(r=>r.status==="draft"||r.status==="queried");
  // Minimum hours per day (re-checked by trg_timesheet_day_minimum, 045).
  const short = daysBelowMinimum(me, toSubmit);
  if(short.length) return toast(short.map(x=>fmtShort(x.date)+": "+hrs(x.total)+"h of "+x.min+"h").join(" · ")+
    " — a full day needs "+MIN_FULL_DAY_HOURS+"h. Worked half a day? Tick Half day (minimum "+MIN_HALF_DAY_HOURS+"h).");
  const nextStatus = CAN.selfCertify() ? "approved" : "pending";
  const { error } = await supabase.from("timesheet_entries")
    .update({ status:nextStatus, query_reason:"" }).in("id", toSubmit.map(r=>r.id));
  if(error) return toast("Could not submit — "+error.message);
  toSubmit.forEach(r=>{ r.status = nextStatus; r.query=""; });
  if(nextStatus==="approved") await reloadLinkedTasks(toSubmit);
  toast(CAN.selfCertify() ? "Certified and recorded"
       : "Sent to "+person(person(me).reportsTo).name);
  render();
}

/* Approving time can mark the named task Done, and undoing can reopen it, in
   the database (trg_timesheet_task_approved, 040, same transaction; its rules
   are there). Re-read just those tasks so the Work screen shows what was
   actually committed. */
async function reloadLinkedTasks(rows){
  const ids=[...new Set(rows.map(r=>r.taskId).filter(Boolean))];
  if(!ids.length) return;
  const { data, error } = await supabase.from("tasks").select("id,status").in("id", ids);
  if(error) return console.error("[DATA] Could not refresh linked tasks",error);
  data.forEach(d=>{ const t=TASKS.find(x=>x.id===d.id); if(t) t.status=d.status; });
}

async function submitBudget(jid){
  if(!CAN.requestBudget()) return toast("Partners can book beyond the budget — no request needed");
  const raw=$("#mbHours").value.trim(), add=+raw, r=$("#mbReason").value.trim();
  if(!raw) return toast("Enter the additional hours requested");
  if(!(add>0)) return toast("Additional hours must be more than 0");
  if(r.length<10) return toast("Give a reason of at least 10 characters");
  if(BUDGET_REQUESTS.some(b=>b.job===jid && b.status==="pending")) return toast("A request for this job is already waiting for a decision");
  // from/to record the hours available before and after this request; the
  // additional hours are (to − from). jobs.budget_hours itself is not touched.
  const from=jobBudgetTotal(jid), to=+(from+add).toFixed(2);
  const { data, error } = await supabase.from("budget_requests").insert({
    organization_id:ORG_ID, job_id:jid, from_hours:from, to_hours:to, requested_by:me,
    requested_date:TODAY, reason:r, status:"pending"
  }).select().single();
  if(error) return toast("Could not send the request — "+error.message);
  BUDGET_REQUESTS.push({ id:data.id, job:jid, from, to, reason:r, by:me, on:TODAY, status:"pending" });
  closeModal(); toast("Sent for approval"); render();
}
async function decideBudget(id,ok){
  const b=BUDGET_REQUESTS.find(x=>x.id===id);
  if(!CAN.approveBudget(b)) return toast("You cannot decide this one");
  const status = ok?"approved":"rejected";
  const decidedAt = new Date().toISOString();
  const { error } = await supabase.from("budget_requests")
    .update({ status, decided_by:me, decided_at:decidedAt }).eq("id", id);
  if(error) return toast("Could not save — "+error.message);
  // Budgeted Hours on the job is left exactly as it was; the approved
  // additional hours live on this request and are added on top.
  if(ok) JOB_EXTRA_HOURS[b.job] = jobExtraHours(b.job) + (b.to - b.from);
  b.status=status; b.decidedBy=me; b.decidedAt=decidedAt;
  toast(ok ? "Approved +"+hrs(b.to-b.from)+"h — "+budgetBreakdown(b.job) : "Request rejected"); render();
}

/* --- tasks --- */
async function reassign(id,who){
  const t = TASKS.find(x=>x.id===id);
  if(!t) return;
  if(t.who === who) return;
  if(!CAN.reassignTask()){ toast("Assistant Manager and above can assign work"); return render(); }
  if(jobClosed(t.job)){ toast(job(t.job).code+" is closed — reopen it before reassigning tasks"); return render(); }

  const nowTs = new Date().toISOString();
  const hist = (t.responsibilityHistory ? [...t.responsibilityHistory] : []);
  hist.forEach(r => {
    if(!r.toDate){
      r.toDate = TODAY;
    }
  });
  hist.push({
    id: "rh_"+Date.now()+"_"+Math.random().toString(36).slice(2,7),
    assignedTo: who,
    assignedBy: me,
    fromDate: TODAY,
    toDate: null,
    createdAt: nowTs
  });

  const updatePayload = {
    assigned_to: who,
    assigned_by: me,
    responsibility_history: hist
  };

  let { error } = await supabase.from("tasks").update(updatePayload).eq("id", id);
  if(error && (error.message.includes("responsibility_history") || error.message.includes("assigned_by"))){
    delete updatePayload.responsibility_history;
    delete updatePayload.assigned_by;
    const retry = await supabase.from("tasks").update(updatePayload).eq("id", id);
    error = retry.error;
  }
  if(error) return toast("Could not reassign — "+error.message);

  t.who = who;
  t.assignedBy = me;
  t.responsibilityHistory = hist;
  toast("Reassigned to "+person(who).name+" (responsibility history updated)");
  render();
}

async function saveTaskCost(id){
  const isPartner = person(me).role === "partner";
  if(!isPartner) return toast("Only partners can view and edit task costs");
  const t = TASKS.find(x=>x.id===id);
  if(!t) return;
  const cost = Math.max(0, +$("#etcCost").value||0);
  const effMonth = $("#etcMonth").value || TODAY.slice(0,7);
  if(!effMonth) return toast("Select an effective month");

  const history = t.costHistory ? [...t.costHistory] : [];
  const existingIdx = history.findIndex(h=>h.effectiveMonth === effMonth);
  const newEntry = {
    effectiveMonth: effMonth,
    monthlyCost: cost,
    updatedBy: me,
    updatedAt: new Date().toISOString()
  };

  if(existingIdx >= 0){
    history[existingIdx] = newEntry;
  } else {
    history.push(newEntry);
  }
  history.sort((a,b)=> (a.effectiveMonth||"").localeCompare(b.effectiveMonth||""));

  const updatePayload = {
    monthly_cost: cost,
    cost_history: history
  };

  let { error } = await supabase.from("tasks").update(updatePayload).eq("id", id);
  if(error && (error.message.includes("monthly_cost") || error.message.includes("cost_history"))){
    delete updatePayload.monthly_cost;
    delete updatePayload.cost_history;
    const retry = await supabase.from("tasks").update(updatePayload).eq("id", id);
    error = retry.error;
  }
  if(error) return toast("Could not update cost — "+error.message);

  t.monthlyCost = cost;
  t.costHistory = history;
  closeModal();
  toast("Task cost updated effective "+effMonth);
  render();
}

/* --- leave -------------------------------------------------------------------
   These two helpers degrade gracefully if 007_leave_management.sql has not
   been applied yet to this database (request_id/rejection_reason missing) —
   same pattern as the accuracy_meters fallback in recordPunch(): retry once
   without the column that doesn't exist yet, rather than breaking the
   action outright. */
async function insertLeaveRows(rows){
  let { data, error } = await supabase.from("leaves").insert(rows).select();
  if(error && /request_id/.test(error.message||"")){
    console.warn("[leave] request_id column not found — run supabase/migrations/007_leave_management.sql. Submitting without request grouping.");
    ({ data, error } = await supabase.from("leaves").insert(rows.map(({request_id, ...r})=>r)).select());
  }
  return { data, error };
}
async function updateLeaveRows(ids, patch){
  let { error } = await supabase.from("leaves").update(patch).in("id", ids);
  if(error && /rejection_reason/.test(error.message||"")){
    console.warn("[leave] rejection_reason column not found — run supabase/migrations/007_leave_management.sql.");
    const rest = Object.assign({}, patch); delete rest.rejection_reason;
    ({ error } = await supabase.from("leaves").update(rest).in("id", ids));
  }
  return { error };
}
function mapLeaveRow(l){
  return { id:l.id, who:l.profile_id, date:l.leave_date, part:l.duration_part,
    type:canonicalLeaveCode(l.leave_type), origType:l.leave_type, status:l.status,
    reason:l.reason||"", requestId:l.request_id||l.id, rejectionReason:l.rejection_reason||"",
    approvedBy:l.approved_by||null, approvedAt:l.approved_at||null, createdAt:l.created_at||null };
}

  if(s && e){ e.min = s.value; if(e.value < s.value) e.value = s.value; }
