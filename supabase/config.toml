[functions.create-employee]
# The function verifies the caller's JWT itself (and checks their profile's
# role) before touching the Admin API, but requiring a valid JWT at the
# platform level too means an anonymous request never even reaches the code.
verify_jwt = true

[functions.send-notifications]
# Server-to-server only: called by pg_cron (pg_net) with no user JWT. The
# function itself rejects any request without the NOTIFICATIONS_DISPATCH_SECRET
# header value.
verify_jwt = false

[functions.register-employee]
# Public registration validates every submitted field and company server-side.
verify_jwt = false

[functions.register-user]
enabled = true
verify_jwt = false
import_map = "./functions/register-user/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/register-user/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/register-user/*.html" ]
